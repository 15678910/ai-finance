name: Forward Test Evaluation (Monthly)

on:
  schedule:
    # 매월 1일 KST 08:00
    - cron: '0 23 1 * *'  # UTC 23:00 = KST 08:00 익일
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run forward test evaluator
        env:
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python forward_test_evaluator.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add docs/forward_test_evaluation.json 2>/dev/null || true

          if git diff --cached --quiet 2>/dev/null; then
            echo "No changes"
          else
            git pull --rebase
            git commit -m "Update forward test evaluation [automated]"
            git push
          fi
