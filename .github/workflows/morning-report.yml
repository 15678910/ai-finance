name: Morning Report

# 매일 KST 07시 전후 — 대시보드 수집 데이터 종합 모닝 브리핑을 텔레그램 발송
#
# ⚠️ GitHub Actions 예약 실행은 '정시(:00)'에 큐가 몰려 상습 지연된다.
#    실측(2026-07-28~08-02, 6회): 22:00 UTC 예약분이 매번 +48~59분 지연되어
#    실제로는 KST 07:48~07:59에 발송됐다 — 정시에 도착한 적이 한 번도 없음.
#    → 예약을 45분 앞당기고(21:15 UTC = KST 06:15) 분을 비정시로 옮겨 혼잡을 피한다.
#      지연 없으면 06:15, 과거 최대 지연(+59분)이어도 07:14 — 어느 쪽이든 개장(09:00) 전.
on:
  schedule:
    - cron: '30 20 * * *'   # UTC 20:30 = KST 05:30 예약
    # ⚠️ GitHub Actions 예약은 상습 지연된다 — 실측 +73~104분(중앙값 약 95분).
    #    05:30 예약이면 대개 07:00~07:15 에 완료돼 아침 시간에 맞는다.
    #    미국장 마감(05:00 KST)과 해외 수집기(매시 실행) 뒤라 순서도 안전하다.
    #    그래도 순서가 뒤집히면 morning_report.py 가 경고하고 제목에 기준일을 박는다.
    # 2026-11-03: 11-02 20:30 UTC 예약분이 09:00 KST 까지도 실행되지 않아 아침 브리핑이 전날 것으로 남았다.
    #    → 예비 예약 추가. morning_report.py 는 오늘 자 리포트가 이미 있으면 건너뛰므로(--force 전까지) 중복 발송은 없다.
    - cron: '50 22 * * *'   # UTC 22:50 = KST 07:50 예비 (첫 예약이 이미 돌았으면 스크립트가 스스로 종료)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Send morning report
        env:
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python morning_report.py

      # 대시보드용 JSON 커밋 (충돌 시 재시도 — 다른 워크플로와 동시 실행 대비)
      - name: Commit report JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/morning_report.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "Update morning report (daily briefing) [automated]"
          for i in 1 2 3; do
            git pull --rebase -X ours && git push && echo "pushed" && exit 0
            sleep 5
          done
          echo "push failed after retries"
