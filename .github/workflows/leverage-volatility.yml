name: Update Leverage Volatility Monitor

on:
  schedule:
    - cron: '5 7 * * 1-5'   # 평일 KST 16:05 (UTC 07:05) — 장 마감 후
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install yfinance pykrx requests
      - name: Collect leverage/volatility data
        env:
          PYTHONIOENCODING: utf-8
        run: python leverage_volatility_monitor.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Update leverage volatility monitor [automated]"
          for i in 1 2 3; do git push 2>/dev/null && exit 0; git pull --rebase origin master; done
