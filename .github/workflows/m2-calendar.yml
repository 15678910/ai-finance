name: Update M2 & Economic Calendar

on:
  schedule:
    - cron: '0 1 * * *'   # 매일 KST 10:00 (UTC 01:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Collect M2 data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python m2_monitor.py

      - name: Update economic calendar
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python economic_calendar.py

      # 성장 대비 부채 비율 (미국·한국·일본 정부부채/GDP — FRED/IMF)
      - name: Collect debt-to-GDP
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python debt_gdp_monitor.py || echo "debt_gdp had errors, continuing..."

      # 코스피 밸류에이션: KRX·INDEXerGO 모두 GitHub 데이터센터 IP를 차단(403)해 자동수집 불가.
      #   → 내 PC(한국 IP)의 로컬 스케줄러(update_kospi_valuation.bat)가 담당. GitHub에선 시도 안 함.

      # 공포·탐욕지수 (미국증시 CNN + 크립토 alternative.me)
      - name: Collect Fear & Greed
        env:
          PYTHONIOENCODING: utf-8
        run: python fear_greed_monitor.py || echo "fear_greed had errors, continuing..."

      # 추세추종 신호 보드 (Supertrend·EMA200·ADX + 백테스트·몬테카를로 — yfinance)
      - name: Collect trend signal
        env:
          PYTHONIOENCODING: utf-8
        run: python trend_signal.py || echo "trend_signal had errors, continuing..."

      # 거장 매매 추적 (SEC EDGAR 13F — 분기 공시, IP 차단 없음)
      - name: Collect guru 13F
        env:
          PYTHONIOENCODING: utf-8
        run: python guru_13f.py || echo "guru_13f had errors, continuing..."

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ 2>/dev/null || true
          if git diff --cached --quiet 2>/dev/null; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update M2 data and economic calendar [automated]"
          for i in 1 2 3; do
            if git push 2>/dev/null; then exit 0; fi
            git pull --rebase origin master
          done
