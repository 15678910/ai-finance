name: Update ETF Holdings

on:
  schedule:
    - cron: '0 1 * * 1-5'   # 평일 KST 10:00 (UTC 01:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pykrx requests
      - name: Collect ETF holdings
        env:
          PYTHONIOENCODING: utf-8
        run: python etf_holdings_monitor.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/etf_holdings.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Update ETF holdings [automated]"
          for i in 1 2 3; do git push 2>/dev/null && exit 0; git pull --rebase origin master; done
