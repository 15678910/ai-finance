    const ohSec = document.getElementById('overheating-section');
    if (sc && ohSec && ohSec.nextElementSibling !== sc) ohSec.insertAdjacentElement('afterend', sc);
  }

  // ─── 😱 시장감정지수 (Fear & Greed) ─────────────────────
  function renderSentiment(s) {
    if (!s) return;
    const COL = { red:'#f87171', orange:'#fb923c', amber:'#fbbf24', cyan:'#22d3ee', green:'#4ade80', muted:'#94a3b8' };
    const classifyFG = (v) => {
      if (v == null) return ['데이터없음', COL.muted, ''];
      if (v >= 75) return ['극단적 탐욕', COL.red, '과열·차익 경계'];
      if (v >= 55) return ['탐욕', COL.orange, '위험선호 강함'];
      if (v >= 45) return ['중립', COL.amber, '방향성 모호'];
      if (v >= 25) return ['공포', COL.cyan, '위험회피 — 분할매수 관심'];
      return ['극단적 공포', COL.green, '투매 — 역발상 매수 유리'];
    };
    // 게이지: 좌(0,공포)=초록 ↔ 우(100,탐욕)=빨강 (역발상 컬러)
    const gauge = (flag, title, score, label, color, hint, comps) => {
      const c = COL[color] || COL.muted;
      const pct = score == null ? 50 : Math.max(0, Math.min(100, score));
      const compHtml = (comps || []).map(cp => `
        <div style="display:flex;justify-content:space-between;font-size:0.58rem;color:var(--text-muted);padding:1px 0;">
          <span>${h(cp.name)} <span style="opacity:0.6;">${h(String(cp.raw))}</span></span>
          <span style="font-family:var(--font-mono);color:${cp.score>=55?COL.orange:cp.score<45?COL.cyan:'var(--text)'};">${cp.score==null?'—':cp.score}</span>
        </div>`).join('');
      return `<div class="glass-card anim-item" style="padding:14px 16px;border-top:3px solid ${c};">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
          <span style="font-size:0.78rem;font-weight:700;color:var(--text-bright);">${flag} ${h(title)}</span>
          <span style="font-size:0.7rem;font-weight:800;color:${c};">${h(label)}</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:6px;">
          <span style="font-size:2rem;font-weight:800;font-family:var(--font-mono);color:${c};line-height:1;">${score==null?'—':score}</span>
          <span style="font-size:0.6rem;color:var(--text-muted);">/ 100</span>
        </div>
        <div style="position:relative;height:16px;margin:8px 0 3px;">
          <div style="position:absolute;top:6px;left:0;right:0;height:6px;border-radius:4px;background:linear-gradient(90deg,#4ade80,#22d3ee,#fbbf24,#fb923c,#f87171);opacity:0.7;"></div>
          <div style="position:absolute;top:2px;left:${pct}%;transform:translateX(-50%);width:11px;height:11px;background:#fff;border:2px solid ${c};border-radius:50%;box-shadow:0 0 5px ${c};"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:0.5rem;color:var(--text-muted);margin-bottom:6px;">
          <span style="color:#4ade80;">공포 0</span><span>중립 50</span><span style="color:#f87171;">탐욕 100</span>
        </div>
        ${hint ? `<div style="font-size:0.6rem;color:${c};margin-bottom:6px;">▸ ${h(hint)}</div>` : ''}
        ${compHtml ? `<div style="border-top:1px solid rgba(255,255,255,0.06);padding-top:5px;">${compHtml}</div>` : ''}
      </div>`;
    };

    const us = s.us || {}, kr = s.kr || {};
    const usCard = gauge('🇺🇸', '미국 시장감정', us.score, us.label, us.color, us.hint, us.components);
    const krCard = gauge('🇰🇷', '한국 시장감정', kr.score, kr.label, kr.color, kr.hint, kr.components);
    // 암호화폐는 실시간 채움 (placeholder)
    const cryptoCard = `<div id="sentiment-crypto-card">${gauge('🪙', '암호화폐 (실시간)', null, '연결 중…', 'muted', '', [])}</div>`;

    const html = `<section class="section-wrap" id="sentiment-section">
      <div class="section-label" style="color:#fb7185;">😱 시장감정지수 <span style="font-size:0.62rem;color:var(--text-muted);">(Fear &amp; Greed · 0=공포→100=탐욕 · 역발상 신호)</span>
        <span style="font-size:0.6rem;color:var(--text-muted);margin-left:8px;">갱신: ${h(s.generated_at||'')}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;">
        ${usCard}${krCard}${cryptoCard}
      </div>
      <div style="font-size:0.58rem;color:var(--text-muted);margin-top:8px;line-height:1.5;">
        ※ 미국·한국은 자체 composite(변동성·모멘텀·외국인·레버리지·신용). 암호화폐는 alternative.me 실시간. ${h(s.note||'')}<br>
        🚨 통계 추정 · 역발상 참고용. 투자 결정 단독 사용 금지.
      </div>
    </section>`;

    const existing = document.getElementById('sentiment-section');
    if (existing) { existing.outerHTML = html; }
    else { (document.getElementById('app') || document.body).insertAdjacentHTML('beforeend', html); }
    scheduleNavRebuild();

    // 암호화폐 공포탐욕 실시간 (alternative.me)
    const loadCrypto = async () => {
      const card = document.getElementById('sentiment-crypto-card');
      if (!card) return;
      try {
        const r = await fetch('https://api.alternative.me/fng/?limit=1', { cache:'no-store' });
        const d = (await r.json()).data[0];
        const v = +d.value;
        const [label, color, hint] = classifyFG(v);
        card.innerHTML = gauge('🪙', '암호화폐 (실시간)', v, label, color, hint,
          [{ name:'출처', raw:'alternative.me', score:null }, { name:'원분류', raw:d.value_classification, score:null }]);
      } catch (e) {
        card.innerHTML = gauge('🪙', '암호화폐', null, '연결 실패', 'muted', '네트워크 차단', []);
      }
    };
    loadCrypto();
    if (window.__fgTimer) clearInterval(window.__fgTimer);
    window.__fgTimer = setInterval(loadCrypto, 300000); // 5분
  }

  // ─── 🌍 외국인 보유 + 개미 추정 평단가 ──────────────────
  function renderHoldings(hd) {
    if (hd && hd.stocks) window.__holdingsData = hd;
    hd = window.__holdingsData;
    if (!hd || !hd.stocks || !hd.stocks.length) return;
    const fmtSh = v => v == null ? '—' : (v >= 1e8 ? (v/1e8).toFixed(1)+'억주' : (v/1e4).toFixed(0)+'만주');
    const won = v => v == null ? '—' : Math.round(v).toLocaleString()+'원';

    // 정렬 (헤더 클릭) — null은 항상 맨 뒤
    const sort = window.__holdingsSort || { key: null, dir: -1 };
    let stocks = hd.stocks.slice();
    if (sort.key) {
      stocks.sort((a, b) => {
        const va = a[sort.key], vb = b[sort.key];
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        if (typeof va === 'string') return sort.dir * va.localeCompare(vb);
        return sort.dir * (va - vb);
      });
    }
    const arrow = k => sort.key === k ? (sort.dir < 0 ? ' ▼' : ' ▲') : '';
    const thBtn = (k, label, align) => `<th onclick="sortHoldings('${k}')" style="padding:5px 8px;text-align:${align};font-size:0.6rem;color:${sort.key===k?'#60a5fa':'var(--text-muted)'};font-weight:500;cursor:pointer;user-select:none;white-space:nowrap;">${label}${arrow(k)}</th>`;

    const rows = stocks.map(s => {
      const pnl = s.indiv_pnl_pct;
      const pc = pnl == null ? 'var(--text-muted)' : pnl >= 0 ? '#22c55e' : '#f87171';
      const f5 = s.foreign_pct_5d_change;
      const f5c = f5 == null ? 'var(--text-muted)' : f5 >= 0 ? '#22c55e' : '#f87171';
      const streak = (s.foreign_streak_days && s.foreign_streak_dir)
        ? `<span style="font-size:0.54rem;color:${s.foreign_streak_dir==='sell'?'#f87171':'#22c55e'};">${s.foreign_streak_dir==='sell'?'🩸':'🟢'}${s.foreign_streak_days}${s.foreign_streak_capped?'일+':'일'}</span>` : '';
      return `<tr style="border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;" onclick="openStockDetail('${h(s.ticker)}')">
        <td style="padding:6px 8px;">
          ${s.sector?`<span style="font-size:0.52rem;color:#60a5fa;background:rgba(96,165,250,0.12);padding:0 5px;border-radius:6px;">${h(s.sector)}</span><br>`:''}
          <span style="font-size:0.74rem;font-weight:600;color:var(--text-bright);">${h(s.name)}</span>
        </td>
        <td style="padding:6px 8px;text-align:right;font-family:var(--font-mono);">
          <span style="font-size:0.76rem;font-weight:700;color:var(--text-bright);">${s.foreign_pct!=null?s.foreign_pct+'%':'—'}</span>
          ${f5!=null?`<span style="font-size:0.54rem;color:${f5c};"> ${f5>=0?'+':''}${f5}%p</span>`:''}<br>
          <span style="font-size:0.54rem;color:var(--text-muted);">${fmtSh(s.foreign_shares)} ${streak}</span>
        </td>
        <td style="padding:6px 8px;text-align:right;font-size:0.74rem;font-family:var(--font-mono);color:var(--text);">${won(s.indiv_avg_est)}<br><span style="font-size:0.5rem;color:var(--text-muted);">${h(s.window||'')}·순매수${s.indiv_buy_days||0}일</span></td>
        <td style="padding:6px 8px;text-align:right;font-size:0.74rem;font-family:var(--font-mono);color:var(--text-bright);">${won(s.current)}</td>
        <td style="padding:6px 8px;text-align:right;font-size:0.82rem;font-weight:800;font-family:var(--font-mono);color:${pc};">${pnl==null?'—':(pnl>=0?'+':'')+pnl+'%'}</td>
      </tr>`;
    }).join('');

    const html = `<section class="section-wrap" id="holdings-section">
      <div class="section-label" style="color:#60a5fa;">🌍 외국인 보유 + 개미 추정 평단가
        <span style="font-size:0.62rem;color:var(--text-muted);">(보유율=공시 · 평단가=순매수 가중 추정)</span>
        <span style="font-size:0.6rem;color:var(--text-muted);margin-left:8px;">갱신: ${h(hd.generated_at||'')}</span>
      </div>
      <div class="glass-card" style="padding:8px 14px;overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;min-width:520px;">
          <thead><tr style="border-bottom:1px solid rgba(255,255,255,0.12);">
            ${thBtn('sector','종목·분야','left')}
            ${thBtn('foreign_pct','외국인 보유율','right')}
            ${thBtn('indiv_avg_est','개미 추정 평단','right')}
            ${thBtn('current','현재가','right')}
            ${thBtn('indiv_pnl_pct','개미 평가손익','right')}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="font-size:0.58rem;color:var(--text-muted);margin-top:8px;line-height:1.5;">
        🔀 <b style="color:#60a5fa;">표 헤더(외국인 보유율·평단·현재가·평가손익)를 클릭</b>하면 해당 순으로 정렬됩니다 (재클릭 시 오름/내림 전환).<br>
        ※ 외국인 보유율·보유량 = KRX/네이버 공시(정확). 🩸N일 = 외인 연속 순매도.<br>
        ※ <b>개미 평단가는 추정치</b> — 실제 공시 없음. "최근 순매수 가중평균"으로, 장기보유분 아닌 최근 매집 단가. 개미 = −(외국인+기관) 근사.<br>
        🚨 추정·참고용. 투자 결정 단독 사용 금지.
      </div>
    </section>`;

    const existing = document.getElementById('holdings-section');
    if (existing) { existing.outerHTML = html; }
    else { (document.getElementById('app') || document.body).insertAdjacentHTML('beforeend', html); }
    scheduleNavRebuild();
  }
  // 헤더 클릭 정렬 (같은 열 재클릭 시 방향 토글)
  window.sortHoldings = function (key) {
    const cur = window.__holdingsSort || {};
    window.__holdingsSort = { key, dir: (cur.key === key && cur.dir < 0) ? 1 : -1 };
    renderHoldings();
  };

  // ─── ⏱️ 분봉 단타 보조지표 (SK하이닉스 · XRP) ───────────
  function renderIntraday(id) {
    if (!id || !id.targets || !id.targets.length) return;
    const COL = { red:'#f87171', amber:'#fbbf24', cyan:'#22d3ee', green:'#4ade80', muted:'#94a3b8' };
    const metric = (label, val, suffix, good) => `
      <div style="text-align:center;flex:1;">
        <div style="font-size:0.52rem;color:var(--text-muted);">${label}</div>
        <div style="font-size:0.82rem;font-weight:700;font-family:var(--font-mono);color:${good||'var(--text-bright)'};">${val==null?'—':val}${suffix||''}</div>
      </div>`;
    const tfBlock = (title, tf) => {
      if (!tf) return `<div style="font-size:0.58rem;color:var(--text-muted);">${title}: 데이터 없음</div>`;
      const rsiC = tf.rsi14<=30?COL.green:tf.rsi14>=70?COL.red:'var(--text-bright)';
      const zC = tf.z20<=-1.5?COL.green:tf.z20>=1.5?COL.red:'var(--text-bright)';
      const vC = tf.vwap_dev<0?COL.cyan:COL.amber;
      return `<div style="margin-top:6px;">
        <div style="font-size:0.55rem;color:var(--text-muted);margin-bottom:2px;">${title} <span style="opacity:0.7;">바 ${h(tf.last_bar||'')}</span></div>
        <div style="display:flex;gap:4px;">
          ${metric('RSI(14)', tf.rsi14, '', rsiC)}
          ${metric('z20', (tf.z20>=0?'+':'')+tf.z20, 'σ', zC)}
          ${metric('VWAP이격', (tf.vwap_dev>=0?'+':'')+tf.vwap_dev, '%', vC)}
          ${metric('당일위치', tf.day_pos, '%', tf.day_pos<=20?COL.green:tf.day_pos>=80?COL.red:'var(--text-bright)')}
        </div>
      </div>`;
    };
    const cards = id.targets.map(t => {
      const c = COL[t.color] || COL.muted;
      const px = t.tf3 ? `${t.tf3.price.toLocaleString()}${h(t.unit||'')}` : '—';
      const isXrp = t.key === 'XRP';
      const liveBlock = isXrp ? `<div style="display:flex;justify-content:center;align-items:center;background:rgba(34,211,238,0.07);border-radius:6px;padding:4px 8px;margin:5px 0;">
          <span style="font-size:0.56rem;color:#22d3ee;font-weight:700;">🔴 실시간 거래소 연결 중…</span>
        </div>` : '';
      const skNote = (t.ticker && t.ticker.endsWith('.KS')) ? `<div style="font-size:0.5rem;color:var(--text-muted);margin-top:2px;">⚠️ yfinance 지연·불완전 — 실측은 HTS 차트 기준</div>` : '';
      return `<div class="glass-card anim-item" ${isXrp?'id="intraday-xrp-card"':''} style="padding:13px 15px;border-top:3px solid ${c};">
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <span style="font-size:0.8rem;font-weight:700;color:var(--text-bright);">${t.flag} ${h(t.key)}</span>
          <span style="font-size:0.8rem;font-weight:800;font-family:var(--font-mono);color:var(--text-bright);">${px}</span>
        </div>
        <div style="font-size:0.72rem;font-weight:700;color:${c};margin:4px 0 2px;">${isXrp?'⏳ 실시간 연결 중…':h(t.signal||'')}</div>
        ${liveBlock}
        ${t.tf3 ? `<div style="font-size:0.56rem;color:var(--text-muted);">VWAP ${t.tf3.vwap.toLocaleString()} 대비 <b style="color:${t.tf3.vwap_dev<0?COL.cyan:COL.amber};">${t.tf3.vwap_dev>=0?'+':''}${t.tf3.vwap_dev}%</b>${isXrp?'':' <span style="opacity:0.6;">(지표는 지연)</span>'}</div>`:''}
        ${tfBlock('3분봉', t.tf3)}
        ${tfBlock('15분봉', t.tf15)}
        ${skNote}
      </div>`;
    }).join('');

    const html = `<section class="section-wrap" id="intraday-section">
      <div class="section-label" style="color:#2dd4bf;">⏱️ 분봉 단타 보조지표
        <span style="font-size:0.62rem;color:var(--text-muted);">(SK하이닉스 · XRP — VWAP·RSI(14)·z20 · XRP 실시간)</span>
        <span style="font-size:0.6rem;color:var(--text-muted);margin-left:8px;">지표 갱신: ${h(id.generated_at||'')}</span>
      </div>
      <div class="glass-card" style="padding:8px 14px;margin-bottom:10px;background:rgba(251,191,36,0.06);border-left:3px solid #fbbf24;">
        <div style="font-size:0.6rem;color:var(--text);">⚠️ ${h(id.disclaimer||'')}</div>
        ${id.note_sk ? `<div style="font-size:0.56rem;color:var(--text-muted);margin-top:3px;">🇰🇷 ${h(id.note_sk)}</div>` : ''}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">${cards}</div>
      <div style="font-size:0.58rem;color:var(--text-muted);margin-top:8px;line-height:1.5;">
        ※ VWAP=당일 거래량가중평균(단타 기준선) · RSI(14) 과매도30↓/과매수70↑ · z20=20봉 표준편차 · 당일위치 0%=저가 100%=고가.<br>
        ※ XRP는 빗썸(KRW)/바이낸스(USD) 실시간 직접계산(10초) — RSI·z·VWAP이격은 통화 무관이라 HTS와 일치. SK하이닉스는 yfinance 정규장 지연.<br>
        🚨 매매 신호 아님. 체결·타이밍은 HTS 실시간 차트로.
      </div>
    </section>`;

    const existing = document.getElementById('intraday-section');
    if (existing) { existing.outerHTML = html; }
    else { (document.getElementById('app') || document.body).insertAdjacentHTML('beforeend', html); }
    scheduleNavRebuild();

    // ── XRP: 빗썸(KRW) 우선 + 바이낸스(USD) 폴백 — 둘 다 CORS 허용 ──
    //   RSI·z·VWAP이격·당일위치는 통화 무관 → 어느 소스든 HTS와 일치, 가격만 통화 차이.
    if (id.targets.some(t => t.key === 'XRP')) {
      if (window.__xrpLiveTimer) clearInterval(window.__xrpLiveTimer);
      const COL2 = COL;
      const pad = n => String(n).padStart(2, '0');
      const rsiW = (cl, n) => {
        if (cl.length <= n) return null;
        let up = 0, dn = 0;
        for (let i = 1; i <= n; i++) { const x = cl[i] - cl[i-1]; if (x > 0) up += x; else dn -= x; }
        up /= n; dn /= n;
        for (let i = n + 1; i < cl.length; i++) { const x = cl[i] - cl[i-1]; up = (up*(n-1)+(x>0?x:0))/n; dn = (dn*(n-1)+(x<0?-x:0))/n; }
        if (dn === 0) return 100;
        return 100 - 100/(1 + up/dn);
      };
      const kstParts = (t) => { const k = new Date(t + 9*3600000); return { day:`${k.getUTCFullYear()}-${k.getUTCMonth()+1}-${k.getUTCDate()}`, lbl:`${pad(k.getUTCMonth()+1)}-${pad(k.getUTCDate())} ${pad(k.getUTCHours())}:${pad(k.getUTCMinutes())}` }; };
      const resample = (cs, n) => { const out=[]; for (let i=0;i<cs.length;i+=n){ const g=cs.slice(i,i+n); if(!g.length)continue; out.push({ t:g[g.length-1].t, h:Math.max(...g.map(x=>x.h)), l:Math.min(...g.map(x=>x.l)), c:g[g.length-1].c, v:g.reduce((a,b)=>a+b.v,0) }); } return out; };
      const calcTF = (cs) => {
        if (!cs || cs.length < 25) return null;
        const cl = cs.map(x => x.c);
        const price = cl[cl.length-1];
        const rsi = rsiW(cl, 14);
        const l20 = cl.slice(-20), m = l20.reduce((a,b)=>a+b,0)/20;
        const sd = Math.sqrt(l20.reduce((a,b)=>a+(b-m)**2,0)/19);
        const z = sd ? (price-m)/sd : 0;
        const lastDay = kstParts(cs[cs.length-1].t).day;
        let pv=0, vv=0, hi=-Infinity, lo=Infinity;
        cs.forEach(x => { if (kstParts(x.t).day !== lastDay) return; const tp=(x.h+x.l+x.c)/3; pv+=tp*x.v; vv+=x.v; if(x.h>hi)hi=x.h; if(x.l<lo)lo=x.l; });
        const vwap = vv ? pv/vv : price;
        return { price, vwap, vwap_dev:+((price/vwap-1)*100).toFixed(2),
                 rsi14: rsi!=null?Math.round(rsi):null, z20:+z.toFixed(2),
                 day_pos: hi>lo?Math.round((price-lo)/(hi-lo)*100):50,
                 last_bar: kstParts(cs[cs.length-1].t).lbl };
      };
      const sigOf = (tf) => {
        if (!tf) return ['데이터없음', COL2.muted];
        if ((tf.rsi14!=null && tf.rsi14<=30) || tf.z20<=-2) return ['🟢 단기 과매도 (반등 관심)', COL2.green];
        if ((tf.rsi14!=null && tf.rsi14>=70) || tf.z20>=2) return ['🔴 단기 과매수 (차익 관심)', COL2.red];
        if (tf.vwap_dev < -0.5) return ['🔵 VWAP 하단 — 약세 흐름', COL2.cyan];
        if (tf.vwap_dev > 0.5) return ['🟠 VWAP 상단 — 강세 흐름', COL2.amber];
        return ['⚪ 중립 (VWAP 부근)', COL2.muted];
      };
      const fmtV = (v, rnd) => rnd ? v.toFixed(rnd) : Math.round(v).toLocaleString();
      const metric2 = (label, val, suf, good) => `<div style="text-align:center;flex:1;"><div style="font-size:0.52rem;color:var(--text-muted);">${label}</div><div style="font-size:0.82rem;font-weight:700;font-family:var(--font-mono);color:${good||'var(--text-bright)'};">${val==null?'—':val}${suf||''}</div></div>`;
      const tfb = (title, tf) => {
        if (!tf) return `<div style="font-size:0.58rem;color:var(--text-muted);">${title}: 데이터 없음</div>`;
        const rc = tf.rsi14<=30?COL2.green:tf.rsi14>=70?COL2.red:'var(--text-bright)';
        const zc = tf.z20<=-1.5?COL2.green:tf.z20>=1.5?COL2.red:'var(--text-bright)';
        const vc = tf.vwap_dev<0?COL2.cyan:COL2.amber;
        return `<div style="margin-top:6px;"><div style="font-size:0.55rem;color:var(--text-muted);margin-bottom:2px;">${title} <span style="opacity:0.7;">바 ${tf.last_bar}</span></div>
          <div style="display:flex;gap:4px;">${metric2('RSI(14)',tf.rsi14,'',rc)}${metric2('z20',(tf.z20>=0?'+':'')+tf.z20,'σ',zc)}${metric2('VWAP이격',(tf.vwap_dev>=0?'+':'')+tf.vwap_dev,'%',vc)}${metric2('당일위치',tf.day_pos,'%',tf.day_pos<=20?COL2.green:tf.day_pos>=80?COL2.red:'var(--text-bright)')}</div></div>`;
      };
      const fetchBithumb = async () => {
        const [tkR, cR] = await Promise.all([
          fetch('https://api.bithumb.com/public/ticker/XRP_KRW', { cache:'no-store' }),
          fetch('https://api.bithumb.com/public/candlestick/XRP_KRW/3m', { cache:'no-store' }),
        ]);
        const tk = (await tkR.json()).data, cj = await cR.json();
        if (!tk || cj.status !== '0000') throw new Error('bithumb');
        // 빗썸 캔들: [ts, open, close, high, low, volume]
        const c3 = cj.data.map(r => ({ t:+r[0], o:+r[1], c:+r[2], h:+r[3], l:+r[4], v:+r[5] }));
        const price = +tk.closing_price, prev = +tk.prev_closing_price;
        const chg = prev ? (price-prev)/prev*100 : (+tk.fluctate_rate_24H || 0);
        return { price, chg, c3, unit:'원', src:'빗썸 KRW', rnd:0 };
      };
      const fetchBinance = async () => {
        const [tkR, kR] = await Promise.all([
          fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=XRPUSDT', { cache:'no-store' }),
          fetch('https://api.binance.com/api/v3/klines?symbol=XRPUSDT&interval=3m&limit=500', { cache:'no-store' }),
        ]);
        const tk = await tkR.json(), kl = await kR.json();
        const c3 = kl.map(k => ({ t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5] }));
        return { price:+tk.lastPrice, chg:+tk.priceChangePercent, c3, unit:'$', src:'바이낸스 USD', rnd:4 };
      };
      const updateXrp = async () => {
        const card = document.getElementById('intraday-xrp-card');
        if (!card) return;
        let d;
        try { d = await fetchBithumb(); }
        catch (e) { try { d = await fetchBinance(); } catch (_) {
          const sigEl = card.querySelector('[data-xrp-sig]'); if (sigEl) sigEl.textContent = '⚠️ 거래소 연결 실패 (재시도 중)';
          return;
        } }
        const tf3 = calcTF(d.c3), tf15 = calcTF(resample(d.c3, 5));
        const [sig, sc] = sigOf(tf3);
        const pTxt = `${fmtV(d.price, d.rnd)}${d.unit}`;
        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <span style="font-size:0.8rem;font-weight:700;color:var(--text-bright);">⚪ XRP</span>
            <span style="font-size:0.8rem;font-weight:800;font-family:var(--font-mono);color:var(--text-bright);">${pTxt}</span>
          </div>
          <div data-xrp-sig style="font-size:0.72rem;font-weight:700;color:${sc};margin:4px 0 2px;">${sig}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(34,211,238,0.07);border-radius:6px;padding:4px 8px;margin:5px 0;">
            <span style="font-size:0.56rem;color:#22d3ee;font-weight:700;">🔴 LIVE ${d.src}</span>
            <span style="font-size:0.62rem;font-weight:700;color:${d.chg>=0?'#22c55e':'#f87171'};">${d.chg>=0?'+':''}${(+d.chg).toFixed(2)}%</span>
            <span style="font-size:0.5rem;color:var(--text-muted);">${new Date().toLocaleTimeString('ko-KR')}</span>
          </div>
          ${tf3?`<div style="font-size:0.56rem;color:var(--text-muted);">VWAP ${fmtV(tf3.vwap,d.rnd)}${d.unit} 대비 <b style="color:${tf3.vwap_dev<0?COL2.cyan:COL2.amber};">${tf3.vwap_dev>=0?'+':''}${tf3.vwap_dev}%</b></div>`:''}
          ${tfb('3분봉', tf3)}
          ${tfb('15분봉', tf15)}`;
      };
      updateXrp();
      window.__xrpLiveTimer = setInterval(updateXrp, 10000);
    }
  }

  // ─── 📦 수출입 동향 ──────────────────────────────────
  function renderTradeData(td) {
    if (!td || !td.products) return;
    const s = td.summary || {};
    const catColor = {
      'IT/전자':'#22d3ee','에너지/화학':'#fbbf24','자동차':'#f59e0b',
      '기계':'#94a3b8','조선':'#60a5fa','소재':'#a78bfa','소비재':'#f472b6',
      '바이오':'#34d399','농식품':'#4ade80','배터리':'#86efac'
    };
    const chgColor = v => v >= 20 ? '#22c55e' : v >= 0 ? '#4ade80' : v >= -5 ? '#fbbf24' : '#f87171';
    const chgBg   = v => v >= 0 ? 'rgba(74,222,128,0.1)' : 'rgba(248,113,113,0.1)';

    // 월별 트렌드 미니차트
    const trend = td.monthly_trend || [];
    let trendSvg = '';
    if (trend.length >= 2) {
      const vals = trend.map(t => t.total);
      const maxV = Math.max(...vals), minV = Math.min(...vals);
      const TW = 200, TH = 44;
      let pts = '';
      trend.forEach((t, i) => {
        const x = (i / (trend.length - 1)) * TW;
        const y = TH - ((t.total - minV) / (maxV - minV + 1)) * (TH - 8) - 4;
        pts += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
      });
      const last = trend[trend.length - 1];
      const lx = TW, ly = TH - ((last.total - minV) / (maxV - minV + 1)) * (TH - 8) - 4;
      trendSvg = `<svg viewBox="0 0 ${TW} ${TH}" width="100%" height="${TH}" preserveAspectRatio="none" style="display:block;width:100%;">
        <path d="${pts.trim()}" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.5" fill="#22d3ee" vector-effect="non-scaling-stroke"/>
      </svg>`;
    }

    // 상단 KPI
    const kpis = `<div style="display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
      <div class="glass-card" style="padding:12px 18px;min-width:160px;border-left:3px solid #22d3ee;">
        <div style="font-size:0.65rem;color:var(--text-muted);">📦 총 수출액 (${h(td.period_label||'')})</div>
        <div style="font-size:1.6rem;font-weight:800;color:var(--text-bright);">${h(s.total_export_str||'')}</div>
        <div style="font-size:0.75rem;color:#22c55e;font-weight:600;">${s.yoy_pct >= 0 ? '+' : ''}${s.yoy_pct}% YoY</div>
        ${s.record ? `<div style="font-size:0.62rem;background:rgba(250,204,21,0.15);color:#fbbf24;padding:2px 7px;border-radius:8px;display:inline-block;margin-top:3px;">🏆 ${h(s.record)}</div>` : ''}
      </div>
      <div class="glass-card" style="padding:12px 18px;flex:1;min-width:200px;">
        <div style="font-size:0.65rem;color:var(--text-muted);margin-bottom:4px;">📈 월별 수출 추이 (억달러)</div>
        ${trendSvg}
        <div style="display:flex;justify-content:space-between;font-size:0.6rem;color:var(--text-muted);margin-top:2px;">
          ${trend.map(t => `<span>${t.month.slice(5)}월</span>`).join('')}
        </div>
      </div>
      <div class="glass-card" style="padding:12px 18px;min-width:200px;">
        <div style="font-size:0.65rem;color:#22c55e;font-weight:600;margin-bottom:4px;">✅ 주요 성과</div>
        ${(td.insights||[]).slice(0,3).map(ins => `<div style="font-size:0.68rem;color:var(--text);line-height:1.5;margin-bottom:3px;">${h(ins)}</div>`).join('')}
      </div>
      <div class="glass-card" style="padding:12px 18px;min-width:200px;">
        <div style="font-size:0.65rem;color:#f87171;font-weight:600;margin-bottom:4px;">⚠️ 리스크</div>
        ${(td.risk_factors||[]).map(r => `<div style="font-size:0.67rem;color:var(--text-muted);line-height:1.5;margin-bottom:3px;">• ${h(r)}</div>`).join('')}
      </div>
    </div>`;

    // 제품별 바 차트
    // ── 세로 막대 차트 (SVG) ─────────────────────────
    const sorted = [...(td.products||[])].sort((a,b) => b.export_bn - a.export_bn);
    const maxExport = sorted[0]?.export_bn || 1;

    const BAR_W = 50, GAP = 8, ML = 46, MR = 12, MT = 52, MB = 90;
    const CH = 240; // 차트 영역 높이
    const totalW = ML + sorted.length * (BAR_W + GAP) - GAP + MR;
    const SVG_H = MT + CH + MB;

    // Y축 그리드
    const yTicks = [0, 5, 10, 15, 20, 25, 30, 35, 40];
    const yScl = (v) => CH - (v / maxExport) * CH;

    let gridSvg = yTicks
      .filter(v => v <= maxExport + 2)
      .map(v => {
        const y = MT + yScl(v);
        return `<line x1="${ML}" y1="${y.toFixed(1)}" x2="${totalW - MR}" y2="${y.toFixed(1)}"
          stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
          <text x="${ML - 6}" y="${(y + 4.5).toFixed(1)}" text-anchor="end"
            fill="#94a3b8" font-size="12" font-weight="500">${v}억</text>`;
      }).join('');

    let barsSvg = sorted.map((p, i) => {
      const x    = ML + i * (BAR_W + GAP);
      const bH   = Math.max(3, (p.export_bn / maxExport) * CH);
      const by   = MT + CH - bH;
      const cc   = p.yoy_pct >= 0 ? (p.yoy_pct >= 20 ? '#22c55e' : '#4ade80') : (p.yoy_pct >= -5 ? '#fbbf24' : '#f87171');
      const opacity = p.yoy_pct >= 0 ? 0.88 : 0.65;
      const nameShort = p.name.length > 5 ? p.name.slice(0, 5) : p.name;
      const chgTxt = (p.yoy_pct >= 0 ? '+' : '') + p.yoy_pct + '%';
      const cx = (x + BAR_W / 2).toFixed(1);

      return `<g>
        <!-- 막대 -->
        <rect x="${x}" y="${by.toFixed(1)}" width="${BAR_W}" height="${bH.toFixed(1)}"
          rx="4" fill="${cc}" opacity="${opacity}"/>
        ${p.record ? `<rect x="${x}" y="${by.toFixed(1)}" width="${BAR_W}" height="${bH.toFixed(1)}"
          rx="4" fill="${cc}" opacity="0.3" filter="url(#glow)"/>` : ''}
        <!-- 수출액 (막대 위, 더 위쪽) -->
        <text x="${cx}" y="${(by - 20).toFixed(1)}"
          text-anchor="middle" fill="${cc}" font-size="12" font-weight="700"
          font-family="monospace">${p.export_bn.toFixed(1)}억</text>
        <!-- 증감률 (막대 바로 위) -->
        <text x="${cx}" y="${(by - 5).toFixed(1)}"
          text-anchor="middle" fill="${cc}" font-size="13" font-weight="800"
          font-family="monospace">${chgTxt}</text>
        <!-- 역대순위 뱃지 -->
        ${p.record ? `<text x="${cx}" y="${(MT + CH + 16).toFixed(1)}"
          text-anchor="middle" fill="#fbbf24" font-size="13">🏆</text>` : ''}
        <!-- 품목명 (45도 회전) -->
        <text transform="rotate(-40,${cx},${(MT + CH + 28).toFixed(1)})"
          x="${cx}" y="${(MT + CH + 28).toFixed(1)}"
          text-anchor="end" fill="#e2e8f0" font-size="13" font-weight="600">${h(nameShort)}</text>
      </g>`;
    }).join('');

    const vertChart = `<div class="glass-card anim-item" style="padding:14px 18px;overflow-x:auto;">
      <div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:6px;">
        20대 주요 품목별 수출액(억달러) · 증감률 · 아래→위: 수출규모
      </div>
      <svg viewBox="0 0 ${totalW} ${SVG_H}" width="${totalW}" height="${SVG_H}"
           style="display:block;min-width:${totalW}px;">
        <defs>
          <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- 기준선 -->
        <line x1="${ML}" y1="${MT + CH}" x2="${totalW - MR}" y2="${MT + CH}"
          stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
        ${gridSvg}
        ${barsSvg}
      </svg>
    </div>`;

    const html = `<section class="section-wrap" id="trade-section">
      <div class="section-label" style="color:var(--cyan);">📦 수출입 동향
        <span style="font-size:0.65rem;color:var(--text-muted);margin-left:8px;">${h(td.period_label||'')} 월간 통계 · 출처: ${h(td.source||'')} · <span style="color:#fbbf24;">월 1회 공식 발표</span></span>
      </div>
      ${kpis}
      ${vertChart}
      <div style="font-size:0.62rem;color:var(--text-muted);margin-top:6px;text-align:right;">
        🚨 시뮬레이션·분석용. 투자 결정 금지. 자료: 산업통상자원부
      </div>
    </section>`;

    const existing = document.getElementById('trade-section');
    if (existing) { existing.outerHTML = html; }
    else { (document.getElementById('app') || document.body).insertAdjacentHTML('beforeend', html); }
    scheduleNavRebuild();
  }

  // ─── ⚔️ Key Debates ──────────────────────────────────
  function renderKeyDebates(db) {
    if (!db || !db.debates || !db.debates.length) return;

    const statusColor = { '진행 중': '#fbbf24', '논란': '#f87171', '임박': '#f87171', '결론': '#4ade80' };
    const getStatusColor = (s) => {
      for (const [k, v] of Object.entries(statusColor)) { if (s && s.includes(k)) return v; }
      return '#22d3ee';
    };
    const colorVar = { red:'#f87171', amber:'#fbbf24', green:'#4ade80', cyan:'#22d3ee', muted:'#64748b' };

    let debatesHtml = '';
    db.debates.forEach(d => {
      const sc = getStatusColor(d.status);
      const tagsHtml = (d.tags||[]).map(t =>
        `<span style="padding:1px 6px;background:rgba(255,255,255,0.07);border-radius:8px;font-size:0.6rem;color:var(--text-muted);">${h(t)}</span>`
      ).join(' ');
      const dataHtml = (d.key_data||[]).map(kd =>
        `<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
          <span style="font-size:0.68rem;color:var(--text-muted);">${h(kd.label)}</span>
          <span style="font-size:0.7rem;font-weight:700;color:${colorVar[kd.color]||'var(--text)'};">${h(kd.value)}</span>
        </div>`
      ).join('');
      const srcLink = d.source_url
        ? `<a href="${h(d.source_url)}" target="_blank" style="color:var(--cyan);text-decoration:none;font-size:0.62rem;">${h(d.source)}</a>`
        : `<span style="font-size:0.62rem;color:var(--text-muted);">${h(d.source||'')}</span>`;

      debatesHtml += `
      <div class="glass-card anim-item" style="padding:0;overflow:hidden;border-top:3px solid ${sc};">
        <!-- 헤더 -->
        <div style="padding:12px 16px 8px;background:rgba(255,255,255,0.02);">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;">
            <div style="font-size:0.85rem;font-weight:700;color:var(--text-bright);flex:1;">${h(d.title)}</div>
            <span style="background:${sc}22;color:${sc};padding:2px 8px;border-radius:10px;font-size:0.63rem;font-weight:600;white-space:nowrap;">${h(d.status)}</span>
          </div>
          <div style="font-size:0.7rem;color:var(--text-muted);line-height:1.5;">${h(d.summary)}</div>
        </div>
        <!-- 주장 vs 반박 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;">
          <div style="padding:10px 14px;background:rgba(99,179,237,0.04);border-right:1px solid rgba(255,255,255,0.06);">
            <div style="font-size:0.65rem;color:#93c5fd;font-weight:600;margin-bottom:6px;">${h(d.position_a.icon)} ${h(d.position_a.label)}
              <span style="background:rgba(147,197,253,0.15);padding:1px 5px;border-radius:6px;margin-left:4px;">${h(d.position_a.stance)}</span>
            </div>
            ${(d.position_a.claims||[]).map(c =>
              `<div style="font-size:0.68rem;color:var(--text);line-height:1.55;margin-bottom:4px;padding-left:8px;border-left:2px solid rgba(147,197,253,0.3);">${h(c)}</div>`
            ).join('')}
          </div>
          <div style="padding:10px 14px;background:rgba(248,113,113,0.04);">
            <div style="font-size:0.65rem;color:#f87171;font-weight:600;margin-bottom:6px;">${h(d.position_b.icon)} ${h(d.position_b.label)}
              <span style="background:rgba(248,113,113,0.15);padding:1px 5px;border-radius:6px;margin-left:4px;">${h(d.position_b.stance)}</span>
            </div>
            ${(d.position_b.claims||[]).map(c =>
              `<div style="font-size:0.68rem;color:var(--text);line-height:1.55;margin-bottom:4px;padding-left:8px;border-left:2px solid rgba(248,113,113,0.3);">${h(c)}</div>`
            ).join('')}
          </div>
        </div>
        <!-- 핵심 데이터 -->
        ${dataHtml ? `<div style="padding:8px 14px;background:rgba(0,0,0,0.15);border-top:1px solid rgba(255,255,255,0.05);">
          <div style="font-size:0.62rem;color:var(--cyan);font-weight:600;margin-bottom:4px;">📊 핵심 데이터</div>
          ${dataHtml}
        </div>` : ''}
        <!-- 소결·출처 -->
        <div style="padding:8px 14px 10px;background:rgba(255,255,255,0.01);border-top:1px solid rgba(255,255,255,0.05);">
          <div style="font-size:0.68rem;color:var(--text);line-height:1.5;margin-bottom:6px;">
            <span style="color:${sc};font-weight:600;">▶ 소결: </span>${h(d.verdict||'')}
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;">
            <div style="display:flex;flex-wrap:wrap;gap:3px;">${tagsHtml}</div>
            <div style="display:flex;gap:8px;align-items:center;">${srcLink}

    });

    const html = `<section class="section-wrap" id="key-debates-section">
      <div class="section-label" style="color:var(--amber,#fbbf24);">⚔️ 핵심 논쟁
        <span style="font-size:0.65rem;color:var(--text-muted);margin-left:8px;">${h(db.section_desc||'')} · ${db.debates.length}개 이슈</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:14px;">
        ${debatesHtml}
      </div>
      <div style="margin-top:8px;font-size:0.62rem;color:var(--text-muted);text-align:right;">
        🚨 <span style="color:#fbbf24;">큐레이션 분석(편집 콘텐츠)</span> · 새 논쟁 발생 시 수동 업데이트. 시뮬레이션·분석용, 투자 결정 금지.
      </div>
    </section>`;

    const existing = document.getElementById('key-debates-section');
    if (existing) { existing.outerHTML = html; }
    else { (document.getElementById('app') || document.body).insertAdjacentHTML('beforeend', html); }
    scheduleNavRebuild();
  }

  // ─── 📅 Economic Calendar ────────────────────────────
  function renderEconomicCalendar(calData) {
    if (!calData || !calData.events || calData.events.length === 0) return;

    // ── 지난 이벤트 제외: 오늘(KST) 이후만 표시 (미래 이벤트는 백엔드가 계속 수집) ──
    const _td = new Date();
    const _todayKST = `${_td.getFullYear()}-${String(_td.getMonth() + 1).padStart(2, '0')}-${String(_td.getDate()).padStart(2, '0')}`;
    const _upcoming = calData.events.filter(ev => !ev.date || String(ev.date).includes('TBD') || String(ev.date) >= _todayKST);
    if (!_upcoming.length) return;
    calData = Object.assign({}, calData, { events: _upcoming });

    // ── 실시간 카운트다운 타깃 계산 (ET 이벤트는 EDT, 그 외 KST) ──
    const eventTargetMs = (ev) => {
      if (!ev.date || String(ev.date).includes('TBD')) return null;
      const m = String(ev.time || '').match(/(\d{1,2}):(\d{2})/);
      const hh = m ? m[1].padStart(2, '0') : '09';
      const mm = m ? m[2] : '00';
      const tz = /ET|EST|EDT/i.test(ev.time || '') ? '-04:00' : '+09:00';
      const t = new Date(`${ev.date}T${hh}:${mm}:00${tz}`).getTime();
      return isNaN(t) ? null : t;
    };

    const impactColor = { HIGH: '#f87171', MEDIUM: '#fbbf24', LOW: '#4ade80' };
    const impactLabel = { HIGH: '🔴 HIGH', MEDIUM: '🟡 MEDIUM', LOW: '🟢 LOW' };
    const catIcon = {
      'IPO': '🚀', '경제지표': '📊', '중앙은행': '🏦',
      'FX/금리': '💱', '지정학': '🌍', 'VIP방한': '✈️',
      '국채입찰': '🏦', '실적': '📈', '파생만기': '🎭', '기타': '📌'
    };

    // Group by date
    const byDate = {};
    calData.events.forEach(ev => {
      const d = ev.date || 'TBD';
      if (!byDate[d]) byDate[d] = [];
      byDate[d].push(ev);
    });

    let html = `<section class="section-wrap">
      <div class="section-label" style="color:var(--amber,#fbbf24);">📅 주요 이벤트 캘린더
        <span style="font-size:0.65rem;color:var(--text-muted);margin-left:8px;">${h(calData.month || '')} · ${calData.events.length}개 이벤트</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;">`;

    Object.entries(byDate).forEach(([date, events]) => {
      const isTBD = date.includes('TBD');
      const dateDisplay = isTBD ? '📌 일정 미정' : (() => {
        const parts = date.split('-');
        return `${parts[1]}월 ${parts[2]}일`;
      })();

      events.forEach(ev => {
        const color = impactColor[ev.impact] || '#94a3b8';
        const icon  = catIcon[ev.category] || '📌';
        const tags  = (ev.tags || []).map(t =>
          `<span style="padding:1px 6px;background:rgba(255,255,255,0.08);border-radius:10px;font-size:0.6rem;color:var(--text-muted);">${h(t)}</span>`
        ).join(' ');

        // 실시간 카운트다운 배지 (예정 이벤트만)
        const cdMs = (ev.status !== 'released') ? eventTargetMs(ev) : null;
        const cdBadge = cdMs ? `<span class="evt-cd" data-t="${cdMs}" style="font-size:0.6rem;font-weight:700;font-family:var(--font-mono);color:#fbbf24;background:rgba(251,191,36,0.12);padding:1px 7px;border-radius:8px;white-space:nowrap;">…</span>` : '';

        // ── VIP 방한 특별 카드 (면담 테이블 + 영향 종목) ──────────────
        if (ev.category === 'VIP방한' && (ev.meetings || ev.affected_stocks)) {
          const meetings = ev.meetings || [];
          const stocks   = ev.affected_stocks || [];
          html += `<div class="glass-card anim-item" style="padding:14px 16px;border-left:3px solid ${color};grid-column:span 2;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
              <div style="font-size:0.72rem;color:var(--text-muted);font-family:var(--font-mono);">${ev.region||''} ${dateDisplay}</div>
              <div style="display:flex;gap:6px;align-items:center;">${cdBadge}<span style="font-size:0.65rem;font-weight:600;color:${color};">${impactLabel[ev.impact]||ev.impact}</span></div>
            </div>
            <div style="font-size:0.92rem;font-weight:700;color:var(--text-bright);margin-bottom:6px;">
              ${icon} ${h(ev.title)}
            </div>
            <div style="font-size:0.72rem;color:var(--text-muted);line-height:1.6;margin-bottom:${ev.impact_analysis ? '4px' : '10px'};">${h(ev.detail||'')}</div>
            ${ev.impact_analysis ? `<div style="font-size:0.7rem;color:var(--text);line-height:1.6;background:rgba(255,255,255,0.04);border-radius:4px;padding:6px 8px;margin-bottom:10px;border-left:2px solid rgba(99,179,237,0.4);">
              <span style="font-size:0.6rem;color:var(--cyan);font-weight:600;display:block;margin-bottom:2px;">📊 시장 영향 분석</span>
              ${h(ev.impact_analysis)}
            </div>` : ''}
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              ${meetings.length ? `<div>
                <div style="font-size:0.68rem;color:var(--cyan);font-weight:600;margin-bottom:6px;">👥 면담 일정</div>
                <table style="width:100%;border-collapse:collapse;font-size:0.68rem;">
                  ${meetings.map(m => `<tr style="border-bottom:1px solid rgba(255,255,255,0.06);">
                    <td style="padding:5px 8px;color:var(--text-bright);font-weight:700;white-space:nowrap;min-width:60px;">${h(m.name)}</td>

  // ── 이벤트 실시간 카운트다운 (매초 갱신) ──
  function startCalendarCountdown() {
    if (window.__calCdTimer) clearInterval(window.__calCdTimer);
    const p = n => String(n).padStart(2, '0');
    const tick = () => {
      const els = document.querySelectorAll('.evt-cd');
      if (!els.length) { clearInterval(window.__calCdTimer); return; }
      const now = Date.now();
      els.forEach(el => {
        const diff = (+el.dataset.t) - now;
        if (diff <= 0) {
          el.textContent = '🔔 발표/시작';
          el.style.color = '#4ade80';
          el.style.background = 'rgba(74,222,128,0.15)';
          return;
        }
        const s = Math.floor(diff / 1000);
        const d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mi = Math.floor(s % 3600 / 60), se = s % 60;
        el.textContent = d > 0 ? `D-${d} ${p(hh)}:${p(mi)}:${p(se)}` : `⏰ ${p(hh)}:${p(mi)}:${p(se)}`;
        // 임박(24시간 이내) 강조
        if (diff < 86400000) { el.style.color = '#f87171'; el.style.background = 'rgba(248,113,113,0.12)'; }
      });
    };
    tick();
    window.__calCdTimer = setInterval(tick, 1000);
  }

  // ─── 💱 USD/JPY 값 통일 (소스별 제각각 → 가장 최신값으로 일치) ──────
  window.__yenSrc = window.__yenSrc || {};
  function registerYen(key, value, ts) {
    const v = Number(value);
    if (!v || v <= 0) return;
    window.__yenSrc[key] = { v: v, ts: String(ts || '') };
    applyCanonicalYen();
  }
  function applyCanonicalYen() {
    if (window.__fxLiveStarted) return;  // 실시간 키 작동 중이면 그쪽이 통일 담당
    const arr = Object.values(window.__yenSrc);
    if (!arr.length) return;
    arr.sort((a, b) => (a.ts < b.ts ? 1 : -1));  // ts(생성시각) 큰=최신 우선
    const ps = arr[0].v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    document.querySelectorAll('[data-fx="usdjpy"]').forEach(el => { el.textContent = ps; });
  }

  // ─── 💱 실시간 FX (USD/JPY·USD/KRW) — TwelveData 무료 키 폴링 ─────────
  // 사용법: 아래 apiKey 에 TwelveData 무료 키 입력 (https://twelvedata.com 가입 → API Key 복사).
  //   · 키가 비어 있으면 비활성 → 기존 워크플로 값(약 1시간 주기) 그대로 표시.
  //   · 공개 레포라 키가 노출됨(읽기전용 시세 키라 위험 낮으나 쿼터 도용 가능).
  //   · 무료 800req/일: 2쌍 × 120초 ≈ 720/일. 쌍을 늘리면 intervalSec 도 늘리세요.
  const FX_LIVE = {
    apiKey: '',                                    // ← 여기에 TwelveData 무료 키 입력
    pairs: { usdjpy: 'USD/JPY', usdkrw: 'USD/KRW' },
    intervalSec: 120,
  };
  function startLiveFx() {
    if (window.__fxLiveStarted || !FX_LIVE.apiKey) return;
    window.__fxLiveStarted = true;
    const syms = Object.values(FX_LIVE.pairs).join(',');
    async function tick() {
      try {
        const url = `https://api.twelvedata.com/quote?symbol=${encodeURIComponent(syms)}&apikey=${FX_LIVE.apiKey}`;
        const r = await fetch(url, { cache: 'no-store' });
        const d = await r.json();
        Object.entries(FX_LIVE.pairs).forEach(([key, sym]) => {
          const q = d && (d[sym] || (d.symbol === sym ? d : null));
          if (!q || q.status === 'error' || q.close == null) return;
          const price = parseFloat(q.close);
          const pct = parseFloat(q.percent_change);
          const valEl = document.getElementById('fxval-' + key);
          const chgEl = document.getElementById('fxchg-' + key);
          const liveEl = document.getElementById('fxlive-' + key);
          const ps = price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          if (valEl && !isNaN(price)) valEl.textContent = ps;
          // 페이지 내 엔화가 있는 모든 곳(한일 진단·일본 위기 모니터 등) 실시간 패치
          if (!isNaN(price)) document.querySelectorAll('[data-fx="' + key + '"]').forEach(el => { el.textContent = ps; });
          if (chgEl && !isNaN(pct)) {
            chgEl.textContent = (pct >= 0 ? '▲ +' : '▼ ') + pct.toFixed(2) + '%';
            chgEl.style.color = pct >= 0 ? 'var(--green,#4ade80)' : 'var(--red,#f87171)';
          }
          if (liveEl) { liveEl.style.display = 'inline'; liveEl.title = '실시간 갱신: ' + new Date().toLocaleTimeString(); }
        });
      } catch (e) { /* 네트워크·쿼터 실패 → 기존 값 유지 */ }
    }
    tick();
    setInterval(tick, Math.max(30, FX_LIVE.intervalSec) * 1000);
  }

      fetch('./ai_value_gap.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(d => { if (d) renderAiValueGap(d); });
      // Load FX Swap Monitor (외환위기 조기경보 — FX 스왑 그림자부채 6대 지표)
      fetch('./fx_swap.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(d => { if (d) renderFxSwap(d); });
      // Load Asia Semiconductor Monitor (아시아 반도체 당일 동조 — 디커플링 선행동력)
      fetch('./asia_semi.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(as => { if (as) renderAsiaSemi(as); });
      // Load Strategy Backtest (전략 백테스트)
      fetch('./strategy_backtest.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(sb => { if (sb) renderStrategyBacktest(sb); });
      // Load Liquidity Stress (시스템 유동성 위험 게이지)
      fetch('./liquidity_stress.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(ls => { if (ls) renderLiquidityStress(ls); });
      // Load Overheating Risk Gauge (과열·차익실현 위험)
      fetch('./overheating.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(oh => { if (oh) renderOverheating(oh); });
      // Load Market Sentiment Index (시장감정지수 Fear & Greed)
      fetch('./sentiment.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(se => { if (se) renderSentiment(se); });
      // Load Holdings + Retail Avg Price (외국인 보유 + 개미 평단가)
      fetch('./holdings_estimate.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(hd => { if (hd) renderHoldings(hd); });
      // (분봉 단타 보조지표 섹션 삭제됨 — 사용자 요청)
    })
    .catch(err => {
      $('#app').innerHTML = `
        <div class="state-screen">
          <div class="error-icon">&#9888;</div>
          <div class="error-title">데이터 로드 실패</div>
          <div class="error-msg">${err.message}</div>
        </div>`;
    });

})();
</script>
</body>
</html>
