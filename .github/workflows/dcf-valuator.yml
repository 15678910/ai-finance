name: DCF Valuator

on:
  schedule:
    # 매일 KST 07:30 (auto_research_value 직후)
    - cron: '30 22 * * *'  # UTC 22:30 = KST 07:30
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run DCF valuator
        env:
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python dcf_valuator.py

      # 출력 sanity check — 의도적으로 `|| echo` 를 붙이지 않는다.
      # 음수 적정가·-100% 미만 괴리·NaN 같은 회귀가 나오면 이 스텝이 실패해 실행이
      # 빨갛게 표시된다(2026-09-19 사고는 이 단계가 없어 초록색으로 지나갔다).
      # 커밋 스텝은 if: always() 라 데이터는 그대로 올라간다 — 알림만 켜진다.
      - name: Validate DCF output
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python validate_dcf_output.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add docs/ 2>/dev/null || true
          if git diff --cached --quiet 2>/dev/null; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update DCF valuations [automated]"
          for i in 1 2 3 4 5; do
            if git push 2>/dev/null; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            git pull --rebase --strategy-option=theirs || git rebase --abort
            sleep $((i * 2))
          done
          exit 1
