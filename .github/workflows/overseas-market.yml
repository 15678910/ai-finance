name: Overseas Market Monitor

on:
  schedule:
    # KOSPI 마감 후~다음날 개장 전: 매시간 정시
    # KST 16:00, 17:00, ... 23:00, 00:00, ... 08:00 = UTC 07:00, 08:00, ... 23:00
    # = 모든 정시에 실행하되 KOSPI 운영 중(09:00~15:00 KST = 00:00~06:00 UTC)에는 스킵
    - cron: '0 7-23 * * *'  # UTC 07:00~23:00 = KST 16:00~다음날 08:00
    - cron: '0 0 * * *'     # UTC 00:00 = KST 09:00 (KOSPI 시초가 직전)
    # 미국 장 마감 확정값 캡처 (4PM EDT=20:00 UTC, 15·30분 후 정산값)
    - cron: '15 20 * * 1-5' # UTC 20:15 = 4:15PM EDT (장 마감 직후)
    - cron: '30 20 * * 1-5' # UTC 20:30 = 4:30PM EDT (마감 정산값 확정)
  workflow_dispatch:

concurrency:
  group: docs-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # generate_dashboard_data.py 병합에 필요한 전체 의존성 (openpyxl 등)
          pip install -r requirements.txt || pip install yfinance openpyxl pandas requests

      - name: Run overseas market monitor
        env:
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python overseas_market_monitor.py

      # AI 패러다임 모니터 (MV=PY · 휴머노이드 · CAPEX) — 별도 JSON, 대시보드가 직접 fetch
      - name: Run AI paradigm monitor
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python ai_paradigm_monitor.py || echo "AI paradigm monitor had errors, continuing..."

      # KOSPI 시나리오 시뮬레이터 — 베타 회귀 + 현재가 스냅샷
      - name: Run KOSPI scenario simulator
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python kospi_scenario.py || echo "KOSPI scenario had errors, continuing..."

      # 과열·차익실현 위험 게이지 (z-score·이격도·모멘텀)
      - name: Run overheating monitor
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python overheating_monitor.py || echo "Overheating monitor had errors, continuing..."

      # KOSPI 예측 vs 실제 추적 (kospi_scenario 베타 사용 → 이후 실행)
      - name: Run prediction tracker
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python prediction_tracker.py || echo "Prediction tracker had errors, continuing..."

      # 시장감정지수 (Fear & Greed composite)
      - name: Run sentiment index
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python sentiment_index.py || echo "Sentiment index had errors, continuing..."

      # 시장 뉴스 수집 (급변 원인 — Yahoo·네이버 RSS)
      - name: Run market news collector
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python market_news.py || echo "Market news had errors, continuing..."

      # SK하이닉스 OHLC 예측 (나스닥 선물 + 반도체 동료)
      - name: Run SK Hynix OHLC forecast
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python sk_hynix_forecast.py || echo "SK Hynix forecast had errors, continuing..."

      # overseas_market.json을 data.json에 병합 (대시보드는 data.json을 읽음)
      # 이 단계가 없으면 시세는 수집돼도 화면·갱신시각이 멈춤
      - name: Regenerate dashboard data.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python generate_dashboard_data.py || echo "Dashboard regeneration had errors, continuing..."

      # 외국인 보유 + 개미 추정 평단가 (data.json 읽음 → regenerate 이후 실행)
      - name: Run holdings estimate
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python holdings_estimate.py || echo "Holdings estimate had errors, continuing..."

      - name: Commit results
        if: always()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add docs/overseas_market.json docs/overseas_market_state.json docs/data.json docs/macro_cache.json docs/ai_paradigm.json docs/kospi_scenario.json docs/overheating.json docs/sentiment.json docs/holdings_estimate.json docs/prediction_log.json docs/market_news.json docs/us_index_cache.json docs/sk_hynix_forecast.json docs/kospi_chart.json 2>/dev/null || true

          if git diff --cached --quiet 2>/dev/null; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update overseas market data [automated]"

          # Retry push up to 5 times with rebase on conflict
          for i in 1 2 3 4 5; do
            if git push 2>/dev/null; then
              echo "Pushed successfully on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, rebasing..."
            git pull --rebase --strategy-option=theirs || git rebase --abort
            sleep $((i * 2))
          done

          echo "Failed to push after 5 attempts"
          exit 1
