name: DART Watchlist Disclosures

# 관심종목(대통령 3대 메가프로젝트 수혜) DART 수주·투자 공시 모니터.
# 공시는 보통 장 마감 후(15:30+) 접수 → 마감 후 위주로 하루 4회. 주말도 실행(generated_at 신선도 유지).
on:
  schedule:
    - cron: '30 0,7,9,11 * * *'   # UTC 00:30,07:30,09:30,11:30 = KST 09:30,16:30,18:30,20:30
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run DART watchlist monitor
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python dart_watchlist_monitor.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add docs/ 2>/dev/null || true
          if git diff --cached --quiet 2>/dev/null; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update DART watchlist disclosures [automated]"
          for i in 1 2 3 4 5; do
            if git push 2>/dev/null; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            git pull --rebase --strategy-option=theirs || git rebase --abort
            sleep $((i * 2))
          done
          echo "Push failed after 5 attempts"
          exit 1
