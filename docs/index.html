<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI 기반 한국 주식시장 일일 분석 대시보드">
<title>AI 금융 분석 대시보드</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e17'/%3E%3Cpolyline points='4,24 10,14 16,18 22,8 28,12' fill='none' stroke='%2306b6d4' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='28' cy='12' r='2' fill='%2310b981'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script src="https://unpkg.com/versor@0.2.0/build/versor.min.js"></script>

<style>
/* ─── Reset & Base ─────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:           #0a0e17;
  --surface:      #111827;
  --surface-hi:   #162032;
  --surface-glass: rgba(17, 24, 39, 0.7);
  --border:       rgba(6,182,212,0.12);
  --border-hi:    rgba(6,182,212,0.28);
  --cyan:         #06b6d4;
  --cyan-dim:     rgba(6,182,212,0.15);
  --green:        #10b981;
  --green-dim:    rgba(16,185,129,0.15);
  --red:          #ef4444;
  --red-dim:      rgba(239,68,68,0.15);
  --amber:        #f59e0b;
  --amber-dim:    rgba(245,158,11,0.15);
  --orange:       #f97316;
  --orange-dim:   rgba(249,115,22,0.15);
  --text:         #f1f5f9;
  --text-muted:   #e2e8f0;
  --text-bright:  #ffffff;
  --font: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Consolas", "Menlo", monospace;
  --radius:  10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
  --shadow:  0 4px 24px rgba(0,0,0,0.4);
  --shadow-glow: 0 0 30px rgba(6,182,212,0.08);
  --row-even: rgba(255,255,255,0.02);
}

html { font-size: 24px; scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Subtle grid texture (cosmic dim) */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(6,182,212,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(6,182,212,0.02) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

/* ─── 🌌 우주 별 배경 (Cosmic Stars) ──────────────────── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 50% 50%, rgba(34,211,238,0.3), transparent),
    radial-gradient(2px 2px at 80% 10%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 90% 60%, rgba(167,139,250,0.4), transparent),
    radial-gradient(1px 1px at 33% 80%, rgba(255,255,255,0.5), transparent),
    radial-gradient(2px 2px at 15% 60%, rgba(0,255,136,0.3), transparent),
    radial-gradient(1px 1px at 75% 25%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 45% 15%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 10% 90%, rgba(34,211,238,0.3), transparent),
    radial-gradient(1px 1px at 95% 85%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 25% 45%, rgba(167,139,250,0.3), transparent),
    radial-gradient(2px 2px at 55% 35%, rgba(255,255,255,0.4), transparent);
  background-size: 800px 800px;
  background-repeat: repeat;
  pointer-events: none;
  z-index: 0;
  opacity: 0.7;
  animation: starDrift 180s linear infinite;
}
@keyframes starDrift {
  0%   { background-position: 0 0; }
  100% { background-position: 800px 800px; }
}

/* 🌌 깊은 우주 그라데이션 (배경) */
body {
  background:
    radial-gradient(ellipse at 20% 0%, rgba(34,211,238,0.04), transparent 50%),
    radial-gradient(ellipse at 80% 50%, rgba(167,139,250,0.04), transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(0,255,136,0.03), transparent 50%),
    var(--bg) !important;
}

/* CRT 미세 스캔라인 (subtle) */
.shell::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(255,255,255,0.005) 2px,
    rgba(255,255,255,0.005) 3px
  );
  pointer-events: none;
  z-index: 1;
  mix-blend-mode: overlay;
}

/* 글로벌 글로우 — 카드 시그널 강조 */
.sw-card[data-sao-id]:hover {
  box-shadow: 0 0 12px rgba(34,211,238,0.18);
}
.sw-card.active {
  box-shadow: 0 0 20px rgba(34,211,238,0.3);
}

/* Sovereign Watch 녹색 터미널 액센트 (LIVE/HOME/펄스) */
#liveDot {
  animation: terminalPulse 2s ease-in-out infinite;
}
@keyframes terminalPulse {
  0%, 100% { box-shadow: 0 0 4px #00ff88; opacity: 1; }
  50%      { box-shadow: 0 0 12px #00ff88, 0 0 20px #00ff88; opacity: 0.85; }
}

/* 인스펙터 패널 글로우 (열렸을 때) */
.inspector-panel.is-open {
  box-shadow: -8px 0 40px rgba(0,0,0,0.5), -2px 0 24px rgba(34,211,238,0.1);
}

/* 사이드바 글래스 강조 (우주 베이스) */
.sidebar {
  background: linear-gradient(180deg,
    rgba(8,12,20,0.95) 0%,
    rgba(8,12,20,0.92) 50%,
    rgba(8,12,20,0.95) 100%) !important;
  box-shadow: 2px 0 24px rgba(0,0,0,0.4), 1px 0 0 rgba(34,211,238,0.05);
}

/* ─── Animations ──────────────────────────────────────── */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-20px); }
  to   { opacity: 1; transform: translateX(0); }
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.4; transform: scale(0.7); }
}

@keyframes spin { to { transform: rotate(360deg); } }

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes gaugeGrow {
  from { width: 0; }
}

.anim-item {
  opacity: 0;
  animation: fadeInUp 0.5s ease forwards;
}

.anim-item:nth-child(1) { animation-delay: 0.05s; }
.anim-item:nth-child(2) { animation-delay: 0.1s; }
.anim-item:nth-child(3) { animation-delay: 0.15s; }
.anim-item:nth-child(4) { animation-delay: 0.2s; }
.anim-item:nth-child(5) { animation-delay: 0.25s; }
.anim-item:nth-child(6) { animation-delay: 0.3s; }

/* ─── Multi-Asset Fusion Center (Sovereign Watch 영감) ─ */
.sao-row {
  transition: background 0.12s ease;
}
.sao-row:hover {
  background: rgba(34, 211, 238, 0.05) !important;
}
.sao-row:last-child {
  border-bottom: none !important;
}
@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(1.15); }
}
.glass-card span[style*="box-shadow:0 0 6px"] {
  animation: pulseDot 2s ease-in-out infinite;
}

/* ─── Credit Spread Guide (2-pane reader) ────────────── */
.cs-card-clickable:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(167, 139, 250, 0.15), 0 0 0 1px rgba(167, 139, 250, 0.3);
}
.cs-card-clickable:active {
  transform: translateY(0);
}
.cs-guide-tab:hover {
  background: rgba(167, 139, 250, 0.08) !important;
  color: #c4b5fd !important;
}
.cs-guide-tab.is-active {
  background: rgba(167, 139, 250, 0.18) !important;
  color: #a78bfa !important;
  border-left-color: #a78bfa !important;
  font-weight: 600 !important;
}
.cs-guide-panel {
  display: none;
}
.cs-guide-panel.is-active {
  display: block;
  animation: csGuideFadeIn 0.2s ease;
}
@keyframes csGuideFadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 760px) {
  .cs-guide-layout {
    grid-template-columns: 1fr !important;
  }
  .cs-guide-nav {
    flex-direction: row !important;
    overflow-x: auto !important;
    position: static !important;
    padding: 6px !important;
  }
  .cs-guide-tab {
    white-space: nowrap;
    flex-shrink: 0;
  }
}

/* ─── Sidebar (Sovereign Watch + Claude Docs 하이브리드) ─ */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 300px;
  height: 100vh;
  background: rgba(8, 12, 20, 0.95);
  border-right: 1px solid rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 18px 20px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  flex-shrink: 0;
}
.sidebar-brand {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-bright, #e2e8f0);
  letter-spacing: 0.02em;
}
.sidebar-subtitle {
  font-size: 0.65rem;
  color: var(--text-muted, #94a3b8);
  margin-top: 3px;
  font-family: var(--font-mono);
}
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  scrollbar-width: thin;
  scrollbar-color: rgba(34, 211, 238, 0.3) transparent;
}
.sidebar-nav::-webkit-scrollbar { width: 5px; }
.sidebar-nav::-webkit-scrollbar-track { background: transparent; }
.sidebar-nav::-webkit-scrollbar-thumb { background: rgba(34, 211, 238, 0.25); border-radius: 3px; }
.sidebar-nav::-webkit-scrollbar-thumb:hover { background: rgba(34, 211, 238, 0.5); }

.sidebar-link {
  display: block;
  padding: 7px 14px 7px 18px;
  margin: 1px 6px;
  color: var(--text-muted, #94a3b8);
  text-decoration: none;
  font-size: 0.78rem;
  border-radius: 5px;
  border-left: 2px solid transparent;
  transition: all 0.15s ease;
  cursor: pointer;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-link:hover {
  color: var(--text-bright, #e2e8f0);
  background: rgba(34, 211, 238, 0.04);
}
.sidebar-link.active {
  color: #22d3ee;
  background: rgba(34, 211, 238, 0.08);
  border-left-color: #22d3ee;
  font-weight: 600;
}

.sidebar-group-label {
  padding: 12px 18px 4px;
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: rgba(148, 163, 184, 0.6);
  font-weight: 600;
}

.sidebar-footer {
  padding: 12px 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  flex-shrink: 0;
}

/* ─── Sovereign Watch 스타일 사이드바 카드 ─────────────── */
.sw-section-title {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #06b6d4;
  font-weight: 700;
  padding: 14px 18px 6px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid rgba(6, 182, 212, 0.15);
  margin-bottom: 4px;
}
.sw-section-title .sw-badge {
  background: rgba(220, 38, 38, 0.18);
  color: #ef4444;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 0.6rem;
  font-weight: 700;
  border: 1px solid rgba(220, 38, 38, 0.3);
}
.sw-filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  padding: 6px 10px;
}
.sw-filter-chip {
  font-size: 0.6rem;
  padding: 2px 7px;
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-muted);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  cursor: pointer;
  font-family: var(--font-mono);
  user-select: none;
  transition: all 0.12s ease;
}
.sw-filter-chip:hover {
  background: rgba(34, 211, 238, 0.08);
  color: #22d3ee;
}
.sw-filter-chip.active {
  background: rgba(34, 211, 238, 0.18);
  color: #22d3ee;
  border-color: rgba(34, 211, 238, 0.4);
  font-weight: 600;
}
.sw-card {
  display: block;
  margin: 3px 8px;
  padding: 8px 10px;
  background: rgba(15, 23, 42, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-left: 2px solid rgba(255, 255, 255, 0.1);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.12s ease;
  position: relative;
}
.sw-card:hover {
  background: rgba(34, 211, 238, 0.06);
  border-left-color: #22d3ee;
  transform: translateX(2px);
}
.sw-card.active {
  background: rgba(34, 211, 238, 0.1);
  border-left-color: #22d3ee;
  border-color: rgba(34, 211, 238, 0.3);
}
.sw-card-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 2px;
}
.sw-card-name {
  font-size: 0.78rem;
  font-weight: 600;
  color: #e2e8f0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 180px;
}
.sw-card-priority {
  font-size: 0.6rem;
  font-weight: 700;
  font-family: var(--font-mono);
  padding: 1px 6px;
  border-radius: 6px;
  flex-shrink: 0;
}
.sw-card-meta {
  font-size: 0.6rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
  line-height: 1.4;
}
.sw-card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 4px;
  font-size: 0.58rem;
}
.sw-card-source {
  color: var(--text-muted);
  font-family: var(--font-mono);
}
.sw-card-action {
  color: var(--text-muted);
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.12s ease;
}
.sw-card:hover .sw-card-action {
  opacity: 1;
}
.sw-card-action.always-show {
  opacity: 0.7;
}

/* ─── Object Inspector (우측 슬라이드 패널) ───────────── */
.inspector-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 380px;
  height: 100vh;
  background: rgba(8, 12, 20, 0.97);
  border-left: 1px solid rgba(34, 211, 238, 0.2);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 1100;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: translateX(100%);
  transition: transform 0.25s ease;
  box-shadow: -8px 0 40px rgba(0, 0, 0, 0.5);
}
.inspector-panel.is-open {
  transform: translateX(0);
}
.inspector-header {
  padding: 14px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  background: rgba(34, 211, 238, 0.05);
}
.inspector-close {
  background: rgba(255, 255, 255, 0.06);
  border: none;
  color: var(--text-muted);
  font-size: 1.2rem;
  cursor: pointer;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  line-height: 1;
  padding: 0;
  transition: all 0.12s ease;
}
.inspector-close:hover {
  background: rgba(220, 38, 38, 0.2);
  color: #ef4444;
}
.inspector-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px 18px;
  font-size: 0.8rem;
}
.inspector-section {
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
}
.inspector-section:last-child {
  border-bottom: none;
}
.inspector-section-title {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  margin-bottom: 6px;
}
.inspector-kv {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 0.75rem;
}
.inspector-kv-key { color: var(--text-muted); }
.inspector-kv-value { color: #e2e8f0; font-family: var(--font-mono); }

@media (max-width: 900px) {
  .inspector-panel {
    width: 100%;
  }
  .sidebar {
    width: 280px !important;
  }
}

/* ─── Layout ───────────────────────────────────────────── */
.shell {
  position: relative;
  z-index: 1;
  max-width: 1280px;
  margin: 0 auto;
  margin-left: 300px;  /* 사이드바 만큼 오프셋 */
  padding: 0 20px 48px;
}

/* 모바일에서는 사이드바 숨김 (햄버거 버튼으로 슬라이드) */
@media (max-width: 900px) {
  .sidebar {
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    width: 260px;
  }
  .sidebar.is-open {
    transform: translateX(0);
    box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
  }
  .shell {
    margin-left: 0 !important;
  }
  #sidebarToggle {
    display: block !important;
  }
}

/* ─── Glass Card Base ─────────────────────────────────── */
.glass-card {
  background: var(--surface-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: border-color 0.25s, box-shadow 0.25s;
}

.glass-card:hover {
  border-color: var(--border-hi);
  box-shadow: var(--shadow), var(--shadow-glow);
}

/* ─── Header ───────────────────────────────────────────── */
.header {
  padding: 24px 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 28px;
  animation: fadeIn 0.4s ease;
}

.header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 42px; height: 42px;
  background: var(--cyan-dim);
  border: 1px solid var(--border-hi);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.brand-icon svg { width: 22px; height: 22px; }

.brand-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-bright);
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.brand-sub {
  font-size: 0.72rem;
  color: var(--cyan);
  font-family: var(--font-mono);
  letter-spacing: 0.08em;
  margin-top: 2px;
}

.header-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(16,185,129,0.1);
  border: 1px solid rgba(16,185,129,0.3);
  color: var(--green);
  font-size: 0.7rem;
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: 0.12em;
  padding: 4px 12px;
  border-radius: 20px;
}

.live-dot {
  width: 6px; height: 6px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse-dot 2s infinite;
}

.meta-date {
  font-size: 0.82rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

.meta-time {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

/* ─── Section Label ────────────────────────────────────── */
.section-label {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--cyan);
  text-transform: uppercase;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.section-wrap {
  margin-bottom: 36px;
}

/* ─── Insights Section ─────────────────────────────────── */
.insights-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}

.insight-card {
  padding: 18px;
  position: relative;
  overflow: hidden;
}

.insight-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
}

.insight-card.type-warning::before { background: linear-gradient(90deg, var(--amber), transparent); }
.insight-card.type-opportunity::before { background: linear-gradient(90deg, var(--green), transparent); }
.insight-card.type-risk::before { background: linear-gradient(90deg, var(--red), transparent); }
.insight-card.type-info::before { background: linear-gradient(90deg, var(--cyan), transparent); }

.insight-icon {
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 10px;
  font-size: 1.1rem;
}

.insight-icon.warning { background: var(--amber-dim); }
.insight-icon.opportunity { background: var(--green-dim); }
.insight-icon.risk { background: var(--red-dim); }
.insight-icon.info { background: var(--cyan-dim); }

.insight-title {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 6px;
  line-height: 1.3;
}

.insight-desc {
  font-size: 0.78rem;
  color: var(--text);
  line-height: 1.5;
}

/* ─── AI Commentary Section ───────────────────────────────── */
.commentary-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

.commentary-overview {
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.commentary-overview::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--cyan), transparent);
}

.commentary-overview-text {
  font-size: 0.82rem;
  color: var(--text);
  line-height: 1.7;
}

.commentary-subsection {
  margin-top: 8px;
}

.commentary-subsection-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--cyan);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.commentary-subsection-title .icon {
  font-size: 1rem;
}

.sector-picks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
}

.sector-pick-card {
  padding: 16px;
  position: relative;
  overflow: hidden;
}

.sector-pick-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
}

.sector-pick-card.signal-positive::before { background: linear-gradient(90deg, var(--green), transparent); }
.sector-pick-card.signal-negative::before { background: linear-gradient(90deg, var(--red), transparent); }
.sector-pick-card.signal-neutral::before  { background: linear-gradient(90deg, var(--amber), transparent); }

.sector-pick-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.sector-pick-name {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-bright);
}

.signal-badge {
  font-size: 0.65rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.02em;
}

.signal-badge.positive { background: var(--green-dim); color: var(--green); }
.signal-badge.negative { background: var(--red-dim); color: var(--red); }
.signal-badge.neutral  { background: var(--amber-dim); color: var(--amber); }

.sector-pick-comment {
  font-size: 0.75rem;
  color: var(--text);
  line-height: 1.6;
  margin-bottom: 6px;
}

.sector-pick-tops {
  font-size: 0.7rem;
  color: var(--cyan);
}

.risk-list, .action-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.risk-item, .action-item {
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
}

.risk-item::before, .action-item::before {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 3px;
}

.risk-item.severity-high::before   { background: var(--red); }
.risk-item.severity-medium::before { background: var(--amber); }

.action-item.priority-high::before   { background: var(--red); }
.action-item.priority-medium::before { background: var(--amber); }
.action-item.priority-low::before    { background: var(--green); }

.risk-header, .action-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.severity-badge, .priority-badge {
  font-size: 0.62rem;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 20px;
  letter-spacing: 0.02em;
}

.severity-badge.high, .priority-badge.high     { background: var(--red-dim); color: var(--red); }
.severity-badge.medium, .priority-badge.medium { background: var(--amber-dim); color: var(--amber); }
.priority-badge.low                             { background: var(--green-dim); color: var(--green); }

.risk-type {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-bright);
}

.risk-desc, .action-detail {
  font-size: 0.75rem;
  color: var(--text);
  line-height: 1.6;
}

.action-title {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text-bright);
}

/* ─── Macro Cards ──────────────────────────────────────── */
.macro-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 14px;
}

.macro-card {
  padding: 18px;
  position: relative;
  overflow: hidden;
}

.macro-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--cyan), transparent);
  opacity: 0.6;
}

.macro-icon {
  width: 34px; height: 34px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
  font-size: 1rem;
}

.macro-icon.cycle { background: var(--cyan-dim); }
.macro-icon.rate  { background: var(--green-dim); }
.macro-icon.infl  { background: var(--amber-dim); }

.macro-label {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  letter-spacing: 0.08em;
  margin-bottom: 4px;
  text-transform: uppercase;
}

.macro-value {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-bright);
  letter-spacing: -0.01em;
  line-height: 1.2;
}

.macro-sub {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: 3px;
  font-family: var(--font-mono);
}

/* Macro Detail Panel */
.macro-detail-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px;
  cursor: pointer;
  font-size: 0.72rem;
  font-family: var(--font-mono);
  color: var(--cyan);
  letter-spacing: 0.06em;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: transparent;
  width: 100%;
  transition: background 0.2s, border-color 0.2s;
}

.macro-detail-toggle:hover {
  background: var(--cyan-dim);
  border-color: var(--border-hi);
}

.macro-detail-toggle .toggle-arrow {
  transition: transform 0.3s;
  font-size: 0.65rem;
}

.macro-detail-toggle.is-open .toggle-arrow {
  transform: rotate(180deg);
}

.macro-detail-panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s ease-out, opacity 0.3s ease;
  opacity: 0;
}

.macro-detail-panel.is-open {
  max-height: none;
  overflow: visible;
  opacity: 1;
}

.macro-detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  padding: 16px 0 4px;
}

.macro-detail-item {
  padding: 14px;
}

.macro-detail-item .md-label {
  font-size: 0.68rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.macro-detail-item .md-value {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-bright);
  font-family: var(--font-mono);
}

.macro-detail-item .md-sub {
  font-size: 0.68rem;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ─── Geopolitical Risk Section ────────────────────────── */
.geo-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.geo-gauge-card {
  padding: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.gauge-label {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.gauge-wrap {
  width: 100%;
  max-width: 300px;
  position: relative;
}

.gauge-track {
  width: 100%;
  height: 18px;
  border-radius: 9px;
  background: rgba(255,255,255,0.06);
  overflow: hidden;
  position: relative;
}

.gauge-track::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg,
    #10b981 0%, #10b981 30%,
    #f59e0b 30%, #f59e0b 50%,
    #f97316 50%, #f97316 70%,
    #ef4444 70%, #ef4444 100%);
  opacity: 0.25;
  border-radius: 9px;
}

.gauge-fill {
  height: 100%;
  border-radius: 9px;
  position: relative;
  z-index: 1;
  animation: gaugeGrow 1s ease-out forwards;
  transition: width 0.6s ease;
}

.gauge-needle {
  position: absolute;
  top: -6px;
  width: 4px;
  height: 30px;
  background: var(--text-bright);
  border-radius: 2px;
  z-index: 2;
  box-shadow: 0 0 8px rgba(255,255,255,0.5);
  transform: translateX(-50%);
  transition: left 0.6s ease;
}

.gauge-score {
  font-size: 2rem;
  font-weight: 800;
  font-family: var(--font-mono);
  margin-top: 14px;
  letter-spacing: -0.02em;
}

.gauge-score-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
  margin-top: 2px;
}

.gauge-scale {
  display: flex;
  justify-content: space-between;
  width: 100%;
  max-width: 300px;
  margin-top: 6px;
  font-size: 0.6rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
}

.geo-details-card {
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.geo-categories {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.geo-cat-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.geo-cat-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.geo-cat-name {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text);
}

.geo-cat-score {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  color: var(--text-bright);
  font-weight: 600;
}

.geo-cat-bar {
  height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.06);
  overflow: hidden;
}

.geo-cat-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.8s ease;
}

/* Safe haven mini-cards */
.safe-haven-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
}

.safe-haven-item {
  padding: 10px;
  text-align: center;
}

.sh-name {
  font-size: 0.68rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  letter-spacing: 0.04em;
  margin-bottom: 3px;
}

.sh-price {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text-bright);
  font-family: var(--font-mono);
}

.sh-change {
  font-size: 0.68rem;
  font-family: var(--font-mono);
  font-weight: 600;
}

.sh-change.pos { color: var(--green); }
.sh-change.neg { color: var(--red); }

/* Geo news */
.geo-news {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.geo-news-item {
  font-size: 0.75rem;
  color: var(--text);
  padding: 6px 10px;
  background: rgba(255,255,255,0.02);
  border-radius: var(--radius-sm);
  border-left: 2px solid var(--amber);
  line-height: 1.4;
}

/* ─── Sector Cards ─────────────────────────────────────── */
.sectors-section { display: flex; flex-direction: column; gap: 14px; }

.sector-card {
  border-radius: var(--radius);
  overflow: hidden;
}

.sector-header {
  padding: 14px 18px;
  background: var(--surface-hi);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  transition: background 0.2s;
}

.sector-header:hover {
  background: rgba(22, 32, 50, 0.9);
}

.sector-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--cyan);
  flex-shrink: 0;
}

.sector-name {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-bright);
  letter-spacing: -0.01em;
}

.sector-sentiment-badge {
  font-size: 0.68rem;
  font-family: var(--font-mono);
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 3px;
  margin-left: 8px;
}

.sector-count {
  margin-left: auto;
  font-size: 0.72rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  background: rgba(255,255,255,0.05);
  padding: 3px 10px;
  border-radius: 20px;
}

.sector-toggle {
  color: var(--text-muted);
  font-size: 0.65rem;
  transition: transform 0.3s;
  margin-left: 8px;
}

.sector-header.is-open .sector-toggle {
  transform: rotate(180deg);
}

.sector-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}

.sector-body.is-open {
  max-height: 2000px;
}

/* ─── Stock Table ──────────────────────────────────────── */
.stock-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.stock-table thead th {
  font-size: 0.65rem;
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.25);
  white-space: nowrap;
  text-align: left;
  overflow: hidden;
}

.stock-table .col-name   { width: 22%; }
.stock-table .col-regime { width: 10%; text-align: center; }
.stock-table .col-sent   { width: 14%; }
.stock-table .col-price  { width: 14%; text-align: right; }
.stock-table .col-mcap   { width: 13%; text-align: right; }
.stock-table .col-per    { width: 12%; text-align: right; }
.stock-table .col-roe    { width: 10%; text-align: right; }
.stock-table .col-arrow  { width: 5%; text-align: center; }

.stock-row {
  cursor: pointer;
  transition: background 0.12s;
}

.stock-row:hover { background: rgba(6,182,212,0.05); }
.stock-row.is-open { background: rgba(6,182,212,0.07); }
.stock-row:nth-child(4n+1) { background: var(--row-even); }
.stock-row:nth-child(4n+1):hover { background: rgba(6,182,212,0.05); }

.stock-row td {
  padding: 12px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
  vertical-align: middle;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stock-name {
  font-weight: 600;
  color: var(--text-bright);
  line-height: 1.3;
}

.stock-ticker {
  font-size: 0.65rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  margin-left: 6px;
}

/* Regime badges */
.regime {
  display: inline-block;
  font-size: 0.68rem;
  font-family: var(--font-mono);
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 3px;
  white-space: nowrap;
  line-height: 1.4;
}

.regime-up-strong   { background: rgba(16,185,129,0.2);  color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
.regime-up          { background: rgba(16,185,129,0.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.2); }
.regime-up-weak     { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }
.regime-sideways    { background: rgba(245,158,11,0.1);  color: #fcd34d; border: 1px solid rgba(245,158,11,0.2); }
.regime-down-weak   { background: rgba(249,115,22,0.15); color: #fb923c; border: 1px solid rgba(249,115,22,0.25); }
.regime-down        { background: rgba(239,68,68,0.15);  color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
.regime-down-strong { background: rgba(239,68,68,0.22);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.35); }
.regime-unknown     { background: rgba(100,116,139,0.15); color: #94a3b8; border: 1px solid rgba(100,116,139,0.2); }

/* Sentiment */
.sent-label {
  font-size: 0.78rem;
  font-weight: 600;
}

.sent-score {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  font-weight: 500;
  margin-left: 4px;
}

.col-pos  { color: var(--green); }
.col-neg  { color: var(--red); }
.col-neut { color: var(--text-muted); }

/* Numeric cells */
.num {
  font-family: var(--font-mono);
  text-align: right;
  color: var(--text-bright);
}

.num-muted {
  font-family: var(--font-mono);
  text-align: right;
  color: var(--text);
}

/* Expand arrow */
.arrow-cell {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.65rem;
  transition: transform 0.2s;
}

.stock-row.is-open .arrow-cell { color: var(--cyan); }

/* ─── Detail Row (expanded) ────────────────────────────── */
.detail-row { display: none; }
.detail-row.is-visible { display: table-row; }

.detail-row td {
  padding: 0;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
}

.detail-panel {
  padding: 14px 16px 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px 16px;
}

.detail-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.detail-label {
  font-size: 0.68rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.detail-value {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-bright);
  font-family: var(--font-mono);
}

/* 52w range bar */
.range-bar-wrap { grid-column: 1 / -1; margin-top: 4px; }

.range-label-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.68rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  margin-bottom: 4px;
}

.range-track {
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  position: relative;
  overflow: visible;
}

.range-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  border-radius: 2px;
}

.range-current {
  position: absolute;
  top: -3px;
  width: 10px; height: 10px;
  background: var(--text-bright);
  border-radius: 50%;
  transform: translateX(-50%);
  box-shadow: 0 0 6px rgba(255,255,255,0.4);
}

/* ─── Charts Section ──────────────────────────────────── */
.charts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 14px;
}

.chart-card {
  padding: 20px;
  min-height: 280px;
}

.chart-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.chart-title-icon {
  width: 24px; height: 24px;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem;
  background: var(--cyan-dim);
}

.chart-wrap {
  position: relative;
  width: 100%;
  max-height: 260px;
}

/* ─── Portfolio Section ───────────────────────────────── */
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
}

.portfolio-card {
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.portfolio-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}

.portfolio-card.aggressive::before { background: linear-gradient(90deg, var(--red), var(--orange)); }
.portfolio-card.balanced::before { background: linear-gradient(90deg, var(--cyan), var(--green)); }
.portfolio-card.conservative::before { background: linear-gradient(90deg, var(--green), #06b6d4); }

.portfolio-type {
  font-size: 0.68rem;
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.portfolio-card.aggressive .portfolio-type { color: var(--red); }
.portfolio-card.balanced .portfolio-type { color: var(--cyan); }
.portfolio-card.conservative .portfolio-type { color: var(--green); }

.portfolio-name {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 12px;
}

.portfolio-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}

.port-stat-label {
  font-size: 0.65rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.port-stat-value {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text-bright);
  font-family: var(--font-mono);
}

.portfolio-weights {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.weight-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.weight-name {
  font-size: 0.72rem;
  color: var(--text);
  min-width: 80px;
  flex-shrink: 0;
}

.weight-bar-track {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  overflow: hidden;
}

.weight-bar-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--cyan);
  transition: width 0.6s ease;
}

.weight-pct {
  font-size: 0.68rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  min-width: 32px;
  text-align: right;
}

/* ─── Benchmark Table ──────────────────────────────────── */
.benchmark-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 0.72rem;
}
.benchmark-table th {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 5px 6px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.benchmark-table th:first-child { text-align: left; }
.benchmark-table td {
  padding: 4px 6px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text);

}
.benchmark-table td:first-child {

  font-size: 0.62rem;
  font-family: var(--font-mono);

  padding: 20px 0;

<script>
(function() {
  'use strict';

  // ─── Utilities ───────────────────────────────────────
  const $ = s => document.querySelector(s);
  const h = s => s == null ? 'N/A' : String(s);

  function fmtPrice(v) {
    if (v == null) return 'N/A';
    if (v >= 1000) return Math.round(v).toLocaleString('ko-KR');
    if (v >= 1) return v.toLocaleString('ko-KR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    return v.toLocaleString('ko-KR', {minimumFractionDigits: 4, maximumFractionDigits: 4});
  }

  function fmtMcap(v) {
    // market_cap은 조원 단위로 저장됨 (yfinance marketCap / 1e12)
    // 삼성전자 2337.7조, LG전자 66.3조, 소형주 0.5조 등
    if (v == null) return 'N/A';
    if (v >= 1)   return v.toFixed(1) + '조';
    if (v > 0)    return (v * 10000).toFixed(0) + '억';
    return 'N/A';
  }

  function fmtPct(v) {
    if (v == null) return 'N/A';
    return (v >= 0 ? '+' : '') + Number(v).toFixed(1) + '%';
  }

  function regimeClass(r) {
    if (!r) return 'regime-unknown';
    const map = {
      '강한상승': 'regime-up-strong', '상승': 'regime-up', '약한상승': 'regime-up-weak',
      '횡보': 'regime-sideways',
      '약한하락': 'regime-down-weak', '하락': 'regime-down', '강한하락': 'regime-down-strong'
    };
    return map[r] || 'regime-unknown';
  }

  function sentClass(score) {
    const n = parseFloat(score);
    if (isNaN(n)) return 'col-neut';
    return n > 0 ? 'col-pos' : n < 0 ? 'col-neg' : 'col-neut';
  }

  function riskColor(score) {
    if (score <= 30) return '#10b981';
    if (score <= 50) return '#f59e0b';
    if (score <= 70) return '#f97316';
    return '#ef4444';
  }

  function riskGradient(score) {
    if (score <= 30) return 'linear-gradient(90deg, #10b981, #34d399)';
    if (score <= 50) return 'linear-gradient(90deg, #10b981, #f59e0b)';
    if (score <= 70) return 'linear-gradient(90deg, #10b981, #f59e0b, #f97316)';
    return 'linear-gradient(90deg, #10b981, #f59e0b, #f97316, #ef4444)';
  }

  function riskLabel(score) {
    if (score <= 30) return '안정';
    if (score <= 50) return '경계';
    if (score <= 70) return '위험';
    return '심각';
  }

  // ─── Compute sector averages ─────────────────────────
  function sectorAvgSentiment(stocks) {
    let sum = 0, cnt = 0;
    stocks.forEach(s => {
      const v = parseFloat(s.sentiment_score);
      if (!isNaN(v)) { sum += v; cnt++; }
    });
    return cnt ? sum / cnt : 0;
  }

  function countRegimes(sectors) {
    const counts = {};
    sectors.forEach(sec => {
      sec.stocks.forEach(s => {
        const r = s.regime;
        if (!r || r === 'N/A' || r === '기타') return;  // N/A·미산출 제외(도넛 도배 방지)
        counts[r] = (counts[r] || 0) + 1;
      });
    });
    return counts;
  }

  // ─── Render ──────────────────────────────────────────
  // ─── 상대 시간 계산 (예: "9분 전")
  function relativeTime(generatedAt) {
    if (!generatedAt) return '';
    try {
      // "2026-05-14 00:31:27" → Date 객체 (로컬 KST로 해석)
      const dt = new Date(generatedAt.replace(' ', 'T') + '+09:00');
      const diffMs = Date.now() - dt.getTime();
      const diffMin = Math.floor(diffMs / 60000);
      if (diffMin < 1) return '방금 전';
      if (diffMin < 60) return `${diffMin}분 전`;
      const diffHour = Math.floor(diffMin / 60);
      if (diffHour < 24) return `${diffHour}시간 전`;
      const diffDay = Math.floor(diffHour / 24);
      return `${diffDay}일 전`;
    } catch (e) {
      return '';
    }
  }

  // ─── 현재 시각 (실시간 갱신)
  function nowKST() {
    const d = new Date();
    // KST 변환 (UTC+9)
    const kst = new Date(d.getTime() + (9 * 60 + d.getTimezoneOffset()) * 60000);
    const h = String(kst.getHours()).padStart(2, '0');
    const m = String(kst.getMinutes()).padStart(2, '0');
    const s = String(kst.getSeconds()).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  function render(data) {
    const app = $('#app');
    const dateParts = (data.date || '').split('-');
    const dateStr = dateParts.length === 3 ? `${dateParts[0]}년 ${parseInt(dateParts[1])}월 ${parseInt(dateParts[2])}일` : data.date;
    // 갱신 시각 = 데이터 재조립(data_refreshed_at) 우선, 없으면 generated_at
    const refreshedAt = data.data_refreshed_at || data.generated_at;
    const timeStr = refreshedAt ? refreshedAt.split(' ')[1] || '' : '';
    const relStr = relativeTime(refreshedAt);
    // 분석 기준 = 일일 분석(Excel) 생성 시각 (부가 표시)
    const basisAt = data.analysis_basis_at || data.generated_at;
    const basisTime = basisAt ? basisAt.split(' ')[1] || '' : '';

    let html = '';

    // ─── HEADER ────────────────────────────────────────
    html += `
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="2,18 7,10 12,14 17,6 22,10"/>
              <circle cx="22" cy="10" r="1.5" fill="#10b981" stroke="none"/>
            </svg>
          </div>
          <div>
            <div class="brand-title">AI 금융 분석 대시보드</div>
            <div class="brand-sub">MARKET INTELLIGENCE</div>
          </div>
        </div>
        <div class="header-meta">
          <span class="live-badge"><span class="live-dot"></span>LIVE</span>
          <span class="meta-date">${dateStr}</span>
          ${timeStr ? `<span class="meta-time" title="시세 데이터 갱신 시각">갱신: ${timeStr}${relStr ? ` (${relStr})` : ''}</span>` : ''}
          ${basisTime && basisTime !== timeStr ? `<span class="meta-time" title="일일 분석(레짐·센티멘트) 기준 시각" style="opacity:0.65;">분석기준: ${basisTime}</span>` : ''}
          <span class="meta-time" id="now-clock" title="현재 시각 (KST)" style="color:var(--cyan);">현재: <span id="now-time">${nowKST()}</span> KST</span>
        </div>
      </div>
    </header>`;

    // ─── AI INSIGHTS ───────────────────────────────────
    const ins = data.insights;
    if (ins && (ins.market_assessment || (ins.top_insights && ins.top_insights.length) || (ins.best_opportunities && ins.best_opportunities.length))) {
      html += `<section class="section-wrap"><div class="section-label">AI 인사이트</div><div class="insights-grid">`;

      // Market assessment
      if (ins.market_assessment) {
        html += `<div class="insight-card glass-card type-info anim-item">
          <div class="insight-icon info">&#128200;</div>
          <div class="insight-title">시장 종합 평가</div>
          <div class="insight-desc">${ins.market_assessment}</div>
        </div>`;
      }

      // Top insights
      if (ins.top_insights && ins.top_insights.length > 0) {
        ins.top_insights.forEach(tip => {
          html += `<div class="insight-card glass-card type-opportunity anim-item">
            <div class="insight-icon opportunity">&#9733;</div>
            <div class="insight-title">핵심 포인트</div>

                <h4 style="color:#fb923c;margin:0 0 8px 0;font-size:0.95rem;">📖 1. 기초: OAS (Option-Adjusted Spread)란?</h4>
            <p style="margin:0 0 10px 0;"><b>한 줄 정의</b>: "이 채권 수익률 − 동기간 국채 수익률" = 시장이 요구하는 <b style="color:#22d3ee;">신용 위험 프리미엄</b></p>
            <p style="margin:0 0 6px 0;padding:8px 12px;background:rgba(34,211,238,0.06);border-left:2px solid #22d3ee;border-radius:3px;">
              예: BBB 회사채 4.5% − 10Y 국채 3.56% = <b>BBB OAS 0.94%p</b><br/>
              → 시장이 BBB 회사채에 "94bp만큼 더 받아야 사겠다"고 말하는 것
            </p>

      ira.results.slice(0, 25).forEach(r => {

        html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.04);">

      // 강력매수 후보가 있으면 별도 강조

  // ─── Charts ──────────────────────────────────────────
  function renderCharts(data) {
    const sectors = data.sectors || [];

    // Chart defaults
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = 'rgba(6,182,212,0.1)';
    Chart.defaults.font.family = "-apple-system, 'Noto Sans KR', 'Malgun Gothic', sans-serif";

    // 1. Sector Sentiment Bar Chart (horizontal)
    const sentCtx = document.getElementById('chartSentiment');
    if (sentCtx) {
      const labels = sectors.map(s => s.name);
      const values = sectors.map(s => {
        let sum = 0, cnt = 0;
        s.stocks.forEach(st => {
          const v = parseFloat(st.sentiment_score);
          if (!isNaN(v)) { sum += v; cnt++; }
        });
        return cnt ? +(sum / cnt).toFixed(1) : 0;
      });
      const colors = values.map(v => v >= 0 ? 'rgba(16,185,129,0.7)' : 'rgba(239,68,68,0.7)');
      const borderColors = values.map(v => v >= 0 ? '#10b981' : '#ef4444');

      new Chart(sentCtx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            data: values,
            backgroundColor: colors,
            borderColor: borderColors,
            borderWidth: 1,
            borderRadius: 4,
            barThickness: 22
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => `센티멘트: ${ctx.parsed.x >= 0 ? '+' : ''}${ctx.parsed.x}`
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255,255,255,0.04)' },
              ticks: { font: { size: 11 } }
            },
            y: {
              grid: { display: false },
              ticks: { font: { size: 12 } }
            }
          }
        }
      });
    }

    // 2. Regime Distribution Donut Chart
    const regimeCtx = document.getElementById('chartRegime');
    if (regimeCtx) {
      const regimeCounts = countRegimes(sectors);
      const regimeLabels = Object.keys(regimeCounts);
      const regimeValues = Object.values(regimeCounts);

      const regimeColorMap = {
        '강한상승': '#34d399', '상승': '#6ee7b7', '약한상승': '#fbbf24',
        '횡보': '#fcd34d',
        '약한하락': '#fb923c', '하락': '#f87171', '강한하락': '#fca5a5'
      };
      const rColors = regimeLabels.map(r => regimeColorMap[r] || '#94a3b8');

      new Chart(regimeCtx, {
        type: 'doughnut',
        data: {
          labels: regimeLabels,
          datasets: [{
            data: regimeValues,
            backgroundColor: rColors.map(c => c + 'bb'),
            borderColor: rColors,
            borderWidth: 1,
            hoverOffset: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '55%',
          plugins: {
            legend: {
              position: 'right',
              labels: {
                boxWidth: 12,
                padding: 10,
                font: { size: 11 },
                usePointStyle: true,
                pointStyleWidth: 8
              }
            },
            tooltip: {
              callbacks: {
                label: ctx => `${ctx.label}: ${ctx.parsed}개 종목`
              }
            }
          }
        }
      });
    }

    // 3. Portfolio Sharpe Ratio (if portfolios exist)
    if (data.portfolios && data.portfolios.sectors) {
      const sharpeCtx = document.getElementById('chartSharpe');
      if (sharpeCtx) {
        const pfLabels = data.portfolios.sectors.map(s => s.name);
        const pfValues = data.portfolios.sectors.map(s => s.sharpe_ratio || 0);

        const pfBorders = pfValues.map(v => v > 1 ? '#10b981' : v > 0 ? '#06b6d4' : '#ef4444');

        new Chart(sharpeCtx, {
          type: 'bar',
          data: {
            labels: pfLabels,
            datasets: [{
              data: pfValues,

              borderColor: pfBorders,
              borderWidth: 1,
              borderRadius: 4,
              barThickness: 40
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,

                callbacks: {

              }

            scales: {
              x: {

  // ─── 🕸️ Knowledge Graph (Palantir 스타일) ───────────────
  let __kgNetwork = null;
  let __kgNodesAll = [];
  let __kgEdgesAll = [];
  let __kgActiveTypes = new Set();

  function renderKnowledgeGraph(data) {
    const kg = data.knowledge_graph;
    const container = document.getElementById('kgNetwork');
    if (!kg || !Array.isArray(kg.nodes) || kg.nodes.length === 0 || !container) {
      return;
    }
    if (typeof vis === 'undefined') {
      const emptyEl = document.getElementById('kgEmptyMsg');
      if (emptyEl) emptyEl.textContent = 'vis.js 라이브러리 로드 실패 (네트워크 차단 가능성)';
      return;
    }

    __kgNodesAll = kg.nodes.slice();
    __kgEdgesAll = kg.edges.slice();
    __kgActiveTypes = new Set(__kgNodesAll.map(n => n.type));

    // 필터 칩 렌더
    const filterBox = document.getElementById('kgFilters');
    if (filterBox) {
      const typeCount = {};
      __kgNodesAll.forEach(n => { typeCount[n.type] = (typeCount[n.type] || 0) + 1; });
      filterBox.innerHTML = Object.entries(typeCount).map(([t, c]) => {
        const color = (__kgNodesAll.find(n => n.type === t) || {}).color || '#888';
        return `<button class="kg-filter-btn" data-type="${t}" style="padding:4px 10px;background:${color}22;border:1px solid ${color}66;color:${color};border-radius:14px;font-size:0.7rem;cursor:pointer;">${t} (${c})</button>`;
      }).join('');
      filterBox.querySelectorAll('.kg-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const t = btn.dataset.type;
          if (__kgActiveTypes.has(t)) {
            __kgActiveTypes.delete(t);
            btn.style.opacity = '0.3';
          } else {
            __kgActiveTypes.add(t);
            btn.style.opacity = '1';
          }
          renderKgNetwork();
        });
      });
    }

    // 검색
    const searchEl = document.getElementById('kgSearch');
    if (searchEl) {
      searchEl.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase().trim();
        if (!q || !__kgNetwork) return;
        const match = __kgNodesAll.find(n =>
          n.label.toLowerCase().includes(q) ||
          n.id.toLowerCase().includes(q)
        );
        if (match) {
          __kgNetwork.focus(match.id, { scale: 1.5, animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
          __kgNetwork.selectNodes([match.id]);
          renderKgDetail(match);
        }
      });
    }

    // 리셋
    const resetBtn = document.getElementById('kgReset');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        if (__kgNetwork) __kgNetwork.fit({ animation: true });
        if (searchEl) searchEl.value = '';
        document.getElementById('kgDetail').innerHTML = '<div style="color:var(--text-muted);text-align:center;margin-top:50px;line-height:1.6;">👆 노드를 클릭하면<br/>해당 객체의 모든 분석 신호가<br/>여기에 표시됩니다.</div>';
      });
    }

    renderKgNetwork();
  }

  function renderKgNetwork() {
    const container = document.getElementById('kgNetwork');
    if (!container) return;

    const filteredNodes = __kgNodesAll.filter(n => __kgActiveTypes.has(n.type));
    const filteredNodeIds = new Set(filteredNodes.map(n => n.id));
    const filteredEdges = __kgEdgesAll.filter(e => filteredNodeIds.has(e.from) && filteredNodeIds.has(e.to));

    const visNodes = filteredNodes.map(n => ({
      id: n.id,
      label: `${n.emoji || ''} ${n.label}`,
      color: { background: n.color, border: '#0a0e17', highlight: { background: '#ffffff', border: n.color } },
      font: { color: '#e2e8f0', size: 11, face: 'monospace' },
      shape: 'dot',
      size: n.type === 'Stock' ? 8 : (n.type === 'Sector' ? 14 : (n.type === 'Index' ? 12 : 10)),
      borderWidth: 1.5,
      _data: n,
    }));

    const relColor = {
      IN_SECTOR: '#a78bfa',
      CORRELATES_WITH: '#22d3ee',
      SENSITIVE_TO: '#4ade80',
      AFFECTED_BY: '#fb923c',
      MENTIONS: '#9ca3af',
      COMPETES_WITH: '#f87171',
      SUPPLIES: '#fbbf24',
    };
    const visEdges = filteredEdges.map(e => ({
      from: e.from,
      to: e.to,
      width: Math.max(0.5, Math.min(e.weight || 1, 4)),
      color: { color: (relColor[e.type] || '#666') + 'aa', highlight: relColor[e.type] || '#fff' },
      smooth: { type: 'continuous' },
      title: `${e.type}${e.data && e.data.beta ? ' β=' + e.data.beta.toFixed(2) : ''}`,
    }));

    const opts = {
      physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: { gravitationalConstant: -50, springLength: 100, springConstant: 0.08 },
        stabilization: { iterations: 200 },
      },
      interaction: { hover: true, tooltipDelay: 200, navigationButtons: false, zoomView: true, dragView: true },
      nodes: { borderWidthSelected: 3 },
    };

    // 로딩 메시지 즉시 숨김 (네트워크 생성 직후 = 가시화 시작)
    const hideLoading = () => {
      const emptyEl = document.getElementById('kgEmptyMsg');
      if (emptyEl) emptyEl.style.display = 'none';
    };

    try {
      if (__kgNetwork) {
        __kgNetwork.setData({ nodes: visNodes, edges: visEdges });
        hideLoading();
      } else {
        __kgNetwork = new vis.Network(container,
          { nodes: new vis.DataSet(visNodes), edges: new vis.DataSet(visEdges) },
          opts);
        __kgNetwork.on('click', (params) => {
          if (params.nodes && params.nodes.length > 0) {
            const id = params.nodes[0];
            const node = __kgNodesAll.find(n => n.id === id);
            if (node) renderKgDetail(node);
          }
        });
        __kgNetwork.on('stabilizationIterationsDone', hideLoading);
        // Fallback: 안정화 이벤트 미발생 대비 (네트워크 생성 100ms 후 무조건 숨김)
        setTimeout(hideLoading, 100);
      }
    } catch (err) {
      console.error('[KG] render error', err);
      const emptyEl = document.getElementById('kgEmptyMsg');
      if (emptyEl) emptyEl.textContent = '그래프 렌더링 실패: ' + (err.message || err);
    }
  }

          ['Gordon %', irr.gordon_pct || irr.gordon_irr_pct],
          ['Earnings Yield %', irr.earnings_yield_pct],

          ['CAPM 베이스 %', d.required_return.base_capm_pct],
          ['코리아 디스카운트 %', d.required_return.korea_discount_pct],
          ['β 사용', d.required_return.beta_used],
        ]));

        </div>`);

      if (d.semi_v2 && d.semi_v2.betas) {
        const b = d.semi_v2.betas;
        sections.push(kvBlock('🔬 반도체 민감도 v2 (다변량)', [
          ['adj R²', d.semi_v2.adj_r_squared],

          ['β SOX (t-1)', b.sox],
          ['β KOSPI', b.kospi],
          ['β USDKRW', b.usdkrw],
          ['β UST10Y', b.ust10y],

        </div>`);

    // Sector: 평균 IRR + 멤버 종목
    else if (node.type === 'Sector') {
      sections.push(kvBlock('🏢 섹터 통계', [
        ['종목 수', d.count],
        ['평균 IRR %', d.mean_irr_pct],
        ['중앙값 IRR %', d.median_irr_pct],
      ]));
      // 이 섹터에 속한 종목 리스트
      const members = __kgEdgesAll
        .filter(e => e.to === node.id && e.type === 'IN_SECTOR')
        .map(e => __kgNodesAll.find(n => n.id === e.from))
        .filter(Boolean);
      if (members.length > 0) {
        sections.push(`<div style="margin-bottom:10px;">
          <div style="font-size:0.75rem;color:var(--text);font-weight:600;margin-bottom:4px;">📈 소속 종목 (${members.length})</div>

    else if (node.type === 'Index') {

        ['Ticker', d.ticker],
        ['Key', d.key],
      ]));
      const correlated = __kgEdgesAll
        .filter(e => e.to === node.id && e.type === 'CORRELATES_WITH')
        .map(e => ({ node: __kgNodesAll.find(n => n.id === e.from), edge: e }))
        .filter(x => x.node)
        .sort((a, b) => (b.edge.weight || 0) - (a.edge.weight || 0))
        .slice(0, 20);
      if (correlated.length > 0) {
        sections.push(`<div style="margin-bottom:10px;">
          <div style="font-size:0.75rem;color:var(--text);font-weight:600;margin-bottom:4px;">↔️ 상관 종목 (β 내림차순)</div>

          </div>`).join('')}
        </div>`);
      }
    }
    // Bill: 상태 + 관련 뉴스
    else if (node.type === 'Bill') {
      sections.push(kvBlock('🏛️ 법안 정보', [
        ['단축명', d.short_name],
        ['전체명', d.full_name],
        ['의회', d.congress + '대'],
        ['법안번호', `${d.bill_type} ${d.number}`],
        ['현 상태', d.status_label_kr],
        ['발생일', d.status_date],
        ['발의자', d.sponsor],
      ]));
      if (d.link) {
        sections.push(`<a href="${escapeHtml(d.link)}" target="_blank" rel="noopener" style="color:#22d3ee;text-decoration:none;font-size:0.75rem;">🔗 공식 페이지 →</a>`);
      }
    }
    // Currency
    else if (node.type === 'Currency') {
      sections.push(kvBlock('💱 통화', [['Ticker', d.ticker], ['Key', d.key]]));
      const sensitive = __kgEdgesAll
        .filter(e => e.to === node.id && e.type === 'SENSITIVE_TO')
        .map(e => ({ node: __kgNodesAll.find(n => n.id === e.from), edge: e }))
        .filter(x => x.node);
      if (sensitive.length > 0) {
        sections.push(`<div style="margin-bottom:10px;">
          <div style="font-size:0.75rem;color:var(--text);font-weight:600;margin-bottom:4px;">💧 환율 민감 종목</div>
          ${sensitive.map(c => `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:0.7rem;border-bottom:1px dashed rgba(255,255,255,0.05);">
            <span>${escapeHtml(c.node.label)}</span>
            <span style="color:#4ade80;font-family:var(--font-mono);">β=${(c.edge.data?.beta_usdkrw || c.edge.weight || 0).toFixed(2)}</span>
          </div>`).join('')}
        </div>`);
      }
    }
    // NewsItem
    else if (node.type === 'NewsItem') {
      sections.push(`<div style="line-height:1.5;font-size:0.8rem;color:var(--text);margin-bottom:6px;">${escapeHtml(d.title_ko || d.title || '')}</div>`);
      if (d.title_ko && d.title) {

        sections.push(`<div style="font-size:0.7rem;color:var(--text-muted);line-height:1.5;margin-bottom:8px;">${escapeHtml((d.summary_ko || d.summary).substring(0, 300))}</div>`);
      }

      if (d.link) sections.push(`<a href="${escapeHtml(d.link)}" target="_blank" rel="noopener" style="color:#22d3ee;font-size:0.7rem;">🔗 원문 →</a>`);
    }
    // 일반 객체
    else {
      sections.push(`<pre style="font-size:0.65rem;color:var(--text-muted);white-space:pre-wrap;">${escapeHtml(JSON.stringify(d, null, 2))}</pre>`);
    }

    // 연결된 노드 요약
    const incoming = __kgEdgesAll.filter(e => e.to === node.id);
    const outgoing = __kgEdgesAll.filter(e => e.from === node.id);
    if (incoming.length + outgoing.length > 0) {
      sections.push(`<div style="margin-top:10px;padding-top:8px;border-top:1px solid rgba(34,211,238,0.15);font-size:0.65rem;color:var(--text-muted);">
        🔗 연결: 들어오는 ${incoming.length} · 나가는 ${outgoing.length}
      </div>`);
    }

    panel.innerHTML = sections.join('');
  }

  function kvBlock(title, pairs) {
    const valid = pairs.filter(([k, v]) => v !== null && v !== undefined && v !== '');
    if (valid.length === 0) return '';
    return `<div style="margin-bottom:10px;">
      <div style="font-size:0.7rem;color:var(--text);font-weight:600;margin-bottom:4px;">${escapeHtml(title)}</div>
      ${valid.map(([k, v]) => `<div style="display:flex;justify-content:space-between;padding:2px 0;font-size:0.7rem;">
        <span style="color:var(--text-muted);">${escapeHtml(k)}</span>
        <span style="color:var(--text);font-family:var(--font-mono);">${escapeHtml(String(v))}</span>
      </div>`).join('')}
    </div>`;
  }

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;' }[c]));
  }

  // ─── 📚 카드 클릭 → 해당 해석 바로 위에 표시 ──────
  function attachCsCardClicks() {
    // 시리즈 ID → 가이드 패널 매핑
    const CARD_TO_PANEL = {
      'BAMLH0A0HYM2': '2a',   // 하이일드 OAS
      'BAMLC0A1CAAA': '2b',   // AAA OAS
      'BAMLC0A4CBBB': '2c',   // BBB OAS
      'BAMLC0A0CM':   '2c',   // 투자등급 (BBB와 가장 가까움)
      'DGS10':        '2e',   // 10Y 국채
      'DGS2':         '2e',   // 2Y 국채 (10Y와 동일 패널)
      'T10Y2Y':       '2f',   // 10Y-2Y 스프레드
    };

    const cards = document.querySelectorAll('.cs-card-clickable');
    const detailContainer = document.getElementById('csCardDetail');
    if (!detailContainer || cards.length === 0) return;

    cards.forEach(card => {
      card.addEventListener('click', (e) => {
        // FRED 링크 클릭 시는 무시 (링크가 동작하도록)
        if (e.target.tagName === 'A' || e.target.closest('a')) return;

        const seriesId = card.dataset.csSeriesId;
        const panelId = CARD_TO_PANEL[seriesId];
        if (!panelId) return;

        const sourcePanel = document.querySelector(`.cs-guide-panel[data-cs-panel="${panelId}"]`);
        if (!sourcePanel) return;

        // 컨테이너에 헤더(닫기 버튼) + 패널 내용 복사
        detailContainer.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(167,139,250,0.2);">
            <div style="font-size:0.75rem;color:#a78bfa;font-weight:600;">📚 해석법 — ${card.querySelector('div div').textContent.split('📚')[0].trim()}</div>

          </div>
          <div>${sourcePanel.innerHTML}</div>

        detailContainer.style.display = 'block';

        detailContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });

  // ─── 📚 Credit Spread Guide 2-pane Reader 탭 전환 ─────
  function attachCsGuideTabs() {
    const tabs = document.querySelectorAll('.cs-guide-tab');
    const panels = document.querySelectorAll('.cs-guide-panel');
    if (tabs.length === 0 || panels.length === 0) return;

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const target = tab.dataset.csTab;
        // 탭 활성 상태 전환
        tabs.forEach(t => {
          const isActive = t.dataset.csTab === target;
          t.classList.toggle('is-active', isActive);
          // 인라인 스타일 동기화 (CSS specificity 보정)
          if (isActive) {
            t.style.background = 'rgba(167,139,250,0.18)';
            t.style.color = '#a78bfa';
            t.style.borderLeftColor = '#a78bfa';
            t.style.fontWeight = '600';
          } else {
            t.style.background = 'transparent';
            t.style.color = 'var(--text-muted)';
            t.style.borderLeftColor = 'transparent';
            t.style.fontWeight = '400';
          }
        });
        // 패널 표시 전환
        panels.forEach(p => {
          const isActive = p.dataset.csPanel === target;
          p.classList.toggle('is-active', isActive);
          p.style.display = isActive ? 'block' : 'none';
        });
      });
    });
  }

  function slugify(str) {
    // 한글 + 영문 모두 안전한 ID 생성
    return 'sec-' + (str || '').toLowerCase()
      .replace(/[^\w\s가-힣]/g, '')
      .replace(/\s+/g, '-')
      .substring(0, 50)
      .trim() + '-' + Math.random().toString(36).substr(2, 5);
  }

        btn.style.color = '#c4b5fd';
        btn.style.borderColor = 'rgba(167,139,250,0.5)';
        window.__tmMarketFilter = btn.dataset.mkt;
        renderTcmTreemap(window.__dashboardData || {}, window.__tmMarketFilter);
      });
    });

    // ─── 모든 뷰 렌더링 ─────────
    renderTcmGlobe(data);
    renderTcmTreemap(data, 'all');
    renderTcmHeatmap(data);
  }

  // ─── 🌍 3D 지구본 렌더링 (D3.js Orthographic Globe) ──
  let __globeRotation = [-127, -36, 0]; // 한국 중심 (longitude, latitude, roll)
  let __globeAutoRotate = true;
  let __globeTimer = null;

  function renderTcmGlobe(data) {
    const svg = d3.select('#tcm-globe');
    if (!svg.node()) return;
    svg.selectAll('*').remove();

    const w = svg.node().clientWidth || 800;
    const h = svg.node().clientHeight || 560;
    svg.attr('viewBox', `0 0 ${w} ${h}`);

    const radius = Math.min(w, h) / 2.4;
    const projection = d3.geoOrthographic()
      .scale(radius)
      .translate([w / 2, h / 2])
      .rotate(__globeRotation)
      .clipAngle(90);

    const path = d3.geoPath(projection);

    // 배경 우주 효과 (별)
    const defs = svg.append('defs');
    // 글로우 필터
    const filter = defs.append('filter').attr('id', 'globe-glow').attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
    filter.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'coloredBlur');
    const fMerge = filter.append('feMerge');
    fMerge.append('feMergeNode').attr('in', 'coloredBlur');
    fMerge.append('feMergeNode').attr('in', 'SourceGraphic');

    // 그라데이션 (대기권 효과)
    const grad = defs.append('radialGradient').attr('id', 'atmosphere').attr('cx', '50%').attr('cy', '50%').attr('r', '50%');
    grad.append('stop').attr('offset', '0%').attr('stop-color', 'rgba(34,211,238,0.05)');
    grad.append('stop').attr('offset', '70%').attr('stop-color', 'rgba(34,211,238,0.15)');
    grad.append('stop').attr('offset', '100%').attr('stop-color', 'rgba(34,211,238,0)');

    // 별 배경 (랜덤 200개)
    const starsG = svg.append('g').attr('class', 'globe-stars');
    for (let i = 0; i < 200; i++) {
      const sx = Math.random() * w;
      const sy = Math.random() * h;
      const sr = Math.random() * 1.2 + 0.2;
      const opacity = Math.random() * 0.7 + 0.2;
      starsG.append('circle')
        .attr('cx', sx).attr('cy', sy).attr('r', sr)
        .attr('fill', '#ffffff').attr('opacity', opacity);
    }

    // 대기권 글로우
    svg.append('circle')
      .attr('cx', w / 2).attr('cy', h / 2)
      .attr('r', radius + 8)
      .attr('fill', 'url(#atmosphere)')
      .attr('class', 'globe-atmosphere');

    // 지구 바다 (sphere)
    const earthG = svg.append('g').attr('class', 'globe-earth');
    earthG.append('circle')
      .attr('cx', w / 2).attr('cy', h / 2)
      .attr('r', radius)
      .attr('fill', 'rgba(0,16,32,0.95)')
      .attr('stroke', 'rgba(0,255,136,0.3)')
      .attr('stroke-width', 1);

    // 위도/경도 그라티큘 (Sovereign Watch 스타일)
    const graticule = d3.geoGraticule().step([20, 20]);
    earthG.append('path')
      .datum(graticule())
      .attr('d', path)
      .attr('fill', 'none')
      .attr('stroke', 'rgba(0,255,136,0.12)')
      .attr('stroke-width', 0.5);

    // 대륙 (TopoJSON 로드)
    const landG = svg.append('g').attr('class', 'globe-land');

    // 자산 마커 (한국, 미국, 일본, 영국, 중국, 인도 등 주요 시장)
    const ASSET_MARKERS = [
      { id: 'kr',  name: '🇰🇷 한국 (KOSPI)',     lon: 126.978, lat: 37.566, color: '#22c55e', pulse: 'KR_EQUITY', size: 8 },
      { id: 'us',  name: '🇺🇸 미국 (NYSE/NASDAQ)', lon: -74.006, lat: 40.713, color: '#ef4444', pulse: 'MACRO',     size: 10 },
      { id: 'jp',  name: '🇯🇵 일본 (Nikkei)',     lon: 139.692, lat: 35.690, color: '#fb923c', pulse: 'CRYPTO',    size: 7 },
      { id: 'gb',  name: '🇬🇧 영국 (FTSE)',       lon: -0.128,  lat: 51.507, color: '#a78bfa', pulse: 'MACRO',     size: 6 },
      { id: 'cn',  name: '🇨🇳 중국 (SSE)',        lon: 121.473, lat: 31.230, color: '#fbbf24', pulse: 'SEMI',      size: 7 },
      { id: 'hk',  name: '🇭🇰 홍콩 (HSI)',        lon: 114.169, lat: 22.319, color: '#06b6d4', pulse: 'CRYPTO',    size: 6 },
      { id: 'de',  name: '🇩🇪 독일 (DAX)',        lon: 13.405,  lat: 52.520, color: '#a78bfa', pulse: 'MACRO',     size: 6 },
      { id: 'tw',  name: '🇹🇼 대만 (TSMC)',       lon: 121.565, lat: 25.033, color: '#06b6d4', pulse: 'SEMI',      size: 6 },
      { id: 'in',  name: '🇮🇳 인도 (SENSEX)',     lon: 72.877,  lat: 19.076, color: '#fbbf24', pulse: 'NEWS',      size: 5 },
    ];

    // 연결선 (한국 ↔ 다른 시장 — 글로벌 자본 흐름)
    const FLOW_LINKS = [
      { from: 'kr', to: 'us', weight: 1.0 },
      { from: 'kr', to: 'jp', weight: 0.8 },
      { from: 'kr', to: 'cn', weight: 0.9 },
      { from: 'kr', to: 'tw', weight: 0.85 },
      { from: 'kr', to: 'hk', weight: 0.7 },
      { from: 'us', to: 'gb', weight: 0.7 },
      { from: 'us', to: 'de', weight: 0.6 },
      { from: 'us', to: 'jp', weight: 0.7 },
      { from: 'cn', to: 'hk', weight: 0.9 },
      { from: 'tw', to: 'us', weight: 0.8 },
    ];

    // 마커 그룹
    const linksG = svg.append('g').attr('class', 'globe-links');
    const markersG = svg.append('g').attr('class', 'globe-markers');

    function isVisible(lon, lat) {
      const r = projection.rotate();
      const dist = d3.geoDistance([lon, lat], [-r[0], -r[1]]);
      return dist < Math.PI / 2;
    }

    function updateGlobe() {
      projection.rotate(__globeRotation);

      // 대륙 path
      landG.selectAll('path').attr('d', path);
      earthG.selectAll('path').attr('d', path);

      // 마커
      markersG.selectAll('g.asset-marker')
        .attr('transform', d => {
          const p = projection([d.lon, d.lat]);
          return p ? `translate(${p[0]},${p[1]})` : 'translate(-9999,-9999)';
        })
        .style('opacity', d => isVisible(d.lon, d.lat) ? 1 : 0.15);

      // 연결선 (great circle arc)
      linksG.selectAll('path.flow-arc')
        .attr('d', d => {
          const from = ASSET_MARKERS.find(m => m.id === d.from);
          const to = ASSET_MARKERS.find(m => m.id === d.to);
          if (!from || !to) return '';
          const arc = { type: 'LineString', coordinates: [[from.lon, from.lat], [to.lon, to.lat]] };
          return path(arc);
        })
        .style('opacity', d => {
          const from = ASSET_MARKERS.find(m => m.id === d.from);
          const to = ASSET_MARKERS.find(m => m.id === d.to);
          if (!from || !to) return 0.15;
          const visFrom = isVisible(from.lon, from.lat);
          const visTo = isVisible(to.lon, to.lat);
          return (visFrom && visTo) ? 0.7 : (visFrom || visTo) ? 0.35 : 0.1;
        });
    }

    // TopoJSON 대륙 데이터 로드
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(r => r.json())
      .then(world => {
        const countries = topojson.feature(world, world.objects.countries);
        landG.selectAll('path')
          .data(countries.features)
          .enter()
          .append('path')
          .attr('d', path)
          .attr('fill', 'rgba(0,255,136,0.06)')
          .attr('stroke', 'rgba(0,255,136,0.25)')
          .attr('stroke-width', 0.5);

        const loading = document.getElementById('tcm-loading');
        if (loading) loading.style.display = 'none';
        updateGlobe();
      })
      .catch(err => {
        console.warn('지구본 로드 실패', err);
        const loading = document.getElementById('tcm-loading');
        if (loading) loading.textContent = '대륙 데이터 로드 실패 — 기본 마커만 표시';
      });

    // 연결선 그리기 (great circle)
    linksG.selectAll('path.flow-arc')
      .data(FLOW_LINKS)
      .enter()
      .append('path')
      .attr('class', 'flow-arc')
      .attr('fill', 'none')
      .attr('stroke', d => '#22d3ee')
      .attr('stroke-width', d => d.weight * 1.5)
      .attr('stroke-opacity', 0.7)
      .attr('stroke-dasharray', '4 2')
      .attr('filter', 'url(#globe-glow)');

    // 마커 (펄스 애니메이션)
    const markers = markersG.selectAll('g.asset-marker')
      .data(ASSET_MARKERS)
      .enter()
      .append('g')
      .attr('class', 'asset-marker')
      .style('cursor', 'pointer');

    // 외곽 펄스
    markers.append('circle')
      .attr('r', d => d.size + 4)
      .attr('fill', 'none')
      .attr('stroke', d => d.color)
      .attr('stroke-width', 1.5)
      .attr('stroke-opacity', 0.6);
    // 펄스 애니메이션
    markers.select('circle')
      .each(function(d) {
        d3.select(this).append('animate')
          .attr('attributeName', 'r')
          .attr('values', `${d.size + 4};${d.size + 12};${d.size + 4}`)
          .attr('dur', '3s')
          .attr('repeatCount', 'indefinite');
        d3.select(this).append('animate')
          .attr('attributeName', 'stroke-opacity')
          .attr('values', '0.8;0;0.8')
          .attr('dur', '3s')
          .attr('repeatCount', 'indefinite');
      });

    // 코어 마커
    markers.append('circle')
      .attr('r', d => d.size)
      .attr('fill', d => d.color)
      .attr('stroke', '#ffffff')
      .attr('stroke-width', 1.5)
      .attr('filter', 'url(#globe-glow)');

    markers.append('text')
      .attr('x', d => d.size + 6)
      .attr('y', 4)
      .attr('fill', d => d.color)
      .attr('font-size', '0.7rem')
      .attr('font-weight', 600)
      .attr('font-family', 'var(--font-mono)')
      .text(d => d.name);

    markers.append('title').text(d => `${d.name}\n좌표: ${d.lat.toFixed(2)}°, ${d.lon.toFixed(2)}°`);

    // 마커 클릭 → 인스펙터 (해당 시장 종목 안내)
    markers.on('click', function(event, d) {
      // 한국 시장이면 SAO 시그널에서 한국 종목 첫 항목 열기
      const sao = (window.__dashboardData || {}).sao_signals || {};
      const signals = sao.signals || [];
      const match = signals.find(s => {
        if (d.id === 'kr') return s.pulse === 'KR_EQUITY';
        if (d.id === 'us' || d.id === 'de' || d.id === 'gb') return s.pulse === 'MACRO';
        return s.pulse === d.pulse;
      });
      if (match) openInspector(match.id);
    });

    // ─── 드래그 회전 ─────────
    let v0, q0;
    svg.call(d3.drag()
      .on('start', function(event) {
        __globeAutoRotate = false;
        const toggleEl = document.getElementById('tcm-globe-toggle');
        if (toggleEl) toggleEl.textContent = 'OFF';
        v0 = versor.cartesian(projection.invert([event.x, event.y]));
        q0 = versor(projection.rotate());
      })
      .on('drag', function(event) {
        const v1 = versor.cartesian(projection.rotate(q0).invert([event.x, event.y]));
        const q1 = versor.multiply(q0, versor.delta(v0, v1));
        __globeRotation = versor.rotation(q1);
        updateGlobe();
      })
    );

    // ─── 자동 회전 ─────────
    if (__globeTimer) clearInterval(__globeTimer);
    __globeTimer = setInterval(() => {
      if (__globeAutoRotate) {
        __globeRotation[0] += 0.2;
        updateGlobe();
      }
    }, 50);

    // 자동 회전 토글
    const toggleEl = document.getElementById('tcm-globe-toggle');
    if (toggleEl) {
      toggleEl.addEventListener('click', () => {
        __globeAutoRotate = !__globeAutoRotate;
        toggleEl.textContent = __globeAutoRotate ? 'ON' : 'OFF';
      });
    }

    // 통계 패널 갱신
    const sao = (data || {}).sao_signals || {};
    const sRows = document.getElementById('tcm-globe-stat-rows');
    if (sRows) {
      const ready = sao.ready_to_act || 0;
      const total = sao.total || 0;
      const pulses = sao.pulse_counts || {};
      sRows.innerHTML = `
        <div style="display:flex;justify-content:space-between;padding:2px 0;"><span>READY TO ACT</span><span style="color:#ef4444;font-weight:700;">${ready}</span></div>
        <div style="display:flex;justify-content:space-between;padding:2px 0;"><span>TOTAL SIGNALS</span><span style="color:#22d3ee;font-weight:700;">${total}</span></div>
        <div style="display:flex;justify-content:space-between;padding:2px 0;"><span>KR EQUITY</span><span style="color:#22c55e;">${pulses.KR_EQUITY || 0}</span></div>
        <div style="display:flex;justify-content:space-between;padding:2px 0;"><span>MACRO</span><span style="color:#ef4444;">${pulses.MACRO || 0}</span></div>
        <div style="display:flex;justify-content:space-between;padding:2px 0;"><span>SEMI</span><span style="color:#06b6d4;">${pulses.SEMI || 0}</span></div>
        <div style="display:flex;justify-content:space-between;padding:2px 0;"><span>LEGISLATIVE</span><span style="color:#fb923c;">${pulses.LEGISLATIVE || 0}</span></div>
      `;
    }

    updateGlobe();
  }

  function renderTcmTreemap(data, filter) {
    filter = filter || 'all';
    const svg = d3.select('#tcm-treemap');
    if (!svg.node()) return;
    svg.selectAll('*').remove();

    // 수집 시점 표시 (data.json generated_at)
    const asofEl = document.getElementById('tm-asof');
    if (asofEl) asofEl.textContent = data.generated_at ? `📡 수집: ${data.generated_at}` : '';

    const sectors = data.sectors || [];
    if (sectors.length === 0) {
      svg.append('text').attr('x', '50%').attr('y', '50%')
        .attr('text-anchor', 'middle').attr('fill', '#94a3b8')
        .attr('font-size', '0.85rem').text('섹터 데이터 없음');
      return;
    }

    // ── 분류 설정 (treemap_sectors.json의 market 필드와 동기화) ──────
    // 섹터명이 '미국_'으로 시작하면 US, '암호화폐'면 crypto, 나머지는 국내
    const isUS     = (name) => name.startsWith('미국_') || name === '미국 빅테크';
    const isCrypto = (name) => name === '암호화폐';
    const DOMESTIC = { has: (n) => !isUS(n) && !isCrypto(n) };
    const CRYPTO   = { has: (n) => isCrypto(n) };
    const US       = { has: (n) => isUS(n) };

    // market_cap null → 0.001 (거의 보이지 않음), 실제 값 우선
    const normCap = (raw) => {
      if (raw == null || raw <= 0) return 0.001;
      return raw > 5000 ? raw / 10000 : raw;
    };
    const scaleVal = (c) => Math.sqrt(Math.max(c, 0.1)) * 1e4;

    const makeLeaf = (s) => ({
      name: s.name, ticker: s.ticker,
      value: scaleVal(normCap(s.market_cap)),
      market_cap: normCap(s.market_cap),
      change_pct: s.change_pct || 0,
      per: s.per, roe: s.roe_pct, price: s.price,
    });

    const makeChildren = (secList) => secList
      .map(sec => ({ name: sec.name || sec.sector || 'Unknown',
