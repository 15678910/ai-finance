name: Calendar Alert

on:
  schedule:
    # 30분 간격 — 07시 아침 다이제스트 + HIGH 이벤트 발표 ~1시간 전 임박 알람
    - cron: '0,30 * * * *'
  workflow_dispatch:

concurrency:
  group: calendar-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run calendar alert
        env:
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python calendar_alert.py

      - name: Commit alert state
        if: always()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add docs/calendar_alert_state.json 2>/dev/null || true
          if git diff --cached --quiet 2>/dev/null; then
            echo "No state change"
            exit 0
          fi
          git commit -m "Update calendar alert state [automated]"
          for i in 1 2 3; do
            git push 2>/dev/null && exit 0
            git pull --rebase --strategy-option=theirs || git rebase --abort
            sleep 2
          done
