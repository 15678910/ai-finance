name: Breaking News Monitor

on:
  schedule:
    # 1시간마다 실행 (UTC 기준, 정시)
    - cron: '0 * * * *'
    # ── BOJ 6/16 회의 한시 부스트(15분 주기) — 관측보도·발표(정오 JST)·회견(15:30 JST) 선점 ──
    #    ⚠️ 일회성: 6/17 이후 아래 두 줄 제거 권장(매년 6/15~16 재발동 방지)
    - cron: '*/15 21-23 15 6 *'   # 6/15 21:00~23:59 UTC = 6/16 06:00~08:59 KST (개장 전 관측보도)
    - cron: '*/15 0-8 16 6 *'     # 6/16 00:00~08:59 UTC = 09:00~17:59 KST (발표·회견·장중 반응)
  workflow_dispatch:

concurrency:
  group: docs-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run breaking news monitor
        env:
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python breaking_news_monitor.py

      - name: Commit and push state file
        if: always()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add docs/ 2>/dev/null || true

          if git diff --cached --quiet 2>/dev/null; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "Update breaking news state [automated]"

          for i in 1 2 3 4 5; do
            if git push 2>/dev/null; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, rebasing..."
            git pull --rebase --strategy-option=theirs || git rebase --abort
            sleep $((i * 2))
          done

          echo "Failed to push after 5 attempts"
          exit 1
