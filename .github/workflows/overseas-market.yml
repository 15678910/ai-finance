name: Overseas Market Monitor

on:
  schedule:
    # KOSPI 마감 후~다음날 개장 전: 매시간 정시
    # KST 16:00, 17:00, ... 23:00, 00:00, ... 08:00 = UTC 07:00, 08:00, ... 23:00
    # = 모든 정시에 실행하되 KOSPI 운영 중(09:00~15:00 KST = 00:00~06:00 UTC)에는 스킵
    - cron: '0 7-23 * * *'  # UTC 07:00~23:00 = KST 16:00~다음날 08:00
    - cron: '0 0 * * *'     # UTC 00:00 = KST 09:00 (KOSPI 시초가 직전)
    # 미국 장 마감 확정값 캡처 (4PM EDT=20:00 UTC, 15·30분 후 정산값)
    - cron: '15 20 * * 1-5' # UTC 20:15 = 4:15PM EDT (장 마감 직후)
    - cron: '30 20 * * 1-5' # UTC 20:30 = 4:30PM EDT (마감 정산값 확정)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # generate_dashboard_data.py 병합에 필요한 전체 의존성 (openpyxl 등)
          pip install -r requirements.txt || pip install yfinance openpyxl pandas requests

      - name: Run overseas market monitor
        env:
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python overseas_market_monitor.py

      # AI 패러다임 모니터 (MV=PY · 휴머노이드 · CAPEX) — 별도 JSON, 대시보드가 직접 fetch
      - name: Run AI paradigm monitor
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python ai_paradigm_monitor.py || echo "AI paradigm monitor had errors, continuing..."

      # KOSPI 시나리오 시뮬레이터 — 베타 회귀 + 현재가 스냅샷 (엔캐리 위험 텔레그램 경보 포함)
      - name: Run KOSPI scenario simulator
        env:
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python kospi_scenario.py || echo "KOSPI scenario had errors, continuing..."

      # 과열·차익실현 위험 게이지 (z-score·이격도·모멘텀)
      - name: Run overheating monitor
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python overheating_monitor.py || echo "Overheating monitor had errors, continuing..."

      # 컨센서스 vs 실데이터 괴리 (과열↔엔캐리·BOJ·엔화 — japan_crisis·economic_calendar·overheating 읽음)
      - name: Run consensus gap indicator
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python consensus_gap.py || echo "Consensus gap had errors, continuing..."

      # 이벤트 사전영향 레이더 (다가오는 FOMC/BOJ 등이 오늘 포지셔닝에 주는 영향 — economic_calendar 읽음)
      - name: Run event radar
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python event_radar.py || echo "Event radar had errors, continuing..."

      # 엔/달러 → 한국증시 레짐별 민감도 (평온일/급변일, KOSPI·SK·삼성)
      - name: Run yen sensitivity
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python yen_sensitivity.py || echo "Yen sensitivity had errors, continuing..."

      # 반도체 디커플링 진단 (한국 SK·삼성 vs 미국 SOX) + 외국인 수급 급변 텔레그램 경보
      - name: Run semiconductor decoupling
        env:
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python semi_decoupling.py || echo "Semi decoupling had errors, continuing..."

      # KOSPI 예측 vs 실제 추적 (kospi_scenario 베타 사용 → 이후 실행)
      - name: Run prediction tracker
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python prediction_tracker.py || echo "Prediction tracker had errors, continuing..."

      # 시장감정지수 (Fear & Greed composite)
      - name: Run sentiment index
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python sentiment_index.py || echo "Sentiment index had errors, continuing..."

      # 시장 뉴스 수집 (급변 원인 — Yahoo·네이버 RSS)
      - name: Run market news collector
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python market_news.py || echo "Market news had errors, continuing..."

      # SK하이닉스 OHLC 예측 (나스닥 선물 + 반도체 동료)
      - name: Run SK Hynix OHLC forecast
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python sk_hynix_forecast.py || echo "SK Hynix forecast had errors, continuing..."

      # 삼성전자 OHLC 예측 (SK와 함께 반도체 빅섹터 양대 축)
      - name: Run Samsung OHLC forecast
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python samsung_forecast.py || echo "Samsung forecast had errors, continuing..."

      # SK하이닉스 사이클 변곡점 (주가가 실적·메모리가격 선행 — 고점 경계 컨텍스트)
      - name: Run SK cycle analysis
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python sk_cycle.py || echo "SK cycle had errors, continuing..."

      # 실적 모니터 (분기 EPS·매출 실제 vs 컨센서스 — 마이크론·SK·삼성)
      - name: Run earnings monitor
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python earnings_monitor.py || echo "Earnings monitor had errors, continuing..."

      # AI 생태계 밸류에이션 갭 (발주처 vs 공급처 PER — 한국 반도체 강제 저평가)
      - name: Run AI value gap
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python ai_value_gap.py || echo "AI value gap had errors, continuing..."

      # 외환위기 조기경보 (FX 스왑 그림자부채 6대 지표 — credit_spread·semi_decoupling 읽음 → 이후 실행)
      - name: Run FX swap monitor
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python fx_swap_monitor.py || echo "FX swap monitor had errors, continuing..."

      # 국내 증권사 리포트 (네이버 리서치 — 목표주가·투자의견 + 신규/목표가변경 텔레그램)
      - name: Run analyst reports
        env:
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python analyst_reports.py || echo "Analyst reports had errors, continuing..."

      # 아시아 반도체 섹터 당일 모니터 (TSMC·일본 반도체 동조 — 디커플링 선행동력)
      - name: Run Asia semiconductor monitor
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python asia_semi_monitor.py || echo "Asia semi monitor had errors, continuing..."

      # 모멘텀 오버레이 백테스트 (선물 단일 vs 선물+모멘텀 — 채택 여부 검증 산출물)
      - name: Run momentum overlay backtest
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python momentum_overlay_backtest.py || echo "Momentum backtest had errors, continuing..."

      # 전략 백테스트 (선물 신호 매매 규칙 과거 성과)
      - name: Run strategy backtest
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python strategy_backtest.py || echo "Strategy backtest had errors, continuing..."

      # overseas_market.json을 data.json에 병합 (대시보드는 data.json을 읽음)
      # 이 단계가 없으면 시세는 수집돼도 화면·갱신시각이 멈춤
      - name: Regenerate dashboard data.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python generate_dashboard_data.py || echo "Dashboard regeneration had errors, continuing..."

      # 외국인 보유 + 개미 추정 평단가 (data.json 읽음 → regenerate 이후 실행)
      - name: Run holdings estimate
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python holdings_estimate.py || echo "Holdings estimate had errors, continuing..."

      - name: Commit results
        if: always()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # docs/ 전체를 추가(없는 파일이 섞이면 git add가 통째로 실패하는 버그 회피).
          #   예: yen_carry_alert_state.json·semi_foreign_alert_state.json은 알림 발동 시에만 생성됨
          #   → 목록에 넣으면 미발동 시 git add 전체 실패 → "No changes" → 갱신 멈춤(6/17~6/18 사고).
          git add docs/ 2>/dev/null || true

          if git diff --cached --quiet 2>/dev/null; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update overseas market data [automated]"

          # Retry push up to 5 times with rebase on conflict
          for i in 1 2 3 4 5; do
            if git push 2>/dev/null; then
              echo "Pushed successfully on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, rebasing..."
            git pull --rebase --strategy-option=theirs || git rebase --abort
            sleep $((i * 2))
          done

          echo "Failed to push after 5 attempts"
          exit 1
