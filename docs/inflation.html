<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 실질임금 · 임금단협 · 노동 양극화 해소 계산기</title>
<meta name="description" content="카드 이용내역 CSV로 체감물가·실질임금을 계산하고, 회사 지불능력과 임금인상률 산식을 비교합니다. 정규직·비정규직, 원청·하청, 사내하도급 임금격차와 그 해소 경로까지 숫자로 냅니다.">
<style>
  :root{--bg:#0b1017;--card:#131a24;--line:#20293a;--tx:#e6edf3;--mut:#8b98a9;
        --grn:#3fb950;--red:#f85149;--amb:#d29922;--cy:#39c5cf;--acc:#58a6ff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
       font-size:17px;line-height:1.68}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
  header{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px}
  h1{font-size:1.62rem;margin:0 0 4px}
  .sub{color:var(--mut);font-size:.9rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .card h2{font-size:1.14rem;margin:0 0 5px}
  .hint{color:var(--mut);font-size:.88rem;margin-bottom:12px;line-height:1.7}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 9px;text-align:right;font-size:.93rem;border-top:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:.83rem;border-top:none}
  th:first-child,td:first-child{text-align:left}
  input[type=number]{width:84px;background:#0d1219;border:1px solid var(--line);color:var(--tx);
       border-radius:6px;padding:6px 8px;font-size:.93rem;text-align:right;font-variant-numeric:tabular-nums}
  input.amt{width:118px}
  input:focus{outline:none;border-color:var(--acc)}
  .big{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .box{flex:1;min-width:205px;background:#0d1219;border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .lab{color:var(--mut);font-size:.84rem;line-height:1.55}
  .pos{color:var(--grn)}.neg{color:var(--red)}.warn{color:var(--amb)}.cy{color:var(--cy)}
  .note{color:var(--mut);font-size:.84rem;line-height:1.72;border-top:1px solid var(--line);padding-top:11px;margin-top:12px}
  button{background:#1f6feb;color:#fff;border:none;border-radius:7px;padding:7px 14px;
         font-size:.9rem;cursor:pointer;font-weight:600}
  button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
  button.on{background:#238636}
  .mono{font-variant-numeric:tabular-nums}
  .bar{height:7px;background:#0d1219;border-radius:4px;overflow:hidden;min-width:52px}
  .bar>i{display:block;height:100%}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;
        color:var(--mut);font-size:.9rem;cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--acc);color:var(--tx);background:#0d1219}
  .tag{display:inline-block;background:#0d1219;border:1px solid var(--line);border-radius:20px;
       padding:3px 11px;font-size:.8rem;margin:2px 3px 2px 0}
  @media print{
    body{background:#fff;color:#000;font-size:14.5px}
    .card,.box{background:#fff;border-color:#bbb}
    .noprint{display:none!important}
    .lab,.hint,.note,th{color:#444}
    .pos{color:#0a6b2b}.neg{color:#a01b12}.cy{color:#0b6b73}
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>내 실질임금 · 임금단협 · 노동 양극화 해소 계산기</h1>
  <div class="sub">①②③ <b>내 실질임금</b> — 카드내역 CSV로 체감물가를 내고 명목임금과 비교합니다.<br>
    ④ <b>임금단협</b> — 회사 지불능력(DART)과 인상률 산식 여섯 가지를 같은 화면에 놓습니다.<br>
    ⑤⑥ <b>노동 양극화 해소</b> — 정규직·비정규직, 원청·하청, 사내하도급 격차를 재고 좁히는 경로별 비용을 계산합니다.<br>
    입력값은 이 브라우저에만 저장되며 서버로 전송되지 않습니다. 단체협약 근거자료로 인쇄할 수 있습니다.</div>
</header>
<div id="app"><div class="card">데이터를 불러오는 중…</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const KEY='__infl_calc_v2';
const fmt=(v,d)=>v==null||!isFinite(v)?'—':Number(v.toFixed(d==null?2:d)).toLocaleString();
const won=v=>v==null||!isFinite(v)?'—':Math.round(v).toLocaleString();
const sc=v=>v==null?'':v>=0?'pos':'neg';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null,S=null,LASTMAP=null,CO=null;

/* 가맹점명 → 품목 분류 사전.
   카드 내역의 가맹점명은 표기가 제각각이라 완벽 분류는 불가능하다.
   흔한 상호·업종 키워드만 잡고, 못 잡은 건 '미분류'로 남겨 사용자가 확인하게 한다. */
const RULES=[
  ['__subs', ['openai','chatgpt','anthropic','claude','gemini','google one','copilot','cursor',
              'midjourney','perplexity','notion','adobe','icloud','dropbox','github']],
  ['Recreation and culture', ['netflix','넷플릭스','youtube','유튜브','watcha','왓챠','tving','티빙','wavve','웨이브',
              'spotify','스포티파이','멜론뮤직','지니뮤직','벅스뮤직','cgv','메가박스','롯데시네마','영화관',
              '서점','교보문고','yes24','알라딘','스팀','steam','nintendo','플레이스테이션','게임']],
  ['Fuels and lubricants for personal transport equipment',
             ['주유','주유소','sk에너지','gs칼텍스','s-oil','에스오일','현대오일뱅크','알뜰주유','ev충전','충전소']],
  ['Transport', ['지하철','버스','택시','카카오t','우버','코레일','ktx','srt','고속도로','하이패스','주차','통행료','대중교통','항공','대한항공','아시아나']],
  // 외식·배달을 식료품보다 먼저 둔다 — '쿠팡이츠'가 식료품의 '쿠팡'에 먼저 걸리는 것을 막기 위함.
  // 규칙은 위에서부터 순서대로 매칭되므로 '더 구체적인 것'이 앞에 와야 한다.
  ['Restaurants and hotels',
             ['배달의민족','배민','요기요','쿠팡이츠','스타벅스','커피','카페','투썸','이디야','메가커피','빽다방',
              '식당','국밥','치킨','피자','버거','맥도날드','롯데리아','김밥','분식','호텔','모텔','펜션','숙박','에어비앤비']],
  ['Food and non-alcoholic beverages',
             ['이마트','홈플러스','롯데마트','코스트코','하나로마트','농협','슈퍼','마트','청과','정육','수산','생협','마켓컬리','오아시스','쿠팡']],
  ['Housing, water, electricity, gas and other fuels',
             ['관리비','도시가스','한국전력','한전','수도','상수도','월세','전기요금','난방']],
  ['Communication', ['skt','sk텔레콤','kt','lg유플러스','lgu','유플러스','알뜰폰','통신','인터넷요금']],
  ['Health', ['병원','의원','약국','치과','한의원','클리닉','메디컬','건강검진','안과','피부과','정형외과']],
  ['Education', ['학원','교육','학습지','대학교','등록금','스터디','인강','ebs','과외']],
  ['Clothing and footwear', ['유니클로','자라','무신사','나이키','아디다스','의류','신발','아울렛','스파오','탑텐']],
  ['Furnishings, household equipment and routine household maintenance',
             ['다이소','이케아','ikea','가구','생활용품','올리브영','홈세트','한샘']],
  ['Alcoholic beverages, tobacco and narcotics', ['주류','와인','맥주','소주','담배','전자담배']],
];
function classify(name){
  const s=(name||'').toLowerCase();
  for(const [k,kws] of RULES){ if(kws.some(w=>s.includes(w))) return k; }
  return null;
}

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function init(d){
  D=d; const st=load();
  const items=(d.cpi_items&&d.cpi_items.items)||[];
  S={mode:st.mode||'amount',
     weights:st.weights||Object.fromEntries(items.map(i=>[i.key,i.default_weight])),
     amounts:st.amounts||Object.fromEntries(items.map(i=>[i.key,0])),
     subs:st.subs??0, spendManual:st.spendManual??300,
     intNow:st.intNow??0, intPrev:st.intPrev??0,
     co:st.co||'', coManual:st.coManual||{}, share:st.share??30, caseRate:st.caseRate??0,
     gap:st.gap||{}, gapSubM:st.gapSubM||{},
     wage:st.wage??((d.wage&&d.wage.nominal_yoy_pct)||0)};
  render();
}
window.setMode=m=>{S.mode=m;save();render()};
window.setW=(k,v)=>{S.weights[k]=Math.max(0,parseFloat(v)||0);save();render()};
window.setA=(k,v)=>{S.amounts[k]=Math.max(0,parseFloat(v)||0);save();render()};
window.setF=(k,v)=>{S[k]=Math.max(0,parseFloat(v)||0);save();render()};
window.setWage=v=>{S.wage=parseFloat(v)||0;save();render()};
window.reset=()=>{localStorage.removeItem(KEY);LASTMAP=null;init(D)};

function calc(){
  const items=(D.cpi_items&&D.cpi_items.items)||[];
  const amtMode=S.mode==='amount';
  const raw=k=>amtMode?(S.amounts[k]||0):(S.weights[k]||0);
  let tw=0,acc=0;
  items.forEach(i=>{const w=raw(i.key);tw+=w;acc+=w*i.yoy_pct});
  const basket=tw>0?acc/tw:null;
  // 소비 총액: 금액모드면 입력 합계(원), 비중모드면 사용자가 넣은 만원 단위
  const spendWon=amtMode?tw:(S.spendManual*10000);
  const subAdd=spendWon>0?(S.subs/spendWon)*100:0;
  /* 주거 금융비용(대출이자) — CPI에 없는 항목이다.
     이자는 '소비지출'이 아니라 금융거래로 분류돼 국제 기준(COICOP)상 물가에서 제외된다.
     신규 구독과 달리 작년에도 있던 지출이므로 '전액'이 아니라 '증감분'만 물가 압력으로 본다.
     금리가 내려 이자가 줄었다면 음수가 되어 체감물가를 낮춘다 — 그것이 맞는 계산이다. */
  const intAdd=spendWon>0?((S.intNow||0)-(S.intPrev||0))/spendWon*100:0;
  const felt=basket==null?null:basket+subAdd+intAdd;
  const official=(D.cpi_items&&D.cpi_items.total_yoy_pct)??null;
  return{items,tw,basket,subAdd,intAdd,felt,official,amtMode,spendWon,
    realOfficial:official==null?null:S.wage-official,
    realFelt:felt==null?null:S.wage-felt};
}

/* ── CSV 파싱 ── 브라우저에서만 처리. 서버 전송 없음. 원본은 저장하지 않는다. */
function parseCSV(text){
  const rows=[];let f='',row=[],q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}
    else if(c!=='\r')f+=c;
  }
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
const COL_NAME=['가맹점','상호','내용','적요','거래처','사용처','기재내용','설명','메모','항목'];
const COL_AMT=['금액','이용금액','사용금액','승인금액','출금','출금액','결제금액','합계','거래금액'];

window.onCSV=async file=>{
  const buf=await file.arrayBuffer();
  let text='';
  for(const enc of ['utf-8','euc-kr']){            // 국내 카드사 CSV는 EUC-KR이 흔하다
    try{ const t=new TextDecoder(enc,{fatal:false}).decode(buf);
         if(!/�/.test(t.slice(0,4000))){text=t;break} if(!text)text=t; }catch(e){}
  }
  const rows=parseCSV(text);
  if(rows.length<2){alert('내용을 읽지 못했습니다. CSV 파일인지 확인해 주세요.');return}
  // 헤더 행 찾기 (앞 10줄 중 이름/금액 컬럼이 함께 있는 줄)
  let hi=-1,ci=-1,ai=-1;
  for(let r=0;r<Math.min(10,rows.length);r++){
    const h=rows[r].map(x=>String(x).replace(/\s/g,''));
    const c=h.findIndex(x=>COL_NAME.some(k=>x.includes(k)));
    const a=h.findIndex(x=>COL_AMT.some(k=>x.includes(k)));
    if(c>=0&&a>=0){hi=r;ci=c;ai=a;break}
  }
  if(hi<0){alert('가맹점명·금액 컬럼을 찾지 못했습니다.\n헤더에 「가맹점/내용」과 「금액」이 포함된 CSV를 사용해 주세요.');return}
  const sum={},unmatched={};let subs=0,n=0,total=0;
  for(let r=hi+1;r<rows.length;r++){
    const nm=String(rows[r][ci]||'').trim();
    const am=Math.abs(parseFloat(String(rows[r][ai]||'').replace(/[^0-9.\-]/g,''))||0);
    if(!nm||!am)continue;
    n++;total+=am;
    const k=classify(nm);
    if(k==='__subs')subs+=am;
    else if(k)sum[k]=(sum[k]||0)+am;
    else unmatched[nm]=(unmatched[nm]||0)+am;
  }
  if(!n){alert('집계할 거래를 찾지 못했습니다.');return}
  const items=(D.cpi_items&&D.cpi_items.items)||[];
  S.mode='amount';
  S.amounts=Object.fromEntries(items.map(i=>[i.key,Math.round(sum[i.key]||0)]));
  const misc='Miscellaneous goods and services';
  const unTot=Object.values(unmatched).reduce((a,b)=>a+b,0);
  if(items.some(i=>i.key===misc)) S.amounts[misc]=(S.amounts[misc]||0)+Math.round(unTot);
  S.subs=Math.round(subs);
  LASTMAP={n,total,subs:Math.round(subs),unmatched:Object.entries(unmatched).sort((a,b)=>b[1]-a[1]).slice(0,8),
           unTot:Math.round(unTot),file:file.name};
  save();render();
};

/* ── ④ 회사별 지불능력 ── 노동측 근거(물가)와 사측 근거(재무)를 같은 화면에 둔다 */
window.setCo=v=>{S.co=v;save();render()};
window.setCoF=(k,v)=>{S.coManual=S.coManual||{};S.coManual[k]=Math.max(0,parseFloat(v)||0);save();render()};
function coCard(c){
  const list=(CO&&CO.companies)||[];
  const sel=S.co||'';
  const M=S.coManual||{};
  const picked=sel==='manual'?null:list.find(x=>x.code===sel);
  const D_=picked||{headcount:M.headcount||0,avg_pay:M.avg_pay||0,
    payroll_total:(M.headcount||0)*(M.avg_pay||0),revenue:M.revenue||0,operating_income:M.op||0,year:'직접입력'};
  const pay=D_.payroll_total,rev=D_.revenue,op=D_.operating_income;
  const p2r=pay&&rev?pay/rev*100:null, opm=op!=null&&rev?op/rev*100:null;
  const rates=[2,3,5,c.felt].filter(x=>x!=null&&isFinite(x));
  const scen=(pay&&rev&&op!=null)?rates.map(r=>{
    const add=pay*r/100;
    return{r,add,opAfter:op-add,opmAfter:(op-add)/rev*100,drop:add/rev*100};
  }):[];
  const opts=`<option value="">— 회사 선택 —</option>`+
    list.map(x=>`<option value="${esc(x.code)}"${x.code===sel?' selected':''}>${esc(x.name)} (${x.year}년)</option>`).join('')+
    `<option value="manual"${sel==='manual'?' selected':''}>직접 입력 (비상장·미수록)</option>`;
  const mi=(k,lab,ph)=>`<div style="flex:1;min-width:130px"><div class="lab">${lab}</div>
    <input type="number" step="1" min="0" value="${M[k]||0}" oninput="setCoF('${k}',this.value)" style="width:100%" placeholder="${ph||''}"></div>`;
  return `<div class="card">
    <h2>④ 회사별 지불능력 — 사측 근거</h2>
    <div class="hint">임금협상에서 노동측은 <b>생계비(물가)</b>를, 사측은 <b>지불능력(재무)</b>을 근거로 듭니다.
      위 ②③이 앞의 절반이라면 여기가 뒤의 절반입니다. 상장사는 DART 사업보고서에서 자동으로 채워집니다.</div>
    <div class="row noprint" style="margin-bottom:10px">
      <select onchange="setCo(this.value)" style="background:#0d1219;border:1px solid var(--line);color:var(--tx);border-radius:7px;padding:7px 10px;font-size:.85rem;min-width:230px">${opts}</select>
    </div>
    ${sel==='manual'?`<div class="row" style="margin-bottom:12px">
      ${mi('headcount','직원 수 (명)')}${mi('avg_pay','1인평균 연봉 (원)')}
      ${mi('revenue','연 매출액 (원)')}${mi('op','연 영업이익 (원)')}
      ${mi('prod','1인당 매출 증가율 (%)')}${mi('opG','영업이익 증가율 (%)')}
      </div><div class="lab" style="margin-bottom:10px">사업보고서·감사보고서의 '직원 등의 현황'과 손익계산서에서 옮겨 적으세요.</div>`:''}
    ${!pay||!rev?`<div class="lab">회사를 선택하거나 직접 입력하면 지불능력 지표가 계산됩니다.</div>`:`
    <div class="row">
      <div class="box"><div class="lab">직원 수 / 1인평균 연봉</div>
        <div class="big mono" style="font-size:1.15rem">${won(D_.headcount)}명</div>
        <div class="lab">${won(D_.avg_pay)}원 · ${esc(String(D_.year))}년 기준</div></div>
      <div class="box"><div class="lab">인건비 / 매출</div>
        <div class="big mono ${p2r>25?'warn':''}">${fmt(p2r)}%</div>
        <div class="lab">연간급여총액 ${won(pay/1e8)}억 ÷ 매출 ${won(rev/1e8)}억</div></div>
      <div class="box"><div class="lab">영업이익률</div>
        <div class="big mono ${sc(opm)}">${fmt(opm)}%</div>
        <div class="lab">영업이익 ${won(op/1e8)}억원</div></div>
      <div class="box"><div class="lab">1인당 매출</div>
        <div class="big mono" style="font-size:1.15rem">${won(rev/D_.headcount/1e6)}백만</div>
        <div class="lab">생산성 참고치</div></div>
    </div>
    ${scen.length?`<table style="margin-top:14px"><thead><tr>
        <th>인상률</th><th>인건비 증가액</th><th>영업이익 (후)</th><th>영업이익률 (후)</th><th>하락폭</th>
      </tr></thead><tbody>${scen.map(s=>`<tr${Math.abs(s.r-c.felt)<0.01?' style="background:rgba(210,153,34,.09)"':''}>
        <td>${fmt(s.r)}%${Math.abs(s.r-c.felt)<0.01?' <span class="lab">← 내 체감물가</span>':''}</td>
        <td class="mono">${won(s.add/1e8)}억원</td>
        <td class="mono">${won(s.opAfter/1e8)}억원</td>
        <td class="mono ${sc(s.opmAfter)}">${fmt(s.opmAfter)}%</td>
        <td class="mono neg">−${fmt(s.drop)}%p</td></tr>`).join('')}</tbody></table>
      <div class="note">📖 <b>읽는 법</b> — 인건비/매출 비중이 낮을수록 같은 인상률이 영업이익에 주는 충격이 작습니다.
        예컨대 비중이 10%면 5% 인상 시 영업이익률은 0.5%p만 내려갑니다.
        시나리오는 <b>다른 조건이 그대로일 때</b>의 산술 계산이며 매출 변동·생산성 향상은 반영하지 않았습니다.</div>`:''}
    `}
    ${formulaTable(c,D_,picked)}
    <div class="note">⚠️ ${esc(((CO||{}).caveats||[]).join(' / '))}<br>
      ⚖️ ${esc((CO||{}).neutrality||'')}</div>
  </div>`;
}

/* ⑤ 고용형태·원하청 격차 — 같은 회사 안의 정규직/기간제, 그리고 원청과 하청.
   DART가 자동으로 주는 것은 '인원'뿐이다(rgllbr_co·cnttk_co). 급여는 합산 공시라
   고용형태별 임금은 공시에 없고, 사용자가 단체협약 자료·급여명세로 넣어야 한다.
   대신 넣은 값이 공시된 1인평균과 맞는지 검산해 주고, 격차를 좁히는 데 드는 돈을
   재무제표 대비로 환산한다 — 협상장에서 '얼마면 되는가'를 숫자로 놓기 위한 것이다. */
window.setGap=(k,v)=>{S.gap=S.gap||{};S.gap[k]=(v===''||v==null)?null:Math.max(0,parseFloat(v)||0);save();render()};
window.setGapCo=v=>{S.gap=S.gap||{};S.gap.sub=v;save();render()};
window.setGapSubF=(k,v)=>{S.gapSubM=S.gapSubM||{};S.gapSubM[k]=Math.max(0,parseFloat(v)||0);save();render()};

/* 격차 계산의 공통 입력·파생값 — ⑤(측정)와 ⑥(대안)이 같은 숫자를 쓰도록 한 곳에서 만든다.
   두 카드가 각자 계산하면 산식이 갈라질 수 있어 의도적으로 분리했다. */
function gapCtx(){
  const list=(CO&&CO.companies)||[],G=S.gap||{},SM=S.gapSubM||{},CM=S.coManual||{};
  const main=(S.co&&S.co!=='manual')?list.find(x=>x.code===S.co):null;
  const mName=main?main.name:(S.co==='manual'?'직접입력 회사':null);
  const mPay=main?main.avg_pay:(CM.avg_pay||null);
  const mRev=main?main.revenue:(CM.revenue||null);
  const mOp=main?main.operating_income:(CM.op||null);
  const mPayroll=main?main.payroll_total:((CM.headcount||0)*(CM.avg_pay||0)||null);
  const mHead=main?main.headcount:(CM.headcount||null);

  // ── 사내 고용형태 ──────────────────────────────────────────────
  const reg=(G.regN!=null?G.regN:(main?main.regular:null));
  const tmp=(G.tmpN!=null?G.tmpN:(main?main.temporary:null));
  const typed=(reg||0)+(tmp||0);
  const tRatio=typed?(tmp||0)/typed*100:(main?main.temp_ratio_pct:null);
  const rp=G.regPay,tp=G.tmpPay;
  const chk=(reg&&tmp&&rp&&tp)?(reg*rp+tmp*tp)/(reg+tmp):null;      // 검산: 가중평균 = 공시 1인평균?
  const chkErr=(chk&&mPay)?(chk/mPay-1)*100:null;
  const gPct=(rp&&tp)?(rp-tp)/rp*100:null;
  const close=G.close!=null?G.close:50;
  const need=(tmp&&rp&&tp&&rp>tp)?tmp*(rp-tp)*close/100:null;

  // ── 원청 vs 하청 ──────────────────────────────────────────────
  const subSel=G.sub||'';
  const subCo=(subSel&&subSel!=='manual')?list.find(x=>x.code===subSel):null;
  const subD=subCo||(subSel==='manual'?{name:'하청(직접입력)',year:'직접입력',
    headcount:SM.headcount||0,avg_pay:SM.avg_pay||0,revenue:SM.revenue||0,operating_income:SM.op||0}:null);
  const sPct=(subD&&mPay&&subD.avg_pay)?(mPay-subD.avg_pay)/mPay*100:null;
  const close2=G.close2!=null?G.close2:50;
  const need2=(subD&&mPay&&subD.avg_pay&&subD.headcount&&mPay>subD.avg_pay)
    ?subD.headcount*(mPay-subD.avg_pay)*close2/100:null;
  const unit=G.unit!=null?G.unit:3, pass=G.pass!=null?G.pass:50;
  const extra=(subD&&subD.revenue)?subD.revenue*unit/100:null;
  const toWage=extra!=null?extra*pass/100:null;
  const perHead=(toWage&&subD&&subD.headcount)?toWage/subD.headcount:null;

  // ── 간접고용(사내하도급·파견·용역) ────────────────────────────
  // 공시에는 아예 없는 인력이다. 원청 손익에서 이들의 비용은 '인건비'가 아니라
  // 외주비·지급수수료로 잡히므로, ④의 인건비/매출 비중이 실제보다 낮게 나온다.
  // 사용자가 인원·임금·도급비를 넣으면 그 왜곡을 되돌려 계산한다.
  const iN=G.indN,iPay=G.indPay,iCost=G.indCost;
  const iWage=(iN&&iPay)?iN*iPay:null;                       // 노동자가 실제 받는 총액
  const realHead=(mHead&&iN)?mHead+iN:null;                  // 실질 사업장 인력
  const iRatio=realHead?iN/realHead*100:null;
  const rphDisc=(mRev&&mHead)?mRev/mHead:null;               // 공시 기준 1인당 매출
  const rphReal=(mRev&&realHead)?mRev/realHead:null;         // 간접고용 포함 1인당 매출
  const labCost=(iCost!=null&&iCost>0)?iCost:iWage;          // 원청이 실제 부담하는 금액
  const p2rDisc=(mPayroll&&mRev)?mPayroll/mRev*100:null;
  const p2rReal=(mPayroll&&mRev&&labCost)?(mPayroll+labCost)/mRev*100:null;
  const perCost=(iCost&&iN)?iCost/iN:null;                   // 원청이 1인당 지급하는 단가
  const midMargin=(perCost&&iPay)?perCost-iPay:null;         // 용역업체 마진·관리비 몫
  const iTarget=G.indTarget!=null?G.indTarget:80;            // 원청 평균의 몇 %까지
  const iGoalPay=mPay?mPay*iTarget/100:null;
  const need3=(iN&&iGoalPay&&iPay&&iGoalPay>iPay)?iN*(iGoalPay-iPay):null;
  const costUp=(need3&&iCost)?need3/iCost*100:null;          // 도급단가를 몇 % 올리면 되나

  return {list,G,SM,CM,main,mName,mPay,mRev,mOp,mPayroll,mHead,reg,tmp,typed,tRatio,rp,tp,chk,chkErr,gPct,close,need,subSel,subCo,subD,sPct,close2,need2,unit,pass,extra,toWage,perHead,iN,iPay,iCost,iWage,realHead,iRatio,rphDisc,rphReal,labCost,p2rDisc,p2rReal,perCost,midMargin,iTarget,iGoalPay,need3,costUp};
}

function gapCard(c){
  const {list,G,SM,CM,main,mName,mPay,mRev,mOp,mPayroll,mHead,reg,tmp,typed,tRatio,rp,tp,chk,chkErr,gPct,close,need,subSel,subCo,subD,sPct,close2,need2,unit,pass,extra,toWage,perHead,iN,iPay,iCost,iWage,realHead,iRatio,rphDisc,rphReal,labCost,p2rDisc,p2rReal,perCost,midMargin,iTarget,iGoalPay,need3,costUp}=gapCtx();

  const num=(k,lab,ph,setter)=>`<div style="flex:1;min-width:150px"><div class="lab">${lab}</div>
    <input type="number" step="1" min="0" value="${(setter==='sub'?(SM[k]!=null?SM[k]:''):(G[k]!=null?G[k]:''))}"
      oninput="${setter==='sub'?`setGapSubF('${k}',this.value)`:`setGap('${k}',this.value)`}"
      style="width:100%" placeholder="${ph||''}"></div>`;
  const opts=`<option value="">— 비교할 하청·협력사 선택 —</option>`+
    list.filter(x=>x.code!==S.co).map(x=>`<option value="${esc(x.code)}"${x.code===subSel?' selected':''}>${esc(x.name)} (${x.year}년)</option>`).join('')+
    `<option value="manual"${subSel==='manual'?' selected':''}>직접 입력 (비상장 협력사)</option>`;

  return `<div class="card">
    <h2>⑤ 고용형태·원하청 격차 — 좁히는 데 드는 돈</h2>
    <div class="hint">같은 사업장 안의 <b>정규직·기간제</b>, 그리고 <b>원청과 하청</b>의 임금 차이를 숫자로 놓고,
      그 격차를 좁히는 데 필요한 재원이 회사 손익에서 어느 정도인지 환산합니다.
      ④에서 회사를 먼저 고르면 그 회사가 기준(원청)이 됩니다.</div>

    <div class="lab" style="margin:14px 0 6px;font-weight:600;color:var(--tx)">Ⓐ 사내 고용형태 격차${mName?` — ${esc(mName)}`:''}</div>
    ${!mName?`<div class="lab">④에서 회사를 먼저 선택하세요.</div>`:`
    <div class="row">
      <div class="box"><div class="lab">정규직 / 기간제 인원</div>
        <div class="big mono" style="font-size:1.05rem">${reg!=null?won(reg):'—'} / ${tmp!=null?won(tmp):'—'}명</div>
        <div class="lab">${main?'DART 직원현황 자동':'직접 입력'}</div></div>
      <div class="box"><div class="lab">비정규 비율</div>
        <div class="big mono ${tRatio!=null&&tRatio>20?'warn':''}">${fmt(tRatio,1)}%</div>
        <div class="lab">기간제 ÷ (정규+기간제)</div></div>
      <div class="box"><div class="lab">평균 근속연수</div>
        <div class="big mono" style="font-size:1.05rem">${main&&main.avg_tenure_yr!=null?fmt(main.avg_tenure_yr,1)+'년':'—'}</div>
        <div class="lab">전체 평균 (형태별 구분 없음)</div></div>
      <div class="box"><div class="lab">공시 1인평균 연봉</div>
        <div class="big mono" style="font-size:1.05rem">${mPay?won(mPay):'—'}원</div>
        <div class="lab">정규·기간제 <b>합산</b> 평균</div></div>
    </div>
    <div class="note" style="margin-top:10px">📌 <b>DART는 고용형태별 급여를 공시하지 않습니다.</b>
      인원만 정규직·기간제로 나뉘고 급여총액·1인평균은 합산입니다.
      아래 두 칸은 단체협약 자료·급여명세·노조 실태조사로 확인해 직접 넣으세요.</div>
    <div class="row" style="margin:10px 0">
      ${num('regPay','정규직 평균 연봉 (원)','예: 120000000')}
      ${num('tmpPay','기간제·비정규직 평균 연봉 (원)','예: 60000000')}
      ${num('regN','정규직 인원 (비우면 공시값)')}
      ${num('tmpN','비정규 인원 (비우면 공시값)')}
    </div>
    ${chkErr!=null?`<div class="lab" style="margin-bottom:10px">🔎 검산 — 넣은 값의 인원가중 평균 ${won(chk)}원은
      공시 1인평균 ${won(mPay)}원과 <b class="${Math.abs(chkErr)<10?'pos':'neg'}">${chkErr>=0?'+':''}${fmt(chkErr,1)}%</b> 차이입니다.
      ${Math.abs(chkErr)<10?'대체로 일치합니다.':'차이가 큽니다 — 인원 기준(연결/별도·해외법인 포함 여부)이나 급여 범위가 다를 수 있습니다.'}</div>`:''}
    ${gPct!=null?`
    <div class="row">
      <div class="box"><div class="lab">임금 격차</div>
        <div class="big mono neg">${fmt(gPct,1)}%</div>
        <div class="lab">비정규직은 정규직의 ${fmt(100-gPct,1)}% 수준</div></div>
      <div class="box"><div class="lab">1인당 차액</div>
        <div class="big mono" style="font-size:1.05rem">${won(rp-tp)}원</div>
        <div class="lab">연간 기준</div></div>
      <div class="box"><div class="lab">해소 목표
          <input type="number" step="5" min="0" max="100" value="${close}" oninput="setGap('close',this.value)"
            style="width:62px;margin-left:6px"> %</div>
        <div class="big mono" style="font-size:1.05rem">${need!=null?won(need/1e8)+'억원':'—'}</div>
        <div class="lab">격차의 ${fmt(close,0)}%를 좁히는 데 필요한 연간 재원</div></div>
      <div class="box"><div class="lab">손익 대비</div>
        <div class="big mono ${need&&mOp&&need/mOp>0.1?'warn':''}">${need&&mOp?fmt(need/mOp*100,1)+'%':'—'}</div>
        <div class="lab">영업이익 대비${need&&mRev?` · 매출 대비 ${fmt(need/mRev*100,2)}%`:''}${need&&mPayroll?` · 인건비 대비 ${fmt(need/mPayroll*100,1)}%`:''}</div></div>
    </div>
    <div class="note">📖 <b>읽는 법</b> — 전 직원 일괄 X% 인상(④)과 달리, 격차 해소는 <b>비정규직에게만</b> 재원이 갑니다.
      인원이 적으면 총액도 작아 영업이익 대비 부담이 낮게 나옵니다. 그만큼 '못 한다'가 아니라
      '얼마면 되는가'를 먼저 확정하는 것이 협상의 출발점입니다.</div>`:''}
    `}

    <div class="lab" style="margin:20px 0 6px;font-weight:600;color:var(--tx)">Ⓑ 원청 ↔ 하청·협력사 격차</div>
    <div class="row noprint" style="margin-bottom:10px">
      <select onchange="setGapCo(this.value)" style="background:#0d1219;border:1px solid var(--line);color:var(--tx);border-radius:7px;padding:7px 10px;font-size:.85rem;min-width:250px">${opts}</select>
    </div>
    ${subSel==='manual'?`<div class="row" style="margin-bottom:10px">
      ${num('headcount','협력사 직원 수 (명)','','sub')}${num('avg_pay','협력사 1인평균 연봉 (원)','','sub')}
      ${num('revenue','협력사 연 매출액 (원)','','sub')}${num('op','협력사 연 영업이익 (원)','','sub')}
      </div><div class="lab" style="margin-bottom:10px">비상장 협력사는 감사보고서(DART 전자공시 → 감사보고서)나 사업자 제출 자료에서 옮겨 적으세요.</div>`:''}
    ${!subD||!mPay?`<div class="lab">④에서 원청을 고르고 여기서 협력사를 고르면 비교가 계산됩니다.</div>`:`
    <div class="row">
      <div class="box"><div class="lab">${esc(mName||'원청')} 1인평균</div>
        <div class="big mono" style="font-size:1.05rem">${won(mPay)}원</div></div>
      <div class="box"><div class="lab">${esc(subD.name)} 1인평균</div>
        <div class="big mono" style="font-size:1.05rem">${subD.avg_pay?won(subD.avg_pay):'—'}원</div>
        <div class="lab">${esc(String(subD.year))}년 기준 · ${subD.headcount?won(subD.headcount)+'명':'—'}</div></div>
      <div class="box"><div class="lab">원하청 임금 격차</div>
        <div class="big mono ${sPct!=null&&sPct>0?'neg':'pos'}">${fmt(sPct,1)}%</div>
        <div class="lab">${sPct!=null?`협력사는 원청의 ${fmt(100-sPct,1)}% 수준`:''}</div></div>
      <div class="box"><div class="lab">해소 목표
          <input type="number" step="5" min="0" max="100" value="${close2}" oninput="setGap('close2',this.value)"
            style="width:62px;margin-left:6px"> %</div>
        <div class="big mono" style="font-size:1.05rem">${need2!=null?won(need2/1e8)+'억원':'—'}</div>
        <div class="lab">협력사 전 직원 기준 연간 재원</div></div>
    </div>
    ${need2!=null?`<table style="margin-top:12px"><thead><tr>
        <th>부담 주체</th><th>필요 재원</th><th>영업이익 대비</th><th>매출 대비</th></tr></thead><tbody>
      <tr><td>${esc(subD.name)} 자체 부담</td><td class="mono">${won(need2/1e8)}억원</td>
        <td class="mono ${subD.operating_income&&need2/subD.operating_income>0.3?'neg':''}">${subD.operating_income?fmt(need2/subD.operating_income*100,1)+'%':'—'}</td>
        <td class="mono">${subD.revenue?fmt(need2/subD.revenue*100,2)+'%':'—'}</td></tr>
      <tr><td>${esc(mName||'원청')}이 납품단가로 전액 보전</td><td class="mono">${won(need2/1e8)}억원</td>
        <td class="mono">${mOp?fmt(need2/mOp*100,1)+'%':'—'}</td>

        원청 손익에서는 소수점 이하인 경우가 흔합니다. 이 표는 그 비대칭을 그대로 보여주기 위한 것입니다.</div>`:''}

    <div class="lab" style="margin:16px 0 6px;font-weight:600;color:var(--tx)">납품단가 연동 시뮬레이션</div>

    </div>

      <b>외주비·지급수수료</b>로 잡히므로, ④의 인건비/매출 비중과 1인당 매출이 모두 실제와 어긋납니다.
      노조가 파악한 인원·임금·도급비를 넣으면 그 왜곡을 되돌려 계산합니다.</div>

      <div class="box"><div class="lab">인건비/매출 — 공시 → 실질</div>

        <div class="lab">${(p2rDisc!=null&&p2rReal!=null)?`사측 지불능력 근거가 ${fmt(p2rReal-p2rDisc,1)}%p 낮게 제시됨`:''}</div></div>
    </div>
    <div class="note" style="margin-top:10px">📖 <b>왜 이 두 지표가 핵심인가</b> — 협상에서 사측은 '인건비 비중이 이미 높다',
      '1인당 매출이 이 정도다'를 근거로 듭니다. 그런데 그 분모·분자에서 간접고용 인력이 통째로 빠져 있으면
      <b>같은 매출을 더 적은 사람이 만든 것처럼</b> 보입니다. 위 두 칸은 그 계산을 원래대로 되돌린 값입니다.</div>

    <div class="row" style="align-items:center;margin:14px 0 8px">
      <div class="lab">간접고용 임금을 원청 평균의

    </div>
    <div class="row">
      <div class="box"><div class="lab">목표 연봉</div>

      <div class="box"><div class="lab">원청 영업이익 대비</div>

        <div class="lab">${(need3&&mRev)?`매출 대비 ${fmt(need3/mRev*100,2)}%`:''}</div></div>
      <div class="box"><div class="lab">도급단가 인상률</div>

      그래서 현실적인 요구 형태는 ①<b>도급단가 인상 + 인건비 배분 합의</b>(위 마지막 칸), ②원·하청 공동 협의체,
      ③직접고용 전환입니다. 위 숫자는 그중 ①의 크기를 특정하기 위한 것입니다.<br>
      원청의 교섭의무 범위, 파견·도급 구분, 직접고용 의무는 <b>법률 판단 영역</b>이라 이 계산기로 다투지 마세요 —
      노무사·변호사 확인이 필요합니다.</div>`}
    `}

    <div class="note">⚠️ <b>이 카드의 한계</b><br>
      · 고용형태별 급여는 DART 미공시 → 사용자 입력값에 전적으로 의존합니다. 출처를 함께 제시하세요.<br>
      · 하청 비교는 <b>협력사도 공시 대상</b>이거나 감사보고서를 구할 수 있을 때만 가능합니다.<br>
      · 사내하도급·파견·용역은 어떤 공시에도 없습니다 → Ⓒ에 직접 넣어야 하며, 그 값의 정확도가 Ⓒ 전체를 좌우합니다.<br>
      · Ⓒ의 '실질' 지표는 <b>회계 기준이 아닙니다</b>. 회사 공식 재무제표와 다른 값이므로 근거를 명시해 제시하세요.<br>
      · 근속·직무·근무지가 다르면 평균 비교만으로 '동일노동'을 단정할 수 없습니다.<br>
      ⚖️ 이 계산은 어느 쪽 주장도 대변하지 않습니다. 협상 자료로 쓸 때는 원문 공시로 교차 확인하세요.</div>
  </div>`;
}

/* 국민경제의 노동 몫 — 임금협상에서 가장 오래된 거시 논거.
   회사별 '인건비/매출'과는 분모가 달라(GDP vs 매출) 직접 비교하면 안 된다.
   여기서 보는 것은 수준이 아니라 '추세와 국제 위치'다. */
function laborShareBlock(){
  const L=D.labor_share;
  if(!L||!L.areas||!L.areas.length)return '';
  const kr=L.areas.find(a=>a.code==='KOR');
  const box=a=>`<div class="box"${a.code==='KOR'?' style="border-color:var(--amb)"':''}>
    <div class="lab">${a.flag} ${esc(a.name)}</div>
    <div class="big mono" style="font-size:1.05rem">${fmt(a.share_pct,1)}%</div>
    <div class="lab">${esc(a.asof)} · ${esc(a.start_year)} 대비
      <b class="${a.chg_since_start_pp>=0?'pos':'neg'}">${a.chg_since_start_pp>=0?'+':''}${fmt(a.chg_since_start_pp,1)}%p</b>
      · 10년 ${a.chg_10y_pp>=0?'+':''}${fmt(a.chg_10y_pp,1)}%p</div></div>`;
  return `<div class="lab" style="margin:18px 0 6px;font-weight:600;color:var(--tx)">거시 기준선 — 국민경제의 노동 몫</div>
    <div class="hint" style="margin-bottom:8px">생산된 소득(GDP) 중 <b>피용자보수</b>가 차지하는 비율입니다.
      "회사가 아니라 나라 전체에서 노동 몫이 어떻게 변했나"를 보는 지표로, 단협에서 가장 오래 쓰인 거시 논거입니다.</div>
    <div class="row">${L.areas.map(box).join('')}</div>
    <div class="note">📖 <b>읽는 법</b> — ${kr?`한국은 ${esc(kr.start_year)}년 ${fmt(kr.start_pct,1)}%에서 ${esc(kr.asof)}년 ${fmt(kr.share_pct,1)}%로
      ${kr.chg_since_start_pp>=0?'올랐습니다':'내렸습니다'}. `:''}수준 자체보다 <b>방향</b>이 중요합니다.
      노동 몫이 오르는데 내 실질임금이 제자리라면, 늘어난 몫이 고용 증가나 다른 계층으로 갔다는 뜻입니다.<br>
      ⚠️ <b>④의 '인건비/매출'과 직접 비교하지 마세요</b> — 분모가 GDP와 매출로 완전히 다릅니다.<br>
      ⚠️ ${esc(L.caveat||'')}<br>
      ⚠️ ${esc(L.bok_note||'')}</div>`;
}

/* 1인당 실질 가계소비 — "통계는 올랐다는데 왜 쓸 돈이 없나"의 간극을 메우는 지표.
   실질임금은 '근로자 1인', 이 지표는 '인구 1인'이라 부양 부담·고용 구성까지 반영된다. */
function householdBlock(c){
  const H=D.household;
  if(!H||!H.areas||!H.areas.length)return '';
  const kr=H.areas.find(a=>a.code==='KOR');
  const rw=(c&&c.realFelt!=null&&kr)?c.realFelt-kr.avg4q_pct:null;
  return `<div class="lab" style="margin:18px 0 6px;font-weight:600;color:var(--tx)">체감 대조 — 1인당 실질 가계소비</div>
    <div class="hint" style="margin-bottom:8px">실질임금은 <b>근로자 1인</b> 기준이지만 이 지표는 <b>인구 1인</b> 기준입니다.
      부양 가족 수와 고용 구성 변화까지 들어가서, 통계상 임금이 올라도 이 값이 제자리면 체감이 나아지지 않습니다.</div>
    <div class="row">
      ${H.areas.map(a=>`<div class="box"${a.code==='KOR'?' style="border-color:var(--amb)"':''}>
        <div class="lab">${a.flag} ${esc(a.name)}</div>
        <div class="big mono ${sc(a.avg4q_pct)}" style="font-size:1.05rem">${a.avg4q_pct>=0?'+':''}${fmt(a.avg4q_pct,2)}%</div>
        <div class="lab">최근 4분기 평균 · ${esc(a.asof)} ${a.yoy_pct>=0?'+':''}${fmt(a.yoy_pct,2)}%</div></div>`).join('')}
    </div>
    ${rw!=null?`<div class="note">📖 내 체감물가 기준 실질임금 <b>${c.realFelt>=0?'+':''}${fmt(c.realFelt)}%</b> vs
      한국 1인당 실질소비 <b>${kr.avg4q_pct>=0?'+':''}${fmt(kr.avg4q_pct,2)}%</b> —
      차이 <b class="${rw>=0?'pos':'neg'}">${rw>=0?'+':''}${fmt(rw)}%p</b>.
      ${rw>1?'임금이 소비보다 빠르게 늘고 있습니다 — 늘어난 몫이 저축·부채상환으로 갔거나, 내 물가 입력이 실제보다 낮을 수 있습니다.'
        :rw<-1?'소비가 임금보다 빠릅니다 — 저축을 헐거나 빚으로 메우고 있을 가능성이 있습니다.'
        :'임금과 소비가 대체로 같은 속도로 움직이고 있습니다.'}</div>`:''}
    <div class="note">⚠️ ${esc(H.caveat||'')}<br>⚠️ ${esc(H.why||'')}</div>`;
}

/* ⑥ 격차 해소 경로 — 재는 것(⑤)과 좁히는 것은 다른 문제다.
   외주·도급 노동자는 원청과 근로계약이 없어 '임금을 올려달라'고 직접 교섭할 상대가 없다.
   그래서 실제로 쓰이는 방법은 우회로 다섯 가지이고, 각각 부담 주체·법적 근거·소요기간이
   전혀 다르다. 여기서는 같은 목표(원청 대비 P%)를 놓고 경로별 비용을 나란히 계산해
   '무엇이 현실적인가'를 숫자로 고르게 한다. 어느 경로를 권하지는 않는다. */
function pathCard(c){
  const X=gapCtx(),{mPay,mPayroll,mHead,mRev,mOp,reg,tmp,rp,tp,iN,iPay,iCost,perCost,midMargin,subD,G}=X;
  /* 대상 집단 — 세 종류가 모두 '노동자 간 격차'지만 비교 기준과 해법이 다르다.
       사내 비정규직  : 같은 회사 소속. 기준은 정규직 평균. 임금을 직접 정할 수 있다.
       간접고용       : 근로계약이 남. 기준은 원청 평균. 도급단가를 통해서만 닿는다.
       사외 하청      : 별개 법인. 기준은 원청 평균. 납품단가를 통해서만 닿는다. */
  const TARGETS=[];
  if(tmp&&tp&&rp)TARGETS.push({k:'temp',n:tmp,pay:tp,base:rp,baseLabel:'정규직 평균',
    label:'사내 비정규직(기간제)',cost:null,giverN:reg,giverPay:rp,giverLabel:'정규직',direct:true});
  if(iN&&iPay&&mPay)TARGETS.push({k:'ind',n:iN,pay:iPay,base:mPay,baseLabel:'원청 평균',
    label:'간접고용(사내하도급·파견·용역)',cost:iCost,giverN:mHead,giverPay:mPay,giverLabel:'원청 직원',direct:false});
  if(subD&&subD.headcount&&subD.avg_pay&&mPay)TARGETS.push({k:'sub',n:subD.headcount,pay:subD.avg_pay,
    base:mPay,baseLabel:'원청 평균',label:subD.name+' 소속 노동자',cost:null,
    giverN:mHead,giverPay:mPay,giverLabel:'원청 직원',direct:false});
  if(!TARGETS.length)return `<div class="card"><h2>⑥ 격차 해소 경로 — 대안 비교</h2>
    <div class="hint">⑤에서 대상 집단을 먼저 입력하면 경로별 필요 재원과 소요 연수를 계산합니다.<br>
      Ⓐ 정규직·비정규직 평균 연봉 · Ⓑ 하청 회사 선택 · Ⓒ 간접고용 인원·연봉 중 하나면 됩니다.</div></div>`;
  const T=TARGETS.find(t=>t.k===G.target)||TARGETS[0];

  const ratioNow=T.pay/T.base*100, gapNow=100-ratioNow;
  const goal=G.pathGoal!=null?G.pathGoal:80;
  const years=Math.max(1,Math.min(15,G.pathYears!=null?G.pathYears:5));
  const goalPay=T.base*goal/100;
  const totalNeed=goalPay>T.pay?T.n*(goalPay-T.pay):0;

  // ① 도급·납품단가 인상 + 배분 합의
  const p1Up=(totalNeed&&T.cost)?totalNeed/T.cost*100:null;
  // ② 연대임금 — 기준 집단이 인상분 일부를 양보
  const sol=G.pathSol!=null?G.pathSol:0.5;
  const giverPool=(T.giverN&&T.giverPay)?T.giverN*T.giverPay:mPayroll;
  const solPool=giverPool?giverPool*sol/100:null;
  const solGive=(solPool&&T.giverN)?solPool/T.giverN:null;
  const solGet=solPool?solPool/T.n:null;
  const solLever=(T.giverN&&T.n)?T.giverN/T.n:null;
  const solPp=(solGet&&T.base)?solGet/T.base*100:null;
  const solYears=(totalNeed&&solPool)?totalNeed/solPool:null;
  // ③ 공동근로복지기금·상생기금
  const fund=G.pathFund!=null?G.pathFund:0.5;
  const fundAmt=mOp?mOp*fund/100:null;
  const fundPer=fundAmt?fundAmt/T.n:null;
  const fundCover=(fundAmt&&totalNeed)?fundAmt/totalNeed*100:null;
  // ④ 전환 — 사내 비정규직은 '정규직 전환', 사외는 '직접고용 전환'
  const ohd=G.pathOhd!=null?G.pathOhd:25;
  const convCost=T.direct?T.n*goalPay*(1+ohd/100):T.n*goalPay*(1+ohd/100);
  const convBase=T.direct?T.n*T.pay*(1+ohd/100):T.cost;      // 이미 쓰고 있는 돈
  const convNet=convBase!=null?convCost-convBase:null;
  const convSave=(!T.direct&&midMargin&&T.n)?midMargin*T.n:null;
  // ⑤ 단계적 로드맵
  const road=Array.from({length:years},(_,k)=>{
    const r=ratioNow+(goal-ratioNow)*(k+1)/years;
    const pay=T.base*r/100;
    const prev=k===0?T.pay:T.base*(ratioNow+(goal-ratioNow)*k/years)/100;
    return {y:k+1,r,pay,inc:T.n*(pay-prev),cum:T.n*(pay-T.pay)};
  });

  /* ⑥ 소요 연수 역산 — "이 속도면 몇 년 걸리나".
     기준 집단도 매년 오르므로 격차는 '인상률 차이'로만 좁혀진다.
       비율_t = 비율_0 × ((1+b)/(1+a))^t   →   t = ln(목표/현재) ÷ ln((1+b)/(1+a))
     b ≤ a 이면 분모가 0 이하라 영원히 도달하지 못한다. 이 경우를 반드시 그대로 보여준다. */
  const rBase=G.rateBase!=null?G.rateBase:(D.wage&&D.wage.nominal_yoy_pct!=null?Math.round(D.wage.nominal_yoy_pct*10)/10:3);
  const rTgt=G.rateTgt!=null?G.rateTgt:Math.round((rBase+2)*10)/10;
  const growth=(1+rTgt/100)/(1+rBase/100);
  const closeYears=(goal>ratioNow&&growth>1)?Math.log(goal/ratioNow)/Math.log(growth):null;
  const nowY=new Date().getFullYear();
  // N년 안에 끝내려면 대상 집단 인상률이 몇 %여야 하나
  const needRate=n=>(goal>ratioNow)?((1+rBase/100)*Math.pow(goal/ratioNow,1/n)-1)*100:null;
  const trail=[];
  for(let k=1;k<=Math.min(20,Math.ceil(closeYears||10));k++){
    const r=ratioNow*Math.pow(growth,k);
    trail.push({y:k,r:Math.min(r,100),pay:T.base*Math.pow(1+rBase/100,k)*Math.min(r,100)/100});
    if(r>=goal)break;
  }

  const opPct=v=>(v!=null&&mOp)?fmt(v/mOp*100,2)+'%':'—';
  // 100억 미만은 소수 한 자리까지 — 반올림하면 12.4억이 12억이 되어 협상 숫자가 뭉개진다.
  const eok=v=>v==null?'—':(Math.abs(v)<1e10?fmt(v/1e8,1):won(v/1e8))+'억';
  const inp=(k,v,st,w)=>`<input type="number" step="${st}" min="0" value="${v}" oninput="setGap('${k}',this.value)" style="width:${w||78}px">`;

  const ROWS=[
    {n:T.direct?'① 임금체계 조정 (직접 인상)':'① 도급·납품단가 인상 + 인건비 배분 합의',
     need:totalNeed,who:T.direct?'회사':'원청 → 협력사',per:totalNeed?totalNeed/T.n:null,
     note:T.direct?'같은 회사 소속이라 단협으로 직접 정할 수 있습니다'
        :(p1Up!=null?`단가 <b>+${fmt(p1Up,1)}%</b> 필요`:'도급비를 입력하면 필요 인상률이 나옵니다'),
     risk:T.direct?'호봉·직무급 체계와 충돌할 수 있어 임금체계 개편이 함께 필요할 수 있음'
        :'인상분이 임금으로 갔는지 확인할 장치가 없으면 업체 마진으로 흡수될 수 있음',
     lv:T.direct?'중':'중',t:'단기(1년)'},
    {n:'② 연대임금 — '+esc(T.giverLabel)+' 인상분 이전',need:solPool,who:esc(T.giverLabel),per:solGet,
     note:solLever?`${esc(T.giverLabel)} 1인 <b>${won(solGive)}원</b> 양보 → 대상자 1인 <b>${won(solGet)}원</b> (${fmt(solLever,1)}배)`:'',
     risk:'조합원 총회 동의 필요 — 가장 어려운 관문이자 가장 빠른 경로',lv:'상',t:'단기(1년)'},
    {n:'③ 공동근로복지기금·상생기금 출연',need:fundAmt,who:'회사',per:fundPer,
     note:fundCover!=null?`목표액의 <b>${fmt(fundCover,0)}%</b> 충당`:'',
     risk:'기금은 임금이 아니라 복지(학자금·의료비 등) — 실질소득은 늘지만 임금격차 지표는 그대로',
     lv:'하',t:'중기(1~2년)'},
    {n:T.direct?'④ 정규직(무기계약) 전환':'④ 직접고용 전환',
     need:convNet!=null?convNet:convCost,who:'회사',per:goalPay-T.pay,
     note:convNet!=null?`총비용 ${eok(convCost)} − 현행 ${eok(convBase)} = 순증 <b>${eok(convNet)}</b>`
        :`총비용 ${eok(convCost)} (간접노무비 ${fmt(ohd,0)}% 포함) · 도급비를 넣으면 순증이 계산됩니다`,
     risk:T.direct?'고용 안정과 임금 인상은 별개 — 전환해도 임금이 자동으로 같아지지는 않음'
        :(convSave?`용역업체 마진 ${eok(convSave)}이 사라져 순증이 줄어듦 · 정원·직무체계 개편 수반`
          :'정원·직무체계 개편 수반 · 파견도급 구분은 법률 판단 영역'),
     lv:'상',t:'장기(2~3년)'},
  ];

  const tsel=TARGETS.length>1?`<div class="row noprint" style="margin-bottom:10px">
    <select onchange="setGap('target',this.value)" style="background:#0d1219;border:1px solid var(--line);color:var(--tx);border-radius:7px;padding:7px 10px;font-size:.9rem;min-width:280px">
    ${TARGETS.map(t=>`<option value="${t.k}"${t.k===T.k?' selected':''}>${esc(t.label)} (${won(t.n)}명)</option>`).join('')}
    </select></div>`:'';

  return `<div class="card">
    <h2>⑥ 격차 해소 경로 — 대안 비교와 소요 연수</h2>
    <div class="hint">⑤가 격차를 <b>재는</b> 카드라면 여기는 <b>좁히는</b> 카드입니다.
      경로별 비용을 비교하고, <b>인상률 차이로 몇 년이 걸리는지</b>를 역산합니다.</div>
    ${tsel}
    <div class="row" style="align-items:center;margin:6px 0">
      <div class="lab">대상: <b>${esc(T.label)}</b> ${won(T.n)}명 ·
        ${esc(T.baseLabel)}(${won(T.base)}원) 대비 <b class="neg">${fmt(ratioNow,1)}%</b> (격차 ${fmt(gapNow,1)}%)</div>
    </div>
    <div class="row" style="align-items:center;margin-bottom:10px">
      <div class="lab">목표: ${esc(T.baseLabel)}의 ${inp('pathGoal',goal,5)} % 까지 ·
        단계적 이행 기간 ${inp('pathYears',years,1,66)} 년</div>
    </div>
    <div class="row">
      <div class="box"><div class="lab">목표 연봉</div>
        <div class="big mono" style="font-size:1.05rem">${won(goalPay)}원</div>
        <div class="lab">현재 ${won(T.pay)}원 · +${won(goalPay-T.pay)}원</div></div>
      <div class="box"><div class="lab">총 필요 재원 (연간)</div>
        <div class="big mono" style="font-size:1.05rem">${eok(totalNeed)}원</div>
        <div class="lab">${won(T.n)}명 × 인상액</div></div>
      <div class="box"><div class="lab">회사 영업이익 대비</div>
        <div class="big mono ${totalNeed&&mOp&&totalNeed/mOp>0.1?'warn':''}">${opPct(totalNeed)}</div>
        <div class="lab">${mRev?`매출 대비 ${fmt(totalNeed/mRev*100,2)}%`:''}</div></div>
      <div class="box"><div class="lab">달성 후 격차</div>
        <div class="big mono pos">${fmt(100-goal,1)}%</div>
        <div class="lab">${fmt(gapNow,1)}% → ${fmt(100-goal,1)}%</div></div>
    </div>

    <div class="lab" style="margin:22px 0 6px;font-weight:600;color:var(--tx)">⏳ 몇 년이 걸리나 — 인상률 차이로 역산</div>
    <div class="hint" style="margin-bottom:8px">핵심은 <b>기준 집단도 매년 오른다</b>는 점입니다.
      같은 비율로 오르면 격차는 영원히 그대로입니다. 격차는 <b>인상률의 차이</b>로만 좁혀집니다.</div>
    <div class="row" style="align-items:center;margin-bottom:10px">
      <div class="lab">${esc(T.giverLabel)} 연 ${inp('rateBase',rBase,0.1)} % 인상 ·
        ${esc(T.label.split('(')[0])} 연 ${inp('rateTgt',rTgt,0.1)} % 인상</div>
    </div>
    <div class="row">
      <div class="box" style="border-color:${closeYears==null?'var(--red)':'var(--amb)'}">
        <div class="lab">목표(${fmt(goal,0)}%) 도달까지</div>
        <div class="big mono ${closeYears==null?'neg':''}" style="font-size:${closeYears==null?'1.02rem':'1.5rem'}">
          ${closeYears==null?(goal<=ratioNow?'이미 달성':'영원히 도달 못함'):fmt(closeYears,1)+'년'}</div>
        <div class="lab">${closeYears!=null?`${nowY+Math.ceil(closeYears)}년경 · 인상률 차이 ${fmt(rTgt-rBase,1)}%p`
          :(goal<=ratioNow?'목표를 더 높게 잡으세요':`대상 인상률이 ${esc(T.giverLabel)}보다 높아야 좁혀집니다`)}</div></div>
      <div class="box"><div class="lab">5년 안에 끝내려면</div>
        <div class="big mono pos" style="font-size:1.15rem">${needRate(5)!=null?'연 '+fmt(needRate(5),1)+'%':'—'}</div>
        <div class="lab">${needRate(5)!=null?`${esc(T.giverLabel)}보다 +${fmt(needRate(5)-rBase,1)}%p`:''}</div></div>
      <div class="box"><div class="lab">10년 안에 끝내려면</div>
        <div class="big mono pos" style="font-size:1.15rem">${needRate(10)!=null?'연 '+fmt(needRate(10),1)+'%':'—'}</div>
        <div class="lab">${needRate(10)!=null?`${esc(T.giverLabel)}보다 +${fmt(needRate(10)-rBase,1)}%p`:''}</div></div>
      <div class="box"><div class="lab">첫해 필요 재원</div>
        <div class="big mono" style="font-size:1.15rem">${T.n&&T.pay?eok(T.n*T.pay*(rTgt-rBase)/100)+'원':'—'}</div>
        <div class="lab">${(mOp&&T.n&&T.pay)?`영업이익 대비 ${fmt(T.n*T.pay*(rTgt-rBase)/100/mOp*100,2)}%`:''}</div></div>
    </div>
    ${closeYears==null&&goal>ratioNow?`<div class="note">🚨 <b>지금 설정으로는 격차가 좁혀지지 않습니다.</b>
      ${esc(T.label.split('(')[0])} 인상률(${fmt(rTgt,1)}%)이 ${esc(T.giverLabel)}(${fmt(rBase,1)}%) 이하이기 때문입니다.
      두 집단에 <b>같은 인상률</b>을 적용하는 관행이 격차를 고정시키는 구조입니다 —
      정률 인상은 격차를 유지하고, 정액 인상이나 차등 인상만이 격차를 줄입니다.</div>`:`
    <div style="overflow-x:auto;margin-top:12px"><table><thead><tr>
      <th>연차</th><th>연도</th><th>${esc(T.baseLabel)} 대비</th><th>대상 1인평균</th><th>남은 격차</th>
    </tr></thead><tbody>${trail.map(r=>`<tr${r.r>=goal?' style="background:rgba(63,185,80,.10)"':''}>
      <td>${r.y}년차</td><td>${nowY+r.y}</td><td class="mono">${fmt(r.r,1)}%</td>
      <td class="mono">${won(r.pay)}원</td><td class="mono ${r.r>=goal?'pos':''}">${fmt(100-r.r,1)}%</td></tr>`).join('')}
    </tbody></table></div>
    <div class="note">📖 <b>왜 이렇게 오래 걸리나</b> — 격차 ${fmt(gapNow,1)}%는 인상률 차이 ${fmt(rTgt-rBase,1)}%p로
      한 해에 약 ${fmt((growth-1)*ratioNow,2)}%p씩만 줄어듭니다. 복리로 쌓이지만 출발점이 낮을수록 오래 걸립니다.<br>
      ⚠️ 물가·실적에 따라 인상률은 매년 달라지므로 이 연수는 <b>현재 조건이 유지될 때</b>의 값입니다.
      협약에 쓸 때는 연수가 아니라 <b>'${esc(T.baseLabel)}의 ○○%'라는 목표 비율과 기한</b>을 함께 명시하세요.</div>`}

    <div class="lab" style="margin:22px 0 6px;font-weight:600;color:var(--tx)">💰 재원을 어디서 — 경로별 비교</div>
    <div style="overflow-x:auto"><table><thead><tr>
      <th>경로</th><th>연간 재원</th><th>영업이익 대비</th><th>1인당 증가</th><th>부담 주체</th><th>난이도</th><th>기간</th>
    </tr></thead><tbody>
    ${ROWS.map(r=>`<tr><td><b>${r.n}</b><div class="lab" style="margin-top:3px">${r.note}</div></td>
      <td class="mono">${eok(r.need)}원</td><td class="mono">${opPct(r.need)}</td>
      <td class="mono">${r.per!=null?won(r.per)+'원':'—'}</td><td>${r.who}</td>
      <td>${r.lv==='상'?'🔴 상':r.lv==='중'?'🟡 중':'🟢 하'}</td><td class="lab">${r.t}</td></tr>
      <tr><td colspan="7" class="lab" style="padding-top:0;border-top:none">⚠️ ${r.risk}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="note">난이도·기간은 <b>일반적인 평가</b>이며 사업장 사정에 따라 완전히 달라집니다.
      ①②③은 병행할 수 있고, 실제 합의는 대개 여러 경로를 섞습니다.</div>

    <div class="lab" style="margin:20px 0 6px;font-weight:600;color:var(--tx)">② 연대임금 상세 — 인원 차이가 만드는 지렛대</div>
    <div class="row" style="align-items:center;margin-bottom:8px">
      <div class="lab">${esc(T.giverLabel)} 임금인상률을 ${inp('pathSol',sol,0.1)} %p 낮춰 그 재원을 대상 집단에 이전하면</div>
    </div>
    <div class="row">
      <div class="box"><div class="lab">이전 재원 (연간)</div>
        <div class="big mono" style="font-size:1.05rem">${eok(solPool)}원</div>
        <div class="lab">${esc(T.giverLabel)} 인건비 × ${fmt(sol,1)}%</div></div>
      <div class="box"><div class="lab">${esc(T.giverLabel)} 1인 포기액</div>
        <div class="big mono neg" style="font-size:1.05rem">−${won(solGive)}원</div>
        <div class="lab">연봉의 ${fmt(sol,1)}%</div></div>
      <div class="box"><div class="lab">대상자 1인 수혜액</div>
        <div class="big mono pos" style="font-size:1.05rem">+${won(solGet)}원</div>
        <div class="lab">현재 연봉의 +${fmt(solGet/T.pay*100,1)}%</div></div>
      <div class="box"><div class="lab">지렛대 배율</div>
        <div class="big mono pos">${fmt(solLever,1)}배</div>
        <div class="lab">${won(T.giverN)}명 ÷ ${won(T.n)}명</div></div>
    </div>

      다만 이것은 <b>${esc(T.giverLabel)}이 자기 몫을 내놓는</b> 결정이라 총회 동의 없이는 불가능합니다.</div>

    <div class="lab" style="margin:20px 0 6px;font-weight:600;color:var(--tx)">④ ${T.direct?'정규직(무기계약) 전환':'직접고용 전환'} 비용</div>
    <div class="row" style="align-items:center;margin-bottom:8px">

    <div class="row">
      <div class="box"><div class="lab">전환 후 총비용</div>
        <div class="big mono" style="font-size:1.05rem">${eok(convCost)}원</div>
        <div class="lab">${won(T.n)}명 × ${won(goalPay)}원 × ${fmt(1+ohd/100,2)}</div></div>
      <div class="box"><div class="lab">${T.direct?'현행 인건비':'기존 도급비'}</div>
        <div class="big mono" style="font-size:1.05rem">${convBase!=null?eok(convBase)+'원':'—'}</div>
        <div class="lab">이미 지출 중인 금액</div></div>
      <div class="box"><div class="lab">순증 비용</div>
        <div class="big mono ${convNet!=null&&convNet<0?'pos':''}" style="font-size:1.05rem">${convNet!=null?eok(convNet)+'원':'—'}</div>
        <div class="lab">${convNet!=null?(convNet<0?'오히려 절감':`영업이익 대비 ${opPct(convNet)}`):'도급비 입력 필요'}</div></div>
      <div class="box"><div class="lab">${T.direct?'고용 안정 효과':'사라지는 중간 마진'}</div>
        <div class="big mono" style="font-size:1.05rem">${T.direct?won(T.n)+'명':(convSave?eok(convSave)+'원':'—')}</div>
        <div class="lab">${T.direct?'계약 갱신 불안 해소':'용역업체 관리비·이윤 몫'}</div></div>
    </div>
    <div class="note">${T.direct?`📖 <b>전환과 인상은 별개입니다</b> — 무기계약직으로 전환해도 임금이 자동으로 정규직과 같아지지 않습니다.

      :`📖 전환은 임금만 오르는 것이 아니라 <b>중간 마진이 사라집니다</b>.
      원청이 이미 1인당 ${perCost?won(perCost)+'원':'—'}을 쓰고 있다면, 그중 ${midMargin?won(midMargin)+'원':'—'}은
      노동자에게 가지 않는 몫입니다. 그래서 순증이 예상보다 작거나 경우에 따라 음수가 되기도 합니다.`}<br>
      ⚠️ 간접노무비율은 사업장마다 다르며(보통 임금의 20~35%) 정원·직무체계 개편이 함께 필요합니다.
      ${T.direct?'':'<b>파견·도급 구분과 직접고용 의무는 법률 판단 영역</b>이라 이 계산으로 다투지 마세요.'}</div>

    <div class="lab" style="margin:20px 0 6px;font-weight:600;color:var(--tx)">⑤ 단계적 로드맵 — ${years}년 균등 이행</div>
    <div style="overflow-x:auto"><table><thead><tr>

    </tr></thead><tbody>
    ${road.map(r=>`<tr><td>${r.y}년차</td><td class="mono">${fmt(r.r,1)}%</td>
      <td class="mono">${won(r.pay)}원</td><td class="mono">${eok(r.inc)}원</td>

      역으로 재원을 배분하는 방식입니다. 한 번에 못 올리면 목표와 기한을 협약문에 못 박는 것이 다음 수단입니다.<br>
      ⚠️ 이 표는 <b>${esc(T.baseLabel)}이 그대로일 때</b>의 계산입니다. 기준 집단도 매년 오르면 더 큰 재원이 필요합니다 —
      그래서 금액이 아니라 <b>비율로 쓴 협약</b>이 안전합니다.</div>

    <div class="note">⚠️ <b>이 카드의 한계</b><br>
      · 모든 계산은 ⑤에 넣은 인원·임금·도급비에 의존합니다. 입력이 틀리면 결론도 틀립니다.<br>
      · 소요 연수는 인상률이 매년 일정하다고 본 값입니다. 실제로는 물가·실적에 따라 달라집니다.<br>
      · 세제 혜택(상생협력기금 출연 세액공제 등)은 공제율·한도 개정이 잦아 반영하지 않았습니다.<br>
      · 근속·직무가 다르면 평균 비교만으로 '동일가치노동'을 단정할 수 없습니다.<br>
      · 교섭의무 범위, 파견·도급 구분, 직접고용 의무는 <b>법률 판단</b>이며 이 계산기의 영역이 아닙니다.<br>
      ⚖️ 어느 경로도 권하지 않습니다. 부담 주체가 각각 다르므로 선택은 당사자들의 몫입니다.</div>
  </div>`;
}

/* 임금인상률 산식 비교 — 어느 하나가 '정답'이 아니라 서로 다른 근거를 계산한 결과다.
   협상에서 실제로 인용되는 대표 산식들을 같은 화면에 놓아 폭을 보여준다. */
window.setShare=v=>{S.share=Math.max(0,Math.min(100,parseFloat(v)||0));save();render()};
function formulaTable(c,D_,picked){
  const share=S.share??30;
  const prod=picked?picked.productivity_yoy_pct:(S.coManual||{}).prod;
  const opG=picked?picked.op_yoy_pct:(S.coManual||{}).opG;
  const netG=picked?picked.net_yoy_pct:null;
  const mon=(D.transmission&&D.money)?(()=>{        // 통화량 − 실질성장 (화폐적 물가압력)
    const kr=(D.money||[]).find(m=>m.code==='KOR');
    return kr&&kr.yoy_pct!=null?kr.yoy_pct-3.75:null;   // 실질GDP 성장률(2026Q2)
  })():null;
  const F=[
    ['① 공식물가 보전', c.official, '공식 CPI — 최소 방어선. 이보다 낮으면 실질임금 하락'],
    ['② 체감물가 보전', c.felt, '내 소비 구조 + 신규 구독 반영. ①보다 개인차가 크다'],
    ['③ 생산성 연동 (국제 표준)', (c.official!=null&&prod!=null)?c.official+prod:null,
       '물가 + 노동생산성 증가율 — 실질임금을 지키면서 생산성 향상분을 나누는 방식'],
    ['④ 성과 배분', (c.official!=null&&opG!=null)?c.official+opG*share/100:null,
       `물가 + 영업이익 증가율 × 배분율(${share}%) — 이익이 늘면 나누고 줄면 깎이는 구조`],
    ['⑤ 순이익 연동', (c.official!=null&&netG!=null)?c.official+netG*share/100:null,
       `물가 + 순이익 증가율 × 배분율(${share}%) — 영업 외 손익까지 반영해 변동이 크다`],
    ['⑥ 통화량 기준', mon, '한국 M3 증가율 − 실질GDP 성장률 = 화폐적 물가압력'],
  ].filter(f=>f[1]!=null&&isFinite(f[1]));
  if(!F.length)return '';
  const vals=F.map(f=>f[1]);
  const lo=Math.min(...vals),hi=Math.max(...vals);
  const src=picked?`${esc(picked.name)} ${picked.year}년 공시`:'직접 입력값';
  return `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
    <h2 style="font-size:.98rem;margin:0 0 4px">임금인상률 산식 비교</h2>
    <div class="hint">협상에서 실제로 인용되는 산식들입니다. <b>어느 하나가 정답이 아니라</b>,
      무엇을 근거로 삼느냐에 따라 결과가 달라진다는 것을 보여줍니다. 재무 수치 출처: <b>${src}</b>
      ${picked?`<br>매출 ${fmt(picked.revenue_yoy_pct)}% · 영업이익 ${fmt(picked.op_yoy_pct)}% · 순이익 ${fmt(picked.net_yoy_pct)}% · 1인당매출 ${fmt(picked.productivity_yoy_pct)}% (전년비)`:''}
    </div>
    <div class="row noprint" style="margin-bottom:10px"><div class="box" style="max-width:260px">
      <div class="lab">성과 배분율 (%) — ④⑤에 적용</div>
      <input type="number" step="5" min="0" max="100" value="${share}" oninput="setShare(this.value)" style="width:80px">
      <div class="lab" style="margin-top:4px">이익 증가분 중 임금으로 배분할 비율. 협상 쟁점 자체입니다.</div></div></div>
    <table><thead><tr><th>산식</th><th>인상률</th><th style="width:44%">근거</th></tr></thead><tbody>
      ${F.map(([nm,v,desc])=>`<tr>
        <td>${esc(nm)}</td>
        <td class="mono" style="font-weight:800;color:${v===hi?'var(--red)':v===lo?'var(--cy)':'var(--tx)'}">${fmt(v)}%</td>
        <td style="text-align:left;font-size:.76rem;color:var(--mut)">${esc(desc)}</td></tr>`).join('')}
    </tbody></table>
    <div class="row" style="margin-top:12px">
      <div class="box"><div class="lab">산식별 범위</div>
        <div class="big mono" style="font-size:1.2rem">${fmt(lo)}% ~ ${fmt(hi)}%</div>
        <div class="lab">폭 ${fmt(hi-lo)}%p — 근거 선택이 곧 협상 쟁점</div></div>
      <div class="box"><div class="lab">현재 명목임금 상승률</div>
        <div class="big mono ${sc(S.wage-lo)}" style="font-size:1.2rem">${fmt(S.wage)}%</div>
        <div class="lab">최저 산식(①~⑥ 중 ${fmt(lo)}%) 대비 ${fmt(S.wage-lo)}%p</div></div>
      <div class="box"><div class="lab">타결 사례 입력 (%) — 비교용</div>
        <input type="number" step="0.1" value="${S.caseRate??0}" oninput="setF('caseRate',this.value)" style="width:80px">
        <div class="lab" style="margin-top:4px">뉴스·공시에서 확인한 실제 타결률을 넣어 위 산식들과 대조하세요.</div></div>
    </div>
    <div class="note">📖 <b>③ 생산성 연동</b>이 국제적으로 가장 널리 인용되는 기준입니다 —
      물가만큼 올려 실질임금을 지키고, 생산성이 오른 만큼을 추가로 나누는 구조입니다.
      <b>④⑤ 성과배분</b>은 배분율 자체가 협상 대상이라 한 값으로 정해지지 않습니다.
      <b>⑥ 통화량</b>은 거시 배경 참고치이지 회사별 지급능력과 직접 연결되지 않습니다.<br>
      ⚠️ 이 표는 <b>계산 결과일 뿐 권고안이 아닙니다.</b> 실제 협상은 고용안정·근로시간·복리후생 등
      임금률 외 조건과 함께 다뤄지며, 여기 없는 요소가 결과를 좌우하는 경우가 많습니다.</div>
  </div>`;
}

function render(){
  const c=calc(),W=D.wage||{},A=(D.money||[]);
  const mx=Math.max(...c.items.map(x=>Math.abs(x.yoy_pct)),1);
  const rows=c.items.map(i=>{
    const share=c.tw>0?(c.amtMode?(S.amounts[i.key]||0):(S.weights[i.key]||0))/c.tw*100:0;
    const inp=c.amtMode
      ? `<input class="amt" type="number" step="1000" min="0" value="${S.amounts[i.key]||0}" oninput="setA('${esc(i.key)}',this.value)">`
      : `<input type="number" step="1" min="0" value="${S.weights[i.key]||0}" oninput="setW('${esc(i.key)}',this.value)">`;
    return `<tr>
      <td>${esc(i.name)}</td>
      <td class="mono ${sc(i.yoy_pct)}">${i.yoy_pct>=0?'+':''}${fmt(i.yoy_pct)}%</td>
      <td>${inp}</td>
      <td class="mono" style="color:var(--mut)">${fmt(share,1)}%</td>
      <td><div class="bar"><i style="width:${(Math.abs(i.yoy_pct)/mx*100).toFixed(0)}%;background:${i.yoy_pct>=0?'var(--red)':'var(--grn)'};opacity:.75"></i></div></td>
    </tr>`}).join('');

  const money=A.map(m=>{
    const an=(m.annual||[]).slice(-10);
    return `<tr><td>${esc(m.flag)} ${esc(m.name)}</td>
      <td class="mono ${sc(m.yoy_pct)}">${m.yoy_pct>=0?'+':''}${fmt(m.yoy_pct)}%</td>
      ${an.map(a=>`<td class="mono" style="font-size:.76rem;color:${a.yoy_pct>=8?'var(--red)':a.yoy_pct<0?'var(--cy)':'var(--mut)'}">${a.yoy_pct>=0?'+':''}${fmt(a.yoy_pct,1)}</td>`).join('')}
    </tr>`}).join('');
  const years=((A[0]||{}).annual||[]).slice(-10).map(a=>`<th>${a.year}</th>`).join('');

  const mapInfo=!LASTMAP?'':`<div class="note" style="border-top:none;margin-top:10px;padding-top:0">
      📄 <b>${esc(LASTMAP.file)}</b> — 거래 ${won(LASTMAP.n)}건 · 합계 ${won(LASTMAP.total)}원 분류 완료.
      ${LASTMAP.subs?`구독 서비스 <b class="warn">${won(LASTMAP.subs)}원</b>은 아래 '신규 구독'으로 분리했습니다.`:''}
      ${LASTMAP.unTot?`<br>⚠️ 자동 분류 실패 <b>${won(LASTMAP.unTot)}원</b>은 '기타'로 넣었습니다 — 아래 상호를 보고 직접 옮기세요:<br>
        ${LASTMAP.unmatched.map(([nm,v])=>`<span class="tag">${esc(nm.slice(0,18))} ${won(v)}원</span>`).join('')}`:''}
    </div>`;

  $('app').innerHTML=`
  <div class="card">
    <h2>① 내 소비 입력</h2>
    <div class="hint">
      <b>금액 모드</b>를 권합니다 — 월 소비액을 품목별로 넣으면 비중이 자동 계산됩니다.
      <b>자동차 연료</b>는 교통에 포함된 세부항목이라 별도 칸입니다(연료비를 여기 넣으면 교통에서 빼세요).
    </div>
    <div class="row noprint" style="margin-bottom:12px;gap:8px">
      <button class="${c.amtMode?'on':'ghost'}" onclick="setMode('amount')">💰 금액(원) 입력</button>
      <button class="${c.amtMode?'ghost':'on'}" onclick="setMode('weight')">％ 비중 직접 입력</button>
    </div>
    <div class="drop noprint" id="dz" onclick="document.getElementById('fi').click()">
      📂 <b>카드 이용내역 CSV를 여기에 올리면 자동 분류됩니다</b><br>
      <span style="font-size:.76rem">클릭하거나 파일을 끌어다 놓으세요 · 카드사 홈페이지 [이용내역 다운로드] 또는 가계부 앱 내보내기<br>
      🔒 파일은 <b>이 브라우저 안에서만</b> 읽힙니다 — 서버로 전송되지 않고 원본도 저장되지 않습니다(집계 금액만 남습니다)</span>
    </div>
    <input type="file" id="fi" accept=".csv,text/csv" style="display:none">
    ${mapInfo}
    <table style="margin-top:12px"><thead><tr>
      <th>품목</th><th>물가(전년비)</th><th>${c.amtMode?'월 소비액(원)':'내 비중'}</th><th>환산 비율</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table>
    <div class="row" style="margin-top:14px">
      <div class="box"><div class="lab">월 소비 총액</div>
        ${c.amtMode
          ? `<div class="big mono" style="font-size:1.3rem">${won(c.tw)}원</div><div class="lab">위 입력값 자동 합계</div>`
          : `<input type="number" step="10" min="0" value="${S.spendManual}" oninput="setF('spendManual',this.value)" style="width:100px;font-size:1rem"> <span class="lab">만원</span>`}
      </div>
      <div class="box"><div class="lab">신규 구독 월 지출 (원) — AI·OTT·클라우드 등</div>
        <input type="number" step="1000" min="0" value="${S.subs}" oninput="setF('subs',this.value)" style="width:120px;font-size:1rem">
        <div class="lab" style="margin-top:5px">작년엔 없던 지출. 공식 물가가 <b>구조적으로 못 잡는</b> 부분입니다.</div></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="box" style="min-width:260px"><div class="lab">주거 금융비용 — 월 대출이자 (원)</div>
        <div class="row" style="gap:10px;margin-top:4px">
          <div style="flex:1"><div class="lab">현재</div>
            <input type="number" step="10000" min="0" value="${S.intNow}" oninput="setF('intNow',this.value)" style="width:100%;font-size:1rem"></div>
          <div style="flex:1"><div class="lab">1년 전</div>
            <input type="number" step="10000" min="0" value="${S.intPrev}" oninput="setF('intPrev',this.value)" style="width:100%;font-size:1rem"></div>
        </div>
        <div class="lab" style="margin-top:6px">전세자금·주택담보·보증금 대출의 <b>월 이자</b>를 넣으세요.
          원금 상환액은 빼고 <b>이자만</b> 넣습니다(원금은 자산 이전이지 소비가 아닙니다).</div></div>
      <div class="box"><div class="lab">이자 증감 → 물가 기여</div>
        <div class="big mono ${c.intAdd>0?'warn':c.intAdd<0?'pos':''}" style="font-size:1.3rem">${c.intAdd>=0?'+':''}${fmt(c.intAdd)}%p</div>
        <div class="lab">${won((S.intNow||0)-(S.intPrev||0))}원 ÷ 소비 ${won(c.spendWon)}원<br>
          금리가 내려 이자가 줄면 <b>마이너스</b>가 됩니다.</div></div>
    </div>
    <div class="note">🏠 <b>대출이자는 공식 물가에 들어 있지 않습니다.</b>
      국제 기준(COICOP)에서 이자는 소비지출이 아니라 <b>금융거래</b>로 분류돼 물가지수에서 제외됩니다.
      한국 소비자물가의 '주거·수도·광열'에 들어가는 것은 <b>집세(전세·월세)</b>와 수도·전기·가스요금뿐이고,
      <b>대출이자와 자가주거비(내 집에 사는 데 드는 기회비용)는 빠져 있습니다</b>.<br>
      → 금리가 오른 해에 "물가는 2%인데 왜 이렇게 힘든가"의 큰 부분이 여기서 옵니다.
      위 칸에 넣으면 그만큼이 체감물가에 더해집니다.</div>
  </div>

  <div class="card">
    <h2>② 내 체감물가</h2>
    <div class="row">
      <div class="box"><div class="lab">공식 소비자물가</div><div class="big mono">${fmt(c.official)}%</div>
        <div class="lab">${esc((D.cpi_items||{}).asof||'')} 기준</div></div>
      <div class="box"><div class="lab">내 비중 적용</div><div class="big mono ${c.basket>c.official?'warn':''}">${fmt(c.basket)}%</div>
        <div class="lab">공식 대비 ${c.basket!=null&&c.official!=null?((c.basket-c.official)>=0?'+':'')+fmt(c.basket-c.official)+'%p':'—'}</div></div>
      <div class="box"><div class="lab">＋ 신규 구독 부담</div><div class="big mono warn">+${fmt(c.subAdd)}%p</div>
        <div class="lab">월 ${won(S.subs)}원 ÷ 소비 ${won(c.spendWon)}원</div></div>
      <div class="box"><div class="lab">${c.intAdd>=0?'＋':'−'} 주거 금융비용</div>
        <div class="big mono ${c.intAdd>0?'warn':c.intAdd<0?'pos':''}">${c.intAdd>=0?'+':''}${fmt(c.intAdd)}%p</div>
        <div class="lab">월 이자 ${won(S.intNow)}원 (1년 전 ${won(S.intPrev)}원)<br>공식 물가에 없는 항목</div></div>
      <div class="box" style="border-color:var(--amb)"><div class="lab">＝ 내 체감물가</div>
        <div class="big mono warn">${fmt(c.felt)}%</div>
        <div class="lab">공식 대비 ${c.felt!=null&&c.official!=null?((c.felt-c.official)>=0?'+':'')+fmt(c.felt-c.official)+'%p':'—'}</div></div>
    </div>
  </div>

  <div class="card">
    <h2>③ 실질임금 — 단체협약 근거</h2>
    <div class="hint">실질임금 = <b>명목임금 상승률 − 물가상승률</b>. 마이너스면 임금이 올라도 구매력은 줄었다는 뜻입니다.</div>
    <div class="row">
      <div class="box"><div class="lab">명목임금 상승률 (%) — 수정 가능</div>
        <input type="number" step="0.1" value="${S.wage}" oninput="setWage(this.value)" style="width:100px;font-size:1rem">
        <div class="lab" style="margin-top:5px">기본값=한국 임금지수 ${esc(W.asof||'')} <b>${W.nominal_yoy_pct>=0?'+':''}${fmt(W.nominal_yoy_pct)}%</b><br>${esc(W.method||'')}</div></div>
      <div class="box"><div class="lab">실질임금 — 공식물가 기준</div>
        <div class="big mono ${sc(c.realOfficial)}">${c.realOfficial>=0?'+':''}${fmt(c.realOfficial)}%</div>
        <div class="lab">${fmt(S.wage)}% − ${fmt(c.official)}%</div></div>
      <div class="box" style="border-color:var(--amb)"><div class="lab">실질임금 — 내 체감물가 기준</div>
        <div class="big mono ${sc(c.realFelt)}">${c.realFelt>=0?'+':''}${fmt(c.realFelt)}%</div>
        <div class="lab">${fmt(S.wage)}% − ${fmt(c.felt)}%</div></div>
      <div class="box"><div class="lab">구매력 유지에 필요한 인상률</div>
        <div class="big mono cy">${fmt(c.felt)}%</div>
        <div class="lab">현재 ${fmt(S.wage)}% → <b>${c.felt!=null?fmt(c.felt-S.wage):'—'}%p 부족</b></div></div>
    </div>
    ${laborShareBlock()}
    ${householdBlock(c)}
    <div class="note">⚖️ 이 표는 <b>어느 쪽 주장도 대변하지 않습니다</b>. 공개 통계와 입력값으로 계산한 결과일 뿐이며,
      적정 임금 수준은 생산성·지불능력·업계 관행 등 여기 없는 요소도 함께 따져야 합니다.
      제출 시에는 아래 출처와 기준시점을 반드시 함께 표기하세요.</div>
  </div>

  ${coCard(c)}

  ${gapCard(c)}

  ${pathCard(c)}

  <div class="card">
    <h2>⑦ 주요국 통화량(M3) 연도별 증가율</h2>
    <div class="hint">물가의 배경 조건입니다. 통화량이 실질성장보다 빠르게 늘면 물가 압력이 쌓입니다
      (다만 시차가 길고 시대에 따라 관계가 뒤집히므로 단정은 금물).</div>
    <div style="overflow-x:auto"><table><thead><tr><th>경제권</th><th>최근</th>${years}</tr></thead>
      <tbody>${money}</tbody></table></div>
  </div>

  <div class="card">
    <h2>출처 · 기준시점</h2>
    <div class="note" style="border:none;padding:0;margin:0">
      · 품목별 소비자물가: <b>OECD</b> Consumer Price Index (전년동월비), 기준 ${esc((D.cpi_items||{}).asof||'—')}<br>
      · 임금지수: <b>FRED ${esc(W.series_id||'')}</b> (한국 분기 임금지수), 기준 ${esc(W.asof||'—')} · ${esc(W.method||'')}<br>
      · 통화량(M3): <b>OECD SDMX</b> Monetary Aggregates, 자국통화 기준 증가율<br>
      · 데이터 생성: ${esc(D.generated_at||'')} · 자동 갱신<br>
      · <b>대출이자</b>도 공식 CPI에 없습니다 — 국제 기준(COICOP)상 이자는 소비가 아니라 금융거래로 분류됩니다.
        '주거·수도·광열'에 들어가는 것은 집세(전세·월세)와 수도·전기·가스요금뿐이며,
        대출이자와 자가주거비(귀속임대료)는 제외됩니다.<br>
      · 신규 구독 부담은 <b>공식 CPI에 없는 항목</b>입니다. CPI는 '같은 물건의 가격 변화'를 재고
        '없던 지출이 새로 생긴 것'은 재지 않기 때문에, 사용자가 직접 입력하는 값입니다.<br>
      · CSV 자동 분류는 <b>가맹점명 키워드</b> 기반이라 완벽하지 않습니다. 분류 실패분은 '기타'로 들어가니
        결과를 확인하고 직접 조정하세요.<br>
      🚨 정보 제공용이며 투자자문·법률자문이 아닙니다. 입력값은 이 브라우저에만 저장되고 서버로 전송되지 않습니다.
    </div>
    <div class="row noprint" style="margin-top:12px">
      <button onclick="window.print()">🖨️ 인쇄 / PDF 저장</button>
      <button class="ghost" onclick="reset()">기본값으로 되돌리기</button>
      <a href="./" style="color:var(--mut);font-size:.8rem;align-self:center;margin-left:auto">← 전체 대시보드</a>
    </div>
  </div>`;

  const fi=$('fi'),dz=$('dz');
  if(fi){fi.onchange=e=>{if(e.target.files[0])onCSV(e.target.files[0]);e.target.value=''}}
  if(dz){
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};
    dz.ondragleave=()=>dz.classList.remove('over');
    dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');
      const f=e.dataTransfer.files[0];if(f)onCSV(f)};
  }
}

Promise.all([
  fetch('./money_macro.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
  fetch('./wage_negotiation.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)
]).then(([d,co])=>{
  CO=co;
  if(!d||!d.cpi_items){$('app').innerHTML='<div class="card">데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';return}
  init(d);
});
</script>
</body>
</html>
