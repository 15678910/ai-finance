          <div style="font-size:0.6rem;color:var(--text-muted);margin-bottom:8px;">가치·수익성·성장·모멘텀·컨센서스 결합 → 시장방향 무관</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px;">
            <div><div style="font-size:0.62rem;color:#22c55e;font-weight:700;margin-bottom:4px;">📈 LONG (상위)</div>${longCol}</div>
            <div><div style="font-size:0.62rem;color:#f87171;font-weight:700;margin-bottom:4px;">📉 SHORT (하위)</div>${shortCol}</div>
          </div>
        </div>
      </div>
      ${svBlock}
      <div style="font-size:0.62rem;color:var(--text-muted);margin-top:6px;text-align:right;">
        🚨 시뮬레이션·분석용. 투자 결정 단독 사용 금지.
      </div>
    </section>`;

    const existing = document.getElementById('quant-signals-section');
    if (existing) { existing.outerHTML = html; }
    else { (document.getElementById('app') || document.body).insertAdjacentHTML('beforeend', html); }
  }

  // ─── 📊 ETF 구성종목 비중 ───────────────────────────
  function renderEtfHoldings(ed) {
    if (!ed || !ed.etfs || !ed.etfs.length) return;

    // ── ETF 탭 ──
    const tabs = ed.etfs.map((e, i) =>
      `<button class="etf-tab-btn" data-etf-idx="${i}"
        style="padding:5px 12px;border-radius:16px;border:1px solid ${e.color}44;
          background:${i===0 ? e.color+'22' : 'transparent'};
          color:${i===0 ? e.color : 'var(--text-muted)'};
          font-size:0.7rem;font-weight:600;cursor:pointer;transition:all 0.15s;white-space:nowrap;">
        ${h(e.name)} <span style="font-size:0.58rem;opacity:0.7;">${e.aum_tril}조</span>
      </button>`
    ).join('');

    // ── ETF별 상세 패널 ──
    const panels = ed.etfs.map((e, i) => {
      const maxW = e.holdings[0]?.weight || 1;
      const rows = e.holdings.slice(0, 10).map((h2, rank) => {
        const pct = (h2.weight / maxW * 100).toFixed(1);
        const isTop3 = rank < 3;
        return `<div style="margin-bottom:8px;" onclick="openStockDetail('${h2.ticker}')" style="cursor:pointer;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="width:18px;text-align:center;font-size:0.65rem;font-weight:700;
                color:${rank===0?'#fbbf24':rank===1?'#94a3b8':rank===2?'#f97316':'var(--text-muted)'};">${rank+1}</span>
              <span style="font-size:0.78rem;font-weight:${isTop3?700:500};color:var(--text-bright);cursor:pointer;"
                onclick="openStockDetail('${h2.ticker}')">${h(h2.name)}</span>
              ${h2.ticker ? `<span style="font-size:0.58rem;color:var(--text-muted);">${h(h2.ticker)}</span>` : ''}
            </div>
            <span style="font-size:0.78rem;font-weight:700;color:${e.color};font-family:var(--font-mono);">${h2.weight}%</span>
          </div>
          <div style="height:6px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden;">
            <div style="height:100%;width:${pct}%;background:${e.color};border-radius:3px;opacity:${isTop3?0.9:0.6};"></div>
          </div>
        </div>`;
      }).join('');

      return `<div class="etf-panel" data-etf-idx="${i}" style="display:${i===0?'block':'none'};">
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
          <span style="font-size:0.68rem;color:var(--text-muted);">운용사: <b style="color:var(--text);">${h(e.manager)}</b></span>
          <span style="font-size:0.68rem;color:var(--text-muted);">AUM: <b style="color:${e.color};">${e.aum_tril}조원</b></span>
          <span style="font-size:0.62rem;color:var(--text-muted);">티커: ${h(e.ticker)}</span>
          <span style="font-size:0.6rem;color:var(--text-muted);background:rgba(255,255,255,0.05);padding:1px 5px;border-radius:4px;">${h(e.data_source||'')}</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 20px;">${rows}</div>
      </div>`;
    }).join('');

    // ── 전체 종목 ETF 노출도 ──
    const exposure = (ed.stock_exposure || []).slice(0, 12).map(s => {
      const badges = s.etfs.map(e =>
        `<span style="font-size:0.58rem;padding:1px 5px;border-radius:4px;background:${e.color}22;color:${e.color};white-space:nowrap;">${e.weight}%</span>`
      ).join(' ');
      return `<div style="display:flex;justify-content:space-between;align-items:center;
          padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;"
          onclick="openStockDetail('${h(s.ticker)}')">
        <div>
          <span style="font-size:0.75rem;font-weight:600;color:var(--text-bright);">${h(s.name)}</span>
          <span style="font-size:0.6rem;color:var(--text-muted);margin-left:5px;">${s.etf_count}개 ETF 편입</span>
        </div>
        <div style="display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:60%;">${badges}</div>
      </div>`;
    }).join('');

    const html = `<section class="section-wrap" id="etf-holdings-section">
      <div class="section-label" style="color:#f472b6;">📊 반도체 ETF 구성종목 비중
        <span style="font-size:0.65rem;color:var(--text-muted);margin-left:8px;">클릭 → 종목 분석 · 갱신: ${h(ed.generated_at||'')}</span>
      </div>
      <div style="display:grid;grid-template-columns:3fr 2fr;gap:16px;">
        <!-- 좌: ETF 탭 + 구성종목 -->
        <div class="glass-card anim-item" style="padding:14px 16px;">
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">${tabs}</div>
          <div id="etf-panels-wrap">${panels}</div>
        </div>
        <!-- 우: 전체 종목 ETF 노출도 -->
        <div class="glass-card anim-item" style="padding:14px 16px;">
          <div style="font-size:0.7rem;font-weight:600;color:var(--text-muted);margin-bottom:10px;">
            🔗 종목별 ETF 편입 현황 <span style="font-size:0.6rem;">(AUM 가중 평균 비중)</span>
          </div>
          ${exposure}
        </div>
      </div>
      <div style="font-size:0.62rem;color:var(--text-muted);margin-top:6px;text-align:right;">
        🚨 시뮬레이션·분석용. 투자 결정 금지. 출처: KRX PDF / 각 운용사 공시
      </div>
    </section>`;

    const existing = document.getElementById('etf-holdings-section');
    if (existing) { existing.outerHTML = html; }
    else { (document.getElementById('app') || document.body).insertAdjacentHTML('beforeend', html); }

    // 탭 클릭 이벤트
    document.querySelectorAll('.etf-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.etfIdx);
        const etfs = document.getElementById('etf-holdings-section')?.querySelectorAll('.etf-panel');
        const tabs2 = document.getElementById('etf-holdings-section')?.querySelectorAll('.etf-tab-btn');
        if (!etfs) return;
        etfs.forEach((p, i) => p.style.display = i === idx ? 'block' : 'none');
        tabs2?.forEach((t, i) => {
          const e = ed.etfs[i];
          t.style.background = i === idx ? e.color + '22' : 'transparent';
          t.style.color = i === idx ? e.color : 'var(--text-muted)';
        });
      });
    });
  }

  // ─── 🏆 시가총액 순위 ────────────────────────────────
  function renderMarketCapRankings(rc) {
    if (!rc) return;
    const cc = v => v >= 1 ? '#22c55e' : v >= 0 ? '#4ade80' : v >= -2 ? '#fbbf24' : '#f87171';
    const arrow = v => v >= 0 ? '▲' : '▼';

    function makeTable(list, unit, title, flag) {
      const rows = list.slice(0, 20).map((s, i) => {
        const mc = unit === '조원'
          ? (s.market_cap >= 1000 ? (s.market_cap / 10000).toFixed(2) + '경원' : s.market_cap.toFixed(0) + '조원')
          : (s.market_cap >= 1 ? s.market_cap.toFixed(2) + 'T$' : (s.market_cap * 1000).toFixed(0) + 'B$');
        const chg = s.change_pct ?? 0;
        const rankColor = i === 0 ? '#fbbf24' : i === 1 ? '#94a3b8' : i === 2 ? '#f97316' : 'var(--text-muted)';
        return `<tr style="border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;"
                    onclick="openStockDetail('${h(s.ticker.replace(/\.KS|\.KQ/g,''))}')">
          <td style="padding:6px 8px;font-size:0.7rem;font-weight:700;color:${rankColor};width:28px;">${i + 1}</td>
          <td style="padding:6px 4px;font-size:0.88rem;">${s.flag || ''}</td>
          <td style="padding:6px 6px;font-size:0.75rem;font-weight:600;color:var(--text-bright);">${h(s.name)}</td>
          <td style="padding:6px 8px;font-size:0.68rem;color:var(--text-muted);font-family:var(--font-mono);">${h(s.sector || '')}</td>
          <td style="padding:6px 8px;font-size:0.78rem;font-weight:700;color:var(--text-bright);text-align:right;font-family:var(--font-mono);">${mc}</td>
          <td style="padding:6px 8px;font-size:0.72rem;font-weight:700;color:${cc(chg)};text-align:right;white-space:nowrap;">${arrow(chg)} ${Math.abs(chg).toFixed(2)}%</td>
        </tr>`;
      }).join('');

      return `<div>
        <div style="font-size:0.75rem;font-weight:700;color:var(--cyan);margin-bottom:8px;">${flag} ${title}</div>
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:0.75rem;">
            <thead>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.1);">
                <th style="padding:5px 8px;color:var(--text-muted);font-size:0.62rem;font-weight:500;text-align:left;">#</th>
                <th style="padding:5px 4px;"></th>
                <th style="padding:5px 6px;color:var(--text-muted);font-size:0.62rem;font-weight:500;text-align:left;">기업명</th>
                <th style="padding:5px 8px;color:var(--text-muted);font-size:0.62rem;font-weight:500;text-align:left;">섹터</th>
                <th style="padding:5px 8px;color:var(--text-muted);font-size:0.62rem;font-weight:500;text-align:right;">시가총액</th>
                <th style="padding:5px 8px;color:var(--text-muted);font-size:0.62rem;font-weight:500;text-align:right;">등락</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
    }

    const domTable = makeTable(rc.domestic || [], '조원',  '국내 시총 순위 (KOSPI/KOSDAQ)', '🇰🇷');
    const glbTable = makeTable(rc.global   || [], '조달러','글로벌 시총 순위', '🌐');

    const html = `<section class="section-wrap" id="market-cap-rankings-section">
      <div class="section-label" style="color:var(--amber,#fbbf24);">🏆 시가총액 순위
        <span style="font-size:0.65rem;color:var(--text-muted);margin-left:8px;">클릭 → 종목 분석 · 갱신: ${h(rc.generated_at || '')}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="glass-card anim-item" style="padding:14px 16px;">${domTable}</div>
        <div class="glass-card anim-item" style="padding:14px 16px;">${glbTable}</div>
      </div>
      <div style="font-size:0.62rem;color:var(--text-muted);margin-top:6px;text-align:right;">
        🚨 시뮬레이션·분석용. 투자 결정 금지. 출처: yfinance
      </div>
    </section>`;

    const existing = document.getElementById('market-cap-rankings-section');
    if (existing) { existing.outerHTML = html; }
    else { (document.getElementById('app') || document.body).insertAdjacentHTML('beforeend', html); }
  }

  // ─── 📦 수출입 동향 ──────────────────────────────────
  function renderTradeData(td) {
    if (!td || !td.products) return;
    const s = td.summary || {};
    const catColor = {
      'IT/전자':'#22d3ee','에너지/화학':'#fbbf24','자동차':'#f59e0b',
      '기계':'#94a3b8','조선':'#60a5fa','소재':'#a78bfa','소비재':'#f472b6',
      '바이오':'#34d399','농식품':'#4ade80','배터리':'#86efac'
    };
    const chgColor = v => v >= 20 ? '#22c55e' : v >= 0 ? '#4ade80' : v >= -5 ? '#fbbf24' : '#f87171';
    const chgBg   = v => v >= 0 ? 'rgba(74,222,128,0.1)' : 'rgba(248,113,113,0.1)';

    // 월별 트렌드 미니차트
    const trend = td.monthly_trend || [];
    let trendSvg = '';
    if (trend.length >= 2) {
      const vals = trend.map(t => t.total);
      const maxV = Math.max(...vals), minV = Math.min(...vals);
      const TW = 200, TH = 44;
      let pts = '';
      trend.forEach((t, i) => {
        const x = (i / (trend.length - 1)) * TW;
        const y = TH - ((t.total - minV) / (maxV - minV + 1)) * (TH - 8) - 4;
        pts += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
      });
      const last = trend[trend.length - 1];
      const lx = TW, ly = TH - ((last.total - minV) / (maxV - minV + 1)) * (TH - 8) - 4;
      trendSvg = `<svg viewBox="0 0 ${TW} ${TH}" width="${TW}" height="${TH}" style="display:block;">
        <path d="${pts.trim()}" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3" fill="#22d3ee"/>
      </svg>`;
    }

    // 상단 KPI
    const kpis = `<div style="display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
      <div class="glass-card" style="padding:12px 18px;min-width:160px;border-left:3px solid #22d3ee;">
        <div style="font-size:0.65rem;color:var(--text-muted);">📦 총 수출액 (${h(td.period_label||'')})</div>
        <div style="font-size:1.6rem;font-weight:800;color:var(--text-bright);">${h(s.total_export_str||'')}</div>
        <div style="font-size:0.75rem;color:#22c55e;font-weight:600;">${s.yoy_pct >= 0 ? '+' : ''}${s.yoy_pct}% YoY</div>
        ${s.record ? `<div style="font-size:0.62rem;background:rgba(250,204,21,0.15);color:#fbbf24;padding:2px 7px;border-radius:8px;display:inline-block;margin-top:3px;">🏆 ${h(s.record)}</div>` : ''}
      </div>
      <div class="glass-card" style="padding:12px 18px;flex:1;min-width:200px;">
        <div style="font-size:0.65rem;color:var(--text-muted);margin-bottom:4px;">📈 월별 수출 추이 (억달러)</div>
        ${trendSvg}
        <div style="display:flex;justify-content:space-between;font-size:0.6rem;color:var(--text-muted);margin-top:2px;">
          ${trend.map(t => `<span>${t.month.slice(5)}월</span>`).join('')}
        </div>
      </div>
      <div class="glass-card" style="padding:12px 18px;min-width:200px;">
        <div style="font-size:0.65rem;color:#22c55e;font-weight:600;margin-bottom:4px;">✅ 주요 성과</div>
        ${(td.insights||[]).slice(0,3).map(ins => `<div style="font-size:0.68rem;color:var(--text);line-height:1.5;margin-bottom:3px;">${h(ins)}</div>`).join('')}
      </div>
      <div class="glass-card" style="padding:12px 18px;min-width:200px;">
        <div style="font-size:0.65rem;color:#f87171;font-weight:600;margin-bottom:4px;">⚠️ 리스크</div>
        ${(td.risk_factors||[]).map(r => `<div style="font-size:0.67rem;color:var(--text-muted);line-height:1.5;margin-bottom:3px;">• ${h(r)}</div>`).join('')}
      </div>
    </div>`;

    // 제품별 바 차트
    // ── 세로 막대 차트 (SVG) ─────────────────────────
    const sorted = [...(td.products||[])].sort((a,b) => b.export_bn - a.export_bn);
    const maxExport = sorted[0]?.export_bn || 1;

    const BAR_W = 50, GAP = 8, ML = 46, MR = 12, MT = 52, MB = 90;
    const CH = 240; // 차트 영역 높이
    const totalW = ML + sorted.length * (BAR_W + GAP) - GAP + MR;
    const SVG_H = MT + CH + MB;

    // Y축 그리드
    const yTicks = [0, 5, 10, 15, 20, 25, 30, 35, 40];
    const yScl = (v) => CH - (v / maxExport) * CH;

    let gridSvg = yTicks
      .filter(v => v <= maxExport + 2)
      .map(v => {
        const y = MT + yScl(v);
        return `<line x1="${ML}" y1="${y.toFixed(1)}" x2="${totalW - MR}" y2="${y.toFixed(1)}"
          stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
          <text x="${ML - 6}" y="${(y + 4.5).toFixed(1)}" text-anchor="end"
            fill="#94a3b8" font-size="12" font-weight="500">${v}억</text>`;
      }).join('');

    let barsSvg = sorted.map((p, i) => {
      const x    = ML + i * (BAR_W + GAP);
      const bH   = Math.max(3, (p.export_bn / maxExport) * CH);
      const by   = MT + CH - bH;
      const cc   = p.yoy_pct >= 0 ? (p.yoy_pct >= 20 ? '#22c55e' : '#4ade80') : (p.yoy_pct >= -5 ? '#fbbf24' : '#f87171');
      const opacity = p.yoy_pct >= 0 ? 0.88 : 0.65;
      const nameShort = p.name.length > 5 ? p.name.slice(0, 5) : p.name;
      const chgTxt = (p.yoy_pct >= 0 ? '+' : '') + p.yoy_pct + '%';
      const cx = (x + BAR_W / 2).toFixed(1);

      return `<g>
        <!-- 막대 -->
        <rect x="${x}" y="${by.toFixed(1)}" width="${BAR_W}" height="${bH.toFixed(1)}"
          rx="4" fill="${cc}" opacity="${opacity}"/>
        ${p.record ? `<rect x="${x}" y="${by.toFixed(1)}" width="${BAR_W}" height="${bH.toFixed(1)}"
          rx="4" fill="${cc}" opacity="0.3" filter="url(#glow)"/>` : ''}
        <!-- 수출액 (막대 위, 더 위쪽) -->
        <text x="${cx}" y="${(by - 20).toFixed(1)}"
          text-anchor="middle" fill="${cc}" font-size="12" font-weight="700"
          font-family="monospace">${p.export_bn.toFixed(1)}억</text>
        <!-- 증감률 (막대 바로 위) -->
        <text x="${cx}" y="${(by - 5).toFixed(1)}"
          text-anchor="middle" fill="${cc}" font-size="13" font-weight="800"
          font-family="monospace">${chgTxt}</text>
        <!-- 역대순위 뱃지 -->
        ${p.record ? `<text x="${cx}" y="${(MT + CH + 16).toFixed(1)}"
          text-anchor="middle" fill="#fbbf24" font-size="13">🏆</text>` : ''}
        <!-- 품목명 (45도 회전) -->
        <text transform="rotate(-40,${cx},${(MT + CH + 28).toFixed(1)})"
          x="${cx}" y="${(MT + CH + 28).toFixed(1)}"
          text-anchor="end" fill="#e2e8f0" font-size="13" font-weight="600">${h(nameShort)}</text>
      </g>`;
    }).join('');

    const vertChart = `<div class="glass-card anim-item" style="padding:14px 18px;overflow-x:auto;">
      <div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:6px;">
        20대 주요 품목별 수출액(억달러) · 증감률 · 아래→위: 수출규모
      </div>
      <svg viewBox="0 0 ${totalW} ${SVG_H}" width="${totalW}" height="${SVG_H}"
           style="display:block;min-width:${totalW}px;">
        <defs>
          <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- 기준선 -->
        <line x1="${ML}" y1="${MT + CH}" x2="${totalW - MR}" y2="${MT + CH}"
          stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
        ${gridSvg}
        ${barsSvg}
      </svg>
    </div>`;

    const html = `<section class="section-wrap" id="trade-section">
      <div class="section-label" style="color:var(--cyan);">📦 수출입 동향
        <span style="font-size:0.65rem;color:var(--text-muted);margin-left:8px;">${h(td.period_label||'')} · 출처: ${h(td.source||'')} · 갱신: ${h(td.generated_at||'')}</span>
      </div>
      ${kpis}
      ${vertChart}
      <div style="font-size:0.62rem;color:var(--text-muted);margin-top:6px;text-align:right;">
        🚨 시뮬레이션·분석용. 투자 결정 금지. 자료: 산업통상자원부
      </div>
    </section>`;

    const existing = document.getElementById('trade-section');
    if (existing) { existing.outerHTML = html; }
    else { (document.getElementById('app') || document.body).insertAdjacentHTML('beforeend', html); }
  }

  // ─── ⚔️ Key Debates ──────────────────────────────────
  function renderKeyDebates(db) {
    if (!db || !db.debates || !db.debates.length) return;

    const statusColor = { '진행 중': '#fbbf24', '논란': '#f87171', '임박': '#f87171', '결론': '#4ade80' };
    const getStatusColor = (s) => {
      for (const [k, v] of Object.entries(statusColor)) { if (s && s.includes(k)) return v; }
      return '#22d3ee';
    };
    const colorVar = { red:'#f87171', amber:'#fbbf24', green:'#4ade80', cyan:'#22d3ee', muted:'#64748b' };

    let debatesHtml = '';
    db.debates.forEach(d => {
      const sc = getStatusColor(d.status);
      const tagsHtml = (d.tags||[]).map(t =>
        `<span style="padding:1px 6px;background:rgba(255,255,255,0.07);border-radius:8px;font-size:0.6rem;color:var(--text-muted);">${h(t)}</span>`
      ).join(' ');
      const dataHtml = (d.key_data||[]).map(kd =>
        `<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
          <span style="font-size:0.68rem;color:var(--text-muted);">${h(kd.label)}</span>
          <span style="font-size:0.7rem;font-weight:700;color:${colorVar[kd.color]||'var(--text)'};">${h(kd.value)}</span>
        </div>`
      ).join('');
      const srcLink = d.source_url
        ? `<a href="${h(d.source_url)}" target="_blank" style="color:var(--cyan);text-decoration:none;font-size:0.62rem;">${h(d.source)}</a>`
        : `<span style="font-size:0.62rem;color:var(--text-muted);">${h(d.source||'')}</span>`;

      debatesHtml += `
      <div class="glass-card anim-item" style="padding:0;overflow:hidden;border-top:3px solid ${sc};">
        <!-- 헤더 -->
        <div style="padding:12px 16px 8px;background:rgba(255,255,255,0.02);">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;">
            <div style="font-size:0.85rem;font-weight:700;color:var(--text-bright);flex:1;">${h(d.title)}</div>
            <span style="background:${sc}22;color:${sc};padding:2px 8px;border-radius:10px;font-size:0.63rem;font-weight:600;white-space:nowrap;">${h(d.status)}</span>
          </div>
          <div style="font-size:0.7rem;color:var(--text-muted);line-height:1.5;">${h(d.summary)}</div>
        </div>
        <!-- 주장 vs 반박 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;">
          <div style="padding:10px 14px;background:rgba(99,179,237,0.04);border-right:1px solid rgba(255,255,255,0.06);">
            <div style="font-size:0.65rem;color:#93c5fd;font-weight:600;margin-bottom:6px;">${h(d.position_a.icon)} ${h(d.position_a.label)}
              <span style="background:rgba(147,197,253,0.15);padding:1px 5px;border-radius:6px;margin-left:4px;">${h(d.position_a.stance)}</span>
            </div>
            ${(d.position_a.claims||[]).map(c =>
              `<div style="font-size:0.68rem;color:var(--text);line-height:1.55;margin-bottom:4px;padding-left:8px;border-left:2px solid rgba(147,197,253,0.3);">${h(c)}</div>`
            ).join('')}
          </div>
          <div style="padding:10px 14px;background:rgba(248,113,113,0.04);">
            <div style="font-size:0.65rem;color:#f87171;font-weight:600;margin-bottom:6px;">${h(d.position_b.icon)} ${h(d.position_b.label)}
              <span style="background:rgba(248,113,113,0.15);padding:1px 5px;border-radius:6px;margin-left:4px;">${h(d.position_b.stance)}</span>
            </div>
            ${(d.position_b.claims||[]).map(c =>
              `<div style="font-size:0.68rem;color:var(--text);line-height:1.55;margin-bottom:4px;padding-left:8px;border-left:2px solid rgba(248,113,113,0.3);">${h(c)}</div>`
            ).join('')}
          </div>
        </div>
        <!-- 핵심 데이터 -->
        ${dataHtml ? `<div style="padding:8px 14px;background:rgba(0,0,0,0.15);border-top:1px solid rgba(255,255,255,0.05);">
          <div style="font-size:0.62rem;color:var(--cyan);font-weight:600;margin-bottom:4px;">📊 핵심 데이터</div>
          ${dataHtml}
        </div>` : ''}
        <!-- 소결·출처 -->
        <div style="padding:8px 14px 10px;background:rgba(255,255,255,0.01);border-top:1px solid rgba(255,255,255,0.05);">
          <div style="font-size:0.68rem;color:var(--text);line-height:1.5;margin-bottom:6px;">
            <span style="color:${sc};font-weight:600;">▶ 소결: </span>${h(d.verdict||'')}
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;">
            <div style="display:flex;flex-wrap:wrap;gap:3px;">${tagsHtml}</div>
            <div style="display:flex;gap:8px;align-items:center;">${srcLink}
              <span style="font-size:0.6rem;color:var(--text-muted);">${h(d.date||'')}</span>
            </div>
          </div>
        </div>
      </div>`;
    });

    const html = `<section class="section-wrap" id="key-debates-section">
      <div class="section-label" style="color:var(--amber,#fbbf24);">⚔️ 핵심 논쟁
        <span style="font-size:0.65rem;color:var(--text-muted);margin-left:8px;">${h(db.section_desc||'')} · ${db.debates.length}개 이슈</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:14px;">
        ${debatesHtml}
      </div>
      <div style="margin-top:8px;font-size:0.62rem;color:var(--text-muted);text-align:right;">
        🚨 시뮬레이션·분석용. 투자 결정 금지. 갱신: ${h(db.generated_at||'')}
      </div>
    </section>`;

    const existing = document.getElementById('key-debates-section');
    if (existing) { existing.outerHTML = html; }
    else { (document.getElementById('app') || document.body).insertAdjacentHTML('beforeend', html); }
  }

  // ─── 📅 Economic Calendar ────────────────────────────
  function renderEconomicCalendar(calData) {
    if (!calData || !calData.events || calData.events.length === 0) return;

    const impactColor = { HIGH: '#f87171', MEDIUM: '#fbbf24', LOW: '#4ade80' };
    const impactLabel = { HIGH: '🔴 HIGH', MEDIUM: '🟡 MEDIUM', LOW: '🟢 LOW' };
    const catIcon = {
      'IPO': '🚀', '경제지표': '📊', '중앙은행': '🏦',
      'FX/금리': '💱', '지정학': '🌍', 'VIP방한': '✈️', '기타': '📌'
    };

    // Group by date
    const byDate = {};
    calData.events.forEach(ev => {
      const d = ev.date || 'TBD';
      if (!byDate[d]) byDate[d] = [];
      byDate[d].push(ev);
    });

    let html = `<section class="section-wrap">
      <div class="section-label" style="color:var(--amber,#fbbf24);">📅 주요 이벤트 캘린더
        <span style="font-size:0.65rem;color:var(--text-muted);margin-left:8px;">${h(calData.month || '')} · ${calData.events.length}개 이벤트</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;">`;

    Object.entries(byDate).forEach(([date, events]) => {
      const isTBD = date.includes('TBD');
      const dateDisplay = isTBD ? '📌 일정 미정' : (() => {
        const parts = date.split('-');
        return `${parts[1]}월 ${parts[2]}일`;
      })();

      events.forEach(ev => {
        const color = impactColor[ev.impact] || '#94a3b8';
        const icon  = catIcon[ev.category] || '📌';
        const tags  = (ev.tags || []).map(t =>
          `<span style="padding:1px 6px;background:rgba(255,255,255,0.08);border-radius:10px;font-size:0.6rem;color:var(--text-muted);">${h(t)}</span>`
        ).join(' ');

        // ── VIP 방한 특별 카드 (면담 테이블 + 영향 종목) ──────────────
        if (ev.category === 'VIP방한' && (ev.meetings || ev.affected_stocks)) {
          const meetings = ev.meetings || [];
          const stocks   = ev.affected_stocks || [];
          html += `<div class="glass-card anim-item" style="padding:14px 16px;border-left:3px solid ${color};grid-column:span 2;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
              <div style="font-size:0.72rem;color:var(--text-muted);font-family:var(--font-mono);">${ev.region||''} ${dateDisplay}</div>
              <div style="font-size:0.65rem;font-weight:600;color:${color};">${impactLabel[ev.impact]||ev.impact}</div>
            </div>
            <div style="font-size:0.92rem;font-weight:700;color:var(--text-bright);margin-bottom:6px;">
              ${icon} ${h(ev.title)}
            </div>
            <div style="font-size:0.72rem;color:var(--text-muted);line-height:1.6;margin-bottom:${ev.impact_analysis ? '4px' : '10px'};">${h(ev.detail||'')}</div>
            ${ev.impact_analysis ? `<div style="font-size:0.7rem;color:var(--text);line-height:1.6;background:rgba(255,255,255,0.04);border-radius:4px;padding:6px 8px;margin-bottom:10px;border-left:2px solid rgba(99,179,237,0.4);">
              <span style="font-size:0.6rem;color:var(--cyan);font-weight:600;display:block;margin-bottom:2px;">📊 시장 영향 분석</span>
              ${h(ev.impact_analysis)}
            </div>` : ''}
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              ${meetings.length ? `<div>
                <div style="font-size:0.68rem;color:var(--cyan);font-weight:600;margin-bottom:6px;">👥 면담 일정</div>
                <table style="width:100%;border-collapse:collapse;font-size:0.68rem;">
                  ${meetings.map(m => `<tr style="border-bottom:1px solid rgba(255,255,255,0.06);">
                    <td style="padding:5px 8px;color:var(--text-bright);font-weight:700;white-space:nowrap;min-width:60px;">${h(m.name)}</td>
                    <td style="padding:5px 8px;color:var(--text-muted);font-size:0.65rem;white-space:nowrap;">${h(m.role)}</td>
                    <td style="padding:5px 8px;color:var(--text);font-size:0.68rem;">${h(m.topic)}</td>
                    <td style="padding:5px 8px;text-align:center;white-space:nowrap;">
                      ${m.confirmed
                        ? '<span style="background:rgba(74,222,128,0.15);color:#4ade80;padding:2px 6px;border-radius:8px;font-size:0.6rem;font-weight:600;">✓ 확정</span>'
                        : `<span style="background:rgba(251,191,36,0.12);color:#fbbf24;padding:2px 6px;border-radius:8px;font-size:0.6rem;">${h(m.note||'조율중')}</span>`}
                    </td>
                  </tr>`).join('')}
                </table>
              </div>` : ''}
              ${stocks.length ? `<div>
                <div style="font-size:0.68rem;color:var(--amber);font-weight:600;margin-bottom:6px;">📈 영향 종목</div>
                ${stocks.map(s => `<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
                  <span style="font-size:0.7rem;color:var(--text-bright);">${h(s.name)}</span>
                  <span style="font-size:0.68rem;color:#4ade80;font-family:var(--font-mono);">${h(s.move)}</span>
                </div>
                <div style="font-size:0.62rem;color:var(--text-muted);margin-bottom:2px;">${h(s.reason)}</div>`).join('')}
              </div>` : ''}
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;">
              <span style="padding:1px 7px;background:rgba(255,100,50,0.15);border-radius:10px;font-size:0.62rem;color:#fb923c;">${h(ev.category)}</span>
              ${tags}
            </div>
          </div>`;
          return;
        }

        // ── 일반 이벤트 카드 ──────────────────────────────────────────
        html += `<div class="glass-card anim-item" style="padding:12px 14px;border-left:3px solid ${color};">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
            <div style="font-size:0.72rem;color:var(--text-muted);font-family:var(--font-mono);">
              ${ev.region || ''} ${dateDisplay}
            </div>
            <div style="font-size:0.65rem;font-weight:600;color:${color};white-space:nowrap;margin-left:8px;">
              ${impactLabel[ev.impact] || ev.impact}
            </div>
          </div>
          <div style="font-size:0.85rem;font-weight:700;color:var(--text-bright);margin-bottom:4px;">
            ${icon} ${h(ev.title)}
          </div>
          ${ev.boj_hike_probability != null ? `<div style="display:inline-flex;align-items:center;gap:6px;margin-bottom:6px;background:rgba(251,191,36,0.1);padding:4px 10px;border-radius:12px;border:1px solid rgba(251,191,36,0.3);">
            <span style="font-size:0.65rem;color:var(--text-muted);">금리 인상 확률 (OIS)</span>
            <span style="font-size:1.0rem;font-weight:800;color:#fbbf24;">${ev.boj_hike_probability}%</span>
            <span style="font-size:0.6rem;color:var(--text-muted);">캐리잔고 ~$${ev.carry_trade_size_bn}0억</span>
          </div>` : ''}
          <div style="font-size:0.72rem;color:var(--text-muted);line-height:1.5;margin-bottom:${ev.impact_analysis ? '4px' : '6px'};">
            ${h(ev.detail || '')}
          </div>
          ${ev.impact_analysis ? `<div style="font-size:0.7rem;color:var(--text);line-height:1.6;background:rgba(255,255,255,0.04);border-radius:4px;padding:6px 8px;margin-bottom:6px;border-left:2px solid rgba(99,179,237,0.4);">
            <span style="font-size:0.6rem;color:var(--cyan);font-weight:600;display:block;margin-bottom:2px;">📊 시장 영향 분석</span>
            ${h(ev.impact_analysis)}
          </div>` : ''}
          <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;">
            <span style="padding:1px 7px;background:rgba(255,255,255,0.06);border-radius:10px;font-size:0.62rem;color:var(--cyan);">${h(ev.category)}</span>
            ${tags}
          </div>
        </div>`;
      });
    });

    html += `</div>
      <div style="margin-top:8px;font-size:0.65rem;color:var(--text-muted);text-align:right;">
        🚨 시뮬레이션·분석용. 투자 결정에 활용 금지. 갱신: ${h(calData.generated_at || '')}
      </div>
    </section>`;

    // Inject into main content
    const container = document.getElementById('main-content') || document.querySelector('.dashboard-content');
    if (container) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      // Insert before the last section or append
      container.appendChild(tmp.firstElementChild);
    } else {
      // Fallback: find the section-wrap areas and append after last one
      const sections = document.querySelectorAll('.section-wrap');
      if (sections.length > 0) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        sections[sections.length - 1].insertAdjacentElement('afterend', tmp.firstElementChild);
      }
    }
  }

  // ─── Load Data ───────────────────────────────────────
  fetch('./data.json?v=' + Date.now(), { cache: 'no-store' })
    .then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    })
    .then(data => {
      render(data);
      // Load economic calendar
      fetch('./economic_calendar.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .catch(() => null)
        .then(calData => { if (calData) renderEconomicCalendar(calData); });
      // Load M2 data
      fetch('./m2_data.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(m2 => { if (m2) renderM2Chart(m2); });
      // Load Key Debates
      fetch('./key_debates.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(db => { if (db) renderKeyDebates(db); });
      // Load Trade Data
      fetch('./trade_data.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(td => { if (td) renderTradeData(td); });
      // Load Market Cap Rankings
      fetch('./market_cap_rankings.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(rc => { if (rc) renderMarketCapRankings(rc); });
      // Load ETF Holdings
      fetch('./etf_holdings.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(ed => { if (ed) renderEtfHoldings(ed); });
      // Load Quant Signals
      fetch('./quant_signals.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(q => { if (q) renderQuantSignals(q); });
      // Load Leverage/Volatility Monitor
      fetch('./leverage_volatility.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
        .then(lv => { if (lv) renderLeverageVol(lv); });
    })
    .catch(err => {
      $('#app').innerHTML = `
        <div class="state-screen">
          <div class="error-icon">&#9888;</div>
          <div class="error-title">데이터 로드 실패</div>
          <div class="error-msg">${err.message}</div>
        </div>`;
    });

})();
</script>
</body>
</html>
