name: Morning Report

# 매일 KST 07시 전후 — 대시보드 수집 데이터 종합 모닝 브리핑을 텔레그램 발송
#
# ⚠️ GitHub Actions 예약 실행은 '정시(:00)'에 큐가 몰려 상습 지연된다.
#    실측(2026-07-28~08-02, 6회): 22:00 UTC 예약분이 매번 +48~59분 지연되어
#    실제로는 KST 07:48~07:59에 발송됐다 — 정시에 도착한 적이 한 번도 없음.
#    → 예약을 45분 앞당기고(21:15 UTC = KST 06:15) 분을 비정시로 옮겨 혼잡을 피한다.
#      지연 없으면 06:15, 과거 최대 지연(+59분)이어도 07:14 — 어느 쪽이든 개장(09:00) 전.
on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Send morning report
        env:
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python morning_report.py

      # 대시보드용 JSON 커밋 (충돌 시 재시도 — 다른 워크플로와 동시 실행 대비)
      - name: Commit report JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/morning_report.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "Update morning report (daily briefing) [automated]"
          for i in 1 2 3; do
            git pull --rebase -X ours && git push && echo "pushed" && exit 0
            sleep 5
          done
          echo "push failed after retries"
