name: Stock Tech Info (DART + KIPRIS daily)

on:
  schedule:
    # KST 18:00 평일 — DART 공시 마감 후 수집
    # UTC 09:00 = KST 18:00
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Seoul
      DART_API_KEY:   ${{ secrets.DART_API_KEY }}
      KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Collect tech info
        env:
          PYTHONIOENCODING: utf-8
        run: python stock_dart_tech.py

      - name: Regenerate dashboard data
        env:
          PYTHONIOENCODING: utf-8
        run: python generate_dashboard_data.py || true

      - name: Commit
        if: always()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add docs/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update stock tech info (DART+KIPRIS) [automated]"
          for i in 1 2 3 4 5; do
            git push 2>/dev/null && echo "Pushed" && exit 0
            git pull --rebase --strategy-option=theirs || git rebase --abort
            sleep $((i * 2))
          done
          exit 1
