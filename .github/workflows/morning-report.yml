name: Morning Report

# 매일 KST 07:00 (UTC 22:00) — 대시보드 수집 데이터 종합 모닝 브리핑을 텔레그램 발송
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Send morning report
        env:
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python morning_report.py

      # 대시보드용 JSON 커밋 (충돌 시 재시도 — 다른 워크플로와 동시 실행 대비)
      - name: Commit report JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/morning_report.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "Update morning report (daily briefing) [automated]"
          for i in 1 2 3; do
            git pull --rebase -X ours && git push && echo "pushed" && exit 0
            sleep 5
          done
          echo "push failed after retries"
