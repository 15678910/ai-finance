name: Market Investor Breakdown (8-class daily)

on:
  schedule:
    # KST 19:20 평일 — KR Market Gate(18:40)가 저장한 시총 상위 800 수급 합산을 대체 소스로 쓰기 위해 그 뒤에 실행
    # UTC 10:20 = KST 19:20
    - cron: '20 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run market investor breakdown collector
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python market_investor_breakdown.py

      - name: Regenerate dashboard data.json
        if: always()
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python generate_dashboard_data.py || true

      - name: Commit results
        if: always()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add docs/ 2>/dev/null || true

          if git diff --cached --quiet 2>/dev/null; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update market investor breakdown (8-class) [automated]"

          for i in 1 2 3 4 5; do
            if git push 2>/dev/null; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, rebasing..."
            git pull --rebase --strategy-option=theirs || git rebase --abort
            sleep $((i * 2))
          done

          echo "Failed to push after 5 attempts"
          exit 1
