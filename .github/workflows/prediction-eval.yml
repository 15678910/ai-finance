name: Prediction Evaluation (17:00 KST)

# 매 거래일 KST 17:00(마감 15:30 직후) 예측 자동 평가 — 당일 종가로 채점 + 텔레그램 요약.
# KOSPI·SK하이닉스·삼성전자 예측기를 재실행하면 '마감된 당일'을 채점(15:40 이후 확정 종가).
on:
  schedule:
    - cron: '0 8 * * 1-5'   # UTC 08:00 = KST 17:00 (평일)
  workflow_dispatch:

concurrency:
  group: docs-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests || pip install -r requirements.txt

      - name: Evaluate KOSPI prediction (채점 + 텔레그램)
        env:
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python prediction_tracker.py || echo "KOSPI eval had errors, continuing..."

      - name: Evaluate SK Hynix forecast (채점)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python sk_hynix_forecast.py || echo "SK eval had errors, continuing..."

      - name: Evaluate Samsung forecast (채점)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python samsung_forecast.py || echo "Samsung eval had errors, continuing..."

      - name: Commit results
        if: always()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          # docs/ 전체 추가 (없는 파일 섞여도 안 깨지는 견고한 방식 — 6/17 사고 교훈)
          git add docs/ 2>/dev/null || true
          if git diff --cached --quiet 2>/dev/null; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update prediction evaluation 17:00 KST [automated]"
          for i in 1 2 3 4 5; do
            if git push 2>/dev/null; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            git pull --rebase --strategy-option=theirs || git rebase --abort
            sleep $((i * 2))
          done
          echo "Push failed after 5 attempts"
          exit 1
