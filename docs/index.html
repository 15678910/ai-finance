<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI 기반 한국 주식시장 일일 분석 대시보드">
<title>AI 금융 분석 대시보드</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e17'/%3E%3Cpolyline points='4,24 10,14 16,18 22,8 28,12' fill='none' stroke='%2306b6d4' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='28' cy='12' r='2' fill='%2310b981'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<style>
/* ─── Reset & Base ─────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:           #0a0e17;
  --surface:      #111827;
  --surface-hi:   #162032;
  --surface-glass: rgba(17, 24, 39, 0.7);
  --border:       rgba(6,182,212,0.12);
  --border-hi:    rgba(6,182,212,0.28);
  --cyan:         #06b6d4;
  --cyan-dim:     rgba(6,182,212,0.15);
  --green:        #10b981;
  --green-dim:    rgba(16,185,129,0.15);
  --red:          #ef4444;
  --red-dim:      rgba(239,68,68,0.15);
  --amber:        #f59e0b;
  --amber-dim:    rgba(245,158,11,0.15);
  --orange:       #f97316;
  --orange-dim:   rgba(249,115,22,0.15);
  --text:         #cbd5e1;
  --text-muted:   #475569;
  --text-bright:  #f1f5f9;
  --font: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Consolas", "Menlo", monospace;
  --radius:  10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
  --shadow:  0 4px 24px rgba(0,0,0,0.4);
  --shadow-glow: 0 0 30px rgba(6,182,212,0.08);
  --row-even: rgba(255,255,255,0.02);
}

html { font-size: 21px; scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Subtle grid texture */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(6,182,212,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(6,182,212,0.02) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

/* ─── Animations ──────────────────────────────────────── */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-20px); }
  to   { opacity: 1; transform: translateX(0); }
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.4; transform: scale(0.7); }
}

@keyframes spin { to { transform: rotate(360deg); } }

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes gaugeGrow {
  from { width: 0; }
}

.anim-item {
  opacity: 0;
  animation: fadeInUp 0.5s ease forwards;
}

.anim-item:nth-child(1) { animation-delay: 0.05s; }
.anim-item:nth-child(2) { animation-delay: 0.1s; }
.anim-item:nth-child(3) { animation-delay: 0.15s; }
.anim-item:nth-child(4) { animation-delay: 0.2s; }
.anim-item:nth-child(5) { animation-delay: 0.25s; }
.anim-item:nth-child(6) { animation-delay: 0.3s; }

/* ─── Layout ───────────────────────────────────────────── */
.shell {
  position: relative;
  z-index: 1;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 20px 48px;
}

/* ─── Glass Card Base ─────────────────────────────────── */
.glass-card {
  background: var(--surface-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: border-color 0.25s, box-shadow 0.25s;
}

.glass-card:hover {
  border-color: var(--border-hi);
  box-shadow: var(--shadow), var(--shadow-glow);
}

/* ─── Header ───────────────────────────────────────────── */
.header {
  padding: 24px 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 28px;
  animation: fadeIn 0.4s ease;
}

.header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 42px; height: 42px;
  background: var(--cyan-dim);
  border: 1px solid var(--border-hi);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.brand-icon svg { width: 22px; height: 22px; }

.brand-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-bright);
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.brand-sub {
  font-size: 0.72rem;
  color: var(--cyan);
  font-family: var(--font-mono);
  letter-spacing: 0.08em;
  margin-top: 2px;
}

.header-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(16,185,129,0.1);
  border: 1px solid rgba(16,185,129,0.3);
  color: var(--green);
  font-size: 0.7rem;
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: 0.12em;
  padding: 4px 12px;
  border-radius: 20px;
}

.live-dot {
  width: 6px; height: 6px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse-dot 2s infinite;
}

.meta-date {
  font-size: 0.82rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

.meta-time {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

/* ─── Section Label ────────────────────────────────────── */
.section-label {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--cyan);
  text-transform: uppercase;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.section-wrap {
  margin-bottom: 36px;
}

/* ─── Insights Section ─────────────────────────────────── */
.insights-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}

.insight-card {
  padding: 18px;
  position: relative;
  overflow: hidden;
}

.insight-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
}

.insight-card.type-warning::before { background: linear-gradient(90deg, var(--amber), transparent); }
.insight-card.type-opportunity::before { background: linear-gradient(90deg, var(--green), transparent); }
.insight-card.type-risk::before { background: linear-gradient(90deg, var(--red), transparent); }
.insight-card.type-info::before { background: linear-gradient(90deg, var(--cyan), transparent); }

.insight-icon {
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 10px;
  font-size: 1.1rem;
}

.insight-icon.warning { background: var(--amber-dim); }
.insight-icon.opportunity { background: var(--green-dim); }
.insight-icon.risk { background: var(--red-dim); }
.insight-icon.info { background: var(--cyan-dim); }

.insight-title {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 6px;
  line-height: 1.3;
}

.insight-desc {
  font-size: 0.78rem;
  color: var(--text);
  line-height: 1.5;
}

/* ─── AI Commentary Section ───────────────────────────────── */
.commentary-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

.commentary-overview {
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.commentary-overview::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--cyan), transparent);
}

.commentary-overview-text {
  font-size: 0.82rem;
  color: var(--text);
  line-height: 1.7;
}

.commentary-subsection {
  margin-top: 8px;
}

.commentary-subsection-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--cyan);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.commentary-subsection-title .icon {
  font-size: 1rem;
}

.sector-picks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
}

.sector-pick-card {
  padding: 16px;
  position: relative;
  overflow: hidden;
}

.sector-pick-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
}

.sector-pick-card.signal-positive::before { background: linear-gradient(90deg, var(--green), transparent); }
.sector-pick-card.signal-negative::before { background: linear-gradient(90deg, var(--red), transparent); }
.sector-pick-card.signal-neutral::before  { background: linear-gradient(90deg, var(--amber), transparent); }

.sector-pick-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.sector-pick-name {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-bright);
}

.signal-badge {
  font-size: 0.65rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.02em;
}

.signal-badge.positive { background: var(--green-dim); color: var(--green); }
.signal-badge.negative { background: var(--red-dim); color: var(--red); }
.signal-badge.neutral  { background: var(--amber-dim); color: var(--amber); }

.sector-pick-comment {
  font-size: 0.75rem;
  color: var(--text);
  line-height: 1.6;
  margin-bottom: 6px;
}

.sector-pick-tops {
  font-size: 0.7rem;
  color: var(--cyan);
}

.risk-list, .action-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.risk-item, .action-item {
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
}

.risk-item::before, .action-item::before {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 3px;
}

.risk-item.severity-high::before   { background: var(--red); }
.risk-item.severity-medium::before { background: var(--amber); }

.action-item.priority-high::before   { background: var(--red); }
.action-item.priority-medium::before { background: var(--amber); }
.action-item.priority-low::before    { background: var(--green); }

.risk-header, .action-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.severity-badge, .priority-badge {
  font-size: 0.62rem;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 20px;
  letter-spacing: 0.02em;
}

.severity-badge.high, .priority-badge.high     { background: var(--red-dim); color: var(--red); }
.severity-badge.medium, .priority-badge.medium { background: var(--amber-dim); color: var(--amber); }
.priority-badge.low                             { background: var(--green-dim); color: var(--green); }

.risk-type {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-bright);
}

.risk-desc, .action-detail {
  font-size: 0.75rem;
  color: var(--text);
  line-height: 1.6;
}

.action-title {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text-bright);
}

/* ─── Macro Cards ──────────────────────────────────────── */
.macro-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 14px;
}

.macro-card {
  padding: 18px;
  position: relative;
  overflow: hidden;
}

.macro-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--cyan), transparent);
  opacity: 0.6;
}

.macro-icon {
  width: 34px; height: 34px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
  font-size: 1rem;
}

.macro-icon.cycle { background: var(--cyan-dim); }
.macro-icon.rate  { background: var(--green-dim); }
.macro-icon.infl  { background: var(--amber-dim); }

.macro-label {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  letter-spacing: 0.08em;
  margin-bottom: 4px;
  text-transform: uppercase;
}

.macro-value {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-bright);
  letter-spacing: -0.01em;
  line-height: 1.2;
}

.macro-sub {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: 3px;
  font-family: var(--font-mono);
}

/* Macro Detail Panel */
.macro-detail-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px;
  cursor: pointer;
  font-size: 0.72rem;
  font-family: var(--font-mono);
  color: var(--cyan);
  letter-spacing: 0.06em;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: transparent;
  width: 100%;
  transition: background 0.2s, border-color 0.2s;
}

.macro-detail-toggle:hover {
  background: var(--cyan-dim);
  border-color: var(--border-hi);
}

.macro-detail-toggle .toggle-arrow {
  transition: transform 0.3s;
  font-size: 0.65rem;
}

.macro-detail-toggle.is-open .toggle-arrow {
  transform: rotate(180deg);
}

.macro-detail-panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s ease-out, opacity 0.3s ease;
  opacity: 0;
}

.macro-detail-panel.is-open {
  max-height: none;
  overflow: visible;
  opacity: 1;
}

.macro-detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  padding: 16px 0 4px;
}

.macro-detail-item {
  padding: 14px;
}

.macro-detail-item .md-label {
  font-size: 0.68rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.macro-detail-item .md-value {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-bright);
  font-family: var(--font-mono);
}

.macro-detail-item .md-sub {
  font-size: 0.68rem;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ─── Geopolitical Risk Section ────────────────────────── */
.geo-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.geo-gauge-card {
  padding: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.gauge-label {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.gauge-wrap {
  width: 100%;
  max-width: 300px;
  position: relative;
}

.gauge-track {
  width: 100%;
  height: 18px;
  border-radius: 9px;
  background: rgba(255,255,255,0.06);
  overflow: hidden;
  position: relative;
}

.gauge-track::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg,
    #10b981 0%, #10b981 30%,
    #f59e0b 30%, #f59e0b 50%,
    #f97316 50%, #f97316 70%,
    #ef4444 70%, #ef4444 100%);
  opacity: 0.25;
  border-radius: 9px;
}

.gauge-fill {
  height: 100%;
  border-radius: 9px;
  position: relative;
  z-index: 1;
  animation: gaugeGrow 1s ease-out forwards;
  transition: width 0.6s ease;
}

.gauge-needle {
  position: absolute;
  top: -6px;
  width: 4px;
  height: 30px;
  background: var(--text-bright);
  border-radius: 2px;
  z-index: 2;
  box-shadow: 0 0 8px rgba(255,255,255,0.5);
  transform: translateX(-50%);
  transition: left 0.6s ease;
}

.gauge-score {
  font-size: 2rem;
  font-weight: 800;
  font-family: var(--font-mono);
  margin-top: 14px;
  letter-spacing: -0.02em;
}

.gauge-score-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
  margin-top: 2px;
}

.gauge-scale {
  display: flex;
  justify-content: space-between;
  width: 100%;
  max-width: 300px;
  margin-top: 6px;
  font-size: 0.6rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
}

.geo-details-card {
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.geo-categories {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.geo-cat-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.geo-cat-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.geo-cat-name {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text);
}

.geo-cat-score {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  color: var(--text-bright);
  font-weight: 600;
}

.geo-cat-bar {
  height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.06);
  overflow: hidden;
}

.geo-cat-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.8s ease;
}

/* Safe haven mini-cards */
.safe-haven-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
}

.safe-haven-item {
  padding: 10px;
  text-align: center;
}

.sh-name {
  font-size: 0.68rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  letter-spacing: 0.04em;
  margin-bottom: 3px;
}

.sh-price {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text-bright);
  font-family: var(--font-mono);
}

.sh-change {
  font-size: 0.68rem;
  font-family: var(--font-mono);
  font-weight: 600;
}

.sh-change.pos { color: var(--green); }
.sh-change.neg { color: var(--red); }

/* Geo news */
.geo-news {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.geo-news-item {
  font-size: 0.75rem;
  color: var(--text);
  padding: 6px 10px;
  background: rgba(255,255,255,0.02);
  border-radius: var(--radius-sm);
  border-left: 2px solid var(--amber);
  line-height: 1.4;
}

/* ─── Sector Cards ─────────────────────────────────────── */
.sectors-section { display: flex; flex-direction: column; gap: 14px; }

.sector-card {
  border-radius: var(--radius);
  overflow: hidden;
}

.sector-header {
  padding: 14px 18px;
  background: var(--surface-hi);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  transition: background 0.2s;
}

.sector-header:hover {
  background: rgba(22, 32, 50, 0.9);
}

.sector-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--cyan);
  flex-shrink: 0;
}

.sector-name {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-bright);
  letter-spacing: -0.01em;
}

.sector-sentiment-badge {
  font-size: 0.68rem;
  font-family: var(--font-mono);
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 3px;
  margin-left: 8px;
}

.sector-count {
  margin-left: auto;
  font-size: 0.72rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  background: rgba(255,255,255,0.05);
  padding: 3px 10px;
  border-radius: 20px;
}

.sector-toggle {
  color: var(--text-muted);
  font-size: 0.65rem;
  transition: transform 0.3s;
  margin-left: 8px;
}

.sector-header.is-open .sector-toggle {
  transform: rotate(180deg);
}

.sector-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}

.sector-body.is-open {
  max-height: 2000px;
}

/* ─── Stock Table ──────────────────────────────────────── */
.stock-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.stock-table thead th {
  font-size: 0.65rem;
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.25);
  white-space: nowrap;
  text-align: left;
  overflow: hidden;
}

.stock-table .col-name   { width: 22%; }
.stock-table .col-regime { width: 10%; text-align: center; }
.stock-table .col-sent   { width: 14%; }
.stock-table .col-price  { width: 14%; text-align: right; }
.stock-table .col-mcap   { width: 13%; text-align: right; }
.stock-table .col-per    { width: 12%; text-align: right; }
.stock-table .col-roe    { width: 10%; text-align: right; }
.stock-table .col-arrow  { width: 5%; text-align: center; }

.stock-row {
  cursor: pointer;
  transition: background 0.12s;
}

.stock-row:hover { background: rgba(6,182,212,0.05); }
.stock-row.is-open { background: rgba(6,182,212,0.07); }
.stock-row:nth-child(4n+1) { background: var(--row-even); }
.stock-row:nth-child(4n+1):hover { background: rgba(6,182,212,0.05); }

.stock-row td {
  padding: 12px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
  vertical-align: middle;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stock-name {
  font-weight: 600;
  color: var(--text-bright);
  line-height: 1.3;
}

.stock-ticker {
  font-size: 0.65rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  margin-left: 6px;
}

/* Regime badges */
.regime {
  display: inline-block;
  font-size: 0.68rem;
  font-family: var(--font-mono);
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 3px;
  white-space: nowrap;
  line-height: 1.4;
}

.regime-up-strong   { background: rgba(16,185,129,0.2);  color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
.regime-up          { background: rgba(16,185,129,0.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.2); }
.regime-up-weak     { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }
.regime-sideways    { background: rgba(245,158,11,0.1);  color: #fcd34d; border: 1px solid rgba(245,158,11,0.2); }
.regime-down-weak   { background: rgba(249,115,22,0.15); color: #fb923c; border: 1px solid rgba(249,115,22,0.25); }
.regime-down        { background: rgba(239,68,68,0.15);  color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
.regime-down-strong { background: rgba(239,68,68,0.22);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.35); }
.regime-unknown     { background: rgba(100,116,139,0.15); color: #94a3b8; border: 1px solid rgba(100,116,139,0.2); }

/* Sentiment */
.sent-label {
  font-size: 0.78rem;
  font-weight: 600;
}

.sent-score {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  font-weight: 500;
  margin-left: 4px;
}

.col-pos  { color: var(--green); }
.col-neg  { color: var(--red); }
.col-neut { color: var(--text-muted); }

/* Numeric cells */
.num {
  font-family: var(--font-mono);
  text-align: right;
  color: var(--text-bright);
}

.num-muted {
  font-family: var(--font-mono);
  text-align: right;
  color: var(--text);
}

/* Expand arrow */
.arrow-cell {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.65rem;
  transition: transform 0.2s;
}

.stock-row.is-open .arrow-cell { color: var(--cyan); }

/* ─── Detail Row (expanded) ────────────────────────────── */
.detail-row { display: none; }
.detail-row.is-visible { display: table-row; }

.detail-row td {
  padding: 0;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
}

.detail-panel {
  padding: 14px 16px 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px 16px;
}

.detail-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.detail-label {
  font-size: 0.68rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.detail-value {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-bright);
  font-family: var(--font-mono);
}

/* 52w range bar */
.range-bar-wrap { grid-column: 1 / -1; margin-top: 4px; }

.range-label-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.68rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  margin-bottom: 4px;
}

.range-track {
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  position: relative;
  overflow: visible;
}

.range-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  border-radius: 2px;
}

.range-current {
  position: absolute;
  top: -3px;
  width: 10px; height: 10px;
  background: var(--text-bright);
  border-radius: 50%;
  transform: translateX(-50%);
  box-shadow: 0 0 6px rgba(255,255,255,0.4);
}

/* ─── Charts Section ──────────────────────────────────── */
.charts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 14px;
}

.chart-card {
  padding: 20px;
  min-height: 280px;
}

.chart-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.chart-title-icon {
  width: 24px; height: 24px;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem;
  background: var(--cyan-dim);
}

.chart-wrap {
  position: relative;
  width: 100%;
  max-height: 260px;
}

/* ─── Portfolio Section ───────────────────────────────── */
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
}

.portfolio-card {
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.portfolio-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}

.portfolio-card.aggressive::before { background: linear-gradient(90deg, var(--red), var(--orange)); }
.portfolio-card.balanced::before { background: linear-gradient(90deg, var(--cyan), var(--green)); }
.portfolio-card.conservative::before { background: linear-gradient(90deg, var(--green), #06b6d4); }

.portfolio-type {
  font-size: 0.68rem;
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.portfolio-card.aggressive .portfolio-type { color: var(--red); }
.portfolio-card.balanced .portfolio-type { color: var(--cyan); }
.portfolio-card.conservative .portfolio-type { color: var(--green); }

.portfolio-name {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 12px;
}

.portfolio-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}

.port-stat-label {
  font-size: 0.65rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.port-stat-value {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text-bright);
  font-family: var(--font-mono);
}

.portfolio-weights {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.weight-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.weight-name {
  font-size: 0.72rem;
  color: var(--text);
  min-width: 80px;
  flex-shrink: 0;
}

.weight-bar-track {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  overflow: hidden;
}

.weight-bar-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--cyan);
  transition: width 0.6s ease;
}

.weight-pct {
  font-size: 0.68rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  min-width: 32px;
  text-align: right;
}

/* ─── Benchmark Table ──────────────────────────────────── */
.benchmark-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 0.72rem;
}
.benchmark-table th {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 5px 6px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.benchmark-table th:first-child { text-align: left; }
.benchmark-table td {
  padding: 4px 6px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text);
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.benchmark-table td:first-child {
  text-align: left;
  color: var(--text-muted);
  font-size: 0.65rem;
}
.benchmark-table .bm-beat { color: var(--green); }
.benchmark-table .bm-lag  { color: var(--red); }
.benchmark-section-title {
  font-size: 0.62rem;
  font-family: var(--font-mono);
  color: var(--amber);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin: 12px 0 4px;
}

/* ─── Footer ───────────────────────────────────────────── */
.footer {
  margin-top: 48px;
  padding: 20px 0;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.footer-brand {
  font-size: 0.78rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

.footer-brand span { color: var(--cyan); }

.footer-time {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

/* ─── Loading / Error ──────────────────────────────────── */
.state-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  gap: 20px;
  text-align: center;
}

.spinner {
  width: 40px; height: 40px;
  border: 2px solid var(--border);
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.state-label {
  font-size: 0.82rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

.error-icon { font-size: 2.5rem; line-height: 1; }
.error-title { font-size: 1rem; font-weight: 700; color: var(--red); }
.error-msg {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
  max-width: 320px;
}

/* ─── Mobile ───────────────────────────────────────────── */
@media (max-width: 768px) {
  .shell { padding: 0 12px 32px; }

  .macro-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .macro-card { padding: 12px; }
  .macro-icon { width: 28px; height: 28px; margin-bottom: 8px; font-size: 0.85rem; }
  .macro-value { font-size: 1rem; }

  .geo-container {
    grid-template-columns: 1fr;
  }

  .insights-grid {
    grid-template-columns: 1fr;
  }

  .sector-picks-grid {
    grid-template-columns: 1fr;
  }

  .charts-grid {
    grid-template-columns: 1fr;
  }

  .portfolio-grid {
    grid-template-columns: 1fr;
  }

  .stock-table .hide-mobile { display: none; }
  .stock-table { table-layout: auto; }

  .stock-table .col-name   { width: auto; }
  .stock-table .col-regime { width: auto; }
  .stock-table .col-sent   { width: auto; }
  .stock-table .col-price  { width: auto; }

  .stock-row td { padding: 10px 8px; font-size: 0.82rem; }
  .stock-table thead th { padding: 6px 8px; font-size: 0.62rem; }

  .sector-header { padding: 12px 14px; }

  .detail-panel {
    grid-template-columns: repeat(2, 1fr);

  }

  .macro-detail-grid {
    grid-template-columns: repeat(2, 1fr);

  .safe-haven-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .header-brand { gap: 8px; }
  .brand-title { font-size: 1.05rem; }

}

@media (max-width: 480px) {
  .macro-grid {
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }

  .macro-card { padding: 10px; }
  .macro-icon { width: 24px; height: 24px; font-size: 0.75rem; margin-bottom: 6px; }
  .macro-label { font-size: 0.62rem; }
  .macro-value { font-size: 0.88rem; }
  .macro-sub { font-size: 0.68rem; }
}

<body>

<div class="shell" id="app">
  <div class="state-screen" id="loading">
    <div class="spinner"></div>
    <div class="state-label">데이터를 불러오는 중...</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ─── Utilities ───────────────────────────────────────
  const $ = s => document.querySelector(s);
  const h = s => s == null ? 'N/A' : String(s);

  function fmtPrice(v) {
    if (v == null) return 'N/A';
    if (v >= 1000) return Math.round(v).toLocaleString('ko-KR');
    if (v >= 1) return v.toLocaleString('ko-KR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    return v.toLocaleString('ko-KR', {minimumFractionDigits: 4, maximumFractionDigits: 4});
  }

  function fmtMcap(v) {
    if (v == null) return 'N/A';
    if (v >= 10000) return (v / 10000).toFixed(1) + '조';
    return Math.round(v).toLocaleString() + '억';
  }

  function fmtPct(v) {
    if (v == null) return 'N/A';
    return (v >= 0 ? '+' : '') + Number(v).toFixed(1) + '%';
  }

  function regimeClass(r) {
    if (!r) return 'regime-unknown';
    const map = {
      '강한상승': 'regime-up-strong', '상승': 'regime-up', '약한상승': 'regime-up-weak',
      '횡보': 'regime-sideways',
      '약한하락': 'regime-down-weak', '하락': 'regime-down', '강한하락': 'regime-down-strong'
    };
    return map[r] || 'regime-unknown';
  }

  function sentClass(score) {
    const n = parseFloat(score);
    if (isNaN(n)) return 'col-neut';
    return n > 0 ? 'col-pos' : n < 0 ? 'col-neg' : 'col-neut';
  }

  function riskColor(score) {
    if (score <= 30) return '#10b981';
    if (score <= 50) return '#f59e0b';
    if (score <= 70) return '#f97316';
    return '#ef4444';
  }

  function riskGradient(score) {
    if (score <= 30) return 'linear-gradient(90deg, #10b981, #34d399)';
    if (score <= 50) return 'linear-gradient(90deg, #10b981, #f59e0b)';
    if (score <= 70) return 'linear-gradient(90deg, #10b981, #f59e0b, #f97316)';
    return 'linear-gradient(90deg, #10b981, #f59e0b, #f97316, #ef4444)';
  }

  function riskLabel(score) {
    if (score <= 30) return '안정';
    if (score <= 50) return '경계';
    if (score <= 70) return '위험';
    return '심각';
  }

  // ─── Compute sector averages ─────────────────────────
  function sectorAvgSentiment(stocks) {
    let sum = 0, cnt = 0;
    stocks.forEach(s => {
      const v = parseFloat(s.sentiment_score);
      if (!isNaN(v)) { sum += v; cnt++; }
    });
    return cnt ? sum / cnt : 0;
  }

  function countRegimes(sectors) {
    const counts = {};
    sectors.forEach(sec => {
      sec.stocks.forEach(s => {
        const r = s.regime || '기타';
        counts[r] = (counts[r] || 0) + 1;
      });
    });
    return counts;
  }

  // ─── Render ──────────────────────────────────────────
  // ─── 상대 시간 계산 (예: "9분 전")
  function relativeTime(generatedAt) {
    if (!generatedAt) return '';
    try {
      // "2026-05-14 00:31:27" → Date 객체 (로컬 KST로 해석)
      const dt = new Date(generatedAt.replace(' ', 'T') + '+09:00');
      const diffMs = Date.now() - dt.getTime();
      const diffMin = Math.floor(diffMs / 60000);
      if (diffMin < 1) return '방금 전';
      if (diffMin < 60) return `${diffMin}분 전`;
      const diffHour = Math.floor(diffMin / 60);
      if (diffHour < 24) return `${diffHour}시간 전`;
      const diffDay = Math.floor(diffHour / 24);
      return `${diffDay}일 전`;
    } catch (e) {
      return '';
    }
  }

  // ─── 현재 시각 (실시간 갱신)
  function nowKST() {
    const d = new Date();
    // KST 변환 (UTC+9)
    const kst = new Date(d.getTime() + (9 * 60 + d.getTimezoneOffset()) * 60000);
    const h = String(kst.getHours()).padStart(2, '0');
    const m = String(kst.getMinutes()).padStart(2, '0');
    const s = String(kst.getSeconds()).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  function render(data) {
    const app = $('#app');
    const dateParts = (data.date || '').split('-');
    const dateStr = dateParts.length === 3 ? `${dateParts[0]}년 ${parseInt(dateParts[1])}월 ${parseInt(dateParts[2])}일` : data.date;
    const timeStr = data.generated_at ? data.generated_at.split(' ')[1] || '' : '';
    const relStr = relativeTime(data.generated_at);

    let html = '';

    // ─── HEADER ────────────────────────────────────────
    html += `
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="2,18 7,10 12,14 17,6 22,10"/>
              <circle cx="22" cy="10" r="1.5" fill="#10b981" stroke="none"/>
            </svg>
          </div>
          <div>
            <div class="brand-title">AI 금융 분석 대시보드</div>
            <div class="brand-sub">MARKET INTELLIGENCE</div>
          </div>
        </div>
        <div class="header-meta">
          <span class="live-badge"><span class="live-dot"></span>LIVE</span>
          <span class="meta-date">${dateStr}</span>
          ${timeStr ? `<span class="meta-time" title="데이터 생성 시각">생성: ${timeStr}${relStr ? ` (${relStr})` : ''}</span>` : ''}
          <span class="meta-time" id="now-clock" title="현재 시각 (KST)" style="color:var(--cyan);">현재: <span id="now-time">${nowKST()}</span> KST</span>
        </div>
      </div>
    </header>`;

    // ─── AI INSIGHTS ───────────────────────────────────
    const ins = data.insights;
    if (ins && (ins.market_assessment || (ins.top_insights && ins.top_insights.length) || (ins.best_opportunities && ins.best_opportunities.length))) {
      html += `<section class="section-wrap"><div class="section-label">AI 인사이트</div><div class="insights-grid">`;

      // Market assessment
      if (ins.market_assessment) {
        html += `<div class="insight-card glass-card type-info anim-item">
          <div class="insight-icon info">&#128200;</div>
          <div class="insight-title">시장 종합 평가</div>
          <div class="insight-desc">${ins.market_assessment}</div>
        </div>`;
      }

      // Top insights
      if (ins.top_insights && ins.top_insights.length > 0) {
        ins.top_insights.forEach(tip => {
          html += `<div class="insight-card glass-card type-opportunity anim-item">
            <div class="insight-icon opportunity">&#9733;</div>
            <div class="insight-title">핵심 포인트</div>
            <div class="insight-desc">${tip}</div>
          </div>`;
        });
      }

      // Key risks
      if (ins.key_risks && ins.key_risks.length > 0) {
        ins.key_risks.forEach(risk => {
          html += `<div class="insight-card glass-card type-warning anim-item">
            <div class="insight-icon warning">&#9888;</div>
            <div class="insight-title">주의 사항</div>
            <div class="insight-desc">${risk}</div>
          </div>`;
        });
      }

      // Best opportunities
      if (ins.best_opportunities && ins.best_opportunities.length > 0) {
        ins.best_opportunities.slice(0, 3).forEach(opp => {
          html += `<div class="insight-card glass-card type-opportunity anim-item">

        html += `<div class="commentary-overview glass-card anim-item" style="border-left:4px solid ${regimeBorder};">

          <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;align-items:baseline;">
            <div style="font-size:1.3rem;font-weight:700;color:${regimeColor};">${mr.regime}</div>
            ${mr.real_rate !== null && mr.real_rate !== undefined ? `<div style="font-size:0.9rem;color:var(--text);">실질금리 <b style="color:${regimeColor};">${mr.real_rate > 0 ? '+' : ''}${mr.real_rate.toFixed(2)}%</b></div>` : ''}

          <div class="commentary-overview-text" style="margin-bottom:10px;">${mr.description || ''}</div>
          ${mr.beneficiaries && mr.beneficiaries.length ? `<div style="margin-top:8px;font-size:0.8rem;"><b style="color:var(--green,#4ade80);">수혜:</b> <span style="color:var(--text);">${mr.beneficiaries.join(', ')}</span></div>` : ''}

      if (ac.sector_picks && ac.sector_picks.length > 0) {

          <div class="sector-picks-grid">`;
        ac.sector_picks.forEach(sp => {
          const sigClass = sp.signal === '긍정' ? 'positive' : sp.signal === '부정' ? 'negative' : 'neutral';

            <div class="sector-pick-header">

        html += `</div></div>`;

      // Risk assessment
      if (ac.risk_assessment && ac.risk_assessment.length > 0) {
        html += `<div class="commentary-subsection">
          <div class="commentary-subsection-title"><span class="icon">&#9888;</span> 리스크 평가</div>
          <div class="risk-list">`;
        ac.risk_assessment.forEach(r => {

        ac.action_items.forEach(a => {

        html += `</div></div>`;
      }

      html += `</div></section>`;

    // ─── MACRO ─────────────────────────────────────────
    const m = data.macro || {};
    html += `
    <section class="section-wrap">

      <div class="macro-grid">
        <div class="macro-card glass-card anim-item">

          <div class="macro-icon rate">&#9650;</div>
          <div class="macro-label">금리 방향</div>

        <div class="macro-card glass-card anim-item">
          <div class="macro-icon infl">&#9670;</div>
          <div class="macro-label">인플레이션</div>
          <div class="macro-value">${h(m.cpi || m.inflation)}</div>

        </div>

    // Macro Detail (expandable)
    if (data.macro_detail) {
      const md = data.macro_detail;
      html += `

      const gdpD = md.gdp || {};
      const vixD = md.vix || {};
      const ycD = md.yield_curve || {};
      const t10 = md.treasury_10y || {};
      const t2 = md.treasury_2y || {};
      const dolD = md.dollar_index || {};
      const rcD = md.rate_cycle || {};
      const ecD = md.economic_cycle || {};

      const safeFixed = (v, d) => { const n = parseFloat(v); return isNaN(n) ? String(v || 'N/A') : n.toFixed(d); };
      const detailItems = [
        { label: '기준금리(FFR)', value: ffrD.current, trend: ffrD.trend, fmt: v => safeFixed(v, 2) + '%' },
        { label: '실업률', value: unempD.current, trend: unempD.trend, fmt: v => safeFixed(v, 1) + '%' },
        { label: '실질GDP', value: gdpD.current, trend: gdpD.trend, fmt: v => safeFixed(v, 1) },
        { label: 'VIX', value: vixD.current, trend: vixD.trend, fmt: v => safeFixed(v, 1) },
        { label: '10Y-2Y 스프레드', value: ycD.spread_10y2y, trend: ycD.trend, fmt: v => safeFixed(v, 2) + '%' },
        { label: '10년국채', value: t10.current, trend: t10.trend, fmt: v => safeFixed(v, 2) + '%' },
        { label: '2년국채', value: t2.current, trend: t2.trend, fmt: v => safeFixed(v, 2) + '%' },
        { label: '달러인덱스', value: dolD.current, trend: dolD.trend, fmt: v => safeFixed(v, 1) },
        { label: 'CPI (YoY)', value: md.cpi_yoy, fmt: v => typeof v === 'string' ? v : safeFixed(v, 2) + '%' },
        { label: '기대인플레(10Y)', value: md.breakeven_inflation_10y, fmt: v => safeFixed(v, 2) + '%' },

        html += `</div>`;

      if (md.fomc && md.fomc.next_meeting) {

        const dday = fomc.days_until != null ? ` (D-${fomc.days_until})` : '';
        const rateRange = (fomc.target_lower != null && fomc.target_upper != null) ? `${fomc.target_lower.toFixed(2)}% ~ ${fomc.target_upper.toFixed(2)}%` : 'N/A';

        html += `<div style="font-size:0.78rem;color:var(--text);margin-bottom:3px;">&#8226; 다음 회의: <b>${h(fomc.next_meeting)}</b>${dday}</div>`;

    html += `</section>`;

    // ─── OVERSEAS MARKET ───────────────────────────────
    const om = data.overseas_market;
    if (om && om.markets) {
      const isClosed = om.kospi_closed;
      const activeMarket = om.active_market || '';
      const kospiPred = om.kospi_open_prediction || '';
      const alertCount = om.alert_count || 0;
      const updateBadge = isClosed ? 'KOSPI 휴장 중' : 'KOSPI 운영 중';
      const updateColor = isClosed ? 'var(--amber,#fbbf24)' : 'var(--green,#4ade80)';

      html += `<section class="section-wrap">
        <div class="section-label">&#127760; 해외 시장 동향 <span style="font-size:0.65rem;color:var(--text-muted);">(KOSPI 시간외 모니터링)</span></div>

        <div class="glass-card anim-item" style="padding:14px;margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;">
            <div>
              <div style="font-size:0.7rem;color:var(--text-muted);font-family:var(--font-mono);">ACTIVE MARKET</div>
              <div style="font-size:1.0rem;font-weight:600;color:${updateColor};">${h(activeMarket)}</div>
            </div>
            ${kospiPred && isClosed ? `<div>
              <div style="font-size:0.7rem;color:var(--text-muted);font-family:var(--font-mono);">KOSPI 시초가 예상</div>
              <div style="font-size:1.0rem;font-weight:600;color:var(--cyan);">${h(kospiPred)}</div>
            </div>` : ''}
            ${alertCount > 0 ? `<div>
              <div style="font-size:0.7rem;color:var(--red,#f87171);font-family:var(--font-mono);">ALERTS</div>
              <div style="font-size:1.0rem;font-weight:600;color:var(--red,#f87171);">&#128680; ${alertCount}건</div>
            </div>` : ''}
            <div>
              <div style="font-size:0.7rem;color:var(--text-muted);font-family:var(--font-mono);">UPDATED</div>
              <div style="font-size:0.85rem;color:var(--text);">${h(om.generated_at || '')}</div>
            </div>
          </div>
        </div>`;

      // 카테고리별 시장
      const catLabels = {
        "미국_지수": "🇺🇸 미국 지수",
        "미국_선물": "🇺🇸 미국 선물 (24H)",
        "아시아": "🌏 아시아",
        "유럽": "🇪🇺 유럽",
        "통화_금리": "💱 통화/금리"
      };

      html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;">`;

      Object.entries(om.markets).forEach(([cat, items]) => {
        if (!items || items.length === 0) return;
        html += `<div class="glass-card anim-item" style="padding:14px;">
          <div style="font-size:0.75rem;color:var(--cyan);font-family:var(--font-mono);font-weight:600;letter-spacing:0.05em;margin-bottom:10px;">
            ${h(catLabels[cat] || cat)}
          </div>`;

        items.forEach(m => {
          const change = m.change_pct || 0;
          const arrow = change > 0 ? '▲' : change < 0 ? '▼' : '→';
          const color = change > 0 ? 'var(--green,#4ade80)' : change < 0 ? 'var(--red,#f87171)' : 'var(--text)';
          const isVix = m.is_vix;
          const vixColor = isVix && m.current > 25 ? 'var(--red)' : isVix && m.current > 20 ? 'var(--amber)' : 'var(--text-bright)';

          html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
            <div style="font-size:0.8rem;color:var(--text);">
              ${m.region} ${h(m.name)}
            </div>
            <div style="text-align:right;">
              <div style="font-size:0.85rem;font-weight:600;color:${isVix ? vixColor : 'var(--text-bright)'};">${m.current != null ? m.current.toLocaleString() : 'N/A'}</div>
              <div style="font-size:0.7rem;color:${color};">${arrow} ${change != null ? (change >= 0 ? '+' : '') + change.toFixed(2) + '%' : 'N/A'}</div>
            </div>
          </div>`;
        });

        html += `</div>`;
      });

      html += `</div>`;

      // 알림 메시지
      if (om.alerts && om.alerts.length > 0) {
        html += `<div style="margin-top:14px;background:rgba(239,68,68,0.05);border-left:3px solid var(--red,#f87171);padding:10px 14px;border-radius:4px;">
          <div style="font-size:0.75rem;color:var(--red,#f87171);font-family:var(--font-mono);font-weight:600;margin-bottom:6px;">&#128680; ACTIVE ALERTS</div>`;
        om.alerts.forEach(alert => {
          html += `<div style="font-size:0.85rem;color:var(--text);margin:3px 0;">${h(alert.message)}</div>`;
        });
        html += `</div>`;
      }

      html += `</section>`;
    }

    // ─── EARNINGS REVIEWER (분기 실적) ─────────────────
    const er = data.earnings_reviews;
    if (er && er.reviews && er.reviews.length > 0) {
      html += `<section class="section-wrap">
        <div class="section-label" style="color:var(--cyan);">&#128202; 분기 실적 리뷰 <span style="font-size:0.65rem;color:var(--text-muted);">(${h(er.period_label || '')})</span></div>

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;">`;

      const fmtAmount = (amt) => {
        if (amt == null) return 'N/A';
        const a = Math.abs(amt);
        if (a >= 1e12) return (amt / 1e12).toFixed(2) + '조';
        if (a >= 1e8) return (amt / 1e8).toFixed(0) + '억';
        return amt.toLocaleString('ko-KR') + '원';
      };

      er.reviews.forEach(r => {
        const ratingColor = r.score >= 75 ? 'var(--green,#4ade80)' :
                           r.score >= 60 ? 'var(--green,#4ade80)' :
                           r.score >= 45 ? 'var(--amber,#fbbf24)' :
                           r.score >= 30 ? 'var(--red,#f87171)' :
                           'var(--red,#f87171)';
        const yoyColor = (v) => v == null ? 'var(--text-muted)' : v > 10 ? 'var(--green)' : v > 0 ? 'var(--cyan)' : v < -10 ? 'var(--red)' : 'var(--amber)';

        html += `<div class="glass-card anim-item" style="padding:14px;border-left:3px solid ${ratingColor};">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
            <div>
              <span style="font-size:1.0rem;font-weight:700;color:var(--text-bright);">${h(r.name)}</span>
              <span style="font-size:0.7rem;color:var(--text-muted);margin-left:6px;font-family:var(--font-mono);">${r.stock_code}</span>
            </div>
            <div style="font-size:1.2rem;font-weight:700;color:${ratingColor};">${r.score}</div>
          </div>
          <div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:8px;">${h(r.fs_div || 'N/A')} · ${h(r.rating || '')}</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:0.75rem;margin-bottom:8px;">
            <div>
              <div style="color:var(--text-muted);font-size:0.7rem;">매출</div>
              <div style="color:var(--text-bright);font-weight:600;">${fmtAmount(r.revenue_current)}</div>
              <div style="color:${yoyColor(r.revenue_yoy_pct)};">YoY ${r.revenue_yoy_pct >= 0 ? '+' : ''}${r.revenue_yoy_pct ? r.revenue_yoy_pct.toFixed(1) : 'N/A'}%</div>
            </div>
            <div>
              <div style="color:var(--text-muted);font-size:0.7rem;">영업이익</div>
              <div style="color:var(--text-bright);font-weight:600;">${fmtAmount(r.operating_profit_current)}</div>
              <div style="color:${yoyColor(r.operating_profit_yoy_pct)};">YoY ${r.operating_profit_yoy_pct >= 0 ? '+' : ''}${r.operating_profit_yoy_pct ? r.operating_profit_yoy_pct.toFixed(1) : 'N/A'}%</div>
            </div>
            <div>

                        jc.carry_pressure?.severity === 'amber' ? 'var(--amber,#fbbf24)' :

          const src = typeof n === 'object' ? (n.source || '') : '';

              <tr style="border-top:1px solid rgba(255,255,255,0.05);">
                <td style="padding:8px;color:var(--cyan);font-weight:600;">진화 후 가중치</td>
                <td style="padding:8px;text-align:right;color:var(--green,#4ade80);font-weight:700;">${evolvedSortinoIn.toFixed(3)}</td>
                <td style="padding:8px;text-align:right;color:${validation ? 'var(--green,#4ade80)' : 'var(--amber,#fbbf24)'};font-weight:600;">${evolvedSortinoOut.toFixed(3)}</td>
              </tr>
            </tbody>
          </table>

          <div style="background:rgba(6,182,212,0.05);padding:10px;border-radius:6px;font-size:0.85rem;margin-bottom:12px;">
            <span style="color:var(--text-muted);">개선율:</span>
            <b style="color:${improvement > 0 ? 'var(--green,#4ade80)' : 'var(--red,#f87171)'};margin-left:8px;">${improvement > 0 ? '+' : ''}${improvement.toFixed(1)}%</b>
          </div>

          <div style="margin-top:14px;">
            <div style="font-size:0.7rem;color:var(--text-muted);font-family:var(--font-mono);margin-bottom:6px;">EVOLVED WEIGHTS</div>
            ${Object.entries(ar.evolved_weights || {}).map(([asset, w]) => `
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                <span style="min-width:100px;font-size:0.8rem;color:var(--text);">${h(asset)}</span>
                <div style="flex:1;height:14px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;">
                  <div style="width:${(w*100).toFixed(1)}%;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));"></div>
                </div>
                <span style="min-width:50px;text-align:right;font-size:0.8rem;color:var(--text-bright);">${(w*100).toFixed(1)}%</span>
              </div>
            `).join('')}
          </div>

          <div style="margin-top:14px;font-size:0.7rem;color:var(--text-muted);font-family:var(--font-mono);">
            생성: ${h(ar.generated_at || '')} · 소요 ${ar.elapsed_sec || 0}초 · 과적합 거부 ${ar.rejected_overfit || 0}회
          </div>
        </div>
      </section>`;
    }

    // ─── FOOTER ────────────────────────────────────────
    html += `
    <footer class="footer">
      <div class="footer-brand"><span>AI</span> Finance Dashboard</div>
      <div class="footer-time">최종 업데이트: ${data.generated_at || data.date || ''}</div>
    </footer>`;

    app.innerHTML = html;

    // ─── Render Charts ─────────────────────────────────
    setTimeout(() => renderCharts(data), 100);

    // ─── 🕸️ Render Knowledge Graph (Palantir 스타일) ────
    setTimeout(() => renderKnowledgeGraph(data), 200);

    // ─── 현재 시각 실시간 갱신 (1초마다)
    if (window.__nowClockInterval) clearInterval(window.__nowClockInterval);
    window.__nowClockInterval = setInterval(() => {
      const el = document.getElementById('now-time');
      if (el) el.textContent = nowKST();
    }, 1000);
  }

  // ─── Charts ──────────────────────────────────────────
  function renderCharts(data) {
    const sectors = data.sectors || [];

    // Chart defaults
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = 'rgba(6,182,212,0.1)';
    Chart.defaults.font.family = "-apple-system, 'Noto Sans KR', 'Malgun Gothic', sans-serif";

    // 1. Sector Sentiment Bar Chart (horizontal)
    const sentCtx = document.getElementById('chartSentiment');
    if (sentCtx) {
      const labels = sectors.map(s => s.name);
      const values = sectors.map(s => {
        let sum = 0, cnt = 0;
        s.stocks.forEach(st => {
          const v = parseFloat(st.sentiment_score);
          if (!isNaN(v)) { sum += v; cnt++; }
        });
        return cnt ? +(sum / cnt).toFixed(1) : 0;
      });
      const colors = values.map(v => v >= 0 ? 'rgba(16,185,129,0.7)' : 'rgba(239,68,68,0.7)');
      const borderColors = values.map(v => v >= 0 ? '#10b981' : '#ef4444');

      new Chart(sentCtx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            data: values,
            backgroundColor: colors,
            borderColor: borderColors,
            borderWidth: 1,
            borderRadius: 4,
            barThickness: 22
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => `센티멘트: ${ctx.parsed.x >= 0 ? '+' : ''}${ctx.parsed.x}`
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255,255,255,0.04)' },
              ticks: { font: { size: 11 } }
            },
            y: {
              grid: { display: false },
              ticks: { font: { size: 12 } }
            }
          }
        }
      });
    }

    // 2. Regime Distribution Donut Chart
    const regimeCtx = document.getElementById('chartRegime');
    if (regimeCtx) {
      const regimeCounts = countRegimes(sectors);
      const regimeLabels = Object.keys(regimeCounts);
      const regimeValues = Object.values(regimeCounts);

      const regimeColorMap = {
        '강한상승': '#34d399', '상승': '#6ee7b7', '약한상승': '#fbbf24',
        '횡보': '#fcd34d',
        '약한하락': '#fb923c', '하락': '#f87171', '강한하락': '#fca5a5'
      };
      const rColors = regimeLabels.map(r => regimeColorMap[r] || '#94a3b8');

      new Chart(regimeCtx, {
        type: 'doughnut',
        data: {
          labels: regimeLabels,
          datasets: [{
            data: regimeValues,
            backgroundColor: rColors.map(c => c + 'bb'),
            borderColor: rColors,
            borderWidth: 1,
            hoverOffset: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '55%',
          plugins: {
            legend: {
              position: 'right',
              labels: {
                boxWidth: 12,
                padding: 10,
                font: { size: 11 },
                usePointStyle: true,
                pointStyleWidth: 8
              }
            },
            tooltip: {
              callbacks: {
                label: ctx => `${ctx.label}: ${ctx.parsed}개 종목`
              }
            }
          }
        }
      });
    }

    // 3. Portfolio Sharpe Ratio (if portfolios exist)
    if (data.portfolios && data.portfolios.sectors) {
      const sharpeCtx = document.getElementById('chartSharpe');
      if (sharpeCtx) {
        const pfLabels = data.portfolios.sectors.map(s => s.name);
        const pfValues = data.portfolios.sectors.map(s => s.sharpe_ratio || 0);
        const pfColors = pfValues.map(v => v > 1 ? 'rgba(16,185,129,0.7)' : v > 0 ? 'rgba(6,182,212,0.7)' : 'rgba(239,68,68,0.7)');
        const pfBorders = pfValues.map(v => v > 1 ? '#10b981' : v > 0 ? '#06b6d4' : '#ef4444');

        new Chart(sharpeCtx, {
          type: 'bar',
          data: {
            labels: pfLabels,
            datasets: [{
              data: pfValues,
              backgroundColor: pfColors,
              borderColor: pfBorders,
              borderWidth: 1,
              borderRadius: 4,
              barThickness: 40
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: ctx => `Sharpe: ${ctx.parsed.y.toFixed(2)}`
                }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: { font: { size: 12 } }
              },
              y: {
                grid: { color: 'rgba(255,255,255,0.04)' },
                ticks: { font: { size: 11 } },
                beginAtZero: true
              }
            }
          }
        });
      }
    }
  }

  // ─── 🕸️ Knowledge Graph (Palantir 스타일) ───────────────
  let __kgNetwork = null;
  let __kgNodesAll = [];
  let __kgEdgesAll = [];
  let __kgActiveTypes = new Set();

  function renderKnowledgeGraph(data) {
    const kg = data.knowledge_graph;
    const container = document.getElementById('kgNetwork');
    if (!kg || !Array.isArray(kg.nodes) || kg.nodes.length === 0 || !container) {
      return;
    }
    if (typeof vis === 'undefined') {
      const emptyEl = document.getElementById('kgEmptyMsg');
      if (emptyEl) emptyEl.textContent = 'vis.js 라이브러리 로드 실패 (네트워크 차단 가능성)';
      return;
    }

    __kgNodesAll = kg.nodes.slice();
    __kgEdgesAll = kg.edges.slice();
    __kgActiveTypes = new Set(__kgNodesAll.map(n => n.type));

    // 필터 칩 렌더
    const filterBox = document.getElementById('kgFilters');
    if (filterBox) {
      const typeCount = {};
      __kgNodesAll.forEach(n => { typeCount[n.type] = (typeCount[n.type] || 0) + 1; });
      filterBox.innerHTML = Object.entries(typeCount).map(([t, c]) => {
        const color = (__kgNodesAll.find(n => n.type === t) || {}).color || '#888';
        return `<button class="kg-filter-btn" data-type="${t}" style="padding:4px 10px;background:${color}22;border:1px solid ${color}66;color:${color};border-radius:14px;font-size:0.7rem;cursor:pointer;">${t} (${c})</button>`;
      }).join('');
      filterBox.querySelectorAll('.kg-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const t = btn.dataset.type;
          if (__kgActiveTypes.has(t)) {
            __kgActiveTypes.delete(t);
            btn.style.opacity = '0.3';
          } else {
            __kgActiveTypes.add(t);
            btn.style.opacity = '1';
          }
          renderKgNetwork();
        });
      });
    }

    // 검색
    const searchEl = document.getElementById('kgSearch');
    if (searchEl) {
      searchEl.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase().trim();
        if (!q || !__kgNetwork) return;
        const match = __kgNodesAll.find(n =>
          n.label.toLowerCase().includes(q) ||
          n.id.toLowerCase().includes(q)
        );
        if (match) {
          __kgNetwork.focus(match.id, { scale: 1.5, animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
          __kgNetwork.selectNodes([match.id]);
          renderKgDetail(match);
        }
      });
    }

    // 리셋
    const resetBtn = document.getElementById('kgReset');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        if (__kgNetwork) __kgNetwork.fit({ animation: true });
        if (searchEl) searchEl.value = '';
        document.getElementById('kgDetail').innerHTML = '<div style="color:var(--text-muted);text-align:center;margin-top:50px;line-height:1.6;">👆 노드를 클릭하면<br/>해당 객체의 모든 분석 신호가<br/>여기에 표시됩니다.</div>';
      });
    }

    renderKgNetwork();
  }

  function renderKgNetwork() {
    const container = document.getElementById('kgNetwork');
    if (!container) return;

    const filteredNodes = __kgNodesAll.filter(n => __kgActiveTypes.has(n.type));
    const filteredNodeIds = new Set(filteredNodes.map(n => n.id));
    const filteredEdges = __kgEdgesAll.filter(e => filteredNodeIds.has(e.from) && filteredNodeIds.has(e.to));

    const visNodes = filteredNodes.map(n => ({
      id: n.id,
      label: `${n.emoji || ''} ${n.label}`,
      color: { background: n.color, border: '#0a0e17', highlight: { background: '#ffffff', border: n.color } },
      font: { color: '#e2e8f0', size: 11, face: 'monospace' },
      shape: 'dot',
      size: n.type === 'Stock' ? 8 : (n.type === 'Sector' ? 14 : (n.type === 'Index' ? 12 : 10)),
      borderWidth: 1.5,
      _data: n,
    }));

    const relColor = {
      IN_SECTOR: '#a78bfa',
      CORRELATES_WITH: '#22d3ee',
      SENSITIVE_TO: '#4ade80',
      AFFECTED_BY: '#fb923c',
      MENTIONS: '#9ca3af',
      COMPETES_WITH: '#f87171',
      SUPPLIES: '#fbbf24',
    };
    const visEdges = filteredEdges.map(e => ({
      from: e.from,
      to: e.to,
      width: Math.max(0.5, Math.min(e.weight || 1, 4)),
      color: { color: (relColor[e.type] || '#666') + 'aa', highlight: relColor[e.type] || '#fff' },
      smooth: { type: 'continuous' },
      title: `${e.type}${e.data && e.data.beta ? ' β=' + e.data.beta.toFixed(2) : ''}`,
    }));

    const opts = {
      physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: { gravitationalConstant: -50, springLength: 100, springConstant: 0.08 },
        stabilization: { iterations: 200 },
      },
      interaction: { hover: true, tooltipDelay: 200, navigationButtons: false, zoomView: true, dragView: true },
      nodes: { borderWidthSelected: 3 },
    };

    if (__kgNetwork) {
      __kgNetwork.setData({ nodes: visNodes, edges: visEdges });
    } else {
      __kgNetwork = new vis.Network(container,
        { nodes: new vis.DataSet(visNodes), edges: new vis.DataSet(visEdges) },
        opts);
      __kgNetwork.on('click', (params) => {
        if (params.nodes && params.nodes.length > 0) {
          const id = params.nodes[0];
          const node = __kgNodesAll.find(n => n.id === id);
          if (node) renderKgDetail(node);
        }
      });
      __kgNetwork.on('stabilizationIterationsDone', () => {
        const emptyEl = document.getElementById('kgEmptyMsg');
        if (emptyEl) emptyEl.style.display = 'none';
      });
    }
  }

  function renderKgDetail(node) {
    const panel = document.getElementById('kgDetail');
    if (!panel) return;
    const d = node.data || {};
    const sections = [];

    // 헤더
    sections.push(`<div style="border-bottom:1px solid rgba(34,211,238,0.2);padding-bottom:8px;margin-bottom:10px;">
      <div style="font-size:0.7rem;color:${node.color};font-weight:600;">${node.emoji || ''} ${node.type}</div>
      <div style="font-size:1.1rem;font-weight:700;color:var(--text-bright);margin-top:2px;">${escapeHtml(node.label)}</div>
      <div style="font-size:0.65rem;color:var(--text-muted);font-family:var(--font-mono);">${escapeHtml(node.id)}</div>
    </div>`);

    // Stock: 모든 모듈에서 통합된 신호
    if (node.type === 'Stock') {
      if (d.market_cap_billion) {
        sections.push(kvBlock('💰 시장', [
          ['시총', d.market_cap_billion ? Math.round(d.market_cap_billion / 10000) + '조' : null],
          ['현재가', d.current_price ? d.current_price.toLocaleString() + '원' : null],
          ['시장', d.market],
          ['섹터', d.sector],
        ]));
      }
      if (d.metrics) {
        sections.push(kvBlock('📊 메트릭 (yfinance)', [
          ['PER', d.metrics.per],
          ['PBR', d.metrics.pbr],
          ['ROE %', d.metrics.roe_pct],
          ['부채비율', d.metrics.debt_to_equity],
          ['배당률 %', d.metrics.dividend_yield_pct],
          ['매출성장 %', d.metrics.revenue_growth_pct],
        ]));
      }
      if (d.irr_full || d.irr_basic) {
        const irr = d.irr_full || d.irr_basic || {};
        sections.push(kvBlock('📈 IRR 분석', [
          ['Gordon %', irr.gordon_pct || irr.gordon_irr_pct],
          ['Earnings Yield %', irr.earnings_yield_pct],
          ['ROIC-Retention %', irr.roic_retention_pct],
          ['Primary IRR %', irr.primary_irr_pct],
          ['Implied Growth %', irr.implied_growth_pct],
        ]));
      }
      if (d.required_return) {
        sections.push(kvBlock('⚖️ 필요수익률 (CAPM)', [
          ['총 요구수익률 %', d.required_return.required_return_pct],
          ['CAPM 베이스 %', d.required_return.base_capm_pct],
          ['코리아 디스카운트 %', d.required_return.korea_discount_pct],
          ['β 사용', d.required_return.beta_used],
        ]));
      }
      if (d.margin_of_safety_pct !== undefined && d.margin_of_safety_pct !== null) {
        const mos = d.margin_of_safety_pct;
        const mosColor = mos >= 5 ? '#4ade80' : (mos >= 2 ? '#22d3ee' : (mos >= 0 ? '#fbbf24' : '#f87171'));
        sections.push(`<div style="background:rgba(167,139,250,0.05);border-left:2px solid ${mosColor};padding:8px 12px;margin-bottom:10px;border-radius:3px;">
          <div style="font-size:0.7rem;color:var(--text-muted);">🎯 안전마진</div>
          <div style="font-size:1.15rem;font-weight:700;color:${mosColor};margin-top:2px;">${mos >= 0 ? '+' : ''}${mos}%pt</div>
          <div style="font-size:0.7rem;color:${mosColor};margin-top:2px;">${escapeHtml(d.rating || '')}</div>
        </div>`);
      }
      if (d.semi_v2 && d.semi_v2.betas) {
        const b = d.semi_v2.betas;
        sections.push(kvBlock('🔬 반도체 민감도 v2 (다변량)', [
          ['adj R²', d.semi_v2.adj_r_squared],
          ['β NQ (t-1)', b.nq],
          ['β SOX (t-1)', b.sox],
          ['β KOSPI', b.kospi],
          ['β USDKRW', b.usdkrw],
          ['β UST10Y', b.ust10y],
        ]));
      }
      if (d.dcf) {
        sections.push(kvBlock('💎 DCF 평가', [
          ['적정가', d.dcf.fair_price ? d.dcf.fair_price.toLocaleString() + '원' : null],
          ['업사이드 %', d.dcf.upside_pct],
          ['WACC %', d.dcf.wacc_pct],
          ['성장률 %', d.dcf.growth_rate_pct],
          ['시그널', d.dcf.signal],
        ]));
      }
      if (d.value_score !== undefined && d.value_score !== null) {
        sections.push(`<div style="background:rgba(74,222,128,0.05);padding:8px 12px;margin-bottom:10px;border-radius:3px;">
          <div style="font-size:0.7rem;color:var(--text-muted);">⭐ 가치 점수</div>
          <div style="font-size:1.1rem;font-weight:700;color:#4ade80;">${d.value_score}점</div>
        </div>`);
      }
    }
    // Sector: 평균 IRR + 멤버 종목
    else if (node.type === 'Sector') {
      sections.push(kvBlock('🏢 섹터 통계', [
        ['종목 수', d.count],
        ['평균 IRR %', d.mean_irr_pct],
        ['중앙값 IRR %', d.median_irr_pct],
      ]));
      // 이 섹터에 속한 종목 리스트
      const members = __kgEdgesAll
        .filter(e => e.to === node.id && e.type === 'IN_SECTOR')
        .map(e => __kgNodesAll.find(n => n.id === e.from))
        .filter(Boolean);
      if (members.length > 0) {
        sections.push(`<div style="margin-bottom:10px;">
          <div style="font-size:0.75rem;color:var(--text);font-weight:600;margin-bottom:4px;">📈 소속 종목 (${members.length})</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;">
            ${members.map(m => `<span style="background:rgba(34,211,238,0.1);color:#22d3ee;padding:3px 8px;border-radius:10px;font-size:0.7rem;font-family:var(--font-mono);cursor:pointer;" onclick="document.getElementById('kgSearch').value='${escapeHtml(m.label)}';document.getElementById('kgSearch').dispatchEvent(new Event('input'));">${escapeHtml(m.label)}</span>`).join('')}
          </div>
        </div>`);
      }
    }
    // Index: 상관 종목들
    else if (node.type === 'Index') {
      sections.push(kvBlock('📊 지수 정보', [
        ['Ticker', d.ticker],
        ['Key', d.key],
      ]));
      const correlated = __kgEdgesAll
        .filter(e => e.to === node.id && e.type === 'CORRELATES_WITH')
        .map(e => ({ node: __kgNodesAll.find(n => n.id === e.from), edge: e }))
        .filter(x => x.node)
        .sort((a, b) => (b.edge.weight || 0) - (a.edge.weight || 0))
        .slice(0, 20);
      if (correlated.length > 0) {
        sections.push(`<div style="margin-bottom:10px;">
          <div style="font-size:0.75rem;color:var(--text);font-weight:600;margin-bottom:4px;">↔️ 상관 종목 (β 내림차순)</div>
          ${correlated.map(c => `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:0.7rem;border-bottom:1px dashed rgba(255,255,255,0.05);">
            <span style="color:var(--text);">${escapeHtml(c.node.label)}</span>
            <span style="color:#22d3ee;font-family:var(--font-mono);">β=${(c.edge.weight || 0).toFixed(2)}</span>
          </div>`).join('')}
        </div>`);
      }
    }
    // Bill: 상태 + 관련 뉴스
    else if (node.type === 'Bill') {
      sections.push(kvBlock('🏛️ 법안 정보', [
        ['단축명', d.short_name],
        ['전체명', d.full_name],
        ['의회', d.congress + '대'],
        ['법안번호', `${d.bill_type} ${d.number}`],
        ['현 상태', d.status_label_kr],
        ['발생일', d.status_date],
        ['발의자', d.sponsor],
      ]));
      if (d.link) {
        sections.push(`<a href="${escapeHtml(d.link)}" target="_blank" rel="noopener" style="color:#22d3ee;text-decoration:none;font-size:0.75rem;">🔗 공식 페이지 →</a>`);
      }
    }
    // Currency
    else if (node.type === 'Currency') {
      sections.push(kvBlock('💱 통화', [['Ticker', d.ticker], ['Key', d.key]]));
      const sensitive = __kgEdgesAll
        .filter(e => e.to === node.id && e.type === 'SENSITIVE_TO')
        .map(e => ({ node: __kgNodesAll.find(n => n.id === e.from), edge: e }))
        .filter(x => x.node);
      if (sensitive.length > 0) {
        sections.push(`<div style="margin-bottom:10px;">
          <div style="font-size:0.75rem;color:var(--text);font-weight:600;margin-bottom:4px;">💧 환율 민감 종목</div>
          ${sensitive.map(c => `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:0.7rem;border-bottom:1px dashed rgba(255,255,255,0.05);">
            <span>${escapeHtml(c.node.label)}</span>
            <span style="color:#4ade80;font-family:var(--font-mono);">β=${(c.edge.data?.beta_usdkrw || c.edge.weight || 0).toFixed(2)}</span>
          </div>`).join('')}
        </div>`);
      }
    }
    // NewsItem
    else if (node.type === 'NewsItem') {
      sections.push(`<div style="line-height:1.5;font-size:0.8rem;color:var(--text);margin-bottom:6px;">${escapeHtml(d.title_ko || d.title || '')}</div>`);
      if (d.title_ko && d.title) {
        sections.push(`<div style="font-style:italic;color:var(--text-muted);font-size:0.7rem;margin-bottom:8px;">🇺🇸 ${escapeHtml(d.title)}</div>`);
      }
      if (d.summary_ko || d.summary) {
        sections.push(`<div style="font-size:0.7rem;color:var(--text-muted);line-height:1.5;margin-bottom:8px;">${escapeHtml((d.summary_ko || d.summary).substring(0, 300))}</div>`);
      }
      if (d.source) sections.push(`<div style="font-size:0.65rem;color:#fb923c;">출처: ${escapeHtml(d.source)}</div>`);
      if (d.link) sections.push(`<a href="${escapeHtml(d.link)}" target="_blank" rel="noopener" style="color:#22d3ee;font-size:0.7rem;">🔗 원문 →</a>`);
    }
    // 일반 객체
    else {
      sections.push(`<pre style="font-size:0.65rem;color:var(--text-muted);white-space:pre-wrap;">${escapeHtml(JSON.stringify(d, null, 2))}</pre>`);
    }

    // 연결된 노드 요약
    const incoming = __kgEdgesAll.filter(e => e.to === node.id);
    const outgoing = __kgEdgesAll.filter(e => e.from === node.id);
    if (incoming.length + outgoing.length > 0) {
      sections.push(`<div style="margin-top:10px;padding-top:8px;border-top:1px solid rgba(34,211,238,0.15);font-size:0.65rem;color:var(--text-muted);">
        🔗 연결: 들어오는 ${incoming.length} · 나가는 ${outgoing.length}
      </div>`);
    }

    panel.innerHTML = sections.join('');
  }

  function kvBlock(title, pairs) {
    const valid = pairs.filter(([k, v]) => v !== null && v !== undefined && v !== '');
    if (valid.length === 0) return '';
    return `<div style="margin-bottom:10px;">
      <div style="font-size:0.7rem;color:var(--text);font-weight:600;margin-bottom:4px;">${escapeHtml(title)}</div>
      ${valid.map(([k, v]) => `<div style="display:flex;justify-content:space-between;padding:2px 0;font-size:0.7rem;">
        <span style="color:var(--text-muted);">${escapeHtml(k)}</span>
        <span style="color:var(--text);font-family:var(--font-mono);">${escapeHtml(String(v))}</span>
      </div>`).join('')}
    </div>`;
  }

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;' }[c]));
  }

  // ─── Interactions ────────────────────────────────────
  window.toggleSector = function(header) {
    header.classList.toggle('is-open');
    const body = header.nextElementSibling;
    body.classList.toggle('is-open');
  };

  window.toggleDetail = function(row) {
    row.classList.toggle('is-open');
    const detail = row.nextElementSibling;
    if (detail && detail.classList.contains('detail-row')) {
      detail.classList.toggle('is-visible');
    }
  };

  window.toggleMacroDetail = function(btn) {
    btn.classList.toggle('is-open');
    const panel = document.getElementById('macroDetailPanel');
    if (!panel) return;
    const isOpening = btn.classList.contains('is-open');
    if (isOpening) {
      panel.style.maxHeight = panel.scrollHeight + 'px';
      panel.style.overflow = 'hidden';
      panel.classList.add('is-open');
      panel.addEventListener('transitionend', function onEnd(e) {
        if (e.propertyName !== 'max-height') return;
        panel.removeEventListener('transitionend', onEnd);
        panel.style.maxHeight = 'none';
        panel.style.overflow = 'visible';
      });
    } else {
      panel.style.maxHeight = panel.scrollHeight + 'px';
      panel.style.overflow = 'hidden';
      panel.offsetHeight; // force reflow
      panel.style.maxHeight = '0';
      panel.classList.remove('is-open');
    }
  };

  // ─── Load Data ───────────────────────────────────────
  fetch('./data.json')
    .then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    })
    .then(data => render(data))
    .catch(err => {
      $('#app').innerHTML = `
        <div class="state-screen">
          <div class="error-icon">&#9888;</div>
          <div class="error-title">데이터 로드 실패</div>
          <div class="error-msg">${err.message}</div>
        </div>`;
    });

})();
</script>
</body>
</html>
