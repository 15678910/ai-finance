name: Auto-Research Value (Daily Evolution)

on:
  schedule:
    # 매일 KST 07:00 (value_screener 06:00 직후)
    # 매일 실행으로 누락 시 자동 복구 + 시장 변화 추적
    - cron: '0 22 * * *'  # UTC 22:00 매일 = KST 07:00 다음날
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run value weight evolution
        env:
          TELEGRAM_FINANCE_BOT_TOKEN: ${{ secrets.TELEGRAM_FINANCE_BOT_TOKEN }}
          TELEGRAM_FINANCE_CHAT_ID: ${{ secrets.TELEGRAM_FINANCE_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python auto_research_value.py --time-budget 240

      - name: Commit results
        if: always()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add docs/ 2>/dev/null || true

          if git diff --cached --quiet 2>/dev/null; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update auto-research value weights [automated]"

          for i in 1 2 3 4 5; do
            if git push 2>/dev/null; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, rebasing..."
            git pull --rebase --strategy-option=theirs || git rebase --abort
            sleep $((i * 2))
          done

          echo "Failed to push after 5 attempts"
          exit 1
