        backgroundColor: INST_COLORS[k] + '20',
        borderWidth: 1.8,
        pointRadius: 2,
        pointHoverRadius: 4,
        tension: 0.25,
      }));

      const trendCtx = document.getElementById('mibTrendChart');
      if (trendCtx) {
        if (trendChart) trendChart.destroy();
        trendChart = new Chart(trendCtx, {
          type: 'line',
          data: { labels: dates, datasets: trendDatasets },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { color: '#cbd5e1', font: { size: 9 }, boxWidth: 10, padding: 6 } },
              tooltip: { mode: 'index', intersect: false },
            },
            interaction: { mode: 'index', intersect: false },
            scales: {
              x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#94a3b8', font: { size: 9 } } },
              y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 9 }, callback: (v) => v.toLocaleString() } },
            },
          },
        });
      }

      // 3) 일별 8-class 테이블
      const tableKeys = ['personal', 'foreign', 'institutional_total', 'financial_inv', 'insurance', 'trust', 'other_financial', 'bank', 'pension', 'private_fund', 'other_corp'];
      const fmt = (v) => {
        if (v === null || v === undefined || isNaN(v)) return '-';
        const sign = v >= 0 ? '+' : '';
        const color = v >= 0 ? '#4ade80' : '#f87171';
        return `<span style="color:${color};">${sign}${Number(v).toLocaleString()}</span>`;
      };
      const headerCells = ['날짜', ...tableKeys.map(k => INVESTOR_LABELS[k] || k)].map(h =>
        `<th style="padding:6px 8px;text-align:right;color:#10b981;font-size:0.66rem;font-weight:600;border-bottom:1px solid rgba(16,185,129,0.3);">${escapeHtml(h)}</th>`
      );
      headerCells[0] = `<th style="padding:6px 8px;text-align:left;color:#10b981;font-size:0.66rem;font-weight:600;border-bottom:1px solid rgba(16,185,129,0.3);">날짜</th>`;

      const bodyRows = m.rows.map(r => {
        const cells = [
          `<td style="padding:5px 8px;font-family:var(--font-mono);font-size:0.68rem;color:var(--text);">${escapeHtml(r.date)}</td>`,
          ...tableKeys.map(k => `<td style="padding:5px 8px;font-family:var(--font-mono);font-size:0.68rem;text-align:right;">${fmt(r[k])}</td>`),
        ];
        return `<tr>${cells.join('')}</tr>`;
      }).join('');

      tableHost.innerHTML = `
        <div style="max-height:420px;overflow:auto;border:1px solid rgba(16,185,129,0.15);border-radius:4px;">
          <table style="width:100%;border-collapse:collapse;font-size:0.7rem;">
            <thead style="position:sticky;top:0;background:rgba(15,23,42,0.95);backdrop-filter:blur(6px);z-index:1;">
              <tr>${headerCells.join('')}</tr>
            </thead>
            <tbody>${bodyRows}</tbody>
          </table>
        </div>`;
    }

    // 시장 토글 바인딩
    document.querySelectorAll('.mib-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const market = btn.dataset.mibMarket;
        if (!market || market === currentMarket) return;
        currentMarket = market;
        document.querySelectorAll('.mib-tab').forEach(b => {
          const isActive = b.dataset.mibMarket === market;
          b.classList.toggle('is-active', isActive);
          b.style.background = isActive ? 'rgba(16,185,129,0.18)' : 'rgba(15,23,42,0.4)';
          b.style.borderColor = isActive ? 'rgba(16,185,129,0.4)' : 'rgba(148,163,184,0.2)';
          b.style.color = isActive ? '#10b981' : 'var(--text-muted)';
        });
        renderForMarket(market);
      });
    });

    // 초기 렌더
    renderForMarket(currentMarket);
  }

  // ─── 종목 분석 팝업 패널 ────────────────────────────
  function findStockData(ticker) {
    const data = window.__dashboardData || {};
    for (const sec of (data.sectors || [])) {
      for (const st of (sec.stocks || [])) {
        if (st.ticker === ticker || st.ticker === ticker + '.KS' || st.ticker === ticker + '.KQ')
          return { ...st, sector: sec.name };
      }
    }
    return null;
  }

  // 글로벌 지수 TradingView 탭 전환 (단일 iframe src 교체)
  function switchTvIndex(btn) {
    const frame = document.getElementById('tv-idx-frame');
    const noteEl = document.getElementById('tv-idx-note');
    if (frame && btn.dataset.tvSrc) frame.src = btn.dataset.tvSrc;
    if (noteEl && btn.dataset.tvNote) noteEl.textContent = '※ ' + btn.dataset.tvNote;
    document.querySelectorAll('.tv-idx-btn').forEach(b => {
      const active = b === btn;
      b.style.background = active ? 'rgba(34,211,238,0.18)' : 'transparent';
      b.style.color = active ? '#22d3ee' : 'var(--text-muted)';
      b.style.borderColor = active ? 'rgba(34,211,238,0.5)' : 'rgba(34,211,238,0.15)';
    });
  }

  function openStockDetail(ticker) {
    const st = findStockData(ticker);
    if (!st) { openInspector('stock:' + ticker); return; }

    // 기존 팝업 제거
    document.getElementById('stock-detail-overlay')?.remove();

    const rec    = st.recommendation || '';
    const recMap = { strong_buy:'강한 매수', buy:'매수', hold:'중립', sell:'매도', strong_sell:'강한 매도',
                     'outperform':'매수', 'underperform':'매도', 'market perform':'중립' };
    const recLabel = recMap[rec] || (rec ? rec.replace(/_/g,' ') : '—');
    const recMean  = st.recommendation_mean;  // 1=strong buy, 5=strong sell
    const recScore = recMean ? Math.max(0, Math.min(100, (5 - recMean) / 4 * 100)) : null;

    // 게이지 색상
    const gaugeColor = recScore == null ? '#64748b'
      : recScore >= 70 ? '#22c55e' : recScore >= 55 ? '#4ade80'
      : recScore >= 40 ? '#fbbf24' : recScore >= 25 ? '#f97316' : '#f87171';

    // 반원 게이지 SVG
    const gW = 220, gH = 120;
    const cx = gW/2, cy = gH - 10, r = 80;
    const angleRange = Math.PI; // 180도
    const angle = recScore != null ? (Math.PI - recScore / 100 * Math.PI) : Math.PI / 2;
    const needleX = cx + r * Math.cos(Math.PI - angle);
    const needleY = cy - r * Math.sin(Math.PI - angle);
    const arcSvg = `<svg viewBox="0 0 ${gW} ${gH}" width="${gW}" height="${gH}" style="display:block;margin:0 auto;">
      <defs><linearGradient id="gGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#f87171"/><stop offset="50%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#22c55e"/>
      </linearGradient></defs>
      <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="url(#gGrad)" stroke-width="14" stroke-linecap="round" opacity="0.3"/>
      <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="url(#gGrad)" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="${Math.PI*r}" stroke-dashoffset="${recScore != null ? (1 - recScore/100)*Math.PI*r : Math.PI*r/2}"/>
      ${recScore != null ? `<line x1="${cx}" y1="${cy}" x2="${needleX.toFixed(1)}" y2="${needleY.toFixed(1)}"
        stroke="${gaugeColor}" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="${cx}" cy="${cy}" r="5" fill="${gaugeColor}"/>` : ''}
      <text x="${cx-r-4}" y="${cy+4}" fill="#f87171" font-size="9" text-anchor="middle">매도</text>
      <text x="${cx+r+4}" y="${cy+4}" fill="#22c55e" font-size="9" text-anchor="start">매수</text>
      <text x="${cx}" y="${cy-r-8}" fill="${gaugeColor}" font-size="13" font-weight="700" text-anchor="middle">${recLabel}</text>
    </svg>`;

    // 52주 레인지 바
    const price = st.price || 0;
    const hi52  = st.week52_high || 0;
    const lo52  = st.week52_low  || 0;
    const rangePct = (hi52 > lo52 && price) ? Math.round((price - lo52) / (hi52 - lo52) * 100) : null;
    const rangeBar = rangePct != null ? `
      <div style="margin:8px 0;">
        <div style="display:flex;justify-content:space-between;font-size:0.62rem;color:var(--text-muted);margin-bottom:3px;">
          <span>52주 최저<br><b style="color:var(--text);">${lo52.toLocaleString()}</b></span>
          <span style="text-align:center;color:${rangePct >= 70 ? '#22c55e' : rangePct >= 40 ? '#fbbf24' : '#f87171'}">
            현재위치<br><b>${rangePct}%</b></span>
          <span style="text-align:right;">52주 최고<br><b style="color:var(--text);">${hi52.toLocaleString()}</b></span>
        </div>
        <div style="height:6px;background:rgba(255,255,255,0.1);border-radius:3px;position:relative;">
          <div style="height:100%;width:${rangePct}%;background:linear-gradient(90deg,#f87171,#fbbf24,#22c55e);border-radius:3px;"></div>
          <div style="position:absolute;top:-2px;left:${rangePct}%;transform:translateX(-50%);width:10px;height:10px;background:#fff;border-radius:50%;border:2px solid ${gaugeColor};"></div>
        </div>
      </div>` : '';

    // 목표가
    const tp   = st.target_price_mean;
    const tpHi = st.target_price_high;
    const tpLo = st.target_price_low;
    const upside = (tp && price) ? ((tp - price) / price * 100).toFixed(1) : null;
    const targetBlock = tp ? `
      <div class="glass-card" style="padding:10px 12px;margin-bottom:8px;">
        <div style="font-size:0.65rem;color:var(--text-muted);margin-bottom:4px;">🎯 애널리스트 목표가
          ${st.analyst_count ? `<span style="color:var(--text-muted);">(${st.analyst_count}명)</span>` : ''}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-size:1.2rem;font-weight:700;color:${upside && parseFloat(upside) > 0 ? '#22c55e' : '#f87171'};">
              ${tp.toLocaleString()}</div>
            ${tpLo && tpHi ? `<div style="font-size:0.62rem;color:var(--text-muted);">범위: ${tpLo.toLocaleString()} ~ ${tpHi.toLocaleString()}</div>` : ''}
          </div>
          ${upside ? `<div style="text-align:right;">
            <div style="font-size:0.72rem;color:var(--text-muted);">현재 대비</div>
            <div style="font-size:1rem;font-weight:700;color:${parseFloat(upside) > 0 ? '#22c55e' : '#f87171'};">
              ${parseFloat(upside) > 0 ? '+' : ''}${upside}%</div>
          </div>` : ''}
        </div>
      </div>` : '';

    // 재무 건전성 바
    const healthBars = [
      { label: 'ROE',     val: st.roe,           max: 40,  unit: '%',  color: '#22d3ee' },
      { label: '영업이익률', val: st.profit_margin, max: 30,  unit: '%',  color: '#4ade80' },
      { label: '매출성장률', val: st.revenue_growth, max: 50, unit: '%',  color: '#a78bfa' },
    ].filter(b => b.val != null && !isNaN(b.val));
    const healthHtml = healthBars.length ? `
      <div class="glass-card" style="padding:10px 12px;margin-bottom:8px;">
        <div style="font-size:0.65rem;color:var(--text-muted);margin-bottom:6px;">📊 재무 건전성</div>
        ${healthBars.map(b => {
          const pct = Math.max(0, Math.min(100, (b.val / b.max) * 100));
          return `<div style="margin-bottom:6px;">
            <div style="display:flex;justify-content:space-between;font-size:0.65rem;margin-bottom:2px;">
              <span style="color:var(--text-muted);">${h(b.label)}</span>
              <span style="color:${b.color};font-weight:600;">${b.val >= 0 ? '+' : ''}${b.val.toFixed(1)}${b.unit}</span>
            </div>
            <div style="height:5px;background:rgba(255,255,255,0.08);border-radius:3px;">
              <div style="height:100%;width:${pct}%;background:${b.color};border-radius:3px;opacity:0.8;"></div>
            </div>
          </div>`;
        }).join('')}
      </div>` : '';

    // 기타 지표
    const extras = [
      ['PER',    st.per,           '배'],
      ['베타',    st.beta,          ''],
      ['D/E',    st.debt_to_equity,''],
      ['시가총액', st.market_cap,    '조'],
    ].filter(([,v]) => v != null && v !== 'N/A');

    const extrasHtml = extras.length ? `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;">
        ${extras.map(([l, v, u]) => `
          <div class="glass-card" style="padding:7px 10px;">
            <div style="font-size:0.6rem;color:var(--text-muted);">${h(l)}</div>
            <div style="font-size:0.85rem;font-weight:700;color:var(--text-bright);">${typeof v === 'number' ? v.toFixed(2) : h(String(v))}${h(u)}</div>
          </div>`).join('')}
      </div>` : '';

    const changeColor = (st.change_pct || 0) >= 0 ? '#22c55e' : '#f87171';
    const isCrypto = (st.ticker || '').endsWith('-USD');
    const priceDisp = isCrypto
      ? `$${(st.price||0).toLocaleString('en-US', {maximumFractionDigits:2})}`
      : `${(st.price||0).toLocaleString()}원`;

    const panelHtml = `
    <div id="stock-detail-overlay" style="position:fixed;inset:0;z-index:10000;display:flex;justify-content:flex-end;"
         onclick="if(event.target===this)this.remove()">
      <div style="width:360px;height:100%;background:#0d1117;border-left:1px solid rgba(255,255,255,0.1);
                  overflow-y:auto;padding:16px;animation:slideInRight 0.2s ease;">
        <!-- 헤더 -->
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;">
          <div>
            <div style="font-size:1.1rem;font-weight:700;color:var(--text-bright);">${h(st.name || ticker)}</div>
            <div style="font-size:0.7rem;color:var(--text-muted);">${h(st.ticker||'')} · ${h(st.sector||'')}</div>
            <div style="margin-top:4px;">
              <span style="font-size:1.3rem;font-weight:700;color:var(--text-bright);">${priceDisp}</span>
              ${st.change_pct != null ? `<span style="font-size:0.8rem;color:${changeColor};margin-left:6px;">${st.change_pct >= 0 ? '+' : ''}${st.change_pct.toFixed(2)}%</span>` : ''}
            </div>
          </div>
          <button onclick="document.getElementById('stock-detail-overlay').remove()"
                  style="background:rgba(255,255,255,0.06);border:none;color:var(--text-muted);cursor:pointer;padding:6px 10px;border-radius:6px;font-size:0.8rem;">✕</button>
        </div>
        <!-- 기술적 분석 게이지 -->
        <div class="glass-card" style="padding:12px;margin-bottom:8px;text-align:center;">
          <div style="font-size:0.65rem;color:var(--text-muted);margin-bottom:4px;">📈 기술적 분석 · 애널리스트</div>
          ${arcSvg}
          ${st.recommendation_mean ? `<div style="font-size:0.62rem;color:var(--text-muted);margin-top:2px;">점수: ${((5 - st.recommendation_mean)/4*10).toFixed(1)}/10</div>` : ''}
        </div>
        <!-- 52주 레인지 -->
        ${rangeBar ? `<div class="glass-card" style="padding:10px 12px;margin-bottom:8px;">${rangeBar}</div>` : ''}
        <!-- 목표가 -->
        ${targetBlock}
        <!-- 재무 건전성 -->
        ${healthHtml}
        <!-- 기타 지표 -->
        ${extrasHtml}
        <!-- 레짐·심리 (N/A 종목은 숨김) -->
        ${st.regime && st.regime !== 'N/A' ? `<div class="glass-card" style="padding:8px 12px;margin-bottom:8px;font-size:0.7rem;">
          <span style="color:var(--text-muted);">레짐: </span><b style="color:var(--cyan);">${h(st.regime)}</b>
          ${st.sentiment_label && st.sentiment_label !== 'N/A' ? ` · <span style="color:var(--text-muted);">심리: </span><b style="color:${st.sentiment_label.includes('긍') ? '#22c55e' : '#f87171'};">${h(st.sentiment_label)}</b>` : ''}
        </div>` : ''}
        <div style="font-size:0.6rem;color:var(--text-muted);text-align:center;margin-top:8px;">🚨 시뮬레이션·분석용. 투자 결정 금지.</div>
      </div>
    </div>`;

    document.body.insertAdjacentHTML('beforeend', panelHtml);

    // 슬라이드 애니메이션
    if (!document.getElementById('stock-panel-style')) {
      const s = document.createElement('style');
      s.id = 'stock-panel-style';
      s.textContent = '@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}';
      document.head.appendChild(s);
    }
  }

  // ─── 우측 인스펙터 패널 열기/닫기 ─────────────────
  function openInspector(saoId) {
    const data = window.__dashboardData || {};
    const sao = (data.sao_signals || {}).signals || [];
    const obj = sao.find(s => s.id === saoId);
    if (!obj) return;

    const pulseM = (data.sao_signals || {}).pulse_metadata || {};
    const prioM = (data.sao_signals || {}).priority_metadata || {};
    const prio = prioM[obj.priority] || {};
    const pulse = pulseM[obj.pulse] || {};

    const titleEl = document.getElementById('inspectorTitle');
    const bodyEl = document.getElementById('inspectorBody');
    const panel = document.getElementById('inspectorPanel');
    const overlay = document.getElementById('inspectorOverlay');

    if (!titleEl || !bodyEl || !panel) return;
    titleEl.innerHTML = `${escapeHtml(obj.icon || pulse.emoji || '')} ${escapeHtml(obj.name)}`;

    let html = '';

    // ─── 우선순위 + 분류 ───
    html += `<div class="inspector-section">
      <div class="inspector-section-title">🎯 분류</div>
      <div class="inspector-kv">
        <span class="inspector-kv-key">Priority</span>
        <span class="inspector-kv-value" style="color:${prio.color};font-weight:700;">${prio.emoji} ${obj.priority} — ${escapeHtml(prio.label || '')}</span>
      </div>
      <div class="inspector-kv">
        <span class="inspector-kv-key">Pulse</span>
        <span class="inspector-kv-value" style="color:${pulse.color};">${pulse.emoji} ${escapeHtml(obj.pulse)} (${escapeHtml(pulse.label || '')})</span>
      </div>
      ${obj.market ? `<div class="inspector-kv"><span class="inspector-kv-key">Market</span><span class="inspector-kv-value">${escapeHtml(obj.market)}</span></div>` : ''}
      ${obj.sector ? `<div class="inspector-kv"><span class="inspector-kv-key">Sector</span><span class="inspector-kv-value">${escapeHtml(obj.sector)}</span></div>` : ''}
      ${obj.type ? `<div class="inspector-kv"><span class="inspector-kv-key">Type</span><span class="inspector-kv-value">${escapeHtml(obj.type)}</span></div>` : ''}
    </div>`;

    // ─── 데이터 출처 ───
    html += `<div class="inspector-section">
      <div class="inspector-section-title">📡 데이터 출처</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;">`;
    (obj.source || []).forEach(src => {
      html += `<span style="font-size:0.65rem;background:rgba(34,211,238,0.08);color:#22d3ee;padding:2px 7px;border-radius:8px;border:1px solid rgba(34,211,238,0.2);font-family:var(--font-mono);">${escapeHtml(src)}</span>`;
    });
    html += `</div>`;
    if (obj.last_updated) {
      html += `<div class="inspector-kv" style="margin-top:6px;"><span class="inspector-kv-key">마지막 갱신</span><span class="inspector-kv-value" style="font-size:0.65rem;">${escapeHtml((obj.last_updated || '').substring(0, 19).replace('T', ' '))}</span></div>`;
    }
    html += `</div>`;

    // ─── Snapshot (현재값 + 메트릭) ───
    if (obj.value !== undefined && obj.value !== null) {
      html += `<div class="inspector-section">
        <div class="inspector-section-title">📊 Snapshot</div>
        <div style="font-size:1.4rem;font-weight:700;color:${prio.color || '#22d3ee'};font-family:var(--font-mono);">
          ${obj.value}${escapeHtml(obj.unit || '')}
        </div>
      </div>`;
    }

    if (obj.metrics && Object.keys(obj.metrics).length > 0) {
      html += `<div class="inspector-section">
        <div class="inspector-section-title">📈 메트릭</div>`;
      Object.entries(obj.metrics).forEach(([k, v]) => {
        if (v === null || v === undefined || v === '') return;
        if (typeof v === 'object') return; // dict/list 스킵
        html += `<div class="inspector-kv"><span class="inspector-kv-key">${escapeHtml(k)}</span><span class="inspector-kv-value">${escapeHtml(String(v))}</span></div>`;
      });
      html += `</div>`;
    }

    // ─── 활성 시그널 ───
    if (obj.signals && obj.signals.length > 0) {
      html += `<div class="inspector-section">
        <div class="inspector-section-title">🚨 활성 시그널 (${obj.signals.length})</div>`;
      obj.signals.forEach(s => {
        const color = s.strength >= 5 ? '#dc2626' : s.strength >= 4 ? '#f97316' : s.strength >= 3 ? '#fbbf24' : '#94a3b8';
        html += `<div style="padding:8px 10px;background:${color}0a;border-left:2px solid ${color};border-radius:3px;margin-bottom:6px;">
          <div style="font-size:0.78rem;color:#e2e8f0;font-weight:600;">${escapeHtml(s.emoji || '')} ${escapeHtml(s.label || '')}</div>
          ${s.description ? `<div style="font-size:0.7rem;color:var(--text-muted);margin-top:2px;line-height:1.4;">${escapeHtml(s.description)}</div>` : ''}
          <div style="font-size:0.6rem;color:var(--text-muted);font-family:var(--font-mono);margin-top:3px;">strength: ${s.strength || 0}/5</div>
        </div>`;
      });
      html += `</div>`;
    }

    // ─── 액션 버튼 ───
    html += `<div class="inspector-section">
      <div class="inspector-section-title">⚡ 액션</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="inspector-action-btn" data-action="locate" style="padding:8px 14px;background:rgba(34,211,238,0.15);color:#22d3ee;border:1px solid rgba(34,211,238,0.4);border-radius:6px;font-size:0.75rem;cursor:pointer;font-weight:600;">🎯 위치 찾기</button>
        ${obj.link ? `<a href="${escapeHtml(obj.link)}" target="_blank" rel="noopener" style="padding:8px 14px;background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.4);border-radius:6px;font-size:0.75rem;font-weight:600;text-decoration:none;">🔗 원본</a>` : ''}
      </div>
    </div>`;

    bodyEl.innerHTML = html;

    // 액션 버튼: 위치 찾기 (대시보드 섹션으로 점프)
    const locateBtn = bodyEl.querySelector('[data-action="locate"]');
    if (locateBtn) {
      locateBtn.addEventListener('click', () => {
        // 종목 카드를 KG에서 검색해서 포커싱하거나, 관련 섹션으로 이동
        // 간단히: 사이드바 SECTIONS에서 관련 섹션 찾아 점프
        let targetSection = null;
        if (obj.pulse === 'MACRO') targetSection = '미국 신용 스프레드';
        else if (obj.pulse === 'KR_EQUITY') targetSection = '한국 시장 투자자 매매';
        else if (obj.pulse === 'LEGISLATIVE') targetSection = '미국 암호화폐 입법';
        else if (obj.pulse === 'SEMI') targetSection = '반도체 챌린저';
        else if (obj.pulse === 'CRYPTO') targetSection = '비트코인 본위제';

        if (targetSection) {
          const links = document.querySelectorAll('.sidebar-link');
          links.forEach(link => {
            if (link.textContent.includes(targetSection)) {
              link.click();
              return;
            }
          });
        }
      });
    }

    // 패널 슬라이드 인
    panel.classList.add('is-open');
    panel.setAttribute('aria-hidden', 'false');
    if (overlay) overlay.style.display = 'block';
  }

  function closeInspector() {
    const panel = document.getElementById('inspectorPanel');
    const overlay = document.getElementById('inspectorOverlay');
    if (panel) {
      panel.classList.remove('is-open');
      panel.setAttribute('aria-hidden', 'true');
    }
    if (overlay) overlay.style.display = 'none';
    // 카드 활성 해제
    __saoActiveCardId = null;
    document.querySelectorAll('.sw-card.active').forEach(c => c.classList.remove('active'));
  }

  // 🏠 HOME — 완전 초기 상태로 복귀
  function goHome() {
    // 1. 인스펙터 닫기
    closeInspector();
    // 2. Cmd+K 닫기
    closeCmdk();
    // 3. 페이지 맨 위로 부드럽게 스크롤
    window.scrollTo({ top: 0, behavior: 'smooth' });
    // 4. 사이드바 nav 영역도 맨 위로 (시그널 첫 카드 보이게)
    const navEl = document.getElementById('sidebarNav');
    if (navEl) navEl.scrollTo({ top: 0, behavior: 'smooth' });
    // 5. 모바일에서는 사이드바 열기
    if (window.innerWidth <= 900) {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      if (sidebar) sidebar.classList.add('is-open');
      if (overlay) overlay.style.display = 'block';
    }
    // 6. HOME 시각 피드백 (LIVE 인디케이터에 표시)
    flashLiveIndicator('#00ff88', 'HOME');
  }

  // ─── ⌘+K 명령 팔레트 (Sovereign Watch / Linear 스타일) ──
  let __cmdkResults = [];
  let __cmdkActive = 0;

  function openCmdk() {
    const ov = document.getElementById('cmdkOverlay');
    const input = document.getElementById('cmdkInput');
    if (!ov || !input) return;
    ov.style.display = 'flex';
    input.value = '';
    input.focus();
    renderCmdkResults('');
  }

  function closeCmdk() {
    const ov = document.getElementById('cmdkOverlay');
    if (ov) ov.style.display = 'none';
  }

  function buildCmdkIndex() {
    // 인덱싱: SAO 시그널 + 섹션 + 종목
    const data = window.__dashboardData || {};
    const items = [];
    // 1. SAO 시그널
    ((data.sao_signals || {}).signals || []).forEach(s => {
      items.push({
        type: 'signal',
        id: s.id,
        title: s.name,
        subtitle: (s.signals && s.signals[0] && s.signals[0].label) || s.description || '',
        meta: `${s.priority} · ${s.pulse}`,
        emoji: s.icon || '📡',
        priority: s.priority,
        action: () => openInspector(s.id),
      });
    });
    // 2. 섹션
    document.querySelectorAll('.section-wrap').forEach(sec => {
      const label = sec.querySelector('.section-label');
      if (!label) return;
      const text = label.textContent.replace(/\s+/g, ' ').trim().substring(0, 50);
      items.push({
        type: 'section',
        id: sec.id,
        title: text,
        subtitle: '대시보드 섹션',
        meta: 'SECTION',
        emoji: '🗂️',
        action: () => {
          sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        },
      });
    });
    // 3. 종목 (섹터 데이터 우선 — 애널리스트 분석 포함)
    const seenTickers = new Set();
    (data.sectors || []).forEach(sec => {
      (sec.stocks || []).forEach(st => {
        if (!st.ticker || seenTickers.has(st.ticker)) return;
        seenTickers.add(st.ticker);
        const cleanTicker = st.ticker.replace(/\.KS|\.KQ/g, '');
        const rec = st.recommendation || '';
        const recShort = { strong_buy:'강한매수', buy:'매수', hold:'중립', sell:'매도', strong_sell:'강한매도' }[rec] || rec;
        items.push({
          type: 'stock',
          id: 'stock:' + cleanTicker,
          title: st.name || cleanTicker,
          subtitle: `${sec.name} · ${cleanTicker}${recShort ? ' · ' + recShort : ''}`,
          meta: st.change_pct != null ? (st.change_pct >= 0 ? '+' : '') + st.change_pct.toFixed(1) + '%' : 'STOCK',
          emoji: '📊',
          action: () => openStockDetail(cleanTicker),
        });
      });
    });
    // 3b. KG 종목 (섹터에 없는 것만 추가)
    const kg = data.knowledge_graph || {};
    (kg.nodes || []).filter(n => n.type === 'Stock').forEach(n => {
      if (seenTickers.has(n.id)) return;
      items.push({
        type: 'stock',
        id: n.id,
        title: n.label,
        subtitle: (n.data && n.data.sector) || 'Stock',
        meta: 'KG',
        emoji: '📈',
        action: () => openStockDetail(n.id.replace('stock:', '')),
      });
    });
    return items;
  }

  function renderCmdkResults(query) {
    const resultsEl = document.getElementById('cmdkResults');
    if (!resultsEl) return;
    const idx = buildCmdkIndex();
    const q = (query || '').toLowerCase().trim();

    let filtered = idx;
    if (q) {
      filtered = idx.filter(item =>
        (item.title || '').toLowerCase().includes(q) ||
        (item.subtitle || '').toLowerCase().includes(q) ||
        (item.meta || '').toLowerCase().includes(q)
      );
    }

    // 우선순위 정렬 (signal P1/P2 우선, 그다음 section, 그다음 stock)
    filtered.sort((a, b) => {
      const order = { signal: 0, section: 1, stock: 2 };
      const pri = { P1: 0, P2: 1, P3: 2, P4: 3 };
      if (a.type !== b.type) return order[a.type] - order[b.type];
      if (a.priority && b.priority) return pri[a.priority] - pri[b.priority];
      return 0;
    });

    // 30개로 제한
    __cmdkResults = filtered.slice(0, 30);
    __cmdkActive = 0;

    if (__cmdkResults.length === 0) {
      resultsEl.innerHTML = `<div style="padding:20px;color:var(--text-muted);font-size:0.75rem;text-align:center;">결과 없음</div>`;
      return;
    }

    let html = '';
    __cmdkResults.forEach((item, i) => {
      const active = i === 0;
      html += `<div class="cmdk-row" data-cmdk-idx="${i}" style="display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;border-left:2px solid ${active ? '#22d3ee' : 'transparent'};background:${active ? 'rgba(34,211,238,0.06)' : 'transparent'};transition:all 0.1s ease;">
        <span style="font-size:1rem;width:24px;text-align:center;">${escapeHtml(item.emoji)}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:0.82rem;color:#e2e8f0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(item.title)}</div>
          <div style="font-size:0.65rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(item.subtitle)}</div>
        </div>
        <span style="font-size:0.58rem;color:var(--text-muted);font-family:var(--font-mono);padding:2px 6px;background:rgba(255,255,255,0.04);border-radius:4px;">${escapeHtml(item.meta)}</span>
      </div>`;
    });
    resultsEl.innerHTML = html;

    // 클릭 핸들러
    resultsEl.querySelectorAll('.cmdk-row').forEach(row => {
      row.addEventListener('click', () => {
        const i = parseInt(row.dataset.cmdkIdx);
        if (__cmdkResults[i] && __cmdkResults[i].action) {
          __cmdkResults[i].action();
          closeCmdk();
        }
      });
      row.addEventListener('mouseenter', () => {
        __cmdkActive = parseInt(row.dataset.cmdkIdx);
        updateCmdkActive();
      });
    });
  }

  function updateCmdkActive() {
    document.querySelectorAll('.cmdk-row').forEach((row, i) => {
      const active = i === __cmdkActive;
      row.style.borderLeftColor = active ? '#22d3ee' : 'transparent';
      row.style.background = active ? 'rgba(34,211,238,0.06)' : 'transparent';
    });
    // 활성 행이 보이게 스크롤
    const activeRow = document.querySelector(`.cmdk-row[data-cmdk-idx="${__cmdkActive}"]`);
    if (activeRow) activeRow.scrollIntoView({ block: 'nearest' });
  }

  // ─── 키보드 단축키 + 초기화 ─────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    const closeBtn = document.getElementById('inspectorClose');
    const homeBtn = document.getElementById('inspectorHome');
    const insOverlay = document.getElementById('inspectorOverlay');
    if (closeBtn) closeBtn.addEventListener('click', closeInspector);
    if (insOverlay) insOverlay.addEventListener('click', closeInspector);

    // 🏠 HOME 버튼: 인스펙터 닫기 + 맨 위로 스크롤 + 사이드바 첫 카드로 복귀
    if (homeBtn) {
      homeBtn.addEventListener('click', goHome);
    }

    // Cmd+K 입력 핸들러
    const cmdkInput = document.getElementById('cmdkInput');
    const cmdkOverlay = document.getElementById('cmdkOverlay');
    if (cmdkInput) {
      cmdkInput.addEventListener('input', e => renderCmdkResults(e.target.value));
      cmdkInput.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          __cmdkActive = Math.min(__cmdkActive + 1, __cmdkResults.length - 1);
          updateCmdkActive();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          __cmdkActive = Math.max(__cmdkActive - 1, 0);
          updateCmdkActive();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const item = __cmdkResults[__cmdkActive];
          if (item && item.action) {
            item.action();
            closeCmdk();
          }
        }
      });
    }
    if (cmdkOverlay) {
      cmdkOverlay.addEventListener('click', e => {
        if (e.target === cmdkOverlay) closeCmdk();
      });
    }

    // 전역 키 단축키
    document.addEventListener('keydown', (e) => {
      // Cmd+K / Ctrl+K
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openCmdk();
        return;
      }
      // ESC: 모든 모달 닫기
      if (e.key === 'Escape') {
        closeCmdk();
        closeInspector();
      }
      // H 키: 홈으로 (input/textarea 외)
      if (e.key.toLowerCase() === 'h' && !e.metaKey && !e.ctrlKey && !e.altKey) {
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag !== 'input' && tag !== 'textarea' && !e.target.isContentEditable) {
          e.preventDefault();
          goHome();
        }
      }
    });

    // 🏠 사이드바 HOME 버튼
    const sidebarHomeBtn = document.getElementById('sidebarHome');
    if (sidebarHomeBtn) {
      sidebarHomeBtn.addEventListener('click', goHome);
      sidebarHomeBtn.addEventListener('mouseenter', () => {
        sidebarHomeBtn.style.background = 'rgba(0,255,136,0.22)';
        sidebarHomeBtn.style.boxShadow = '0 0 12px rgba(0,255,136,0.3)';
      });
      sidebarHomeBtn.addEventListener('mouseleave', () => {
        sidebarHomeBtn.style.background = 'rgba(0,255,136,0.1)';
        sidebarHomeBtn.style.boxShadow = 'none';
      });
    }

    // 사이드바 푸터의 Cmd+K 버튼
    const cmdkTrigger = document.getElementById('cmdkTrigger');
    if (cmdkTrigger) {
      cmdkTrigger.addEventListener('click', openCmdk);
      cmdkTrigger.addEventListener('mouseenter', () => {
        cmdkTrigger.style.background = 'rgba(34,211,238,0.18)';
      });
      cmdkTrigger.addEventListener('mouseleave', () => {
        cmdkTrigger.style.background = 'rgba(34,211,238,0.08)';
      });
    }

    // ─── Phase δ: 라이브 폴링 (data.json 5분마다) ──
    startLivePolling();
  });

  // ─── 📡 라이브 폴링 — Phase δ ──────────────────────
  let __lastGeneratedAt = null;
  let __pollInterval = null;

  function startLivePolling() {
    // 첫 갱신 시각 캡처
    if (window.__dashboardData) {
      __lastGeneratedAt = window.__dashboardData.generated_at;
    }
    // 5분마다 폴링
    if (__pollInterval) clearInterval(__pollInterval);
    __pollInterval = setInterval(checkLiveUpdate, 5 * 60 * 1000);
  }

  function checkLiveUpdate() {
    const liveDot = document.getElementById('liveDot');
    const liveText = document.getElementById('liveText');
    if (liveDot) liveDot.style.background = '#facc15';
    if (liveText) liveText.textContent = 'SYNCING';

    fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.json())
      .then(newData => {
        const newGen = newData.generated_at;
        if (newGen && newGen !== __lastGeneratedAt) {
          // 데이터 변경 감지 → 사이드바 재빌드
          window.__dashboardData = newData;
          __lastGeneratedAt = newGen;
          buildSidebarNav();
          flashLiveIndicator('#22d3ee', '신규 데이터');
        } else {
          flashLiveIndicator('#4ade80', 'LIVE');
        }
      })
      .catch(() => {
        flashLiveIndicator('#f87171', 'OFFLINE');
      });
  }

  function flashLiveIndicator(color, text) {
    const liveDot = document.getElementById('liveDot');
    const liveText = document.getElementById('liveText');
    if (liveDot) {
      liveDot.style.background = color;
      liveDot.style.boxShadow = `0 0 4px ${color}`;
    }
    if (liveText) liveText.textContent = text;
    // 3초 후 LIVE로 복귀
    setTimeout(() => {
      if (liveDot) liveDot.style.background = '#4ade80';
      if (liveDot) liveDot.style.boxShadow = '0 0 4px #4ade80';
      if (liveText) liveText.textContent = 'LIVE';
    }, 3000);
  }

  function buildSidebarSignals(data) {
    const navEl = document.getElementById('sidebarNav');
    if (!navEl || !data || !data.sao_signals) return '';
    const sao = data.sao_signals;
    const pulseM = sao.pulse_metadata || {};
    const prioM = sao.priority_metadata || {};
    const signals = sao.signals || [];

    // 필터링
    const filtered = signals.filter(s =>
      __saoFilterPriority.has(s.priority) && __saoFilterPulse.has(s.pulse));

    let html = `<div class="sw-section-title">
      <span>📡 SIGNALS <span style="color:var(--text-muted);font-weight:400;">${filtered.length}/${signals.length}</span></span>
      <span class="sw-badge">READY ${sao.ready_to_act || 0}</span>
    </div>`;

    // Priority 필터 칩
    html += `<div class="sw-filter-row" data-filter-group="priority">`;
    Object.entries(prioM).forEach(([p, meta]) => {
      const active = __saoFilterPriority.has(p);
      html += `<span class="sw-filter-chip ${active ? 'active' : ''}" data-filter-key="${p}" style="${active ? 'color:' + meta.color + ';border-color:' + meta.color + '66;' : ''}">${meta.emoji} ${p}</span>`;
    });
    html += `</div>`;

    // Pulse 필터 칩
    html += `<div class="sw-filter-row" data-filter-group="pulse">`;
    Object.entries(pulseM).forEach(([p, meta]) => {
      const active = __saoFilterPulse.has(p);
      html += `<span class="sw-filter-chip ${active ? 'active' : ''}" data-filter-key="${p}" style="${active ? 'color:' + meta.color + ';border-color:' + meta.color + '66;' : ''}" title="${meta.label}">${meta.emoji}</span>`;
    });
    html += `</div>`;

    // 시그널 카드 (Sovereign Watch 스타일)
    if (filtered.length === 0) {
      html += `<div style="padding:14px 18px;color:var(--text-muted);font-size:0.7rem;font-style:italic;">필터 조건에 맞는 시그널 없음</div>`;
    } else {
      filtered.forEach(s => {
        const prio = prioM[s.priority] || {};
        const pulse = pulseM[s.pulse] || {};
        const firstSig = (s.signals && s.signals[0]) || {};
        const isActive = __saoActiveCardId === s.id;

        html += `<div class="sw-card ${isActive ? 'active' : ''}" data-sao-id="${escapeHtml(s.id)}" style="${isActive ? '' : 'border-left-color:' + (prio.color || 'rgba(255,255,255,0.1)') + ';'}">
          <div class="sw-card-header">
            <div class="sw-card-name">${escapeHtml(firstSig.emoji || s.icon || '')} ${escapeHtml(s.name)}</div>
            <div class="sw-card-priority" style="background:${prio.color}22;color:${prio.color};">${s.priority}</div>
          </div>
          <div class="sw-card-meta">${escapeHtml(firstSig.label || s.description || '')}</div>
          <div class="sw-card-bottom">
            <span class="sw-card-source" style="color:${pulse.color || 'var(--text-muted)'};">${pulse.emoji || ''} ${escapeHtml(s.pulse)}</span>
            <span class="sw-card-action ${s.priority === 'P1' || s.priority === 'P2' ? 'always-show' : ''}" style="color:${prio.color || 'var(--text-muted)'};">→ ${prio.action || 'View'}</span>
          </div>
        </div>`;
      });
    }

    return html;
  }

  // 비동기 주입 섹션을 감지해 사이드바 자동 재빌드 (디바운스)
  let __sidebarObserver = null;
  let __sidebarRebuildTimer = null;
  function setupSidebarObserver() {
    const app = document.getElementById('app');
    if (!app || __sidebarObserver) return;
    let lastCount = document.querySelectorAll('.section-wrap').length;
    __sidebarObserver = new MutationObserver(() => {
      const cur = document.querySelectorAll('.section-wrap').length;
      if (cur === lastCount) return;   // 섹션 수 변화 없으면 무시
      lastCount = cur;
      clearTimeout(__sidebarRebuildTimer);
      __sidebarRebuildTimer = setTimeout(() => buildSidebarNav(), 250);
    });
    __sidebarObserver.observe(app, { childList: true, subtree: true });
  }

  function buildSidebarNav() {
    const navEl = document.getElementById('sidebarNav');
    if (!navEl) return;

    const sections = document.querySelectorAll('.section-wrap');
    if (sections.length === 0) return;

    // 섹션별 ID 자동 부여 + 라벨 추출
    const items = [];
    sections.forEach(sec => {
      const labelEl = sec.querySelector('.section-label');
      if (!labelEl) return;
      // section-label의 텍스트 + 이모지만 추출 (sub-text 제외)
      let labelText = '';
      labelEl.childNodes.forEach(node => {
        if (node.nodeType === Node.TEXT_NODE) {
          labelText += node.textContent;
        } else if (node.nodeType === Node.ELEMENT_NODE && !node.matches('span')) {
          labelText += node.textContent;
        }
      });
      labelText = labelText.trim();
      if (!labelText) labelText = labelEl.textContent.trim().substring(0, 30);
      if (!sec.id) sec.id = slugify(labelText);
      items.push({ id: sec.id, label: labelText, el: sec });
    });

    if (items.length === 0) {
      navEl.innerHTML = '<div style="color:var(--text-muted);font-size:0.7rem;padding:12px 16px;">섹션을 찾지 못함</div>';
      return;
    }

    // 카테고리별 그룹화 (이모지 패턴 기반)
    const groups = {
      '시장 개요': [],
      '한국 시장': [],
      '미국·거시': [],
      '분석·평가': [],
      '기타': [],
    };
    items.forEach(item => {
      const l = item.label;
      if (/시장 개요|매크로 환경|해외 시장 동향|일본|지정학|섹터별|차트 분석|포트폴리오|AI 인사이트|AI 투자|이벤트 캘린더|주요 이벤트/.test(l)) {
        groups['시장 개요'].push(item);
      } else if (/투자자 매매|장중|챌린저|반도체|한국 시장|섹터|시가총액 순위|ETF|수출입|무역/.test(l)) {
        groups['한국 시장'].push(item);
      } else if (/CLARITY|입법|비트코인|신용 스프레드|미국|FRED|거시|M2|통화량|금융안정/.test(l)) {
        groups['미국·거시'].push(item);
      } else if (/IRR|DCF|저평가|실적|Forward|오토리서치|지식 그래프|민감도|핵심 논쟁|퀀트|레버리지|변동성/.test(l)) {
        groups['분석·평가'].push(item);
      } else {
        groups['기타'].push(item);
      }
    });

    // HTML 빌드: 상단 탭 토글 [섹션 | 시그널], 기본 = 섹션
    const sigCount = (window.__dashboardData && window.__dashboardData.sao_signals
                      && window.__dashboardData.sao_signals.signals)
                      ? window.__dashboardData.sao_signals.signals.length : 0;
    let html = `<div style="display:flex;gap:4px;padding:8px 8px 6px;position:sticky;top:0;background:var(--bg-sidebar,#0a0e14);z-index:5;border-bottom:1px solid rgba(255,255,255,0.06);">
      <button id="sb-tab-sections" onclick="switchSidebarTab('sections')"
        style="flex:1;padding:6px 8px;border-radius:6px;border:1px solid rgba(167,139,250,0.4);
          background:rgba(167,139,250,0.18);color:#a78bfa;font-size:0.7rem;font-weight:700;cursor:pointer;">🗂️ 섹션</button>
      <button id="sb-tab-signals" onclick="switchSidebarTab('signals')"
        style="flex:1;padding:6px 8px;border-radius:6px;border:1px solid rgba(34,211,238,0.15);
          background:transparent;color:var(--text-muted);font-size:0.7rem;font-weight:700;cursor:pointer;">📡 시그널 ${sigCount}</button>
    </div>`;

    // 섹션 페인 (기본 표시)
    html += `<div id="sb-sections-pane" style="display:block;">`;
    Object.entries(groups).forEach(([groupName, groupItems]) => {
      if (groupItems.length === 0) return;
      html += `<div class="sidebar-group-label">${groupName}</div>`;
      groupItems.forEach(item => {
        html += `<a class="sidebar-link" href="#${item.id}" data-target="${item.id}">${escapeHtml(item.label)}</a>`;
      });
    });
    html += `</div>`;

    // 시그널 페인 (기본 숨김)
    html += `<div id="sb-signals-pane" style="display:none;">`;
    if (window.__dashboardData) {
      html += buildSidebarSignals(window.__dashboardData);
    }
    html += `</div>`;

    navEl.innerHTML = html;

    // SIGNALS 카드 클릭 → 인스펙터 패널 열기
    navEl.querySelectorAll('.sw-card').forEach(card => {
      card.addEventListener('click', () => {
        const saoId = card.dataset.saoId;
        __saoActiveCardId = saoId;
        // 카드 활성 표시
        navEl.querySelectorAll('.sw-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        // 인스펙터 열기
        openInspector(saoId);
      });
    });

    // Priority/Pulse 필터 칩 클릭
    navEl.querySelectorAll('.sw-filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const group = chip.parentElement.dataset.filterGroup;
        const key = chip.dataset.filterKey;
        const set = group === 'priority' ? __saoFilterPriority : __saoFilterPulse;
        if (set.has(key)) {
          set.delete(key);
        } else {
          set.add(key);
        }
        // 사이드바 재빌드 (필터 반영)
        buildSidebarNav();
      });
    });

    // 클릭 이벤트: 부드러운 스크롤
    navEl.querySelectorAll('.sidebar-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const targetId = link.dataset.target;
        const target = document.getElementById(targetId);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          // 모바일에서는 사이드바 닫기
          if (window.innerWidth <= 900) {
            document.getElementById('sidebar').classList.remove('is-open');
            document.getElementById('sidebarOverlay').style.display = 'none';
          }
        }
      });
    });

    // 스크롤 스파이 (IntersectionObserver)
    if (__scrollSpyObserver) __scrollSpyObserver.disconnect();
    __scrollSpyObserver = new IntersectionObserver((entries) => {
      // 화면 상단에 가장 가까운 visible 섹션 찾기
      const visible = entries
        .filter(e => e.isIntersecting)
        .sort((a, b) => a.target.getBoundingClientRect().top - b.target.getBoundingClientRect().top);
      if (visible.length > 0) {
        const activeId = visible[0].target.id;
        navEl.querySelectorAll('.sidebar-link').forEach(link => {
          if (link.dataset.target === activeId) {
            link.classList.add('active');
            // 활성 링크가 사이드바 뷰포트 밖이면 스크롤
            const linkRect = link.getBoundingClientRect();
            const navRect = navEl.getBoundingClientRect();
            if (linkRect.top < navRect.top || linkRect.bottom > navRect.bottom) {
              link.scrollIntoView({ block: 'center' });
            }
          } else {
            link.classList.remove('active');
          }
        });
      }
    }, {
      rootMargin: '-80px 0px -60% 0px',  // 상단 80px 무시, 하단 60% 무시 = 화면 중상단 활성
      threshold: 0,
    });
    items.forEach(item => __scrollSpyObserver.observe(item.el));

    // 모바일 햄버거 메뉴 토글
    const toggleBtn = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (toggleBtn && sidebar && overlay) {
      toggleBtn.onclick = () => {
        const open = sidebar.classList.toggle('is-open');
        overlay.style.display = open ? 'block' : 'none';
      };
      overlay.onclick = () => {
        sidebar.classList.remove('is-open');
        overlay.style.display = 'none';
      };
    }
  }

  // ─── Interactions ────────────────────────────────────
  window.toggleSector = function(header) {
    header.classList.toggle('is-open');
    const body = header.nextElementSibling;
    body.classList.toggle('is-open');
  };

  window.toggleDetail = function(row) {
    row.classList.toggle('is-open');
    const detail = row.nextElementSibling;
    if (detail && detail.classList.contains('detail-row')) {
      detail.classList.toggle('is-visible');
    }
  };

  window.toggleMacroDetail = function(btn) {
    btn.classList.toggle('is-open');
    const panel = document.getElementById('macroDetailPanel');
    if (!panel) return;
    const isOpening = btn.classList.contains('is-open');
    if (isOpening) {
      panel.style.maxHeight = panel.scrollHeight + 'px';
      panel.style.overflow = 'hidden';
      panel.classList.add('is-open');
      panel.addEventListener('transitionend', function onEnd(e) {
        if (e.propertyName !== 'max-height') return;
        panel.removeEventListener('transitionend', onEnd);
        panel.style.maxHeight = 'none';
        panel.style.overflow = 'visible';
      });
    } else {
      panel.style.maxHeight = panel.scrollHeight + 'px';
      panel.style.overflow = 'hidden';
      panel.offsetHeight; // force reflow
      panel.style.maxHeight = '0';
      panel.classList.remove('is-open');
    }
  };

  // 사이드바 탭 전환 (섹션 ↔ 시그널)
  window.switchSidebarTab = function(tab) {
    const secPane = document.getElementById('sb-sections-pane');
    const sigPane = document.getElementById('sb-signals-pane');
    const secBtn  = document.getElementById('sb-tab-sections');
    const sigBtn  = document.getElementById('sb-tab-signals');
    if (!secPane || !sigPane) return;
    const showSec = tab === 'sections';
    secPane.style.display = showSec ? 'block' : 'none';
    sigPane.style.display = showSec ? 'none' : 'block';
    if (secBtn) {
      secBtn.style.background = showSec ? 'rgba(167,139,250,0.18)' : 'transparent';
      secBtn.style.color = showSec ? '#a78bfa' : 'var(--text-muted)';
      secBtn.style.borderColor = showSec ? 'rgba(167,139,250,0.4)' : 'rgba(255,255,255,0.1)';
    }
    if (sigBtn) {
      sigBtn.style.background = showSec ? 'transparent' : 'rgba(34,211,238,0.18)';
      sigBtn.style.color = showSec ? 'var(--text-muted)' : '#22d3ee';
      sigBtn.style.borderColor = showSec ? 'rgba(34,211,238,0.15)' : 'rgba(34,211,238,0.4)';
    }
    const navEl = document.getElementById('sidebarNav');
    if (navEl) navEl.scrollTo({ top: 0 });
  };

  // 인라인 onclick(전역 스코프)에서 호출되는 IIFE 내부 함수를 window에 노출
  window.switchTvIndex   = switchTvIndex;
  window.openStockDetail = openStockDetail;

  // ─── 💵 M2 Chart ─────────────────────────────────────
  function renderM2Chart(m2Data) {
    try {
    if (!m2Data || !m2Data.series) return;
    const us       = m2Data.series.us;
    const kr       = m2Data.series.kr;        // 개정후 (현행 기준)
    const krBefore = m2Data.series.kr_before; // 개정전 (수익증권 포함 구기준)
    if (!us && !kr && !krBefore) return;

    // 공통 날짜 축 (세 시리즈 합집합)
    const allDates = [...new Set([
      ...(us       ? us.data.map(d => d.date)       : []),
      ...(kr       ? kr.data.map(d => d.date)       : []),
      ...(krBefore ? krBefore.data.map(d => d.date) : []),
    ])].sort();
    if (allDates.length < 2) return;

    const usMap  = us       ? Object.fromEntries(us.data.map(d => [d.date, d.yoy_pct]))       : {};
    const krMap  = kr       ? Object.fromEntries(kr.data.map(d => [d.date, d.yoy_pct]))       : {};
    const krbMap = krBefore ? Object.fromEntries(krBefore.data.map(d => [d.date, d.yoy_pct])) : {};

    const fmtDate = (d) => d.slice(2, 4) + '.' + d.slice(5, 7);

    const W = 720, H = 240, MT = 24, MR = 24, MB = 44, ML = 54;
    const innerW = W - ML - MR, innerH = H - MT - MB;
    const n = allDates.length;

    const allVals = [...Object.values(usMap), ...Object.values(krMap), ...Object.values(krbMap)]
                    .filter(v => v != null && !isNaN(v));
    const minV = Math.floor(Math.min(...allVals, -2)) - 1;
    const maxV = Math.ceil(Math.max(...allVals, 6)) + 1;
    const range = maxV - minV || 1;

    const xS = (i) => ((i / (n - 1)) * innerW).toFixed(1);
    const yS = (v) => (innerH - ((v - minV) / range) * innerH).toFixed(1);

    // SVG 경로 사전 계산
    let usPath = '', krPath = '', krbPath = '', gridLines = '', xLabels = '';
    // 데이터 포인트도 저장 (툴팁용)
    const ptData = allDates.map((d, i) => ({d, i, uv: usMap[d], kv: krMap[d], bv: krbMap[d]}));
    ptData.forEach(({d, i, uv, kv, bv}) => {
      if (uv != null && !isNaN(uv)) usPath  += (usPath  ? 'L' : 'M') + xS(i) + ',' + yS(uv) + ' ';
      if (kv != null && !isNaN(kv)) krPath  += (krPath  ? 'L' : 'M') + xS(i) + ',' + yS(kv) + ' ';
      if (bv != null && !isNaN(bv)) krbPath += (krbPath ? 'L' : 'M') + xS(i) + ',' + yS(bv) + ' ';
      if (i % 6 === 0) xLabels += '<text x="' + xS(i) + '" y="' + (innerH + 16) + '" text-anchor="middle" fill="#64748b" font-size="9">' + fmtDate(d) + '</text>';
    });
    // 그리드라인 (2% 간격)
    for (let v = Math.ceil(minV / 2) * 2; v <= maxV; v += 2) {
      const isZero = v === 0;
      gridLines += '<line x1="0" y1="' + yS(v) + '" x2="' + innerW + '" y2="' + yS(v) + '" stroke="' + (isZero ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.06)') + '" stroke-width="' + (isZero ? 1.5 : 1) + '" ' + (isZero ? 'stroke-dasharray="4,3"' : '') + '/>'
               + '<text x="-6" y="' + (parseFloat(yS(v)) + 4) + '" text-anchor="end" fill="#64748b" font-size="10">' + v + '%</text>';
    }
    // HTML 범례 (SVG 밖 — 라인과 겹치지 않음)
    const htmlLegend = '<div style="display:flex;gap:16px;margin-bottom:6px;flex-wrap:wrap;align-items:center;">'
      + (us       ? '<span style="display:flex;align-items:center;gap:5px;font-size:0.72rem;"><span style="display:inline-block;width:20px;height:2.5px;background:#22d3ee;border-radius:2px;"></span><span style="color:#22d3ee;">미국 M2</span></span>' : '')
      + (krBefore ? '<span style="display:flex;align-items:center;gap:5px;font-size:0.72rem;"><span style="display:inline-block;width:20px;height:2px;background:#f87171;border-radius:2px;"></span><span style="color:#f87171;">한국(개정전)</span></span>' : '')
      + (kr       ? '<span style="display:flex;align-items:center;gap:5px;font-size:0.72rem;"><span style="display:inline-block;width:20px;height:2px;background:#4ade80;border-radius:2px;"></span><span style="color:#4ade80;">한국(개정후)</span></span>' : '')
      + '<span style="font-size:0.63rem;color:var(--text-muted);margin-left:auto;">마우스를 올리면 수치 표시</span>'
      + '</div>';

    // KPI 카드
    const kpiStyle = 'padding:12px 16px;min-width:150px;';
    const kpiVal = (v, color) => '<div style="font-size:1.4rem;font-weight:700;color:' + color + ';">' + (v >= 0 ? '+' : '') + v.toFixed(1) + '%</div>';
    const usKpi  = us ? '<div class="glass-card" style="' + kpiStyle + '"><div style="font-size:0.65rem;color:#22d3ee;font-weight:600;">🇺🇸 미국 M2</div>' + kpiVal(us.latest_yoy, '#22d3ee') + '<div style="font-size:0.62rem;color:var(--text-muted);">' + us.latest_date.slice(0,7) + '</div></div>' : '';
    const krbNote = (krBefore && krBefore.note) ? ' <span style="font-size:0.55rem;color:var(--amber);opacity:0.8;">(추정)</span>' : '';
    const krbKpi = krBefore ? '<div class="glass-card" style="' + kpiStyle + ';border-left:2px solid #f87171;"><div style="font-size:0.65rem;color:#f87171;font-weight:600;">🇰🇷 한국 M2 (개정전)' + krbNote + '</div>' + kpiVal(krBefore.latest_yoy, '#f87171') + '<div style="font-size:0.62rem;color:var(--text-muted);">' + krBefore.latest_date.slice(0,7) + '</div></div>' : '';
    const krKpi  = kr  ? '<div class="glass-card" style="' + kpiStyle + ';border-left:2px solid #4ade80;"><div style="font-size:0.65rem;color:#4ade80;font-weight:600;">🇰🇷 한국 M2 (개정후)</div>' + kpiVal(kr.latest_yoy, '#4ade80') + '<div style="font-size:0.62rem;color:var(--text-muted);">' + kr.latest_date.slice(0,7) + '</div></div>' : '';

    // 개정 설명 박스
    const revNote = '<div class="glass-card anim-item" style="padding:12px 16px;margin-bottom:10px;background:rgba(251,191,36,0.05);border-left:3px solid rgba(251,191,36,0.5);">'
      + '<div style="font-size:0.72rem;font-weight:600;color:var(--amber);margin-bottom:4px;">📌 한국 M2 통계 개정 (2026년 1월 시행 · 출처: 한국은행)</div>'
      + '<div style="font-size:0.7rem;color:var(--text);line-height:1.7;">'
      + '<b style="color:var(--red,#f87171);">개정전</b>: ETF·채권형펀드 등 수익증권을 M2에 포함 → 주가·채권 가격 상승이 통화량 증가로 잡혀 과대계상.<br>'
      + '<b style="color:var(--green,#4ade80);">개정후</b>: 수익증권 제외(시장가격 변동 품목 제외) · 초대형IB 발행어음·CMA 추가 → IMF 2017 기준 준수.<br>'
      + '<span style="color:var(--text-muted);">개정전-후 격차 약 3.5~4%p: 2024~25년 KOSPI 상승으로 펀드 NAV가 부풀어 개정전 M2를 인위적으로 높임.</span>'
      + '</div></div>';

    const html = '<section class="section-wrap" id="m2-chart-section">'
      + '<div class="section-label" style="color:var(--cyan);">💵 M2 통화량 증가율 (전년동월비) · 금융안정 진단'
      + '<span style="font-size:0.65rem;color:var(--text-muted);margin-left:8px;">갱신: ' + h(m2Data.generated_at||'') + ' · 출처: FRED · 한국은행</span></div>'
      + revNote
      + '<div style="display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;">'
      + usKpi + krbKpi + krKpi
      + '<div class="glass-card" style="padding:12px 16px;flex:1;min-width:200px;">'
      + '<div style="font-size:0.68rem;color:var(--text-muted);margin-bottom:4px;">해석 가이드</div>'
      + '<div style="font-size:0.7rem;color:var(--text);line-height:1.7;">'
      + 'M2 ↑ → 유동성 확대 → 위험자산 선호<br>'
      + 'M2 ↓ → 긴축 효과 → 채권·달러 강세<br>'
      + '<span style="color:var(--amber);">2022~23: 미국 M2 급수축 → 고금리·SVB 충격</span></div></div>'
      + '</div>'
      + htmlLegend
      + '<div class="glass-card anim-item" style="padding:14px;overflow-x:auto;position:relative;">'
      + '<svg id="m2-svg" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:' + W + 'px;height:auto;display:block;">'
      + '<g transform="translate(' + ML + ',' + MT + ')">'
      + gridLines
      + (krbPath ? '<path d="' + krbPath.trim() + '" fill="none" stroke="#f87171" stroke-width="2" stroke-linejoin="round" opacity="0.9"/>' : '')
      + (krPath  ? '<path d="' + krPath.trim()  + '" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linejoin="round"/>' : '')
      + (usPath  ? '<path d="' + usPath.trim()  + '" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/>' : '')
      + xLabels
      + '<g id="m2-crosshair" style="display:none;pointer-events:none;">'
      + '<line id="m2-vline" x1="0" x2="0" y1="0" y2="' + innerH + '" stroke="rgba(255,255,255,0.45)" stroke-width="1" stroke-dasharray="3,2"/>'
      + '</g>'
      + '<rect id="m2-overlay" x="0" y="0" width="' + innerW + '" height="' + innerH + '" fill="transparent" style="cursor:crosshair;"/>'
      + '</g></svg></div>'
      + '<div style="font-size:0.63rem;color:var(--text-muted);margin-top:6px;">🚨 시뮬레이션·분석용. 투자 결정 금지. 출처: FRED (M2SL) · 한국은행 ECOS (161Y005)</div>'
      + '</section>';

    const existing = document.getElementById('m2-chart-section');
    if (existing) { existing.outerHTML = html; }
    else { (document.getElementById('app') || document.body).insertAdjacentHTML('beforeend', html); }

    // ── 마우스 오버 툴팁 설정 ──────────────────────────────────────
    const overlay   = document.getElementById('m2-overlay');
    const crosshair = document.getElementById('m2-crosshair');
    const vline     = document.getElementById('m2-vline');
    if (overlay && crosshair && vline) {
      let tip = document.getElementById('m2-tip');
      if (!tip) {
        tip = document.createElement('div');
        tip.id = 'm2-tip';
        tip.style.cssText = 'position:fixed;background:rgba(10,14,20,0.97);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:10px 14px;font-size:0.72rem;pointer-events:none;display:none;z-index:9999;min-width:195px;box-shadow:0 4px 16px rgba(0,0,0,0.6);line-height:1.8;font-family:var(--font-mono,monospace);';
        document.body.appendChild(tip);
      }
      const svgEl = document.getElementById('m2-svg');
      overlay.addEventListener('mousemove', function(e) {
        if (!svgEl) return;
        const rect = svgEl.getBoundingClientRect();
        const scaleX = W / rect.width;
        const xPx = (e.clientX - rect.left) * scaleX - ML;
        const ci = Math.max(0, Math.min(n - 1, Math.round(xPx / (innerW / (n - 1)))));
        const date = allDates[ci];
        const xPos = parseFloat(xS(ci));
        crosshair.style.display = '';
        vline.setAttribute('x1', xPos.toFixed(1));
        vline.setAttribute('x2', xPos.toFixed(1));
        const fmt = (v) => v != null && !isNaN(v) ? ((v >= 0 ? '+' : '') + v.toFixed(2) + '%') : '—';
        const uv = usMap[date], kv = krMap[date], bv = krbMap[date];
        tip.innerHTML = '<div style="color:#94a3b8;font-size:0.63rem;margin-bottom:5px;">📅 ' + date.slice(0,7) + '</div>'
          + (uv != null ? '<div style="color:#22d3ee;">🇺🇸 미국 M2: <b>' + fmt(uv) + '</b></div>' : '')
          + (bv != null ? '<div style="color:#f87171;">🇰🇷 개정전: <b>' + fmt(bv) + '</b></div>' : '')
          + (kv != null ? '<div style="color:#4ade80;">🇰🇷 개정후: <b>' + fmt(kv) + '</b></div>' : '')
          + (bv != null && kv != null ? '<div style="color:#94a3b8;font-size:0.63rem;margin-top:3px;">격차: ' + (bv - kv).toFixed(2) + '%p</div>' : '');
        tip.style.display = 'block';
        tip.style.left = (e.clientX + 18) + 'px';
        tip.style.top  = Math.max(50, e.clientY - 70) + 'px';
      });
      overlay.addEventListener('mouseleave', function() {
        crosshair.style.display = 'none';
        if (tip) tip.style.display = 'none';
      });
    }
    } catch(e) { console.error('[M2 Chart]', e); }
  }

          <div style="position:relative;height:18px;margin-top:8px;">
