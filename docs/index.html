  window.switchTvTab     = switchTvTab;
  window.openStockDetail = openStockDetail;

  // ─── 💵 M2 Chart ─────────────────────────────────────
  function renderM2Chart(m2Data) {
    try {
    if (!m2Data || !m2Data.series) return;
    const us       = m2Data.series.us;
    const kr       = m2Data.series.kr;        // 개정후 (현행 기준)
    const krBefore = m2Data.series.kr_before; // 개정전 (수익증권 포함 구기준)
    if (!us && !kr && !krBefore) return;

    // 공통 날짜 축 (세 시리즈 합집합)
    const allDates = [...new Set([
      ...(us       ? us.data.map(d => d.date)       : []),
      ...(kr       ? kr.data.map(d => d.date)       : []),
      ...(krBefore ? krBefore.data.map(d => d.date) : []),
    ])].sort();
    if (allDates.length < 2) return;

    const usMap  = us       ? Object.fromEntries(us.data.map(d => [d.date, d.yoy_pct]))       : {};
    const krMap  = kr       ? Object.fromEntries(kr.data.map(d => [d.date, d.yoy_pct]))       : {};
    const krbMap = krBefore ? Object.fromEntries(krBefore.data.map(d => [d.date, d.yoy_pct])) : {};

    const fmtDate = (d) => d.slice(2, 4) + '.' + d.slice(5, 7);

    const W = 720, H = 240, MT = 24, MR = 24, MB = 44, ML = 54;
    const innerW = W - ML - MR, innerH = H - MT - MB;
    const n = allDates.length;

    const allVals = [...Object.values(usMap), ...Object.values(krMap), ...Object.values(krbMap)]
                    .filter(v => v != null && !isNaN(v));
    const minV = Math.floor(Math.min(...allVals, -2)) - 1;
    const maxV = Math.ceil(Math.max(...allVals, 6)) + 1;
    const range = maxV - minV || 1;

    const xS = (i) => ((i / (n - 1)) * innerW).toFixed(1);
    const yS = (v) => (innerH - ((v - minV) / range) * innerH).toFixed(1);

    // SVG 경로 사전 계산
    let usPath = '', krPath = '', krbPath = '', gridLines = '', xLabels = '';
    // 데이터 포인트도 저장 (툴팁용)
    const ptData = allDates.map((d, i) => ({d, i, uv: usMap[d], kv: krMap[d], bv: krbMap[d]}));
    ptData.forEach(({d, i, uv, kv, bv}) => {
      if (uv != null && !isNaN(uv)) usPath  += (usPath  ? 'L' : 'M') + xS(i) + ',' + yS(uv) + ' ';
      if (kv != null && !isNaN(kv)) krPath  += (krPath  ? 'L' : 'M') + xS(i) + ',' + yS(kv) + ' ';
      if (bv != null && !isNaN(bv)) krbPath += (krbPath ? 'L' : 'M') + xS(i) + ',' + yS(bv) + ' ';
      if (i % 6 === 0) xLabels += '<text x="' + xS(i) + '" y="' + (innerH + 16) + '" text-anchor="middle" fill="#64748b" font-size="9">' + fmtDate(d) + '</text>';
    });
    // 그리드라인 (2% 간격)
    for (let v = Math.ceil(minV / 2) * 2; v <= maxV; v += 2) {
      const isZero = v === 0;
      gridLines += '<line x1="0" y1="' + yS(v) + '" x2="' + innerW + '" y2="' + yS(v) + '" stroke="' + (isZero ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.06)') + '" stroke-width="' + (isZero ? 1.5 : 1) + '" ' + (isZero ? 'stroke-dasharray="4,3"' : '') + '/>'
               + '<text x="-6" y="' + (parseFloat(yS(v)) + 4) + '" text-anchor="end" fill="#64748b" font-size="10">' + v + '%</text>';
    }
    // HTML 범례 (SVG 밖 — 라인과 겹치지 않음)
    const htmlLegend = '<div style="display:flex;gap:16px;margin-bottom:6px;flex-wrap:wrap;align-items:center;">'
      + (us       ? '<span style="display:flex;align-items:center;gap:5px;font-size:0.72rem;"><span style="display:inline-block;width:20px;height:2.5px;background:#22d3ee;border-radius:2px;"></span><span style="color:#22d3ee;">미국 M2</span></span>' : '')
      + (krBefore ? '<span style="display:flex;align-items:center;gap:5px;font-size:0.72rem;"><span style="display:inline-block;width:20px;height:2px;background:#f87171;border-radius:2px;"></span><span style="color:#f87171;">한국(개정전)</span></span>' : '')
      + (kr       ? '<span style="display:flex;align-items:center;gap:5px;font-size:0.72rem;"><span style="display:inline-block;width:20px;height:2px;background:#4ade80;border-radius:2px;"></span><span style="color:#4ade80;">한국(개정후)</span></span>' : '')
      + '<span style="font-size:0.63rem;color:var(--text-muted);margin-left:auto;">마우스를 올리면 수치 표시</span>'
      + '</div>';

    // KPI 카드
    const kpiStyle = 'padding:12px 16px;min-width:150px;';
    const kpiVal = (v, color) => '<div style="font-size:1.4rem;font-weight:700;color:' + color + ';">' + (v >= 0 ? '+' : '') + v.toFixed(1) + '%</div>';
    const usKpi  = us ? '<div class="glass-card" style="' + kpiStyle + '"><div style="font-size:0.65rem;color:#22d3ee;font-weight:600;">🇺🇸 미국 M2</div>' + kpiVal(us.latest_yoy, '#22d3ee') + '<div style="font-size:0.62rem;color:var(--text-muted);">' + us.latest_date.slice(0,7) + '</div></div>' : '';
    const krbNote = (krBefore && krBefore.note) ? ' <span style="font-size:0.55rem;color:var(--amber);opacity:0.8;">(추정)</span>' : '';
    const krbKpi = krBefore ? '<div class="glass-card" style="' + kpiStyle + ';border-left:2px solid #f87171;"><div style="font-size:0.65rem;color:#f87171;font-weight:600;">🇰🇷 한국 M2 (개정전)' + krbNote + '</div>' + kpiVal(krBefore.latest_yoy, '#f87171') + '<div style="font-size:0.62rem;color:var(--text-muted);">' + krBefore.latest_date.slice(0,7) + '</div></div>' : '';
    const krKpi  = kr  ? '<div class="glass-card" style="' + kpiStyle + ';border-left:2px solid #4ade80;"><div style="font-size:0.65rem;color:#4ade80;font-weight:600;">🇰🇷 한국 M2 (개정후)</div>' + kpiVal(kr.latest_yoy, '#4ade80') + '<div style="font-size:0.62rem;color:var(--text-muted);">' + kr.latest_date.slice(0,7) + '</div></div>' : '';

    // 개정 설명 박스
    const revNote = '<div class="glass-card anim-item" style="padding:12px 16px;margin-bottom:10px;background:rgba(251,191,36,0.05);border-left:3px solid rgba(251,191,36,0.5);">'
      + '<div style="font-size:0.72rem;font-weight:600;color:var(--amber);margin-bottom:4px;">📌 한국 M2 통계 개정 (2026년 1월 시행 · 출처: 한국은행)</div>'
      + '<div style="font-size:0.7rem;color:var(--text);line-height:1.7;">'
      + '<b style="color:var(--red,#f87171);">개정전</b>: ETF·채권형펀드 등 수익증권을 M2에 포함 → 주가·채권 가격 상승이 통화량 증가로 잡혀 과대계상.<br>'
      + '<b style="color:var(--green,#4ade80);">개정후</b>: 수익증권 제외(시장가격 변동 품목 제외) · 초대형IB 발행어음·CMA 추가 → IMF 2017 기준 준수.<br>'
      + '<span style="color:var(--text-muted);">개정전-후 격차 약 3.5~4%p: 2024~25년 KOSPI 상승으로 펀드 NAV가 부풀어 개정전 M2를 인위적으로 높임.</span>'
      + '</div></div>';

    const html = '<section class="section-wrap" id="m2-chart-section">'
      + '<div class="section-label" style="color:var(--cyan);">💵 M2 통화량 증가율 (전년동월비) · 금융안정 진단'
      + '<span style="font-size:0.65rem;color:var(--text-muted);margin-left:8px;">갱신: ' + h(m2Data.generated_at||'') + ' · 출처: FRED · 한국은행</span></div>'
      + revNote
      + '<div style="display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;">'
      + usKpi + krbKpi + krKpi
      + '<div class="glass-card" style="padding:12px 16px;flex:1;min-width:200px;">'
      + '<div style="font-size:0.68rem;color:var(--text-muted);margin-bottom:4px;">해석 가이드</div>'
      + '<div style="font-size:0.7rem;color:var(--text);line-height:1.7;">'
      + 'M2 ↑ → 유동성 확대 → 위험자산 선호<br>'
      + 'M2 ↓ → 긴축 효과 → 채권·달러 강세<br>'
      + '<span style="color:var(--amber);">2022~23: 미국 M2 급수축 → 고금리·SVB 충격</span></div></div>'
      + '</div>'
      + htmlLegend
      + '<div class="glass-card anim-item" style="padding:14px;overflow-x:auto;position:relative;">'
      + '<svg id="m2-svg" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:' + W + 'px;height:auto;display:block;">'
      + '<g transform="translate(' + ML + ',' + MT + ')">'
      + gridLines
      + (krbPath ? '<path d="' + krbPath.trim() + '" fill="none" stroke="#f87171" stroke-width="2" stroke-linejoin="round" opacity="0.9"/>' : '')
      + (krPath  ? '<path d="' + krPath.trim()  + '" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linejoin="round"/>' : '')
      + (usPath  ? '<path d="' + usPath.trim()  + '" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/>' : '')
      + xLabels
      + '<g id="m2-crosshair" style="display:none;pointer-events:none;">'
      + '<line id="m2-vline" x1="0" x2="0" y1="0" y2="' + innerH + '" stroke="rgba(255,255,255,0.45)" stroke-width="1" stroke-dasharray="3,2"/>'
      + '</g>'
      + '<rect id="m2-overlay" x="0" y="0" width="' + innerW + '" height="' + innerH + '" fill="transparent" style="cursor:crosshair;"/>'
      + '</g></svg></div>'
      + '<div style="font-size:0.63rem;color:var(--text-muted);margin-top:6px;">🚨 시뮬레이션·분석용. 투자 결정 금지. 출처: FRED (M2SL) · 한국은행 ECOS (161Y005)</div>'
      + '</section>';

    const existing = document.getElementById('m2-chart-section');
    if (existing) { existing.outerHTML = html; }
    else { (document.getElementById('app') || document.body).insertAdjacentHTML('beforeend', html); }
    scheduleNavRebuild();

    // ── 마우스 오버 툴팁 설정 ──────────────────────────────────────
    const overlay   = document.getElementById('m2-overlay');
    const crosshair = document.getElementById('m2-crosshair');
    const vline     = document.getElementById('m2-vline');
    if (overlay && crosshair && vline) {
      let tip = document.getElementById('m2-tip');
      if (!tip) {
        tip = document.createElement('div');
        tip.id = 'm2-tip';
        tip.style.cssText = 'position:fixed;background:rgba(10,14,20,0.97);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:10px 14px;font-size:0.72rem;pointer-events:none;display:none;z-index:9999;min-width:195px;box-shadow:0 4px 16px rgba(0,0,0,0.6);line-height:1.8;font-family:var(--font-mono,monospace);';
        document.body.appendChild(tip);
      }
      const svgEl = document.getElementById('m2-svg');
      overlay.addEventListener('mousemove', function(e) {
        if (!svgEl) return;
        const rect = svgEl.getBoundingClientRect();
        const scaleX = W / rect.width;
        const xPx = (e.clientX - rect.left) * scaleX - ML;
        const ci = Math.max(0, Math.min(n - 1, Math.round(xPx / (innerW / (n - 1)))));
        const date = allDates[ci];
        const xPos = parseFloat(xS(ci));
        crosshair.style.display = '';
        vline.setAttribute('x1', xPos.toFixed(1));
        vline.setAttribute('x2', xPos.toFixed(1));
        const fmt = (v) => v != null && !isNaN(v) ? ((v >= 0 ? '+' : '') + v.toFixed(2) + '%') : '—';
        const uv = usMap[date], kv = krMap[date], bv = krbMap[date];
        tip.innerHTML = '<div style="color:#94a3b8;font-size:0.63rem;margin-bottom:5px;">📅 ' + date.slice(0,7) + '</div>'
          + (uv != null ? '<div style="color:#22d3ee;">🇺🇸 미국 M2: <b>' + fmt(uv) + '</b></div>' : '')
          + (bv != null ? '<div style="color:#f87171;">🇰🇷 개정전: <b>' + fmt(bv) + '</b></div>' : '')
          + (kv != null ? '<div style="color:#4ade80;">🇰🇷 개정후: <b>' + fmt(kv) + '</b></div>' : '')
          + (bv != null && kv != null ? '<div style="color:#94a3b8;font-size:0.63rem;margin-top:3px;">격차: ' + (bv - kv).toFixed(2) + '%p</div>' : '');
        tip.style.display = 'block';
        tip.style.left = (e.clientX + 18) + 'px';
        tip.style.top  = Math.max(50, e.clientY - 70) + 'px';
      });
      overlay.addEventListener('mouseleave', function() {
        crosshair.style.display = 'none';
        if (tip) tip.style.display = 'none';
      });
    }
    } catch(e) { console.error('[M2 Chart]', e); }
  }

  // ─── ⚡ 레버리지·변동성 모니터 ───────────────────────
  function renderLeverageVol(lv) {
    if (!lv) return;
    const colorMap = { green:'#22c55e', cyan:'#22d3ee', amber:'#fbbf24', red:'#f87171', muted:'#64748b' };
    const reg = lv.vol_regime || {};
    const regColor = colorMap[reg.color] || '#64748b';
    const vix = lv.vix || {};

    // 변동성 레짐 게이지 (VIX 0~40)
    const vixVal = vix.current || 0;
    const vixPct = Math.min(100, vixVal / 40 * 100);

    // ETF 행
    const etfRows = (lv.etfs || []).map(e => {
      const chg = e.change_pct || 0;
      const cc = chg >= 0 ? '#22c55e' : '#f87171';
      const typeColor = e.type === 'leverage' ? '#f59e0b' : '#a78bfa';
      const typeLabel = e.type === 'leverage' ? `레버리지 ${e.mult}X` : `인버스 ${Math.abs(e.mult)}X`;
      return `<tr style="border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;" onclick="openStockDetail('${h(e.ticker)}')">
        <td style="padding:5px 6px;font-size:0.72rem;font-weight:600;color:var(--text-bright);">${h(e.name)}</td>
        <td style="padding:5px 6px;"><span style="font-size:0.55rem;background:${typeColor}22;color:${typeColor};padding:1px 5px;border-radius:5px;white-space:nowrap;">${typeLabel}</span></td>
        <td style="padding:5px 6px;font-size:0.72rem;color:var(--text);text-align:right;font-family:var(--font-mono);">${e.aum_tril!=null?e.aum_tril+'조':'—'}</td>
        <td style="padding:5px 6px;font-size:0.72rem;font-weight:700;color:${cc};text-align:right;">${chg>=0?'+':''}${chg.toFixed(2)}%</td>
        <td style="padding:5px 6px;font-size:0.66rem;color:var(--text-muted);text-align:right;font-family:var(--font-mono);">${e.rebal_pressure_tril>0?'~'+e.rebal_pressure_tril+'조':'—'}</td>
      </tr>`;
    }).join('');

    // 메커니즘 설명
    const mechs = (lv.mechanisms || []).map(m =>
      `<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
        <div style="font-size:0.68rem;font-weight:600;color:#fbbf24;">▸ ${h(m.name)}</div>
        <div style="font-size:0.64rem;color:var(--text-muted);line-height:1.5;">${h(m.desc)}</div>
      </div>`).join('');

    // 해외 레버리지 ETF 행
    const oEtfRows = (lv.overseas_etfs || []).map(e => {
      const chg = e.change_pct || 0;
      const cc = chg >= 0 ? '#22c55e' : '#f87171';
      const typeColor = e.type === 'leverage' ? '#f59e0b' : '#a78bfa';
      const typeLabel = e.type === 'leverage' ? `레버리지 ${e.mult}X` : `인버스 ${Math.abs(e.mult)}X`;
      return `<tr style="border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;" onclick="openStockDetail('${h(e.ticker)}')">
        <td style="padding:5px 6px;font-size:0.72rem;font-weight:600;color:var(--text-bright);">🇺🇸 ${h(e.ticker)}<span style="font-size:0.55rem;color:var(--text-muted);margin-left:4px;">${h(e.underlying||'')}</span></td>
        <td style="padding:5px 6px;"><span style="font-size:0.55rem;background:${typeColor}22;color:${typeColor};padding:1px 5px;border-radius:5px;white-space:nowrap;">${typeLabel}</span></td>
        <td style="padding:5px 6px;font-size:0.72rem;color:var(--text);text-align:right;font-family:var(--font-mono);">${e.aum_b!=null?'$'+e.aum_b+'B':'—'}</td>
        <td style="padding:5px 6px;font-size:0.72rem;font-weight:700;color:${cc};text-align:right;">${chg>=0?'+':''}${chg.toFixed(2)}%</td>
        <td style="padding:5px 6px;font-size:0.66rem;color:var(--text-muted);text-align:right;font-family:var(--font-mono);">${e.rebal_pressure_b>0?'~$'+e.rebal_pressure_b+'B':'—'}</td>
      </tr>`;
    }).join('');
    const oRatio = lv.overseas_ratio;
    const oRatioColor = oRatio == null ? '#64748b' : oRatio > 4 ? '#f87171' : oRatio < 1.5 ? '#22c55e' : '#22d3ee';

    const ratio = lv.lev_inv_ratio;
    const ratioColor = ratio == null ? '#64748b' : ratio > 1.5 ? '#f87171' : ratio < 0.7 ? '#22c55e' : '#22d3ee';

    const html = `<section class="section-wrap" id="leverage-vol-section">
      <div class="section-label" style="color:#f59e0b;">⚡ 레버리지·변동성 모니터 <span style="font-size:0.62rem;color:var(--text-muted);">(ETF·레버리지의 변동성 증폭 추적)</span>
        <span style="font-size:0.6rem;color:var(--text-muted);margin-left:8px;">갱신: ${h(lv.generated_at||'')}</span>
      </div>

      <!-- 상단 3 KPI -->
      <div style="display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
        <!-- 변동성 레짐 (눈금 + 구간 라벨 + 현재 마커 + 25 위험선) -->
        <div class="glass-card" style="padding:12px 16px;min-width:280px;border-left:3px solid ${regColor};">
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <div style="font-size:0.65rem;color:var(--text-muted);">📊 변동성 레짐 (VIX <b style="color:${regColor};">${vixVal||'—'}</b>)</div>
            <div style="font-size:1.3rem;font-weight:800;color:${regColor};line-height:1;">${h(reg.level||'—')}</div>
          </div>
          <!-- 눈금 게이지: 0~40, 구간 경계 15/20/25/30 -->
          <div style="position:relative;height:18px;margin-top:8px;">
            <!-- 구간 색상 띠 (안정<15 정상<20 경계<25 위험<30 패닉) -->
            <div style="position:absolute;top:6px;left:0;right:0;height:7px;border-radius:4px;overflow:hidden;display:flex;">
              <div style="width:37.5%;background:#22c55e;opacity:0.55;"></div>
              <div style="width:12.5%;background:#22d3ee;opacity:0.55;"></div>
              <div style="width:12.5%;background:#fbbf24;opacity:0.6;"></div>
              <div style="width:12.5%;background:#f97316;opacity:0.6;"></div>
              <div style="width:25%;background:#f87171;opacity:0.6;"></div>
            </div>
            <!-- 25 위험선 강조 -->
            <div style="position:absolute;top:2px;left:62.5%;width:2px;height:15px;background:#f87171;"></div>
            <div style="position:absolute;top:-2px;left:62.5%;transform:translateX(-50%);font-size:0.5rem;color:#f87171;font-weight:700;white-space:nowrap;">⚠️25</div>
            <!-- 현재 VIX 마커 -->
            <div style="position:absolute;top:3px;left:${vixPct}%;transform:translateX(-50%);width:11px;height:11px;background:#fff;border:2px solid ${regColor};border-radius:50%;box-shadow:0 0 4px ${regColor};"></div>
          </div>
          <!-- 구간 라벨 -->
          <div style="display:flex;font-size:0.5rem;color:var(--text-muted);margin-top:1px;">
            <span style="width:37.5%;text-align:center;color:#22c55e;">안정<15</span>
            <span style="width:12.5%;text-align:center;color:#22d3ee;">정상</span>
            <span style="width:12.5%;text-align:center;color:#fbbf24;">경계</span>
            <span style="width:12.5%;text-align:center;color:#f97316;">위험</span>
            <span style="width:25%;text-align:center;color:#f87171;">패닉≥30</span>
          </div>
          <div style="font-size:0.62rem;color:var(--text-muted);margin-top:5px;">캐스케이드 위험: <b style="color:${regColor};">${h(reg.cascade_risk||'—')}</b>
            ${vixVal && vixVal < 25 ? ` · 위험선까지 <b style="color:var(--text);">${(25-vixVal).toFixed(1)}p</b>` : ''}</div>
        </div>
        <!-- 레버리지/인버스 비율 -->
        <div class="glass-card" style="padding:12px 16px;min-width:200px;border-left:3px solid ${ratioColor};">
          <div style="font-size:0.65rem;color:var(--text-muted);">⚖️ 레버리지 ÷ 인버스 비율</div>
          <div style="font-size:1.5rem;font-weight:800;color:${ratioColor};">${ratio!=null?ratio:'—'}</div>
          <div style="font-size:0.62rem;color:var(--text);line-height:1.5;margin-top:3px;">${h(lv.ratio_signal||'')}</div>
          <div style="font-size:0.6rem;color:var(--text-muted);margin-top:2px;">레버리지 ${lv.leverage_aum_tril||0}조 / 인버스 ${lv.inverse_aum_tril||0}조</div>
        </div>

  // ─── 🎯 KOSPI 시나리오 시뮬레이터 (실시간 베타 예측) ──────
  function renderKospiScenario(sc) {
    if (!sc || !sc.current || !sc.beta) return;
    const cur = sc.current, b = sc.beta;
    const kNow = cur.KOSPI;
    // 실증 회귀 베타(최근 레짐, 단순수익률) — 1차 소스. 없으면 주간 stress β로 폴백.
    const emp = sc.empirical || null;
    const bSe = emp ? emp.sox : (b.sox_stress * 0.5);   // SOX 일별 베타
    const bNe = emp ? emp.ndx : (b.ndx_stress * 0.5);   // NDX 일별 베타
    const sigma = emp && emp.resid_std ? emp.resid_std : 0.025;  // 잔차 1σ(예측 불확실성)
    const maeBt = emp ? emp.mae_bt : null, r2 = emp ? emp.r2 : null;
    // 지수(SOX/NDX) 기준 표시 — 화면 가격과 일치 (ETF와 % 동일, 예측 동일)
    const soxxNow = cur.SOX || cur.SOXX, qqqNow = cur.NDX || cur.QQQ;
    const tailMul = sc.tail_multiplier || 1.8;
    const dftEtf = sc.default_targets || { soxx: 460, qqq: 650 };
    // ETF 기본목표(460/650)를 지수 등가로 환산 (같은 % 하락폭 유지)
    const dft = {
      soxx: (cur.SOX && cur.SOXX) ? Math.round(cur.SOX * dftEtf.soxx / cur.SOXX / 10) * 10 : dftEtf.soxx,
      qqq:  (cur.NDX && cur.QQQ)  ? Math.round(cur.NDX * dftEtf.qqq  / cur.QQQ  / 10) * 10 : dftEtf.qqq,
    };
    if (!kNow || !soxxNow || !qqqNow) return;

    const fmtN = n => Math.round(n).toLocaleString();
    // 슬라이더 범위: 현재가 대비 -40% ~ +15%
    const sRange = [Math.round(soxxNow * 0.6), Math.round(soxxNow * 1.15)];
    const qRange = [Math.round(qqqNow * 0.6), Math.round(qqqNow * 1.15)];

    // 🔵 선물 기반 장전 예측 (최우선) — 나스닥선물 24H 야간 움직임 = 가장 신선한 선행신호
    let autoBlock = '';
    const fut = sc.futures;
    if (fut && fut.predicted) {
      const fp = fut.predicted_pct, fCol = fp >= 0 ? '#22c55e' : '#f87171';
      const fov = fut.fut_overnight_pct, fsig = (fut.sigma || 0.025);
      const fLo = fut.predicted * (1 - fsig), fHi = fut.predicted * (1 + fsig);
      autoBlock = `<div class="glass-card" style="padding:13px 16px;margin-bottom:12px;background:rgba(56,189,248,0.10);border-left:3px solid #38bdf8;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <div>
            <div style="font-size:0.64rem;color:#38bdf8;font-weight:700;">🔵 개장 전 고정 예측 <span style="color:var(--text-muted);font-weight:400;">(나스닥 선물 24H — 07:00 KST 고정, 장중 보정 없음)</span></div>
            <div style="font-size:0.6rem;color:var(--text-muted);margin-top:3px;">직전 KOSPI 마감 이후 나스닥선물 <b style="color:${fov>=0?'#22c55e':'#f87171'};">${fov>=0?'+':''}${fov}%</b> <span style="font-size:0.52rem;">검증 MAE ±${fut.mae_bt}% · R²${fut.r2} (현물보다 정확)</span></div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:0.58rem;color:var(--text-muted);">KOSPI 종가 예상</div>
            <div style="font-size:1.6rem;font-weight:800;font-family:var(--font-mono);color:${fCol};line-height:1.1;">${fmtN(fut.predicted)} <span style="font-size:0.72rem;">${fp>=0?'+':''}${fp}%</span></div>
            <div style="font-size:0.54rem;color:var(--text-muted);">±1σ ${fmtN(fLo)}~${fmtN(fHi)}</div>
          </div>
        </div>
        <div style="font-size:0.54rem;color:var(--text-muted);margin-top:5px;line-height:1.5;">※ 나스닥선물(NQ)은 <b>거의 24시간 거래</b>되어 미국 현물 마감 후 뉴스까지 반영 → KOSPI 개장 직전 가장 신선. 시간이 갈수록(미국장 진행) 신호가 완성됩니다. 선물 시각 ${h(fut.fut_asof_utc||'')}.</div>
      </div>`;
    }

    // 🔴 (폴백) 현물 기반 — 선물 신호 없을 때만
    const soxChg = sc.change_pct ? sc.change_pct.SOX : null;
    const ndxChg = sc.change_pct ? sc.change_pct.NDX : null;
    if (!autoBlock && soxChg != null && ndxChg != null) {
      const cp = sc.change_pct || {};
      const usDate = cp.asof ? cp.asof.slice(5).replace('-','/') : '최근';
      const kDate = cp.kospi_asof ? cp.kospi_asof.slice(5).replace('-','/') : '';
      const absorbed = !!cp.absorbed;  // 미국 마감일이 KOSPI 기준일에 이미 반영됨
      // 실증 일별 베타(단순수익률) — 현재 변동성 레짐 반영
      const aMove = bSe * (soxChg/100) + bNe * (ndxChg/100);
      const kAuto = kNow * (1 + aMove);
      const aPct = aMove * 100;
      const aCol = aPct >= 0 ? '#22c55e' : '#f87171';
      const aLo = kAuto * (1 - sigma), aHi = kAuto * (1 + sigma);
      const accBadge = (maeBt != null)
        ? `<span style="font-size:0.5rem;color:var(--text-muted);">검증 MAE ±${maeBt}% · R²${r2}</span>` : '';
      const usLine = `미국 ${usDate} 마감: 필라델피아반도체 <b style="color:${soxChg>=0?'#22c55e':'#f87171'};">${soxChg>=0?'+':''}${soxChg}%</b> · 나스닥100 <b style="color:${ndxChg>=0?'#22c55e':'#f87171'};">${ndxChg>=0?'+':''}${ndxChg}%</b> ${accBadge}`;
      if (absorbed) {
        // 미국 세션이 이미 KOSPI에 반영됨 → 다음 예측 신호 아님(이중계산 방지)
        autoBlock = `<div class="glass-card" style="padding:12px 16px;margin-bottom:12px;background:rgba(148,163,184,0.08);border-left:3px solid #94a3b8;">
          <div style="font-size:0.62rem;color:#cbd5e1;font-weight:700;">⏸️ 새 미국 신호 대기 중</div>
          <div style="font-size:0.6rem;color:var(--text-muted);margin-top:3px;">${usLine}</div>
          <div style="font-size:0.56rem;color:var(--text-muted);margin-top:5px;line-height:1.5;">※ <b>미국 ${usDate} 마감은 KOSPI ${kDate} 종가(${fmtN(kNow)})에 이미 반영</b>됐습니다. 다음 예측은 <b>미국 ${usDate} 다음 장 마감 후</b> 자동 갱신됩니다(오늘 밤 미국장 → 내일 KOSPI). 지금 미국장이 열리면 위 슬라이더로 가정해 볼 수 있습니다.</div>
        </div>`;
      } else {
        autoBlock = `<div class="glass-card" style="padding:12px 16px;margin-bottom:12px;background:${aCol}11;border-left:3px solid ${aCol};">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <div>
            <div style="font-size:0.62rem;color:#f87171;font-weight:700;">🔴 실시간 자동 예측 <span style="color:var(--text-muted);font-weight:400;">(미국 야간 움직임 자동 반영)</span></div>
            <div style="font-size:0.6rem;color:var(--text-muted);margin-top:2px;">${usLine}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:0.58rem;color:var(--text-muted);">KOSPI 예상(다음 거래일)</div>
            <div style="font-size:1.5rem;font-weight:800;font-family:var(--font-mono);color:${aCol};line-height:1.1;">${fmtN(kAuto)} <span style="font-size:0.7rem;">${aPct>=0?'+':''}${aPct.toFixed(1)}%</span></div>
            <div style="font-size:0.54rem;color:var(--text-muted);">±1σ ${fmtN(aLo)}~${fmtN(aHi)}</div>
          </div>
        </div>
        <div style="font-size:0.54rem;color:var(--text-muted);margin-top:4px;">※ 한국이 미국보다 먼저 마감 → 미국 움직임을 다음 거래일에 따라가는 '캐치업' 기대값 (최근 ${emp?emp.window:20}일 실증 β). 밴드=과거 잔차 1σ. 슬라이더로 직접 가정도 가능.</div>
      </div>`;
      }
    }

    // ※ 장중 보정 카드 제거됨 — 이미 실현된 시가를 끌어쓰는 정보 누출이라 '진짜 예측'이 아님.
    //   예측은 개장 전(07:00 KST) 고정 → 마감 후 채점(📋 예측 성적표 섹션).

    // 🇰🇷vs🇯🇵 한일 동행/괴리 진단 (예측 아님 — 원인 해석)
    let nikkeiBlock = '';
    const nd = sc.nikkei_div;
    if (nd && nd.vkey) {
      const vc = nd.vkey === 'sync' ? '#94a3b8' : (nd.vkey === 'kr_weak' ? '#f87171' : '#22c55e');
      const kc = nd.kospi_chg >= 0 ? '#22c55e' : '#f87171';
      const jc = nd.nikkei_chg >= 0 ? '#22c55e' : '#f87171';
      const md = nd.date ? nd.date.slice(5).replace('-', '/') : '';
      const yn = sc.yen;
      const yenLine = yn ? `<span>💴 엔/달러 <b data-fx="usdjpy" style="color:${yn.chg_1d >= 0 ? '#fbbf24' : '#22c55e'};font-family:var(--font-mono);">${yn.usdjpy}</b> <span style="font-size:0.58rem;">(${yn.chg_1d >= 0 ? '+' : ''}${yn.chg_1d}% · 엔${yn.chg_1d >= 0 ? '약세' : '강세'})</span></span>` : '';
      const yenAlert = (yn && yn.alert) ? `<div style="font-size:0.62rem;color:#f87171;font-weight:700;margin-top:5px;">⚠️ ${h(yn.alert)}</div>` : '';
      const carryBanner = (yn && yn.carry_risk) ? `<div style="font-size:0.7rem;color:#fff;background:rgba(248,113,113,0.22);border:1px solid #f87171;border-radius:6px;padding:6px 10px;font-weight:800;margin-top:6px;">🚨 ${h(yn.carry_msg||'엔캐리 청산 위험')} <span style="font-weight:400;font-size:0.56rem;">(엔 급변일 엔→SK R²0.24~0.38)</span></div>` : '';
      nikkeiBlock = `<div class="glass-card" style="padding:10px 14px;margin-bottom:12px;background:${vc}11;border-left:3px solid ${vc};">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <div style="font-size:0.62rem;color:${vc};font-weight:700;">🇰🇷vs🇯🇵 한일 동행 진단 <span style="color:var(--text-muted);font-weight:400;">(${md} · 원인 해석용, 예측 아님)</span></div>
          <div style="font-size:0.7rem;font-weight:700;color:${vc};">${h(nd.verdict)}</div>
        </div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:5px;font-size:0.62rem;color:var(--text-muted);">
          <span>🇰🇷 KOSPI <b style="color:${kc};font-family:var(--font-mono);">${nd.kospi_chg>=0?'+':''}${nd.kospi_chg}%</b></span>
          <span>🇯🇵 니케이 <b style="color:${jc};font-family:var(--font-mono);">${nd.nikkei_chg>=0?'+':''}${nd.nikkei_chg}%</b></span>
          <span>니케이 기준 기대 <b style="font-family:var(--font-mono);color:var(--text);">${nd.expected_kospi_chg>=0?'+':''}${nd.expected_kospi_chg}%</b></span>
          <span>괴리 <b style="font-family:var(--font-mono);color:${vc};">${nd.gap_pct>=0?'+':''}${nd.gap_pct}%p</b></span>
          ${yenLine}
        </div>
        ${carryBanner}
        ${yenAlert}
        <div style="font-size:0.52rem;color:var(--text-muted);margin-top:4px;">※ 한일은 같은 시간대(동조 ${nd.corr}). 일본과 함께 움직이면 '아시아 동반', KOSPI만 따로면 '한국 고유 요인(외인 투매·환율·지정학)'. 엔/달러 급변은 BOJ 개입·아시아 위험의 선행신호. 예측이 아닌 원인 진단입니다.</div>
      </div>`;
    }

    const html = `<section class="section-wrap" id="kospi-scenario-section">
      <div class="section-label" style="color:#34d399;">🎯 KOSPI 시나리오 시뮬레이터
        <span style="font-size:0.62rem;color:var(--text-muted);">(가정 도구 — SOX·나스닥100이 변하면 KOSPI는?)</span>
        <span style="font-size:0.6rem;color:var(--text-muted);margin-left:8px;">기준일 ${h(sc.asof||'')}</span>
      </div>
      <div class="glass-card" style="padding:6px 14px;margin-bottom:10px;background:rgba(52,211,153,0.06);border-left:3px solid #34d399;">
        <div style="font-size:0.6rem;color:var(--text);">💡 <b>오늘 미국 변화가 기본 반영</b>됩니다(슬라이더=전일 대비). 더 <b style="color:#f87171;">내리면</b> 추가 하락, 더 <b style="color:#22c55e;">올리면</b> 추가 상승 가정. 예상 KOSPI는 미국 움직임의 다음날 캐치업 기대값.</div>
      </div>
      ${autoBlock}
      ${nikkeiBlock}
      <div class="glass-card" style="padding:16px 18px;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:14px;">
          <div>
            <div style="display:flex;justify-content:space-between;font-size:0.72rem;font-weight:600;color:#22d3ee;margin-bottom:4px;">
              <span>📉 필라델피아 반도체 (SOX 지수)</span>
              <span id="ksc-sox-val" style="font-family:var(--font-mono);"></span>
            </div>
            <input type="range" id="ksc-sox" min="${sRange[0]}" max="${sRange[1]}" step="10" value="${Math.round(soxxNow/10)*10}"
              style="width:100%;accent-color:#22d3ee;cursor:pointer;">
            <div style="font-size:0.58rem;color:var(--text-muted);">현재 ${fmtN(soxxNow)} · 실증 β=${bSe.toFixed(2)} <span style="opacity:0.7;">(주간 ${b.sox_weekly})</span></div>
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;font-size:0.72rem;font-weight:600;color:#a78bfa;margin-bottom:4px;">
              <span>📉 나스닥100 (NDX 지수)</span>
              <span id="ksc-qqq-val" style="font-family:var(--font-mono);"></span>
            </div>
            <input type="range" id="ksc-qqq" min="${qRange[0]}" max="${qRange[1]}" step="10" value="${Math.round(qqqNow/10)*10}"
              style="width:100%;accent-color:#a78bfa;cursor:pointer;">
            <div style="font-size:0.58rem;color:var(--text-muted);">현재 ${fmtN(qqqNow)} · 실증 β=${bNe.toFixed(2)} <span style="opacity:0.7;">(주간 ${b.ndx_weekly})</span></div>
          </div>
        </div>
        <div id="ksc-result"></div>
        <div style="font-size:0.58rem;color:var(--text-muted);margin-top:10px;line-height:1.5;">
          ${h(sc.note||'')}<br>🚨 통계 추정 · 비선형 패닉/환율 효과는 별도. 투자 결정 단독 사용 금지.
        </div>
      </div>
    </section>`;

    const existing = document.getElementById('kospi-scenario-section');
    if (existing) { existing.outerHTML = html; }
    else {
      // 과열게이지 바로 아래에 배치 (없으면 append)
      const oh = document.getElementById('overheating-section');
      const tmp = document.createElement('div'); tmp.innerHTML = html;
      const node = tmp.firstElementChild;
      if (oh) oh.insertAdjacentElement('afterend', node);
      else (document.getElementById('app') || document.body).appendChild(node);
    }
    scheduleNavRebuild();

    // ── 실시간 계산 ──
    const elSox = document.getElementById('ksc-sox');
    const elQqq = document.getElementById('ksc-qqq');
    const elSoxV = document.getElementById('ksc-sox-val');
    const elQqqV = document.getElementById('ksc-qqq-val');
    const elRes = document.getElementById('ksc-result');
    if (!elSox || !elRes) return;

    // 슬라이더 기준점 = 전일 종가 → 오늘 미국 변화가 기본 반영(현재값 슬라이더 = 오늘 변화%)
    const soxBase = (soxChg != null && soxChg !== 0) ? soxxNow / (1 + soxChg/100) : soxxNow;
    const ndxBase = (ndxChg != null && ndxChg !== 0) ? qqqNow / (1 + ndxChg/100) : qqqNow;
    function compute() {
      const sT = +elSox.value, qT = +elQqq.value;
      // 단순수익률(실증 베타가 단순수익률 기준으로 적합됨)
      const soxR = sT / soxBase - 1, qqqR = qT / ndxBase - 1;
      const soxPct = soxR * 100, qqqPct = qqqR * 100;
      // 단일 요인 (실증 베타)
      const kSox = kNow * (1 + bSe * soxR);
      const kQqq = kNow * (1 + bNe * qqqR);
      // 종합 중심값 = 실증 베타 선형결합 (NDX 주도)
      const move = bSe * soxR + bNe * qqqR;
      const kCentral = kNow * (1 + move);
      const cPct = move * 100;
      // 정상 밴드 = 중심값 ± 잔차 1σ (실제 예측 불확실성, 약 ±${(sigma*100).toFixed(1)}%)
      const lo = kCentral * (1 - sigma), hi = kCentral * (1 + sigma);
      // 꼬리 = 진행 방향으로 1.5σ 추가 (하락→패닉 하방 / 상승→강세 상방)
      const down = move < 0;
      const kTail = kCentral * (1 + (down ? -1.5 : 1.5) * sigma);
      const tPct = (kTail / kNow - 1) * 100;
      const tailLabel = down ? '패닉 꼬리위험 (−1.5σ)' : '강세 오버슈팅 (+1.5σ)';
      const tailCol = down ? '#f87171' : '#22c55e';
      const tailBg = down ? 'rgba(248,113,113,0.06)' : 'rgba(34,197,94,0.06)';
      const cColor = cPct >= 0 ? '#4ade80' : cPct >= -8 ? '#fbbf24' : '#f87171';

      elSoxV.textContent = `${sT.toLocaleString()} (${soxPct >= 0 ? '+' : ''}${soxPct.toFixed(1)}%)`;
      elQqqV.textContent = `${qT.toLocaleString()} (${qqqPct >= 0 ? '+' : ''}${qqqPct.toFixed(1)}%)`;
      elSoxV.style.color = soxPct < 0 ? '#f87171' : '#4ade80';
      elQqqV.style.color = qqqPct < 0 ? '#f87171' : '#4ade80';

      elRes.innerHTML = `
        <div style="text-align:center;padding:12px 0;border-top:1px solid rgba(255,255,255,0.08);border-bottom:1px solid rgba(255,255,255,0.08);">
          <div style="font-size:0.66rem;color:var(--text-muted);margin-bottom:2px;">예상 KOSPI (중심값)</div>
          <div style="font-size:2rem;font-weight:800;font-family:var(--font-mono);color:${cColor};line-height:1.1;">${fmtN(kCentral)}</div>
          <div style="font-size:0.82rem;font-weight:700;color:${cColor};">${cPct >= 0 ? '+' : ''}${cPct.toFixed(1)}% <span style="font-size:0.62rem;color:var(--text-muted);">(현재 ${fmtN(kNow)})</span></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;">
          <div style="text-align:center;padding:8px;background:rgba(251,191,36,0.06);border-radius:8px;">
            <div style="font-size:0.6rem;color:var(--text-muted);">정상 밴드 (±1σ)</div>
            <div style="font-size:0.95rem;font-weight:700;font-family:var(--font-mono);color:#fbbf24;">${fmtN(lo)} ~ ${fmtN(hi)}</div>
          </div>
          <div style="text-align:center;padding:8px;background:${tailBg};border-radius:8px;">
            <div style="font-size:0.6rem;color:var(--text-muted);">${tailLabel}</div>
            <div style="font-size:0.95rem;font-weight:700;font-family:var(--font-mono);color:${tailCol};">${fmtN(kTail)} <span style="font-size:0.62rem;">(${tPct >= 0 ? '+' : ''}${tPct.toFixed(1)}%)</span></div>
          </div>
        </div>

  // ─── 📐 엔/달러 → 한국증시 민감도 (레짐별) ──────────────────

        <span style="font-size:0.6rem;color:var(--text-muted);margin-left:8px;">${h(ys.window_desc||'')}</span></div>
      <div class="glass-card" style="padding:10px 14px;">

        <div style="font-size:0.62rem;color:var(--text-muted);margin-top:6px;">※ ${h(ys.note||'')}</div>

    if (!as || !Array.isArray(as.items) || !as.items.length) return;

      const col = it.korea ? '#f87171' : it.group === '발주처' ? '#60a5fa' : '#22d3ee';
      const w = pe ? Math.min(100, pe / maxPe * 100) : 0;
      return `<div style="display:flex;align-items:center;gap:8px;margin:2px 0;">
        <div style="width:120px;font-size:0.64rem;color:${it.korea ? '#fca5a5' : 'var(--text)'};white-space:nowrap;font-weight:${it.korea ? 700 : 400};">${it.flag} ${h(it.name)}</div>

          <span style="font-size:0.7rem;font-weight:800;color:#f87171;">🇰🇷 한국 할인율 <span style="font-family:var(--font-mono);font-size:1.05rem;">${d.korea_discount_pct}%</span> <span style="font-size:0.56rem;font-weight:400;color:var(--text-muted);">(한국 ${d.korea_avg_fwd_pe}배 vs 비한국 공급처 ${d.supply_exkorea_fwd_pe}배)</span></span>

  // 📢 관심종목 DART 수주·투자 공시 (실제 계약·시설투자 추적)

    const body = d.disclosures.length

  // 😱 KOSPI 변동성지수(VKOSPI) 카드 — 값·일변화·상태밴드·스파크라인·52주 위치
  function renderVkospi(d) {
    if (d) { window.__vkospiData = d; window.__vkospiTry = 0; }
    d = window.__vkospiData;
    const card = document.getElementById('vkospi-card');
    if (!card) {   // 해외시장 패널이 아직 안 그려진 레이스 → 캐시값으로 잠시 후 재시도(최대 ~12초)
      if ((window.__vkospiTry = (window.__vkospiTry || 0) + 1) <= 20) setTimeout(() => renderVkospi(), 600);
      return;
    }
    if (!d || d.value == null) return;
    const up = (d.change || 0) >= 0;
    // 공포지수: 상승=위험↑(빨강), 하락=진정(초록)
    const chgCol = up ? '#f87171' : '#4ade80';
    const ser = Array.isArray(d.series) ? d.series.map(s => s.close) : [];
    // 면적차트(1년)
    let chart = '';
    if (ser.length > 1) {
      const w = 560, hh = 90, mn = Math.min(...ser), mx = Math.max(...ser), rg = (mx - mn) || 1;
      const line = ser.map((v, i) => `${(i / (ser.length - 1) * w).toFixed(1)},${(hh - (v - mn) / rg * (hh - 8) - 4).toFixed(1)}`).join(' ');
      chart = `<svg width="100%" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none" style="display:block;">
        <polygon points="0,${hh} ${line} ${w},${hh}" fill="${d.color || '#fbbf24'}" fill-opacity="0.12"/>
        <polyline points="${line}" fill="none" stroke="${d.color || '#fbbf24'}" stroke-width="1.4"/>
      </svg>`;
    }
    // 기간수익률(Investing 스타일) — 변동성↑=빨강, ↓=초록
    const R = d.returns || {};
    const rcol = v => v == null ? 'var(--text-muted)' : (v >= 0 ? '#f87171' : '#4ade80');
    const rcell = (lab, v) => `<div style="text-align:center;flex:1;min-width:42px;">
      <div style="font-size:0.5rem;color:var(--text-muted);">${lab}</div>
      <div style="font-size:0.64rem;font-weight:700;font-family:var(--font-mono);color:${rcol(v)};">${v == null ? '—' : (v >= 0 ? '+' : '') + v + '%'}</div></div>`;
    const returnsRow = `<div style="display:flex;gap:2px;margin-top:9px;padding:7px 3px;background:rgba(255,255,255,0.03);border-radius:7px;">
      ${rcell('1일', R.d1)}${rcell('1주', R.w1)}${rcell('1달', R.m1)}${rcell('3달', R.m3)}${rcell('6달', R.m6)}${rcell('1년', R.y1)}</div>`;
    // 금일 변동(저~고)
    let todayBar = '';
    if (d.today_low != null && d.today_high != null && d.today_high > d.today_low) {
      const pos = Math.max(0, Math.min(100, (d.value - d.today_low) / (d.today_high - d.today_low) * 100));
      todayBar = `<div style="margin-top:9px;">
        <div style="display:flex;justify-content:space-between;font-size:0.52rem;color:var(--text-muted);margin-bottom:2px;"><span>금일 ${d.today_low}</span><span>금일 ${d.today_high}</span></div>
        <div style="position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,0.12);">
          <div style="position:absolute;top:-2px;left:${pos.toFixed(1)}%;width:3px;height:9px;background:${d.color};border-radius:2px;transform:translateX(-50%);"></div>
        </div></div>`;
    }
    // 52주 위치 게이지
    let rangeBar = '';
    if (d.lo_52w != null && d.hi_52w != null && d.hi_52w > d.lo_52w) {
      const pos = Math.max(0, Math.min(100, (d.value - d.lo_52w) / (d.hi_52w - d.lo_52w) * 100));
      rangeBar = `<div style="margin-top:7px;">
        <div style="position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,#4ade80,#fbbf24,#fb923c,#f87171);">
          <div style="position:absolute;top:-3px;left:${pos.toFixed(1)}%;width:3px;height:12px;background:#fff;border-radius:2px;transform:translateX(-50%);box-shadow:0 0 4px rgba(0,0,0,0.6);"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:0.54rem;color:var(--text-muted);margin-top:3px;">
          <span>52주 저 ${d.lo_52w}</span><span>52주 고 ${d.hi_52w}</span></div>
      </div>`;
    }
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
        <div>
          <div style="font-size:0.72rem;color:var(--text-muted);">😱 KOSPI 변동성지수 (VKOSPI) <span style="font-size:0.58rem;opacity:0.7;">한국판 VIX</span></div>
          <div style="display:flex;align-items:baseline;gap:8px;margin-top:3px;">
            <span style="font-size:1.7rem;font-weight:800;font-family:var(--font-mono);color:var(--text-bright);">${d.value}</span>
            <span style="font-size:0.8rem;font-weight:700;font-family:var(--font-mono);color:${chgCol};">${up ? '▲' : '▼'} ${Math.abs(d.change).toFixed(2)} (${up ? '+' : ''}${d.change_pct}%)</span>
          </div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:0.92rem;font-weight:800;color:${d.color};">${h(d.status || '')}</div>
          <div style="font-size:0.56rem;color:var(--text-muted);max-width:170px;">${h(d.desc || '')}</div>
        </div>
      </div>
      <div style="margin-top:10px;">${chart}</div>
      ${returnsRow}
      ${todayBar}
      ${rangeBar}
      <div style="font-size:0.54rem;color:var(--text-muted);margin-top:9px;line-height:1.5;">기준일 ${h(d.asof || '')} · 갱신 ${h(d.generated_at || '')} · ${h(d.note || '')}</div>`;
  }
  window.__renderVkospi = renderVkospi;

  // 📌 주요 일정 — 핵심종목 실적발표일·배당락일 D-day (yfinance 자동)
  function renderKeyEvents(d) {
    if (!d || !Array.isArray(d.events) || !d.events.length) return;
    const ddCol = n => n <= 3 ? '#f87171' : n <= 7 ? '#fb923c' : n <= 30 ? '#22d3ee' : 'var(--text-muted)';
    const tyCol = t => /잠정/.test(t) ? '#34d399' : /실적/.test(t) ? '#60a5fa' : '#a78bfa';
    const dlabel = n => n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : 'D+' + (-n);
    const rows = d.events.map(e => `<div style="display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,0.05);">
      <span style="min-width:52px;text-align:center;font-family:var(--font-mono);font-size:0.7rem;font-weight:800;color:${ddCol(e.dday)};">${dlabel(e.dday)}</span>
      <span style="min-width:74px;font-size:0.64rem;font-family:var(--font-mono);color:var(--text-muted);">${h(e.date)}</span>
      <span style="flex:1;font-size:0.72rem;color:var(--text-bright);font-weight:600;">${h(e.name)}</span>
      <span style="font-size:0.62rem;font-weight:700;color:${tyCol(e.type)};">${h(e.type)}</span>
      ${e.estimated ? '<span style="font-size:0.52rem;color:var(--text-muted);border:1px solid rgba(255,255,255,0.18);border-radius:4px;padding:1px 4px;">추정</span>' : ''}
    </div>`).join('');
    const html = `<section class="section-wrap" id="key-events-section">
      <div class="section-label" style="color:#fbbf24;">📌 주요 일정 <span style="font-size:0.62rem;color:var(--text-muted);">(핵심종목 실적발표·배당락 D-day — yfinance 자동)</span>
        <span style="font-size:0.6rem;color:var(--text-muted);margin-left:8px;">갱신 ${h(d.generated_at || '')}</span></div>
      <div class="glass-card" style="padding:11px 15px;">
        ${rows}
        <div style="font-size:0.54rem;color:var(--text-muted);margin-top:9px;line-height:1.5;">※ ${h(d.note || '')}</div>
      </div>
    </section>`;
    const existing = document.getElementById('key-events-section');
    if (existing) { existing.outerHTML = html; }
    else {
      const tmp = document.createElement('div'); tmp.innerHTML = html;
      const node = tmp.firstElementChild;
      const anchor = document.getElementById('watchlist-section') || document.getElementById('analyst-reports-section');
      if (anchor) anchor.insertAdjacentElement('afterend', node);
      else (document.getElementById('app') || document.body).appendChild(node);
    }
    scheduleNavRebuild();
  }
  window.__renderKeyEvents = renderKeyEvents;

  function renderEarnings(e) {
    if (!e || !Array.isArray(e.stocks) || !e.stocks.length) return;
    window.__earnData = e;
    if (window.__earnSel == null) window.__earnSel = 0;
    const sel = Math.min(window.__earnSel, e.stocks.length - 1);
    const s = e.stocks[sel];
    const cur = s.currency || '';
    const fmtEps = v => v == null ? '—' : (cur === '$' ? cur + v.toFixed(2) : Math.round(v).toLocaleString() + (s.eps_unit || ''));
    const tab = window.__earnTab == null ? (window.__earnTab = '실적') : window.__earnTab;
    const fmtMoney = v => v == null ? '—' : (cur === '$' ? '$' + v.toFixed(2) : Math.round(v).toLocaleString() + '원');
    const tabs = e.stocks.map((st, i) => `<button onclick="window.__earnSel=${i};window.__renderEarnings(window.__earnData)" style="padding:5px 13px;border-radius:20px;font-size:0.72rem;cursor:pointer;font-weight:${i === sel ? 700 : 400};background:${i === sel ? 'rgba(34,211,238,0.2)' : 'transparent'};color:${i === sel ? '#22d3ee' : 'var(--text-muted)'};border:1px solid ${i === sel ? 'rgba(34,211,238,0.5)' : 'rgba(255,255,255,0.15)'};">${h(st.name)}</button>`).join(' ');
    const subTabs = ['실적', '배당', '옵션'].map(tb => `<button onclick="window.__earnTab='${tb}';window.__renderEarnings(window.__earnData)" style="padding:4px 12px;border-radius:6px;font-size:0.68rem;cursor:pointer;font-weight:${tb === tab ? 700 : 400};background:${tb === tab ? 'rgba(255,255,255,0.08)' : 'transparent'};color:${tb === tab ? 'var(--text-bright)' : 'var(--text-muted)'};border:1px solid ${tb === tab ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)'};">${tb}</button>`).join(' ');

    function earnView() {
      const qs = s.quarters.slice().reverse();
      const epsVals = qs.flatMap(q => [q.eps_actual, q.eps_est]).filter(v => v != null);
      const maxE = Math.max(0.01, ...epsVals.map(Math.abs));
      const bars = qs.map(q => {
        const ah = q.eps_actual != null ? Math.max(2, Math.abs(q.eps_actual) / maxE * 70) : 0;
        const eh = q.eps_est != null ? Math.max(2, Math.abs(q.eps_est) / maxE * 70) : 0;
        const ac = q.eps_actual == null ? '#475569' : q.beat ? '#22c55e' : '#f87171';
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:30px;">
          <div style="display:flex;gap:2px;align-items:flex-end;height:74px;">
            <div title="실제 ${fmtEps(q.eps_actual)}" style="width:9px;height:${ah}px;background:${ac};border-radius:2px 2px 0 0;"></div>
            <div title="예측 ${fmtEps(q.eps_est)}" style="width:9px;height:${eh}px;background:#64748b;opacity:0.6;border-radius:2px 2px 0 0;"></div>
          </div>
          <div style="font-size:0.5rem;color:var(--text-muted);">${h(q.date.slice(2, 7).replace('-', '/'))}</div>
        </div>`;
      }).join('');
      const rows = s.quarters.map(q => {
        const sc = q.surprise_pct == null ? 'var(--text-muted)' : q.surprise_pct >= 0 ? '#22c55e' : '#f87171';
        const revShow = q.rev_actual != null ? (q.rev_actual + (s.rev_unit || '')) : (q.rev_est != null ? '~' + q.rev_est + (s.rev_unit || '') : '—');
        const dLab = q.upcoming
          ? (q.date ? (q.date_status === 'estimated' ? q.date + ' (추정)' : q.date) : '예정일 미정')
          : q.date;
        return `<tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
          <td style="padding:4px 6px;font-size:0.62rem;font-family:var(--font-mono);color:var(--text-bright);">${h(dLab)}${q.upcoming ? ' <span style="color:#fbbf24;font-size:0.5rem;">예정</span>' : ''}${q.curated ? ' <span style="color:#22d3ee;font-size:0.5rem;" title="검증 공시로 보강">공시</span>' : ''}</td>
          <td style="padding:4px 6px;text-align:right;font-size:0.64rem;font-family:var(--font-mono);font-weight:700;color:${q.eps_actual == null ? 'var(--text-muted)' : q.beat ? '#22c55e' : '#f87171'};">${fmtEps(q.eps_actual)}</td>
          <td style="padding:4px 6px;text-align:right;font-size:0.62rem;font-family:var(--font-mono);color:var(--text-muted);">${fmtEps(q.eps_est)}</td>
          <td style="padding:4px 6px;text-align:right;font-size:0.6rem;font-family:var(--font-mono);color:${sc};">${q.surprise_pct == null ? '—' : (q.surprise_pct >= 0 ? '+' : '') + q.surprise_pct + '%'}</td>
          <td style="padding:4px 6px;text-align:right;font-size:0.62rem;font-family:var(--font-mono);color:var(--text);">${revShow}</td>
        </tr>`;
      }).join('');
      return `<div style="margin-bottom:8px;"><span style="font-size:0.6rem;color:var(--text-muted);">컨센 상회 <b style="color:${s.beat_rate >= 70 ? '#22c55e' : '#fbbf24'};font-family:var(--font-mono);">${s.beat_rate == null ? '—' : s.beat_rate + '%'}</b> · 평균 서프 <b style="color:${(s.avg_surprise_pct || 0) >= 0 ? '#22c55e' : '#f87171'};font-family:var(--font-mono);">${s.avg_surprise_pct == null ? '—' : (s.avg_surprise_pct >= 0 ? '+' : '') + s.avg_surprise_pct + '%'}</b></span></div>
        <div style="display:flex;gap:3px;align-items:flex-end;padding:6px 0 2px;">${bars}</div>
        <div style="font-size:0.5rem;color:var(--text-muted);margin:4px 0 9px;"><span style="color:#22c55e;">■</span> 실제(비트) <span style="color:#f87171;">■</span> 실제(미스) <span style="color:#64748b;">■</span> 예측</div>
        <div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;min-width:360px;">
          <thead><tr style="border-bottom:1px solid rgba(255,255,255,0.12);">
            <th style="padding:4px 6px;text-align:left;font-size:0.54rem;color:var(--text-muted);font-weight:500;">발표일</th>
            <th style="padding:4px 6px;text-align:right;font-size:0.54rem;color:var(--text-muted);font-weight:500;">실제 EPS</th>
            <th style="padding:4px 6px;text-align:right;font-size:0.54rem;color:var(--text-muted);font-weight:500;">예측 EPS</th>
            <th style="padding:4px 6px;text-align:right;font-size:0.54rem;color:var(--text-muted);font-weight:500;">서프라이즈</th>
            <th style="padding:4px 6px;text-align:right;font-size:0.54rem;color:var(--text-muted);font-weight:500;">매출</th>
          </tr></thead><tbody>${rows}</tbody></table></div>
        ${(s.next_earnings && s.next_earnings.stale_actuals) ? `<div style="font-size:0.54rem;color:#fbbf24;margin-top:7px;line-height:1.5;">⚠️ 최신 분기 실적은 무료 피드(yfinance) 반영 대기 — 과거 분기까지만 표시됩니다(예정일은 분기 주기로 추정).</div>` : ''}`;
    }

    function divView() {
      const dv = s.dividends || [];
      if (!dv.length) return `<div style="font-size:0.7rem;color:var(--text-muted);padding:20px 0;text-align:center;">배당 이력 없음</div>`;
      const maxD = Math.max(...dv.map(d => d.amount));
      const bars = dv.map(d => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:30px;">
          <div title="${fmtMoney(d.amount)}" style="width:14px;height:${Math.max(3, d.amount / maxD * 60)}px;background:#a78bfa;opacity:0.7;border-radius:2px 2px 0 0;"></div>
          <div style="font-size:0.5rem;color:var(--text-muted);">${h(d.date.slice(2, 7).replace('-', '/'))}</div>
        </div>`).join('');
      const rows = dv.slice().reverse().map(d => `<tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
        <td style="padding:4px 8px;font-size:0.64rem;font-family:var(--font-mono);color:var(--text-bright);">${h(d.date)}</td>
        <td style="padding:4px 8px;text-align:right;font-size:0.66rem;font-family:var(--font-mono);color:#c4b5fd;">${fmtMoney(d.amount)}</td>
      </tr>`).join('');
      return `<div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px;">

  // ─── 📊 전략 백테스트 ──────────────────────
  function renderStrategyBacktest(sb) {
    if (!sb || !sb.strategies) return;
    const best = sb.strategies.reduce((a, b) => ((b.m && (b.m.cum_return || 0)) > (a.m && (a.m.cum_return || 0) || -999) ? b : a), sb.strategies[0]);
    const rows = sb.strategies.map(st => {
      const m = st.m || {}; const isBest = st.key === best.key;
      const cr = m.cum_return || 0;
      return `<tr style="border-bottom:1px solid rgba(255,255,255,0.05);${isBest ? 'background:rgba(34,197,94,0.06);' : ''}">
        <td style="padding:7px 8px;font-size:0.76rem;color:var(--text-bright);">${isBest ? '🏆 ' : ''}${h(st.name)}</td>
        <td style="padding:7px 8px;text-align:right;font-size:0.7rem;color:var(--text-muted);font-family:var(--font-mono);">${m.trades ?? '—'}</td>
        <td style="padding:7px 8px;text-align:right;font-size:0.72rem;font-family:var(--font-mono);color:${(m.win_rate||0)>=60?'#22c55e':'#fbbf24'};">${m.win_rate ?? '—'}%</td>
        <td style="padding:7px 8px;text-align:right;font-size:0.8rem;font-weight:700;font-family:var(--font-mono);color:${cr>=0?'#22c55e':'#f87171'};">${cr>=0?'+':''}${cr}%</td>
        <td style="padding:7px 8px;text-align:right;font-size:0.7rem;font-family:var(--font-mono);color:#f87171;">${m.mdd ?? '—'}%</td>
        <td style="padding:7px 8px;text-align:right;font-size:0.7rem;font-family:var(--font-mono);color:var(--text-muted);">${m.sharpe ?? '—'}</td>
      </tr>`;
    }).join('');
    const html = `<section class="section-wrap" id="strategy-backtest-section">
      <div class="section-label" style="color:#38bdf8;">📊 전략 백테스트 <span style="font-size:0.62rem;color:var(--text-muted);">(선물 신호 매매 규칙의 과거 성과 — ${h(sb.period||'')})</span>

    </section>`;

    const rows = mn.items.map(it => {

    const html = `<section class="section-wrap" id="market-news-section">

        <span style="font-size:0.62rem;color:var(--text-muted);">(왜 올랐나/빠졌나 · Yahoo·네이버 자동 수집)</span>
        <span style="font-size:0.6rem;color:var(--text-muted);margin-left:8px;">갱신: ${h(mn.generated_at||'')}</span>

      <div class="glass-card" style="padding:8px 12px;margin-bottom:8px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;">

  function renderPredictionLog(pl) {
    if (!pl || !pl.entries || !pl.entries.length) return;
    const acc = pl.accuracy || {};
    const fmt = n => Math.round(n).toLocaleString();
    const eCol = ae => ae == null ? 'var(--text-muted)' : ae <= 1 ? '#22c55e' : ae <= 3 ? '#fbbf24' : '#f87171';
    const dirMark = ok => ok ? '<span style="color:#22c55e;">✓</span>' : '<span style="color:#f87171;">✗</span>';

    // 모델 셀 (예측 / 오차 / 방향)
    function mcell(m) {
      if (!m) return `<td style="padding:5px 6px;text-align:center;font-size:0.6rem;color:var(--text-muted);">—</td>`;
      return `<td style="padding:5px 6px;text-align:right;font-family:var(--font-mono);font-size:0.66rem;color:var(--text);">${fmt(m.pred)}<br>
        <span style="font-size:0.6rem;font-weight:700;color:${eCol(m.abs_err)};">${m.err>=0?'+':''}${m.err}%</span> ${dirMark(m.dir)}</td>`;
    }
    const rows = pl.entries.slice().reverse().map(e => {
      const md = e.date.slice(5).replace('-', '/');
      return `<tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
        <td style="padding:5px 6px;font-size:0.66rem;color:var(--text-bright);font-family:var(--font-mono);">${md}</td>
        <td style="padding:5px 6px;text-align:right;font-family:var(--font-mono);font-size:0.66rem;color:var(--text-bright);">${fmt(e.actual)}<br><span style="font-size:0.56rem;color:${e.actual_pct>=0?'#22c55e':'#f87171'};">${e.actual_pct>=0?'+':''}${e.actual_pct}%</span></td>
        ${mcell(e.fut)}${mcell(e.reg)}${mcell(e.ens)}
      </tr>`;
    }).join('');

    // 모델별 정확도 비교 (최저 MAE 강조)
    const accModels = [
      { name: '🔵 선물', d: acc.fut || {} },
      { name: '🟣 회귀', d: acc.reg || {} },
      { name: '⚪ 앙상블', d: acc.ens || {} },
    ];
    const maes = accModels.map(m => m.d.mae_pct).filter(v => v != null);
    const bestMae = maes.length ? Math.min(...maes) : null;
    const accCards = accModels.map(m => {
      const d = m.d, isBest = (d.mae_pct != null && d.mae_pct === bestMae);
      const mc = d.mae_pct == null ? 'var(--text-muted)' : d.mae_pct <= 2 ? '#22c55e' : d.mae_pct <= 4 ? '#fbbf24' : '#f87171';
      return `<div style="flex:1;min-width:120px;padding:8px 10px;border-radius:8px;background:${isBest?'rgba(34,197,94,0.12)':'rgba(255,255,255,0.04)'};border:1px solid ${isBest?'rgba(34,197,94,0.4)':'rgba(255,255,255,0.08)'};">
        <div style="font-size:0.62rem;color:var(--text);font-weight:700;">${m.name}${isBest?' <span style="font-size:0.5rem;color:#22c55e;">최저오차</span>':''}</div>
        <div style="font-size:0.54rem;color:var(--text-muted);margin-top:3px;">MAE <b style="font-family:var(--font-mono);color:${mc};font-size:0.9rem;">±${d.mae_pct!=null?d.mae_pct:'—'}%</b></div>
        <div style="font-size:0.54rem;color:var(--text-muted);">방향 <b style="font-family:var(--font-mono);color:${d.dir_hit_rate>=70?'#22c55e':'#fbbf24'};">${d.dir_hit_rate!=null?d.dir_hit_rate:'—'}%</b>${d.dir_hit_strong!=null?` <span style="color:#22c55e;">(강신호일 ${d.dir_hit_strong}%)</span>`:''} <span style="opacity:0.6;">n${d.n||0}</span></div>
      </div>`;
    }).join('');

    // 다음(미마감) 세션 개장 전 고정 예측
    const t = pl.today || {};
    let todayCard = '';
    const tHead = (t.ens || t.fut || t.reg);
    if (tHead) {
      const cell = (label, m, col) => m ? `<div style="text-align:center;">
        <div style="font-size:0.54rem;color:var(--text-muted);">${label}</div>
        <div style="font-size:1.05rem;font-weight:800;font-family:var(--font-mono);color:${col};">${fmt(m.pred)}</div>
        <div style="font-size:0.52rem;color:${m.pct>=0?'#22c55e':'#f87171'};">${m.pct>=0?'+':''}${m.pct}%</div></div>` : '';
      const ovn = (t.fut && t.fut.overnight != null) ? ` · 나스닥선물 야간 ${t.fut.overnight>=0?'+':''}${t.fut.overnight}%` : '';
      const tLocked = t.status === 'locked';
      const tCol = tLocked ? '#38bdf8' : '#fbbf24';
      const tTitle = tLocked
        ? `🔒 ${h(t.target_date||'다음 거래일')} 개장 전 고정 예측 <span style="color:var(--text-muted);font-weight:400;font-size:0.54rem;">(07:00 KST 확정 · 장중 수정 없음 · 마감 후 채점)</span>`
        : `⏳ ${h(t.target_date||'다음 거래일')} 잠정 예측 <span style="color:var(--text-muted);font-weight:400;font-size:0.54rem;">(07:00 확정 전 · 갱신 중)</span>`;
      const tdc = t.dir_confidence;
      const tConfBadge = tdc ? `<span title="${h(t.dir_conf_reason||'')}" style="font-size:0.52rem;padding:2px 8px;border-radius:10px;margin-left:6px;background:${tdc==='high'?'rgba(34,197,94,0.18)':'rgba(148,163,184,0.18)'};color:${tdc==='high'?'#22c55e':'#94a3b8'};font-weight:700;">${tdc==='high'?'🎯 방향신뢰 높음':'🎲 방향신뢰 낮음'}</span>` : '';
      todayCard = `<div class="glass-card" style="padding:12px 16px;margin-bottom:10px;background:${tCol}14;border-left:3px solid ${tCol};">
        <div style="font-size:0.64rem;color:${tCol};font-weight:700;">${tTitle}${tConfBadge}</div>
        <div style="display:flex;gap:18px;align-items:flex-end;margin-top:8px;flex-wrap:wrap;">
          ${cell('🔵 선물', t.fut, '#38bdf8')}${cell('🟣 회귀', t.reg, '#a78bfa')}${cell('⚪ 앙상블', t.ens, '#e2e8f0')}
          <div style="font-size:0.52rem;color:var(--text-muted);align-self:center;">전일종가 ${fmt(t.base)}${ovn}</div>
        </div>
        ${(t.event_risk && t.event_risk.flag) ? `<div style="margin-top:7px;font-size:0.58rem;color:#fbbf24;font-weight:600;line-height:1.4;">⚠️ ${h((t.event_risk.events[0]||{}).title||'중앙은행 이벤트')} 영향권 — 선물 선행신호 신뢰도 낮음(디커플링·안도/실망 랠리로 방향까지 빗나갈 수 있음). 변동 확대 주의.</div>` : ''}
        ${(t.semi_regime) ? `<div style="margin-top:6px;font-size:0.6rem;color:${t.semi_regime.key==='high'?'#f87171':'#fbbf24'};font-weight:600;line-height:1.4;">🔬 ${h(t.semi_regime.text)}</div>` : ''}
      </div>`;
    }

    // 어제(직전 마감) 채점 결과 — 마감 후 자동 표시
    const last = (pl.entries || []).slice(-1)[0];
    let lastResultCard = '';
    if (last) {
      const md = last.date.slice(5).replace('-', '/');
      const seg = (name, m, col) => m ? `<span style="font-size:0.66rem;color:var(--text-muted);">${name} <b style="font-family:var(--font-mono);color:${col};">${fmt(m.pred)}</b> <span style="color:${m.abs_err<=2?'#22c55e':m.abs_err<=5?'#fbbf24':'#f87171'};">${m.err>=0?'+':''}${m.err}% ${m.dir?'✓':'✗'}</span></span>` : '';
      // 냉정한 평가: 방향 적중 여부 + 대형 오차
      const ms = ['fut', 'reg', 'ens'].map(k => last[k]).filter(Boolean);
      const wrong = ms.filter(m => !m.dir).length, tot = ms.length;
      const maxErr = ms.reduce((a, m) => Math.max(a, m.abs_err || 0), 0);
      const allWrong = tot > 0 && wrong === tot;
      const vCol = allWrong ? '#f87171' : wrong > 0 ? '#fbbf24' : '#4ade80';
      const icon = allWrong ? '📉' : wrong > 0 ? '△' : '✅';
      const verdict = tot === 0 ? '채점 대기'
        : allWrong ? `전 모델 방향 오답${maxErr>=5?` · 대형 오차 ±${maxErr}%`:''} — 이벤트·디커플링 가능성, 이 예측 신뢰 금지`
        : wrong > 0 ? `일부 방향 오답 (${wrong}/${tot}) — 부분 신뢰` : `전 모델 방향 적중${maxErr>=5?` (단 오차 ±${maxErr}%)`:''}`;
      lastResultCard = `<div class="glass-card" style="padding:10px 14px;margin-bottom:10px;border-left:3px solid ${vCol};background:${vCol}12;">
        <div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;">
          <span style="font-size:0.78rem;font-weight:800;color:${vCol};">${icon} ${md} 냉정 평가 <span style="font-weight:400;color:var(--text-muted);font-size:0.58rem;">(마감 후 자동)</span></span>
          <span style="font-size:0.74rem;color:var(--text-bright);">실제 종가 <b style="font-family:var(--font-mono);">${fmt(last.actual)}</b> <span style="color:${last.actual_pct>=0?'#22c55e':'#f87171'};font-size:0.6rem;">${last.actual_pct>=0?'+':''}${last.actual_pct}%</span></span>
        </div>
        <div style="font-size:0.68rem;color:${vCol};font-weight:600;margin-top:5px;line-height:1.45;">${verdict}</div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:5px;">
          ${seg('🔵 선물', last.fut, '#38bdf8')}${seg('🟣 회귀', last.reg, '#a78bfa')}${seg('⚪ 앙상블', last.ens, '#e2e8f0')}
        </div>
      </div>`;
    }

    const html = `<section class="section-wrap" id="prediction-log-section">
      <div class="section-label" style="color:#a78bfa;">📋 개장 전 예측 성적표
        <span style="font-size:0.62rem;color:var(--text-muted);">(장중 보정 없는 '진짜 예측' — 07:00 고정 → 마감 채점)</span>
        <span style="font-size:0.6rem;color:var(--text-muted);margin-left:8px;">갱신: ${h(pl.generated_at||'')}</span>
      </div>
      ${lastResultCard}
      ${todayCard}
      <div class="glass-card" style="padding:10px 12px;margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap;">${accCards}</div>
      <div class="glass-card" style="padding:6px 12px;overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;min-width:520px;">
          <thead><tr style="border-bottom:1px solid rgba(255,255,255,0.12);">
            <th style="padding:5px 6px;text-align:left;font-size:0.56rem;color:var(--text-muted);font-weight:500;">날짜</th>
            <th style="padding:5px 6px;text-align:right;font-size:0.56rem;color:var(--text-muted);font-weight:500;">실제</th>
            <th style="padding:5px 6px;text-align:right;font-size:0.56rem;color:#38bdf8;font-weight:600;">🔵 선물</th>
            <th style="padding:5px 6px;text-align:right;font-size:0.56rem;color:#a78bfa;font-weight:600;">🟣 회귀</th>
            <th style="padding:5px 6px;text-align:right;font-size:0.56rem;color:var(--text-muted);font-weight:600;">⚪ 앙상블</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="font-size:0.58rem;color:var(--text-muted);margin-top:8px;">※ 각 칸 = 예측값 / 오차% / 방향(✓✗). ${h(pl.note||'')}<br>🚨 통계 추정. 투자 결정 단독 사용 금지.</div>
    </section>`;

    const existing = document.getElementById('prediction-log-section');
    if (existing) { existing.outerHTML = html; }
    else {
      const sc = document.getElementById('kospi-scenario-section');
      const tmp = document.createElement('div'); tmp.innerHTML = html;
      const node = tmp.firstElementChild;
      if (sc) sc.insertAdjacentElement('afterend', node);
      else (document.getElementById('app') || document.body).appendChild(node);
    }
    scheduleNavRebuild();
  }

  // ─── 🌡️ 과열·차익실현 위험 게이지 ──────────────────────
  function renderOverheating(oh) {
    if (!oh || !oh.indices || !oh.indices.length) return;
    const COL = { red:'#f87171', orange:'#fb923c', amber:'#fbbf24', cyan:'#22d3ee', green:'#4ade80', muted:'#94a3b8' };
    const avg = oh.avg_heat;
    const avgColor = avg >= 85 ? COL.red : avg >= 72 ? COL.orange : avg >= 60 ? COL.amber : avg >= 45 ? COL.cyan : COL.green;
    const dangerZ = oh.danger_z || 3.0;

    const zSign = v => (v >= 0 ? '+' : '') + v;
    function makeCard(it) {
      const c = COL[it.color] || COL.muted;
      const sc = COL[it.stance_color] || COL.muted;
      const heatPct = Math.min(100, it.heat);
      // z-score 게이지 (-3 ~ +3.5 범위 → 0~100%): 과매도(좌)~극단과열(우)
      const zMin = -3, zMax = 3.5;
      const pct = v => Math.max(0, Math.min(100, (v - zMin) / (zMax - zMin) * 100));
      const zPct = pct(it.z50), peakPct = pct(it.peak_z), dangerPct = pct(dangerZ), buyPct = pct(-1.5);
      const dispColor = it.disp200 >= 50 ? COL.red : it.disp200 >= 25 ? COL.amber : it.disp200 <= -15 ? COL.green : 'var(--text)';
      const isBuy = (it.stance_key === 'buy' || it.stance_key === 'buy_strong');
      return `<div class="glass-card anim-item" style="padding:13px 15px;border-top:3px solid ${c};">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;">
          <span style="font-size:0.74rem;font-weight:700;color:var(--text-bright);">${it.flag} ${h(it.name)}</span>
          <span style="font-size:0.6rem;font-weight:700;color:${c};">${h(it.signal)}</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:6px;">
          <span style="font-size:1.7rem;font-weight:800;font-family:var(--font-mono);color:${c};line-height:1;">${it.heat}</span>
          <span style="font-size:0.58rem;color:var(--text-muted);">/ 100 heat</span>
        </div>
        <div style="height:7px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;margin:5px 0 8px;">
          <div style="height:100%;width:${heatPct}%;background:${c};border-radius:4px;"></div>
        </div>
        <div style="font-size:0.56rem;color:var(--text-muted);margin-bottom:2px;">50일선 z-score (현재 <b style="color:${c};">${zSign(it.z50)}σ</b> · 고점 ${zSign(it.peak_z)}σ)</div>
        <div style="position:relative;height:14px;margin-bottom:7px;">
          <div style="position:absolute;top:5px;left:0;right:0;height:5px;border-radius:3px;background:linear-gradient(90deg,#4ade80,#22d3ee,#fbbf24,#f87171);opacity:0.5;"></div>
          <div style="position:absolute;top:1px;left:${buyPct}%;width:2px;height:13px;background:#4ade80;"></div>
          <div style="position:absolute;top:-3px;left:${buyPct}%;transform:translateX(-50%);font-size:0.46rem;color:#4ade80;font-weight:700;white-space:nowrap;">매수-1.5σ</div>
          <div style="position:absolute;top:1px;left:${dangerPct}%;width:2px;height:13px;background:#f87171;"></div>
          <div style="position:absolute;top:-3px;left:${dangerPct}%;transform:translateX(-50%);font-size:0.46rem;color:#f87171;font-weight:700;white-space:nowrap;">⚠️+${dangerZ}σ</div>
          <div style="position:absolute;top:3px;left:${peakPct}%;transform:translateX(-50%);width:8px;height:8px;border:1px dashed ${c};border-radius:50%;opacity:0.7;"></div>
          <div style="position:absolute;top:2px;left:${zPct}%;transform:translateX(-50%);width:10px;height:10px;background:#fff;border:2px solid ${c};border-radius:50%;box-shadow:0 0 4px ${c};"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:0.58rem;color:var(--text-muted);margin-bottom:6px;">
          <span>200일이격 <b style="color:${dispColor};">${it.disp200>=0?'+':''}${it.disp200}%</b></span>
          <span>모멘텀z <b style="color:var(--text);">${it.mom_z>=0?'+':''}${it.mom_z}</b></span>
          <span>RSI <b style="color:${it.rsi<=30?COL.green:it.rsi>=70?COL.red:'var(--text)'};">${it.rsi!=null?it.rsi:'—'}</b></span>
        </div>
        <div style="padding-top:6px;border-top:1px solid rgba(255,255,255,0.06);">
          <div style="font-size:0.66rem;font-weight:700;color:${sc};">${h(it.stance||'')}</div>
          <div style="font-size:0.54rem;color:var(--text-muted);margin-top:2px;line-height:1.4;">
            ${isBuy
              ? (it.buy_backtest ? `과매도 진입 — 역사적 20일 <b style="color:${COL.green};">+${it.buy_backtest.avg_pct}%</b> · 승률 ${it.buy_backtest.win_rate}%` : '과매도 매수 구간')
              : `매수구간(z&lt;-1.5σ)까지 <b style="color:var(--text);">${Math.abs(it.z_to_buy).toFixed(1)}σ</b>${it.buy_backtest?` · 진입 시 역사 <b style="color:${COL.green};">+${it.buy_backtest.avg_pct}%</b>/승률${it.buy_backtest.win_rate}%`:''}`}
          </div>
        </div>
      </div>`;
    }
    const cards = oh.indices.map(makeCard).join('');
    const cryptoCards = (oh.crypto || []).map(makeCard).join('');

    const vix = oh.vix || {};
    const html = `<section class="section-wrap" id="overheating-section">
      <div class="section-label" style="color:#fb923c;">🌡️ 과열·차익실현 위험 게이지
        <span style="font-size:0.62rem;color:var(--text-muted);">(z-score·200일이격·모멘텀 종합 — 실제 위험선 <b style="color:#f87171;">+3σ 극단 과열</b> · '1.9설' 반증)</span>
        <span style="font-size:0.6rem;color:var(--text-muted);margin-left:8px;">기준일 ${h(oh.asof||'')}</span>
      </div>
      ${oh.overall_stance ? `<div class="glass-card" style="padding:11px 16px;margin-bottom:10px;background:${(COL[oh.overall_stance_color]||COL.muted)}18;border-left:4px solid ${COL[oh.overall_stance_color]||COL.muted};">
        <div style="font-size:0.92rem;font-weight:800;color:${COL[oh.overall_stance_color]||COL.muted};">${h(oh.overall_stance)}</div>
        <div style="font-size:0.6rem;color:var(--text-muted);margin-top:2px;">매수 신호 ${oh.buy_count||0} / 과열 ${oh.sell_count||0} (4개 지수) · 매수 기준: z50&lt;-1.5σ 또는 RSI&lt;30</div>
      </div>` : ''}
      <div class="glass-card" style="padding:11px 16px;margin-bottom:12px;background:${avgColor}11;border-left:3px solid ${avgColor};display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">

          ${vix.current ? `<span style="font-size:0.6rem;color:var(--text-muted);margin-left:8px;">VIX ${vix.current}</span>` : ''}</div>
        <div style="font-size:0.58rem;color:var(--text-muted);max-width:560px;">❌ ${h(oh.myth_note||'')}</div>

      <div style="font-size:0.6rem;color:var(--text-muted);margin-bottom:5px;">📈 주식·지수</div>

      ${cryptoCards ? `

        ${oh.crypto_stance ? `<span style="font-size:0.72rem;font-weight:800;color:${COL[oh.crypto_stance_color]||COL.muted};">${h(oh.crypto_stance)} <span style="font-size:0.56rem;color:var(--text-muted);font-weight:400;">매수 ${oh.crypto_buy_count||0}/과열 ${oh.crypto_sell_count||0} · 평균heat ${oh.crypto_avg_heat}</span></span>` : ''}

    const existing = document.getElementById('overheating-section');

    scheduleNavRebuild();
    // KOSPI 시나리오를 과열게이지 바로 아래로 이동 (이미 로드된 경우)
